成 「膜仁消失显两体」 「形定数晰赤道齐」 赤道板 「点裂数数加均极」 加倍 「两消两现重开始」 中心粒发出星射线 两极发出纺锤丝 细胞膜中部内陷缢裂 赤道板位置出现细胞板 中心体 精确地平均分配 亲代和子代细胞之间遗传性状的稳定性", "x": "11.2 有丝分裂各期特点（教材 P112-113，必背） 时期主要特点 间期完成 DNA 分子的复制和有关蛋白质的合成，细胞适度生长；动物细胞中心粒倍增 前期「膜仁消失显两体」：核膜核仁消失，出现染色体和纺锤体，染色体散乱分布 中期「形定数晰赤道齐」：染色体形态稳定、数目清晰，着丝粒整齐排列在赤道板上——观察染色体最佳时期 后期「点裂数数加均极」：着丝粒分裂，姐妹染色单体分开成为两条染色体，染色体数目加倍，平均移向两极 末期「两消两现重开始」：染色体、纺锤体消失，核膜核仁重现 动植物细胞有丝分裂区别：①前期纺锤体形成方式——动物中心粒发出星射线；植物两极发出纺锤丝；②末期细胞质分裂——动物细胞膜中部内陷缢裂；植物赤道板位置出现细胞板扩展成新细胞壁。区分动植物细胞最可靠依据：细胞质分裂方式（有无细胞板）。 赤道板是假想平面（不存在），细胞板是真实结构（植物末期出现）。 数目变化口诀：DNA 加倍在间期（S 期）；染色体加倍在后期"}, {"id": "c10s2", "ch": 10, "chT": "细胞的增殖", "t": "11.3 无丝分裂（教材 P115）", "terms": "没有出现纺锤丝和染色体的变化 蛙的红细胞", "x": "11.3 无丝分裂（教材 P115） 过程：细胞核先延长缢裂为二，然后整个细胞从中部缢裂为二。特点：没有出现纺锤丝和染色体的变化（但有 DNA 复制）；过程简单迅速耗能少，核膜核仁不消失。典型实例：蛙的红细胞（高等植物薄壁组织如胚乳细胞中也常见）。"}, {"id": "c10s3", "ch": 10, "chT": "细胞的增殖", "t": "11.4 实验：观察根尖分生区组织细胞的有丝分裂（教材 P116）", "terms": "解离后细胞已死亡 呈正方形、排列紧密", "x": "11.4 实验：观察根尖分生区组织细胞的有丝分裂（教材 P116） 流程：培养根尖（葱/蒜，根长约 5 cm，取 2~3 mm）→ 解离（15% HCl : 95% 酒精 = 1:1，使组织细胞相互分离）→ 漂洗（清水，洗去药液防解离过度）→ 染色（甲紫溶液或醋酸洋红液 3~5 min，使染色体着色）→ 制片（弄碎根尖、压片使细胞分散）→ 镜检。 解离后细胞已死亡——不能观察到连续分裂过程，需移动装片寻找不同时期的细胞。 分生区细胞特点：呈正方形、排列紧密；先低倍镜找分生区，再高倍镜观察；视野中间期细胞最多（间期时间最长——各期细胞数目与该期持续时间成正比）。 选材要求：选分裂期占细胞周期比例大的材料便于观察分裂相。 甲紫溶液是「碱性染料」但 pH 小于 7——碱性/酸性由电离后助色基团所带电荷决定。"}, {"id": "c10s4", "ch": 10, "chT": "细胞的增殖", "t": "11.5 细胞周期调控与同步化（课件拓展）", "terms": "间期 秋水仙素抑制纺锤体形成", "x": "11.5 细胞周期调控与同步化（课件拓展） 检验点系统：G1/S 检验点（细胞是否足够大、DNA 是否损伤）、S 期检验点（DNA 复制是否正确）、G2/M 检验点、纺锤体组装检验点（中期——染色体是否都与纺锤体正确连接，如 MAD2 蛋白监控单附着染色体）、分离后检验点（染色体是否到达两极，决定是否胞质分裂）。 原癌基因（调节细胞周期、控制生长分裂进程）与抑癌基因（阻止细胞不正常增殖）协同维持细胞周期正常。 药物：抑制 DNA 复制的抗癌药使细胞停留在间期；秋水仙素抑制纺锤体形成→着丝粒正常分裂但染色体不能移向两极→染色体数目加倍（多倍体育种、中期阻断法）。 同步化方法：①DNA 合成双阻断法（胸苷/TdR 两次阻断，使细胞停在 G1/S 交界）；②秋水仙素中期阻断法；③血清饥饿法（停滞于间期）。 CDK1 蛋白（2020 山东）：推动间期→分裂期；DNA 复制未完成时 CDK1 磷酸化失活，复制完成后去磷酸化激活。 边角小字"}, {"id": "c11", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "细胞的分化、衰老和死亡", "terms": "", "x": "12 细胞的分化、衰老和死亡细胞分化 · 细胞的全能性 · 细胞的衰老 · 细胞的死亡（凋亡与自噬）"}, {"id": "c11s0", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.1 细胞分化（教材 P118-119）", "terms": "形态、结构和生理功能上发生稳定性差异 基因的选择性表达", "x": "12.1 细胞分化（教材 P118-119） 概念（黑体）：在个体发育中，由一个或一种细胞增殖产生的后代，在形态、结构和生理功能上发生稳定性差异的过程。 特点：普遍性（贯穿生命历程）、持久性/稳定性（一般保持分化后状态直到死亡）、不可逆性。 根本原因（实质）：基因的选择性表达（遗传物质 DNA 不变；mRNA、蛋白质种类改变）。 「不变与变」：不变——DNA、tRNA、rRNA、细胞数目（核 DNA）；改变——mRNA、蛋白质种类、细胞形态结构功能。 分化与分裂的关系：分裂是分化的基础，二者相伴相随；分化程度越高，分裂能力一般越低。 意义：使多细胞生物体中的细胞趋向专门化，有利于提高各种生理功能的效率。"}, {"id": "c11s1", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.2 细胞的全能性（教材 P120）", "terms": "分裂和分化后，仍具有产生完整有机体或分化成其他各种细胞的潜能和特性 全套遗传信息（全套基因） 离体 已分化的动物细胞核具有全能性 不是 生殖细胞（卵细胞）分化程度高而全能性较高", "x": "12.2 细胞的全能性（教材 P120） 概念（黑体）：细胞经分裂和分化后，仍具有产生完整有机体或分化成其他各种细胞的潜能和特性。 原因：细胞含有本物种的全套遗传信息（全套基因）。条件：①离体；②适宜的营养、激素等条件。标志：发育成完整个体或分化成其他各种细胞。 实例：植物组织培养（植物细胞全能性）；克隆羊多莉（已分化的动物细胞核具有全能性）。种子萌发长成植株不是体现全能性（胚本身是幼体，属正常发育）。 一般规律：分化程度越高，全能性越低；但生殖细胞（卵细胞）分化程度高而全能性较高（孤雌生殖）——特例。 干细胞：全能干细胞（胚胎干细胞，可发育成完整个体）→ 多能干细胞（骨髓造血干细胞）→ 专能干细胞（神经干细胞）；应用：干细胞移植治疗白血病、体外培养组织器官。"}, {"id": "c11s2", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.3 细胞的衰老（教材 P122-124）", "terms": "体积增大 体积变小 自由基学说 端粒学说 特殊序列的 DNA-蛋白质复合体 细胞普遍衰老的过程 自我更新", "x": "12.3 细胞的衰老（教材 P122-124） 特征口诀「一大一小、一多一少、两慢两低」：细胞核体积增大（核膜内折、染色质收缩）、细胞体积变小；色素（脂褐素）积累；水分减少；酶活性降低、代谢减慢；膜通透性改变、物质运输功能降低。 染色质收缩 → 影响 DNA 解旋 → 影响复制与转录。多数酶活性降低，但与衰老相关的酶活性可升高。 自由基学说：异常活泼的带电分子或基团攻击磷脂（破坏生物膜）、DNA（基因突变）、蛋白质（活性下降）→ 细胞衰老。 端粒学说：端粒是染色体两端特殊序列的 DNA-蛋白质复合体；细胞每分裂一次端粒缩短一截，内侧正常 DNA 序列受损 → 细胞活动异常。端粒酶（含 RNA 模板的逆转录酶）可补添端粒（生殖细胞、癌细胞中活跃）。 个体衰老与细胞衰老的关系：单细胞生物——细胞衰老=个体衰老；多细胞生物——个体衰老=细胞普遍衰老的过程，但年轻个体也有衰老细胞，衰老个体也有新生细胞（造血干细胞）。 正常细胞衰老有利于"}, {"id": "c11s3", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.4 细胞的死亡（教材 P125-127）", "terms": "细胞凋亡（黑体） 基因所决定的细胞自动结束生命的过程 细胞坏死 被动 细胞自噬 溶酶体 激烈的细胞自噬可能诱导细胞凋亡 双层膜自噬泡", "x": "12.4 细胞的死亡（教材 P125-127） 细胞凋亡（黑体）：由基因所决定的细胞自动结束生命的过程（程序性死亡，主动、生理性、对机体有利）。实例：胚胎发育中尾的消失、指间细胞自动死亡、被病原体感染细胞的清除、成熟个体细胞的自然更新。 意义：完成正常发育、维持内部环境稳定、抵御外界干扰。机理：凋亡信号与膜受体结合 → 信号转导 → 凋亡相关基因表达 → DNase 切割 DNA、Caspase 降解蛋白 → 形成凋亡小体 → 被吞噬清除（内容物不释放到内环境）。 细胞坏死：外界不利因素导致的被动死亡，膜破裂内容物释放引发炎症，对机体有害。长期吸烟肺部细胞病变死亡属于坏死。 细胞自噬：细胞「吃掉」自身结构和物质——依赖溶酶体清除变性/错误折叠蛋白、衰老损伤细胞器；养分不足时自噬增强；产物可回收利用；激烈的细胞自噬可能诱导细胞凋亡；随年龄增长肌肉细胞自噬减弱。 白细胞凋亡速率远快于红细胞（白细胞吞噬病菌，功能损伤大）；胚胎期尾的消"}, {"id": "c12", "ch": 12, "chT": "高考考情速览与复习建议", "t": "高考考情速览与复习建议", "terms": "", "x": "附 高考考情速览与复习建议基于近年全国卷与各省真题的分布规律 必修 1 在高考中通常占选择题 3~4 个，第 1~4 章（细胞概述与分子组成）合计约 6 分。 非选择题几乎必考光合作用与细胞呼吸的综合（曲线分析、装置计算、实验设计），其次是细胞增殖图像与实验、酶实验设计。 近年高考题明显偏好教材小字与拓展信息：磷酸戊糖途径（2022 山东）、瓦堡效应（2020 全国Ⅰ）、CDK1/BYDV（2020 山东）、染色体桥（2020 山东）、细胞焦亡与凋亡对比（2025 山东）、KDEL 回收、Rubisco 光呼吸、C4 与 CAM 途径等。 复习策略：①黑体字定义逐字背；②边角小字按章过一遍；③易错判断题考前自测；④曲线题掌握「生成速率 vs 消耗速率」「总/净光合」「气体量差值」三套方法。 一册在手 · 每日一背 每章按「核心知识 → 边角小字 → "}, {"id": "c0", "ch": 0, "chT": "减数分裂和受精作用", "t": "减数分裂和受精作用", "terms": "", "x": "01 减数分裂和受精作用 必修2 第1章第1节 · 配图判读、曲线分析与配子异常是高考主线"}, {"id": "c0s0", "ch": 0, "chT": "减数分裂和受精作用", "t": "减数分裂的概念（背诵）", "terms": "减数分裂", "x": "减数分裂的概念（背诵） 减数分裂：进行有性生殖的生物，在产生成熟生殖细胞时进行的染色体数目减半的细胞分裂。染色体复制一次，细胞连续分裂两次，结果成熟生殖细胞中染色体数目比原始生殖细胞减少一半。"}, {"id": "c0s1", "ch": 0, "chT": "减数分裂和受精作用", "t": "分裂过程", "terms": "同源染色体 联会 四分体 交叉互换", "x": "分裂过程 精子形成：精原细胞 →（复制）→ 初级精母细胞 →（减Ⅰ：同源染色体分离、细胞质均分）→ 2个次级精母细胞 →（减Ⅱ：着丝粒分裂）→ 精细胞 →（变形）→ 4个精子 卵细胞形成：卵原细胞 → 初级卵母细胞 →（减Ⅰ不均等分裂）→ 次级卵母细胞 + 第一极体 →（减Ⅱ不均等 / 均等）→ 1个卵细胞 + 3个极体（极体退化消失） 关键概念 同源染色体：减Ⅰ中配对的两条染色体，形状大小一般相同，一条来自父方、一条来自母方。 联会：同源染色体两两配对（减Ⅰ前期）；联会后每对同源染色体含4条染色单体，称四分体（1四分体=1对同源=2条染色体=4条单体=2个着丝粒）。 交叉互换：四分体时期，同源染色体的非姐妹染色单体之间交换对应片段（属于基因重组）。 减Ⅰ后期：同源染色体分离（等位基因随之分离），非同源染色体自由组合；减Ⅱ后期：着丝粒分裂，姐妹染色单体分开。 易错警示 图像三步判断：①无同源染色体→减Ⅱ；②有同源且同源分离→减Ⅰ"}, {"id": "c0s2", "ch": 0, "chT": "减数分裂和受精作用", "t": "配子种类与规律", "terms": "", "x": "配子种类与规律 1个精原细胞2种4个精子（两两相同、互补） 1个卵原细胞1种1个卵细胞 个体配子种类n对同源染色体（不考虑互换）→ 2n 种 互换率发生交换的初级精母细胞比例 = 重组型配子比例 × 2 易错警示 异常配子：减Ⅰ同源染色体未分离→4个配子全部异常；减Ⅱ着丝粒分裂后单体未移向两极→2个正常、2个异常。异常精子 XbY 与 X 卵结合→XXY（21 三体综合征的形成机理与之同类，见课后题）；减Ⅱ时 Y 单体未分开→含 YY 的精子→XYY。"}, {"id": "c0s3", "ch": 0, "chT": "减数分裂和受精作用", "t": "受精作用", "terms": "透明带反应 卵细胞膜反应", "x": "受精作用 过程：精子头部进入卵细胞，尾部留外；透明带反应、卵细胞膜反应阻止多个精子入卵。 意义（背诵）：受精卵的染色体数目恢复到本物种体细胞数目，其中一半来自精子、一半来自卵细胞；配子多样性 + 精卵随机结合 → 同一双亲后代呈多样性。 减数分裂使染色体减半、受精作用使之恢复，对维持每种生物前后代染色体数目的恒定，以及遗传和变异，都具有重要意义。 边角小字 观察蝗虫精母细胞减数分裂实验（P24）：选雄性生殖器官——精母细胞数量多且持续分裂，而卵巢中减Ⅱ常未完成、形成的卵细胞少；装片中视野方向不一的分裂相多；雄蜂（单倍体）无同源染色体，经特殊的假减数分裂仍能产生精子，且具有一整套基因。 高考真题链接 山东卷（2022/2023/2024/2026）反复考查：减Ⅱ姐妹染色单体互锁、环状染色体交换后子细胞基因组成、配子异常的成因判定——核心抓手是\"减Ⅰ异常→全异常；减Ⅱ异常→半数异常\"。"}, {"id": "c1", "ch": 1, "chT": "基因的分离定律", "t": "基因的分离定律", "terms": "", "x": "02 基因的分离定律 必修2 第1章第2节 · 假说-演绎法与显隐性判断是方法学核心"}, {"id": "c1s0", "ch": 1, "chT": "基因的分离定律", "t": "实验材料与基本操作", "terms": "自交 相对性状 等位基因", "x": "实验材料与基本操作 豌豆优点：①自花传粉、闭花受粉，自然状态下都是纯种；②具有易于区分的相对性状；③生长周期短、后代数量大；④花大，易操作。 果蝇优点：易饲养、繁殖快、后代数量多；相对性状多而明显；染色体少、易观察。玉米优点：繁殖快、后代多；相对性状明显；雌雄同株异花，杂交易操作。 人工异花传粉：花蕾期人工去雄 → 套袋 → 人工授粉 → 再套袋（母本去雄须在开花前）。 基本概念 自交：基因型相同个体间交配（闭花授粉、同株授粉）；杂交：基因型不同个体交配；测交：与隐性纯合子杂交。 相对性状：一种生物同一种性状的不同表现类型；性状分离：杂种后代中同时出现显性性状和隐性性状。 等位基因：同源染色体相同位置上控制相对性状的基因（纯合子同位置为相同基因；本质区别是碱基排列顺序不同）。 融合遗传≠不完全显性：紫茉莉红×白→粉花，粉花自交后代 1红:2粉:1白，可重新出现红、白，属于颗粒遗传。"}, {"id": "c1s1", "ch": 1, "chT": "基因的分离定律", "t": "假说-演绎法（背诵）", "terms": "", "x": "假说-演绎法（背诵） 四步：提出问题 → 提出假说 → 演绎推理（若假说成立，测交后代应为 1:1）→ 实验验证（实际 1:1）→ 得出结论 假说内容：①生物性状由遗传因子决定；②体细胞中遗传因子成对存在；③形成配子时每对遗传因子分离，分别进入不同配子；④受精时雌雄配子随机结合。 核心：F1 产生数量相等的两种配子。测交后代比例反映被测个体配子种类及比例。"}, {"id": "c1s2", "ch": 1, "chT": "基因的分离定律", "t": "分离定律的实质与验证", "terms": "等位基因随同源染色体的分开而分离", "x": "分离定律的实质与验证 实质（背诵·P32）：杂合子细胞中，位于一对同源染色体上的等位基因具有一定的独立性；在减数分裂形成配子时，等位基因随同源染色体的分开而分离，独立地随配子遗传给后代（减Ⅰ后期）。 易错警示 符合分离定律不一定出现 3:1，3:1 成立需同时满足：①配子成活率均等；②基因型个体成活率均等；③子代数目足够多；④完全显性；⑤等位基因仅一对且无致死。最能说明实质的是 F1 产生配子比为 1:1。 特殊分离比 显性纯合致死杂合子自交 → 显:隐 = 2:1 隐性纯合致死杂合子自交 → 后代全显性 配子致死如 AB 雄配子致死 → 5:3:3:1 变式（见第3章）"}, {"id": "c1s3", "ch": 1, "chT": "基因的分离定律", "t": "应用一：显隐性判断", "terms": "", "x": "应用一：显隐性判断 定义法（杂交）：两不同性状亲本杂交，子代只出现一种性状→子代性状为显性；同性状亲本杂交出现分离→新性状为隐性。 自交法：自交后代出现性状分离→亲本为显性（适用于植物，最简便）。 动物判断显隐性：多对杂交统计比例（单次交配后代少，不能直接下结论）。"}, {"id": "c1s4", "ch": 1, "chT": "基因的分离定律", "t": "应用二：纯合子/杂合子鉴定", "terms": "", "x": "应用二：纯合子/杂合子鉴定 方法操作与判断适用 自交后代无性状分离→纯合子；有分离→杂合子植物（最简便） 测交×隐性纯合子，子代一种性状→纯合；两种→杂合动物（雄性需与多只隐性雌性交配）、植物均可 花粉鉴定两种花粉1:1→杂合（如糯性与非糯性碘染）仅部分特殊植物，最直接证明"}, {"id": "c1s5", "ch": 1, "chT": "基因的分离定律", "t": "应用三：连续自交与自由交配", "terms": "", "x": "应用三：连续自交与自由交配 杂合子连续自交 n 代Aa 占 (1/2)n；纯合子 1−(1/2)n；显纯=隐纯=[1−(1/2)n]/2 连续自交逐代淘汰 aaAA:Aa 比例每代不变，淘汰后按比例重新归一化 自由交配基因频率不变，基因型频率自 F1 起稳定（遗传平衡） 高频考点 性状分离比模拟实验：甲乙两桶代表雌雄生殖器官，彩球代表配子，两色球代表两种配子；随机抓取组合模拟雌雄配子随机结合。要求：每桶两色球数量相等、抓取随机、记录后放回摇匀、重复 30 次以上以减少误差。"}, {"id": "c2", "ch": 2, "chT": "基因的自由组合定律", "t": "基因的自由组合定律", "terms": "", "x": "03 基因的自由组合定律 必修2 第1章第2节 · 9:3:3:1 变式与两对基因位置判断是解题难点"}, {"id": "c2s0", "ch": 2, "chT": "基因的自由组合定律", "t": "两对相对性状的杂交实验", "terms": "重组类型", "x": "两对相对性状的杂交实验 F1 全为黄圆（黄对绿、圆对皱均为显性）；F2 出现亲本没有的重组类型，四种表现型之比 9:3:3:1。 每一对相对性状单独分析均符合分离定律（黄:绿=3:1，圆:皱=3:1）。 F2 结构：4种纯合子各占 1/16；4种单杂合子各占 2/16；双杂合子 YyRr 占 4/16。 测交结果 1:1:1:1，可检测 F1 配子种类及比例、基因型、纯合杂合。"}, {"id": "c2s1", "ch": 2, "chT": "基因的自由组合定律", "t": "实质（背诵）", "terms": "同源染色体上的等位基因分离的同时，非同源染色体上的非等位基因自由组合", "x": "实质（背诵） 同源染色体上的等位基因分离的同时，非同源染色体上的非等位基因自由组合（减Ⅰ后期）。两定律同时进行、同时起作用；自由组合发生在产生配子时，配子的随机结合不属于自由组合。 易错警示 非等位基因不一定位于非同源染色体上——同一条染色体上的多个基因也是非等位基因，但不能自由组合（连锁）。\"非同源染色体自由组合，使所有非等位基因自由组合\"错误。"}, {"id": "c2s2", "ch": 2, "chT": "基因的自由组合定律", "t": "解题方法：先分后合（乘法原理）", "terms": "", "x": "解题方法：先分后合（乘法原理） 正推：AaBb×Aabb → 子代基因型 3×2=6 种，表现型 2×2=4 种；某基因型概率=两对概率相乘。 逆推：由子代表现型及比例倒推双亲基因型（先拆分每对性状）。 两种遗传病概率：每对先算，再乘（自由组合为前提）。 分解组合法的前提是两对基因独立遗传（配子中比例互不干扰）；若配子比例随搭配改变则不适用（连锁）。"}, {"id": "c2s3", "ch": 2, "chT": "基因的自由组合定律", "t": "9:3:3:1 的变式（高频）", "terms": "", "x": "9:3:3:1 的变式（高频） F2 分离比原因（配子致死类用棋盘法：列出配子→删除致死→重新归纳） 5:3:3:1AB 的雄配子或雌配子致死 7:3:1:1Ab 的雄配子或雌配子致死 7:1:3:1aB 的雄配子或雌配子致死 8:2:2ab 的雄配子或雌配子致死 6:3:2:1AA 或 BB 显性纯合致死 4:2:2:1AA 和 BB 同时显性纯合致死 3:1aa 或 bb 隐性纯合致死 9:3:3aabb 受精卵（胚胎）致死"}, {"id": "c2s4", "ch": 2, "chT": "基因的自由组合定律", "t": "验证自由组合的四种方法", "terms": "", "x": "验证自由组合的四种方法 自交法：F1（AaBb）自交后代 9:3:3:1； 测交法：后代 1:1:1:1； 花粉鉴定法：四种花粉 1:1:1:1； 单倍体育种法：花药培养加倍后四种表现型 1:1:1:1。"}, {"id": "c2s5", "ch": 2, "chT": "基因的自由组合定律", "t": "两对基因的位置判断（连锁与互换）", "terms": "", "x": "两对基因的位置判断（连锁与互换） 同一对同源染色体·不考虑互换完全连锁：自交后代全显性或 显:隐=3:1（比例型同单基因）；测交后代 1:1 同一对同源染色体·考虑互换重组型配子少：测交后代两多两少；自交后代两种单显性比例始终相等 亲本型判断aabb 占比＞1/16 → ab 为亲本型配子；＜1/16 → ab 为重组型配子"}, {"id": "c2s6", "ch": 2, "chT": "基因的自由组合定律", "t": "杂交育种", "terms": "", "x": "杂交育种 植物：选纯合双亲杂交 → F1 自交 → F2 选优 → 连续自交至不再发生性状分离（可用分区域种植法加快）。动物：杂交 → 选优 → 与隐性（或双隐）类型测交检验纯合度，不通过逐代自交。 若所需优良性状为种子（果实）性状，当年即可收获选用；若为植株性状，需种到植株表现性状再选。 高频考点 2022 山东卷：6种纯合突变体互交判突变基因——\"突×突→突\"为相同基因突变（非等位），\"突×突→野\"为不同基因突变。"}, {"id": "c3", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "基因在染色体上、伴性遗传与人类遗传病", "terms": "", "x": "04 基因在染色体上、伴性遗传与人类遗传病 必修2 第2章 · 系谱图判断与正反交设计是考试必出题型"}, {"id": "c3s0", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "萨顿假说（类比推理法）", "terms": "", "x": "萨顿假说（类比推理法） 依据：基因和染色体的行为存在明显的平行关系——①基因在体细胞中成对、染色体也成对；②体细胞中一对基因一个来自父方一个来自母方，同源染色体亦然；③形成配子时成对的基因（染色体）一个进入配子；④非同源染色体自由组合时，非同源染色体上的非等位基因也自由组合。结论：基因在染色体上。"}, {"id": "c3s1", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "摩尔根实验（假说-演绎法）", "terms": "呈线性排列", "x": "摩尔根实验（假说-演绎法） 提出问题：F1 全红眼、F2 3:1 且白眼只在雄性中出现。 假说：控制白眼的基因 w 位于 X 染色体上，Y 染色体上不含其等位基因。 验证：F1 红眼雌 × 白眼雄 → 4种表型 1:1:1:1；关键证据是白眼雌 × F1 红眼雄 → 子代雌全红、雄全白（1:1）。 结论：基因在染色体上；后又发明测定基因相对位置的方法（三点测交），证明基因在染色体上呈线性排列。 边角小字 测交实验不能排除\"基因位于 XY 同源区段\"的假说——可用反交实验（白眼雌 × 红眼雄）排除：若子代雌全红、雄全白且与假说预测矛盾即可排除。荧光标记的 DNA 探针与染色体杂交可直观显示基因位置。 易错警示 基因并非全部位于染色体上：线粒体、叶绿体、原核拟核与质粒、病毒中的基因无染色体。X、Y 染色体同源区段存在等位基因，非同源区段没有。果蝇的 Y 染色体比 X 大（P31）。"}, {"id": "c3s2", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "性别决定与伴性遗传", "terms": "", "x": "性别决定与伴性遗传 XY 型：含两个 X 为雌性，XY 为雄性；性别比例 1:1 的原因是含 X 与含 Y 的精子比例 1:1。ZW 型：ZZ 雄、ZW 雌（鸟类、蛾类）。 性别决定不全是 XY/ZW：有的取决于染色体数目，有的取决于环境（如后螠）；雌雄同体生物无性染色体。 类型实例特点 伴X隐性红绿色盲、血友病隔代遗传；男患者多于女；女病其父、子必病（交叉遗传） 伴X显性抗维生素D佝偻病世代连续；女患者多于男；男病其母、女必病 伴Y外耳道多毛症限雄遗传，父传子、子传孙，世代连续，无显隐之分 细胞质线粒体基因病母系遗传：子女表现型与母亲相同 易错警示 XY 同源区段（Ⅰ）：基因男女都可患病，男患病率可能≠女；X 特有区段（Ⅱ）：隐性病男＞女；Y 特有区段（Ⅲ）：患者全为男性。伴X隐性致病基因：男患者只能来自母亲、只能传给女儿。"}, {"id": "c3s3", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "遗传系谱图判断（准确/最可能）", "terms": "", "x": "遗传系谱图判断（准确/最可能） 三步：先排除伴Y遗传和细胞质遗传（母系）→ 判显隐性：\"无中生有为隐性，有中生无为显性\" → 判位置：女病其父、子全病→伴X隐性；男病其母、女全病→伴X显性；否则常染色体。\"可能\"与\"最可能\"审题：可能一般有多种，最可能只有一种。 正反交的应用（一代交配判位置） 未知显隐性：正反交结果不同（有性别差异）→伴X；结果相同（无性别差异）→常染色体；后代总与母本相同→细胞质遗传。 已知显隐性：用\"同隐异显\"（隐性雌 × 显性纯合雄）判断常/伴X。 判断父本/母本来源致死：双杂合子分别作父本、母本分别测交比较。"}, {"id": "c3s4", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "人类遗传病", "terms": "", "x": "人类遗传病 单基因遗传病：受一对等位基因控制，符合分离定律（白化病、红绿色盲、抗维生素D佝偻病）。 多基因遗传病：两对以上等位基因控制，群体发病率高，易受环境影响（原发性高血压、青少年型糖尿病）。 染色体异常遗传病：猫叫综合征=5号染色体片段缺失；21三体综合征=体细胞多一条21号染色体（是\"三条染色体\"而非三个染色体组）。 易错警示 五个\"不一定\"：携带致病基因不一定患病（女性携带者）；不携带致病基因也可能患病（染色体异常病）；先天性疾病不一定遗传；家族性疾病不一定遗传（缺维生素A夜盲）；遗传病不一定出生即表现。人类所有的病不都是基因病。 高频考点 调查：发病率→在广大人群随机抽样、群体足够大、选发病率较高的单基因遗传病；遗传方式→在患者家系中调查。多基因遗传病易受环境影响，不宜作为调查对象。基因组测序：人测 24 条（22常+X+Y），玉米（2n=20）测 11 条，果蝇同理。 高考真题链接 伴X基因频率在男女中相等（交叉遗"}, {"id": "c4", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "DNA 是主要的遗传物质", "terms": "", "x": "05 DNA 是主要的遗传物质 必修2 第3章第1节 · 三大经典实验的过程、结论与异常分析必须记准"}, {"id": "c4s0", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "肺炎链球菌转化实验", "terms": "转化因子", "x": "肺炎链球菌转化实验 材料特点：S型菌有多糖类荚膜、有毒、菌落光滑；R型菌无荚膜、无毒、菌落粗糙（P43）。 格里菲思体内转化：加热杀死的S型菌 + 活R型菌 → 小鼠死亡，体内分离出活S型菌 → 加热杀死的S型菌中含有\"转化因子\"，使R型转化为S型。 艾弗里体外转化：S型菌破碎→去除绝大部分糖类、蛋白质和脂质制成细胞提取物→分别加入蛋白酶、RNA酶、酯酶、DNA酶（减法原理：每组特异性去除一种物质）→只有 DNA 酶组转化消失 → DNA 是遗传物质，蛋白质等不是。 边角小字 加热致死后 DNA 仍保持活性的原因：80~100℃ 时蛋白质变性失活，而 DNA 双链解开、温度恢复后可复性（P43 小字）。转化的实质是基因重组；转化效率低，只有少部分R型菌转化。艾弗里实验还证明 DNA 可在同种生物不同个体间转移（为基因工程奠基，Ca²⁺处理大肠杆菌=人工转化）。"}, {"id": "c4s1", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "噬菌体侵染细菌实验", "terms": "", "x": "噬菌体侵染细菌实验 四步：①标记噬菌体：先分别用含 ³⁵S、³²P 的培养基培养大肠杆菌，再用其培养噬菌体 → ②侵染未标记的大肠杆菌 → ③搅拌（使吸附在细菌上的噬菌体与细菌分离）→ ④离心（轻的噬菌体颗粒进上清液，重的细菌留沉淀）→ ⑤检测放射性 ³⁵S 标记蛋白质理论上沉淀物无放射性；实测有少量→搅拌不充分，噬菌体仍吸附在细菌表面 ³²P 标记 DNA理论上上清液无放射性；实测有少量→保温过短（未全部侵入）或过长（细菌裂解释放子代） 结论DNA 是遗传物质，蛋白质不是（有争议说\"没证明\"） 易错警示 ①不能用培养基直接培养噬菌体（病毒必须寄生）；②³⁵S、³²P 必须分两组分别标记（同位素检测只能定位不能辨元素）；③不能标记 C、H、O、N（DNA 与蛋白质共有）；④短时间保温=让噬菌体充分侵染又不裂解释放；⑤实验间接证明 DNA 能自我复制、指导蛋白质合成，不能证明 DNA 可产生可遗传变异；⑥子代噬菌体只有少数被 ³²"}, {"id": "c4s2", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "烟草花叶病毒的重建实验", "terms": "", "x": "烟草花叶病毒的重建实验 烟草花叶病毒侵染烟草细胞时，RNA 与蛋白质没有分开（完整病毒侵入），故 TMV 实验不能用噬菌体的操作思路（噬菌体只向细菌注入 DNA，两者天然分开）。 方法：人工分离提纯 RNA 与蛋白质，分别感染烟草 → RNA 组出现病斑并分离出正常 TMV → RNA 是烟草花叶病毒的遗传物质。"}, {"id": "c4s3", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "总结与辨析", "terms": "", "x": "总结与辨析 高频考点 实验共同设计思路（考填空）：将 DNA、蛋白质等物质分开，单独、直接观察各自的作用（分离提纯法/减法原理/同位素标记）。 结论：真核、原核生物及 DNA 病毒的遗传物质都是 DNA；少数病毒（HIV、流感、新冠、烟草花叶病毒）是 RNA → DNA 是主要的遗传物质（统计分析结论，非实验直接验证）。细胞生物的遗传物质只能是 DNA。 高考真题链接 2017 全国Ⅰ卷：判断新病毒类型需甲、乙两组相互印证——用标记特定碱基（如分别标记 T 或 U）的宿主细胞培养病毒，检测子代放射性确定核酸种类。"}, {"id": "c5", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "DNA 的结构、基因的本质与 DNA 复制", "terms": "", "x": "06 DNA 的结构、基因的本质与 DNA 复制 必修2 第3章第2、3节 · 碱基计算与半保留复制证据是计算题主线"}, {"id": "c5s0", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "DNA 双螺旋结构的特点（背诵·P50）", "terms": "碱基互补配对原则", "x": "DNA 双螺旋结构的特点（背诵·P50） 由两条脱氧核苷酸长链构成，按反向平行方式盘旋成双螺旋结构。 外侧：脱氧核糖与磷酸交替连接构成基本骨架；内侧：碱基通过氢键形成碱基对（A=T，G≡C），遵循碱基互补配对原则。 A=T 之间2个氢键，G≡C 之间3个氢键 → G-C 碱基对越多 DNA 越稳定（耐高温）。 1个双链 DNA 含 2个游离磷酸基团、0个游离脱氧核糖；每个磷酸基团连接1~2个脱氧核糖（2个游离磷酸各只连1个），每个脱氧核糖连接1~2个磷酸。 模型构建：沃森、克里克（构建物理模型）；富兰克林拍摄\"照片51号\"（X射线衍射）；威尔金斯展示照片；查哥夫法则（A=T、G=C）提供化学依据。 边角小字 两条链反向平行的意义：DNA 两条链走向相反，使碱基对能整齐配对排布（P50）。酶与化学键：解旋酶、高温断氢键；DNA 聚合酶、DNA 连接酶形成磷酸二酯键；限制酶、DNA 酶破坏磷酸二酯键。"}, {"id": "c5s1", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "碱基计算", "terms": "", "x": "碱基计算 不互补碱基之和恒定A+G = T+C = 50% 互补碱基比例相等单链(A+T)% = 互补链(A+T)% = 双链(A+T)% 氢键数n对碱基中G-C有m对：2(n−m)+3m = 2n+m 磷酸二酯键2n−2 个（n为碱基对数）"}, {"id": "c5s2", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "遗传信息与基因的本质（背诵）", "terms": "遗传信息 基因 遗传效应", "x": "遗传信息与基因的本质（背诵） 遗传信息：基因中 4 种碱基（脱氧核苷酸）的排列顺序。多样性：碱基对的数目和排列顺序千变万化；特异性：每种生物有特定的碱基排列顺序（β-珠蛋白基因1700对→41700 种排列）。 基因：通常是有遗传效应的 DNA 片段。基因在 DNA 上不连续分布（被碱基序列分隔）；染色体是 DNA 的主要载体，基因在染色体上呈线性排列；RNA 病毒的基因在 RNA 上。 数量关系：1条染色体含1个（无单体）或2个（有单体）DNA，DNA 上有许多基因；基因中脱氧核苷酸排列顺序代表遗传信息。"}, {"id": "c5s3", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "DNA 的复制（背诵·P56）", "terms": "冈崎片段", "x": "DNA 的复制（背诵·P56） 时间有丝分裂间期、减数第一次分裂前的间期 场所主要细胞核；其次线粒体、叶绿体；原核在拟核、质粒 条件模板（两条母链）、原料（4种游离脱氧核苷酸）、能量、酶（解旋酶、DNA聚合酶等） 过程解旋 → 合成子链 → 重新螺旋（边解旋边复制） 特点半保留复制；多起点、双向复制 结果与意义1个DNA→2个完全相同的DNA；保持遗传信息连续性 高频考点 准确复制的原因：①独特的双螺旋结构提供精确模板；②碱基互补配对保证准确进行。方向：DNA 聚合酶只能催化子链 5'→3' 延伸（从引物 3' 端连接脱氧核苷酸）→ 后随链形成冈崎片段（不连续，由 DNA 连接酶连接）；两条链反向平行+酶的方向性 → 双向复制。引物：DNA 聚合酶不能从头合成，需 RNA 引物，随后被替换保证准确性。 半保留复制的实验证据（梅塞尔森、斯塔尔） 方法：假说-演绎法 + 同位素标记技术（¹⁵N）+ 密度梯度离心技术。 流程：¹⁵N "}, {"id": "c6", "ch": 6, "chT": "基因的表达", "t": "基因的表达", "terms": "", "x": "07 基因的表达 必修2 第4章 · 转录翻译全程、中心法则与表观遗传"}, {"id": "c6s0", "ch": 6, "chT": "基因的表达", "t": "RNA 与密码子", "terms": "密码子 反密码子", "x": "RNA 与密码子 RNA 适合做信使的原因（P65）：能储存遗传信息；一般为单链、比 DNA 短，能通过核孔从细胞核转移到细胞质。 3种 RNA：mRNA——携带遗传信息，翻译的模板；tRNA——识别并转运氨基酸、识别密码子；rRNA——构成核糖体，催化肽键形成。RNA 还是 RNA 病毒的遗传物质、少数酶的成分。3种 RNA 都是转录产物，都参与翻译。 密码子：mRNA 上决定一个氨基酸的 3 个相邻碱基，共 4³=64 种（3 种终止密码子、61 种决定氨基酸）；反密码子在 tRNA 上。一种密码子只决定一种氨基酸，一种氨基酸可由一种或多种密码子决定。 边角小字 简并性意义（P67 思考·讨论）：①碱基改变可能不改变氨基酸，增强容错性；②多种密码子编码同一氨基酸可保证翻译速度。通用性：所有生物共用一套密码子（病毒基因导入宿主仍表达病毒蛋白）。特殊：原核 GUG 可作起始密码子；UGA 特殊情况编码硒代半胱氨酸。"}, {"id": "c6s1", "ch": 6, "chT": "基因的表达", "t": "转录", "terms": "启动子 终止子", "x": "转录 场所：主要细胞核（也在线粒体、叶绿体、拟核、质粒）；模板：DNA 的一条链（模板链/反义链）；原料：4种游离核糖核苷酸；酶：RNA 聚合酶（兼具解旋、识别结合启动子、连接磷酸二酯键功能）；产物 mRNA 等。 mRNA 延伸方向 5'→3'；转录与复制都遵循碱基互补配对，保证信息传递准确。 启动子：基因上游，RNA 聚合酶识别结合位点，本身不被转录；终止子：编码区下游，终止转录（RNA 水平形成茎-环结构）。 起始密码子、终止密码子位于 mRNA 上；一个基因的有义链可能是另一基因的反义链。"}, {"id": "c6s2", "ch": 6, "chT": "基因的表达", "t": "翻译", "terms": "肽键", "x": "翻译 场所：核糖体；模板：mRNA；原料：20种氨基酸；搬运工：tRNA（一种 tRNA 只转运一种氨基酸）；方向：核糖体沿 mRNA 由 5'→3' 移动（肽链从 N 端向 C 端合成），mRNA 不移动。 核糖体有 2 个 tRNA 结合位点；氨基酸间脱水缩合形成肽键；遇终止密码子合成终止。 准确翻译的原因：mRNA 提供精确模板 + 碱基互补配对（密码子-反密码子）。 多聚核糖体（P69）：一个 mRNA 上结合多个核糖体同时翻译→少量 mRNA 迅速合成大量蛋白质；按肽链长短判断先后（长的在前）。各核糖体产物完全相同。 时空：真核——核内转录、质内翻译，时空分隔；原核——边转录边翻译；线粒体、叶绿体同原核。"}, {"id": "c6s3", "ch": 6, "chT": "基因的表达", "t": "数量关系与中心法则", "terms": "", "x": "数量关系与中心法则 碱基数比例基因 : mRNA : 氨基酸 ≈ 6 : 3 : 1；实际不符原因：内含子转录后被剪切、非编码区不转录、终止密码子不编码氨基酸、肽链加工剪切 中心法则：DNA复制、转录、翻译三主线 + RNA复制（烟草花叶病毒）+ 逆转录（HIV）。 RNA 复制酶、逆转录酶由病毒自身基因组编码、在宿主细胞合成。 体现基因两大功能：传递遗传信息（复制）与表达遗传信息（转录、翻译）。 不同细胞：分裂旺盛细胞三条途径都有；高度分化细胞只有转录翻译；哺乳动物成熟红细胞无。 遗传密码破译（P70）：尼伦伯格体外合成实验——人工多聚尿嘧啶核苷酸（UUU）→多聚苯丙氨酸；需除去提取液中 DNA 和 mRNA 排除干扰。"}, {"id": "c6s4", "ch": 6, "chT": "基因的表达", "t": "基因与性状的关系（背诵·P71）", "terms": "酶的合成控制代谢过程 蛋白质的结构 选择性表达", "x": "基因与性状的关系（背诵·P71） 间接控制：基因通过控制酶的合成控制代谢过程，进而控制性状——白化病（酪氨酸酶）、豌豆皱粒（淀粉分支酶）。 直接控制：基因通过控制蛋白质的结构直接控制性状——镰刀型细胞贫血（血红蛋白）、囊性纤维化（CFTR）。 基因与性状不都是一一对应：一个基因可影响多个性状，一个性状可受多个基因影响；表型 = 基因型 + 环境（单双眼皮、表型模拟）。 细胞分化的实质：基因的选择性表达；不同细胞 mRNA 不同，但 tRNA、rRNA 无差异。"}, {"id": "c6s5", "ch": 6, "chT": "基因的表达", "t": "表观遗传（P74）", "terms": "碱基序列保持不变 基因表达和表型发生可遗传变化", "x": "表观遗传（P74） 概念（背诵）：生物体基因的碱基序列保持不变，但基因表达和表型发生可遗传变化的现象。 机制：①DNA 甲基化；②组蛋白甲基化/乙酰化；③RNA 干扰——主要影响转录过程。 特点：可遗传、可逆（甲基化可去）；不遵循孟德尔遗传规律；通过有丝分裂、减数分裂传递。 实例：柳穿鱼花形、小鼠毛色、蜂王浆使幼虫发育成蜂王（减少 DNA 甲基化改变基因表达）。 高考真题链接 遗传印记（甲基化随配子重建）常考：亲代雌鼠某基因来自父方（雄配子印记去甲基化）；反义 RNA 与 mRNA 形成双链阻断翻译=基因沉默，杂交分子含 4 种核苷酸、4 种碱基。"}, {"id": "c7", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "基因突变、基因重组和染色体变异", "terms": "", "x": "08 基因突变、基因重组和染色体变异 必修2 第5章 · 三种可遗传变异比较与育种方法选择"}, {"id": "c7s0", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "基因突变", "terms": "替换、增添或缺失 碱基序列的改变 普遍性、随机性、不定向性、低频性、多害少利性", "x": "基因突变 概念（背诵·P81）：DNA 分子中发生碱基的替换、增添或缺失，而引起的基因碱基序列的改变。 时间：主要是有丝分裂前的间期、减数第一次分裂前的间期（DNA 复制时出现差错）；原因：物理、化学、生物因素（诱发）+ 自发突变。 5个特点：普遍性、随机性、不定向性、低频性、多害少利性。 意义：产生新基因的途径；生物变异的根本来源；为生物进化提供原材料。 易错警示 一定改变：碱基序列、遗传信息、基因种类（突变产生原基因的等位基因）；不一定改变：氨基酸序列（密码子简并性）、生物性状（隐性突变、突变发生在非编码区或内含子、个别氨基酸改变不影响蛋白功能）；基因数目和位置不变。能否遗传：发生在配子中→遵循遗传规律传给后代；体细胞→一般不能（植物可通过无性生殖）；父方细胞质基因突变一般不传子代。基因突变光镜下不可见；红细胞（无核无线粒体）不会突变。 显性/隐性突变判断：将突变体与未突变体（野生型）杂交——子一代全为野生型→隐性突变；子一"}, {"id": "c7s1", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "基因重组", "terms": "", "x": "基因重组 类型：①减Ⅰ后期——非同源染色体上非等位基因自由组合；②减Ⅰ前期（四分体时期）——同源染色体非姐妹染色单体间交叉互换。 本质：原有基因的重新组合，产生新基因型，不产生新基因。广义还包括基因工程、肺炎链球菌的转化。 意义：生物变异的来源之一；形成生物多样性的重要原因；为进化提供原材料（配子多样化→有性生殖加快进化，P84/P122）。 判断：基因重组不发生在受精作用中；姐妹染色单体间\"交换\"不属于基因重组；Aa 自交的性状分离是等位基因分离所致，不是基因重组。"}, {"id": "c7s2", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "三种可遗传变异的比较", "terms": "", "x": "三种可遗传变异的比较 项目基因突变基因重组染色体变异 适用范围所有生物（含病毒）均可发生真核生物有性生殖核基因；人工基因工程真核生物 发生时间间期（DNA复制时）减Ⅰ前期、减Ⅰ后期随时可发生 结果产生新基因产生新基因型基因数目或排列顺序改变 光镜观察不可见（分子水平）不可见可见（细胞水平） 意义变异的根本来源变异来源之一变异来源之一 易错警示 互换 vs 易位：互换发生在同源染色体的非姐妹染色单体之间（基因重组，不可见）；易位发生在非同源染色体之间（染色体结构变异，可见）。基因突变 vs 染色体缺失：基因突变是基因内若干碱基对的改变；染色体缺失是 DNA 上若干基因的缺失。姐妹染色单体上出现等位基因：基因突变或交叉互换均可导致。"}, {"id": "c7s3", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "染色体结构变异", "terms": "缺失 重复 倒位 易位", "x": "染色体结构变异 四种类型：缺失（猫叫综合征=5号缺失）、重复、倒位、易位——基因的数目或排列顺序发生改变。判读依据：染色体上基因数目或排列顺序改变；联会时可出现缺失环、重复环、倒位环、十字形（易位）。"}, {"id": "c7s4", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "染色体数目变异与染色体组", "terms": "染色体组 单倍体", "x": "染色体数目变异与染色体组 染色体组（背诵·P87）：细胞中的一组非同源染色体，形态和功能各不相同，携带着控制生物生长发育的全部遗传信息。 组数判断：①同种形态染色体有几条→几个组；②基因型中同一字母（不分大小写）出现几次→几个组（AaBb=2组、AAaaBbbb=4组）。 二倍体：受精卵发育、含2个组；多倍体：受精卵发育、含3个及以上组；单倍体：体细胞染色体数与本物种配子相同——由配子直接发育，不论几个组都是单倍体（雄蜂、四倍体的单倍体含2组）。 育性：染色体组为偶数、能联会→一般可育；奇数→联会紊乱→高度不育（三倍体、骡）。异源多倍体的单倍体加倍后仍可能是杂合子。"}, {"id": "c7s5", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "育种方法", "terms": "纺锤体形成", "x": "育种方法 方法原理方法要点优缺点 杂交育种基因重组杂交→自交→选优→连续自交至纯合集中双亲优良性状、操作简单；时间长 诱变育种基因突变物理化学因素处理萌发种子/幼苗提高突变率、大幅改良；盲目、需大量材料 单倍体育种染色体数目变异花药离体培养→单倍体幼苗→秋水仙素加倍→纯合子明显缩短育种年限，后代全纯合；技术复杂 多倍体育种染色体数目变异秋水仙素/低温处理萌发的种子或幼苗茎秆粗壮、果实种子大、营养高；发育迟缓、结实率低 基因工程基因重组定向改造生物性状（外源基因表达）定向、高效；克服远缘杂交不亲和 秋水仙素/低温原理：作用于分裂前期，抑制纺锤体形成→染色体不能移向两极→细胞不分裂→染色体数目加倍（秋水仙素诱导基因突变则作用于间期）。 无子西瓜（P91）：二倍体×四倍体→三倍体种子→种下，授二倍体花粉刺激子房发育→三倍体无子西瓜（联会紊乱不育故无子）。两次授粉：第一次授粉（四倍体 × 二倍体）获得三倍体种子；第二次给三倍体植株授二倍"}, {"id": "c8", "ch": 8, "chT": "生物的进化", "t": "生物的进化", "terms": "", "x": "09 生物的进化 必修2 第6章 · 现代生物进化理论五大要点与基因频率计算"}, {"id": "c8s0", "ch": 8, "chT": "生物的进化", "t": "进化理论的发展", "terms": "", "x": "进化理论的发展 拉马克：用进废退、获得性遗传——进步：否定物种不变论、所有生物由更古老生物进化而来；局限：认为变异是定向的（环境变化直接导致物种改变）。 达尔文：①共同由来学说（所有生物由原始的共同祖先进化而来，揭示生物的统一性）；②自然选择学说——过度繁殖（基础）、生存斗争（动力）、遗传变异（内因）、适者生存（结果），揭示生物的多样性和适应性。 自然选择学说局限（P109）：对遗传变异的认识局限于性状水平，不能解释本质；研究对象局限于个体水平；认为物种形成是渐变的，不能解释物种大爆发。"}, {"id": "c8s1", "ch": 8, "chT": "生物的进化", "t": "共同由来学说的证据", "terms": "化石", "x": "共同由来学说的证据 化石：保存在地层中的古代生物遗体、遗物或生活痕迹——研究生物进化最直接、最重要的证据；越早地层生物越低等、越简单，证实生物由共同祖先经漫长地质年代逐渐进化（简单→复杂、低等→高等、水生→陆生，P101）。 比较解剖学：同源器官（人的上肢与其他脊椎动物前肢结构一致）→共同祖先，适应不同环境出现形态功能差异。 胚胎学：人及脊椎动物胚胎发育都经历鳃裂、尾阶段。 细胞和分子水平：都含 DNA、细胞色素 C 氨基酸序列高度相似、密码子通用、都遵循中心法则；DNA/蛋白质差异大小反映亲缘关系远近与出现顺序。"}, {"id": "c8s2", "ch": 8, "chT": "生物的进化", "t": "适应的形成（P107-108）", "terms": "可遗传变异 自然选择 可遗传的有利变异 定向选择", "x": "适应的形成（P107-108） 适应的两层含义：形态结构适合完成一定功能；形态结构及其功能适合该生物在一定环境中生存和繁殖。 特点：普遍性（拟态、保护色）+ 相对性（雷鸟换白羽遇降雪延迟易被天敌发现）——根本原因：遗传的稳定性与环境不断变化之间的矛盾；适应性特征是对之前环境适应的结果。 拉马克：适应=用进废退+获得性遗传；达尔文：适应的来源是可遗传变异，适应是自然选择的结果。 适应形成的必要条件（背诵）：群体中出现可遗传的有利变异和环境的定向选择。"}, {"id": "c8s3", "ch": 8, "chT": "生物的进化", "t": "用进化观点解释现象", "terms": "", "x": "用进化观点解释现象 细菌抗药性：达尔文——繁殖中产生各种可遗传变异（含抗药性强变异），抗生素使抗药弱者大量死亡、抗药强者生存繁殖，抗药个体增多；现代——抗生素滥用使耐药菌生存繁殖机会增加，耐药基因频率逐年上升形成超级细菌。 防止超级细菌：建立耐药预警机制，耐药率超限时及时更换抗生素，将耐药率控制在低水平（抑制单一抗生素的定向选择）。 变异发生在环境选择之前（不定向），环境只起选择作用——拉马克认为环境变化在前、生物为适应环境产生变异是错误的。"}, {"id": "c8s4", "ch": 8, "chT": "生物的进化", "t": "现代生物进化理论（背诵·P123）", "terms": "适应是自然选择的结果 种群是生物进化的基本单位 突变和基因重组提供进化的原材料", "x": "现代生物进化理论（背诵·P123） 适应是自然选择的结果；种群是生物进化的基本单位。 突变和基因重组提供进化的原材料，自然选择使种群基因频率定向改变，进而通过隔离形成新物种。 进化过程是生物与生物、生物与环境协同进化的过程；生物多样性是协同进化的结果。"}, {"id": "c8s5", "ch": 8, "chT": "生物的进化", "t": "种群基因频率与基因库", "terms": "", "x": "种群基因频率与基因库 种群 / 基因库 / 基因频率生活在一定区域的同种生物全部个体；全部基因；某个基因占全部等位基因数的比值 定义法某基因频率 = 该基因数 ÷ 全部等位基因数（伴X：男 = Xⁿ% ÷ (X+Y)） 遗传平衡定律5条件：种群极大、随机交配、无突变、无选择、无迁入迁出；p²+2pq+q²，AA=p²、Aa=2pq、aa=q² 易错警示 进化的实质：种群基因频率的定向改变（自然选择决定进化方向）。引起基因频率改变的因素：突变和基因重组、自然选择、迁入迁出、遗传漂变等。变异不定向，不能决定进化方向，只提供原材料；自发突变频率低但种群巨大，突变和重组的随机组合数极大。自然选择直接作用对象是生物个体（表型），本质是改变种群的基因频率。"}, {"id": "c8s6", "ch": 8, "chT": "生物的进化", "t": "隔离与物种形成", "terms": "物种 隔离 生殖隔离", "x": "隔离与物种形成 物种（P116）：能在自然状态下相互交配并产生可育后代的一群生物。隔离：不同种群间个体在自然条件下不能自由交配或不能产生可育后代的现象；实质=阻断基因交流。 生殖隔离范畴：不能交配、杂种不活（胚胎致死）、杂种不育（骡子联会紊乱）；地理隔离只是阻碍基因交流，不一定形成新物种。 物种形成三环节：突变和基因重组（原材料）→ 自然选择（决定进化方向）→ 隔离（物种形成的必要条件）；新物种形成的标志=生殖隔离。 关系：基因频率改变→一定发生进化，但不一定形成新物种；只有基因库差异达到不能实现基因交流的程度才形成新物种。 四倍体西瓜与二倍体杂交所得三倍体不育，故四倍体是新物种；三倍体西瓜、骡不是物种（无性生殖生物以表型特征区分）。"}, {"id": "c8s7", "ch": 8, "chT": "生物的进化", "t": "协同进化与生物多样性", "terms": "协同进化 基因（遗传）多样性、物种多样性、生态系统多样性", "x": "协同进化与生物多样性 协同进化（P121）：不同物种之间、生物与无机环境之间在相互影响中不断进化和发展；结果=形成生物多样性。 捕食者作用（P119）：捕食个体数量多的物种，避免一种或少数几种生物占绝对优势（收割理论）；吃掉年老病弱幼小个体促进种群发展；促进协同进化。 生物多样性三个层次：基因（遗传）多样性、物种多样性、生态系统多样性；形成过程：由原始生命进化出原核→真核→多细胞→各类生物。 边角小字 探究抗生素对细菌的选择作用（P115）：抑菌圈直径逐代变小=耐药菌比例升高；结论：耐药性来自可遗传变异（基因突变），抗生素起定向选择作用。 高考真题链接 ZW 型基因频率计算：雌性 ZaW%=10% → 种群短口器雌性占 5%；遗传平衡计算伴X性状：男 7%→女 0.49%。拓展概念：中性学说（中性突变靠遗传漂变固定）、遗传漂变（小种群随机波动更显著）。"}]}; const DOG_PULL=null, DOG_RUN="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASAB <script>
/* 生物必背知识点 · 交互版 逻辑 */
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KEY = "bio_interactive_v2";

/* ---------- 用户数据存储 ---------- */
let store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } })() || { users:{}, current:null };
function saveStore(){ localStorage.setItem(KEY, JSON.stringify(store)); }
function defUser(){ return { created:Date.now(), visited:{}, mastery:{}, cloze:{revealed:0,secs:{}},
  quiz:{}, cards:{known:{},seen:0}, theme:"light", clozeMode:"off", side:true, last:{} }; }
function curUser(){
  if (!store.current || !store.users[store.current]) store.current = Object.keys(store.users)[0] || null;
  if (!store.current) { store.users["默认用户"] = defUser(); store.current = "默认用户"; saveStore(); }
  return store.users[store.current];
}
const U = () => curUser();

/* ---------- 主题 ---------- */
function applyTheme(){ document.documentElement.dataset.theme = U().theme || "light"; }
function toggleTheme(){ const u=U(); u.theme = (u.theme==="dark") ? "light" : "dark"; saveStore(); applyTheme(); }

/* ---------- 章节结构（书籍页） ---------- */
let SECS = [];      // {id, el, chIdx, chT, title}
let CHS  = [];      // {i, n, t, el, secEls:[h2]}
function buildStructure(){
  const chaps = $$(".chapter");
  chaps.forEach((el, i) => {
    el.id = "c" + i;
    const meta = (BOOK && BOOK.chapters[i]) || { n:String(i+1), t: el.querySelector(".ch-head h1")?.textContent || "" };
    const h2s = [...el.querySelectorAll("h2")];
    h2s.forEach((h, j) => { h.id = "c" + i + "s" + j; });
    CHS.push({ i, n: meta.n, t: meta.t, el, secEls: h2s });
    if (h2s.length === 0) SECS.push({ id: el.id, el, chIdx: i, chT: meta.t, title: meta.t });
    h2s.forEach((h, j) => {
      SECS.push({ id: h.id, el: h, chIdx: i, chT: meta.t, title: h.textContent });
    });
  });
}

/* ---------- 侧边目录 ---------- */
function buildTOC(){
  const toc = $("#toc"); if (!toc) return;
  toc.innerHTML = CHS.map(ch => {
    const secs = ch.secEls.length ? ch.secEls.map(h =>
      `<button class="toc-sec" data-jump="${h.id}" data-sid="${h.id}"><span class="st">${esc(h.textContent)}</span><span class="m-dot" title="掌握度"></span></button>`
    ).join("") : `<button class="toc-sec" data-jump="${ch.el.id}" data-sid="${ch.el.id}"><span class="st">本章速览</span><span class="m-dot" title="掌握度"></span></button>`;
    return `<div class="toc-ch" data-ch="${ch.i}">
      <button class="toc-ch-head" data-jump="${ch.el.id}" data-sid="${ch.el.id}">
        <span class="n" style="background:var(--ac, var(--pri))">${esc(ch.n)}</span><span class="t">${esc(ch.t)}</span>
        <span class="prog"></span><span class="arr">▶</span>
      </button><div class="toc-secs">${secs}</div></div>`;
  }).join("");
  $$(".toc-sec .m-dot, .toc-ch-head .m-dot").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); cycleMastery(b.closest("[data-sid]").dataset.sid, b);
  }));
  $$(".toc-ch-head").forEach(b => b.addEventListener("click", e => {
    const box = b.parentElement;
    box.classList.toggle("open");
    if (e.target.closest(".m-dot")) return;
    if (window.innerWidth > 900) { puppyRun(); jumpTo(b.dataset.jump, {}); }
  }));
  $$(".toc-sec").forEach(b => b.addEventListener("click", e => {
    if (e.target.closest(".m-dot")) return;
    puppyRun();
    jumpTo(b.dataset.jump, {});
  }));
  refreshSidebarState();
}
function refreshSidebarState(){
  $$(".toc-ch").forEach(box => {
    const ch = CHS[+box.dataset.ch];
    const sids = ch.secEls.length ? ch.secEls.map(h => h.id) : [ch.el.id];
    const read = sids.filter(s => (U().visited[DATA.id]||[]).includes(s)).length;
    const done = sids.filter(s => U().mastery[s] === 2).length;
    box.querySelector(".prog").textContent = done === sids.length ? "已掌握" : `${read}/${sids.length}`;
  });
}
function cycleMastery(sid, dot){
  const u = U(); const cur = u.mastery[sid] || 0;
  u.mastery[sid] = (cur + 1) % 3; saveStore();
  syncDots();
}
function syncDots(){
  $$("[data-sid]").forEach(el => {
    const d = el.querySelector(".m-dot"); if (!d) return;
    const m = U().mastery[el.dataset.sid] || 0;
    d.className = "m-dot" + (m === 1 ? " m1" : m === 2 ? " m2" : "");
    d.title = ["标记：学习中", "标记：已掌握", "清除标记"][m];
  });
  refreshSidebarState();
}

/* ---------- 跳转 / 滚动 ---------- */
let BACK = [];   // 页内互链返回栈 {id, y, label}
function jumpTo(id, opts){
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({ behavior: opts.instant ? "auto" : "smooth", block: opts.block || "start" });
  if (opts.flash !== false) {
    const box = el.closest(".chapter") || el;
    box.classList.remove("ch-flash"); void box.offsetWidth; box.classList.add("ch-flash");
    setTimeout(() => box.classList.remove("ch-flash"), 1700);
  }
  if (window.innerWidth <= 900) document.body.classList.add("side-collapsed");
  if (opts.afterScroll) setTimeout(opts.afterScroll, 450);
}
function showBack(){
  const pill = $("#xback"); if (!pill) return;
  const top = BACK[BACK.length - 1];
  if (top) { pill.querySelector("span").textContent = "返回：" + top.label; pill.classList.add("show"); }
  else pill.classList.remove("show");
}
/* ---------- 互链 ---------- */
function buildXrefs(){
  if (typeof XREFS === "undefined" || !XREFS.length) return;
  const sidOf = (bk, c, s) => (bk === DATA.id ? "" : bk + ".html") + "#c" + c + (s == null ? "" : "s" + s);
  const entries = XREFS.slice().sort((a, b) => (b.t || "").length - (a.t || "").length);
  $$(".chapter").forEach(chEl => {
    const chIdx = +chEl.id.slice(1);
    const headText = chEl.querySelector(".ch-head")?.textContent || "";
    const used = new Set();
    const walker = document.createTreeWalker(chEl, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        const p = n.parentElement;
        if (!p || p.closest("a, .k, h1, h2, h3, .bx-tag, script, style, .ch-head")) return NodeFilter.FILTER_REJECT;
        return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      let text = node.nodeValue, hits = [];
      entries.forEach(en => {
        const key = en.t;
        if (used.has(key)) return;
        const terms = en.v ? [en.t, ...en.v] : [en.t];
        if (headText.includes(en.t)) return;
        for (const t of terms) {
          const pos = text.indexOf(t);
          if (pos >= 0) { hits.push({ pos, t, en }); break; }
        }
      });
      if (!hits.length) return;
      hits.sort((a, b) => a.pos - b.pos);
      const frag = document.createDocumentFragment();
      let last = 0;
      hits.forEach(h => {
        if (h.pos < last) return;

/* ---------- 小狗彩蛋 ---------- */
function injectDogEnds(){
  if (typeof DOG_PULL === "undefined" || !DOG_PULL) return;
  $$(".chapter").forEach(ch => {
    if (ch.querySelector(".dog-stage")) return;
    const d = document.createElement("div");
    d.className = "ch-end";
    d.innerHTML = `<div class="dog-stage">
      <svg class="dog-chain" viewBox="0 0 230 180" aria-hidden="true">
        <path class="chain-strap" d=""/><g class="chain-links"></g><circle class="chain-clasp" r="4.5"/><circle class="chain-anchor" r="5"/><circle class="chain-ring" r="6"/>
      </svg>
      <div class="dog-body"><img class="ch-dog" alt="戴着项圈的小狗" draggable="false"></div>
      <span class="dog-hint">拉一拉狗绳</span>
    </div>`;
    ch.appendChild(d);
  });
  DOG_PULL.forEach(src => { const im = new Image(); im.src = src; });
  $$(".ch-end .ch-dog").forEach(i => { i.src = DOG_PULL[0]; });
  bindDogPull();
}
function bindDogPull(){
  $$(".dog-stage").forEach(stage => {
    const body = stage.querySelector(".dog-body");
    const img = stage.querySelector(".ch-dog");
    const strap = stage.querySelector(".chain-strap");
    const links = stage.querySelector(".chain-links");
    const clasp = stage.querySelector(".chain-clasp");
    const anchor = stage.querySelector(".chain-anchor");
    const ring = stage.querySelector(".chain-ring");
    const hint = stage.querySelector(".dog-hint");
    const R = 52, K = 130, DAMP = 9;
    const DOG_X = 41, DOG_Y = 16, DOG_S = 148;
    const RING = { x: DOG_X + 0.468 * DOG_S, y: DOG_Y + 0.678 * DOG_S };
    const A = { x: 18, y: 18 };
    const T = [0.15, 0.45, 0.78];
    ring.setAttribute("cx", RING.x.toFixed(1)); ring.setAttribute("cy", RING.y.toFixed(1));
    clasp.setAttribute("cx", RING.x.toFixed(1)); clasp.setAttribute("cy", RING.y.toFixed(1));
    const st = { ax:0, ay:0, vx:0, vy:0, tx:0, ty:0, drag:null, raf:0, f:0 };
    const settled = () => !st.drag && Math.hypot(st.ax, st.ay) < .4 && Math.hypot(st.vx, st.vy) < .4;
    function render(){
      const p = Math.min(1, Math.hypot(st.ax, st.ay) / R);
      while (st.f < 3 && p >= T[st.f] + 0.02) st.f++;
      while (st.f > 0 && p <= T[st.f - 1] - 0.02) st.f--;
      const src = DOG_PULL[st.f];
      if (img.getAttribute("src") !== src) img.setAttribute("src", src);
      const ax = A.x + st.ax, ay = A.y + st.ay;
      anchor.setAttribute("cx", ax.toFixed(1)); anchor.setAttribute("cy", ay.toFixed(1));
      const dist = Math.hypot(RING.x - ax, RING.y - ay);
      const sag = Math.max(4, Math.min(40, 58 - dist * 0.3));
      const mx = (ax + RING.x) / 2, my = (ay + RING.y) / 2 + sag;
      const B = t => ({ x: (1-t)*(1-t)*ax + 2*(1-t)*t*mx + t*t*RING.x, y: (1-t)*(1-t)*ay + 2*(1-t)*t*my + t*t*RING.y });
      const j = B(0.86);
      strap.setAttribute("d", `M ${ax.toFixed(1)} ${ay.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${j.x.toFixed(1)} ${j.y.toFixed(1)}`);
      let lk = "";
      for (let i = 1; i <= 4; i++) {
        const q = B(0.86 + 0.14 * i / 4);
        lk += `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.2"/>`;
      }
      links.innerHTML = lk;
    }
    function start(){
      const raf = cb => document.hidden ? setTimeout(cb, 16) : requestAnimationFrame(cb);
      const loop = () => {
        if (st.drag) {
          st.ax += (st.tx - st.ax) * .35; st.ay += (st.ty - st.ay) * .35;
        } else {
          const dt = 1 / 60;
          st.vx += (-K * st.ax - DAMP * st.vx) * dt; st.vy += (-K * st.ay - DAMP * st.vy) * dt;
          st.ax += st.vx * dt; st.ay += st.vy * dt;
        }
        render();
        if (settled()) { st.ax = st.ay = st.vx = st.vy = 0; render(); st.raf = 0; return; }
        st.raf = raf(loop);
      };
      st.raf = raf(loop);
    }
    body.addEventListener("pointerdown", e => {
      e.preventDefault();
      try { body.setPointerCapture(e.pointerId); } catch(err) {}
      const r = stage.getBoundingClientRect();
      st.drag = { w: r.width, h: r.height };
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const dx = px - A.x, dy = py - A.y;
      const d = Math.hypot(dx, dy);
      const eff = d > R ? R + (d - R) * .2 : d;
      const k = d ? eff / d : 0;
      st.tx = dx * k; st.ty = dy * k;
      st.raf || start();
      stage.classList.add("grabbing");
      hint.classList.add("off");
    });
    body.addEventListener("pointermove", e => {
      if (!st.drag) return;
      const r = stage.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const dx = px - A.x, dy = py - A.y;
      const d = Math.hypot(dx, dy);
      const eff = d > R ? R + (d - R) * .2 : d;
      const k = d ? eff / d : 0;
      st.tx = dx * k; st.ty = dy * k;
    });
    const end = () => {
      if (!st.drag) return;
      st.drag = null; st.tx = st.ty = 0;
      stage.classList.remove("grabbing");
    };
    body.addEventListener("pointerup", end);
    body.addEventListener("pointercancel", end);
  });
}

/* ---------- 搜索 ---------- */
function searchAll(qs){
  const q = qs.trim().toLowerCase(); if (!q) return [];
  const idx = typeof BOOK !== "undefined" && BOOK ? DATA.search : HOME.search;
  const out = [];
  idx.forEach(it => {
    const hay = (it.t + " " + it.chT + " " + (it.terms || "") + " " + it.x).toLowerCase();
    if (!hay.includes(q)) return;
    let score = 0;
    if (it.t.toLowerCase().includes(q)) score += 6;
    if ((it.terms || "").toLowerCase().includes(q)) score += 4;
    if (it.chT.toLowerCase().includes(q)) score += 2;
    out.push({ ...it, score });
  });
  return out.sort((a, b) => b.score - a.score).slice(0, 20);
}

  $("#side-expand").addEventListener("click", () => { document.body.classList.remove("side-collapsed"); U().side = true; saveStore(); });
  if (U().side === false && window.innerWidth > 900) document.body.classList.add("side-collapsed");
  $$(".cloze-group .tbtn").forEach(b => b.addEventListener("click", () => { U().clozeMode = b.dataset.mode; saveStore(); applyClozeMode(); }));
  $("#btn-quiz").addEventListener("click", () => openModal("#m-quiz"));
  $("#btn-cards").addEventListener("click", () => openModal("#m-cards"));
  $("#btn-dice").addEventListener("click", openDice);
  $("#btn-theme").addEventListener("click", toggleTheme);
  $("#btn-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  $("#search-in").addEventListener("click", () => openSearch());
  $("#sp-input").addEventListener("input", e => renderSearch(e.target.value));
  $("#dice-again").addEventListener("click", openDice);
  $("#qz-yes").addEventListener("click", () => answerQuiz(true));
  $("#qz-no").addEventListener("click", () => answerQuiz(false));
  $("#qz-next").addEventListener("click", quizNext);
  $("#fc-yes").addEventListener("click", () => rateCard(true));
  $("#fc-no").addEventListener("click", () => rateCard(false));
  $$(".m-close").forEach(b => b.addEventListener("click", closeModal));
  $("#mask").addEventListener("click", closeModal);
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
    if (e.key === "Escape") closeModal();
  });
}
function bindQuizChips(){
  const box = $("#qz-chips"); if (!box) return;
  box.innerHTML = `<button class="sel-chip on" data-k="all">全部</button>`
    + BOOK.chapters.map((c, i) => ({ c, i })).filter(({ i }) => BOOK.quiz.some(q => q.ch === i))
      .map(({ c, i }) => `<button class="sel-chip" data-k="c${i}">${esc(c.n)} ${esc(c.t)}</button>`).join("");
  box.querySelectorAll(".sel-chip").forEach(b => b.addEventListener("click", () => {
    box.querySelectorAll(".sel-chip").forEach(x => x.classList.toggle("on", x === b));
    openQuiz(b.dataset.k);
  }));
}
function bindCardChips(){
  const box = $("#fc-chips"); if (!box) return;
  box.innerHTML = `<button class="sel-chip on" data-k="all">全部</button>`
    + BOOK.chapters.map((c, i) => ({ c, i })).filter(({ i }) => BOOK.cards.some(q => q.ch === i))
      .map(({ c, i }) => `<button class="sel-chip" data-k="c${i}">${esc(c.n)} ${esc(c.t)}</button>`).join("");
  box.querySelectorAll(".sel-chip").forEach(b => b.addEventListener("click", () => {
    box.querySelectorAll(".sel-chip").forEach(x => x.classList.toggle("on", x === b));
    openCards(b.dataset.k);
  }));
}
function openDice(){
  const bank = typeof BOOK !== "undefined" && BOOK ? BOOK.cards : HOME.cards;
  const c = bank[Math.floor(Math.random() * bank.length)];
  openModal("#m-dice");
  $("#dice-term").textContent = c.t;
  $("#dice-ctx").textContent = c.c;
}

/* ---------- 落地页 ---------- */
function bootHome(){
  applyTheme(); bindUserChip();
  $("#hs-user").textContent = store.current || "";
  const u = U();
  $("#home-books").innerHTML = HOME.books.map(b => {
    const read = (u.visited[b.id] || []).length;
    const pct = Math.min(100, Math.round(read / b.secs * 100));
    return `<a class="book-card" href="${b.file}">
      <h2>${esc(b.label)}</h2><div class="bc-sub">${esc(b.sub)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="bc-meta"><span>已读 ${read} / ${b.secs} 节</span><span>${b.chN} 章</span><span>判断题 ${b.quizN} 条</span><span>闪卡 ${b.cardN} 张</span></div></a>`;
  }).join("");
  $("#home-books").addEventListener("click", e => {
    const a = e.target.closest("a.book-card"); if (!a) return;
    e.preventDefault(); puppyRun();
    setTimeout(() => { location.href = a.getAttribute("href"); }, 750);
  });
  const qzBest = Math.max(0, ...Object.values(u.quiz).map(r => r.best || 0));
  $("#home-stats").innerHTML = `
    <div class="stat"><b>${(u.visited.m1 || []).length + (u.visited.m2 || []).length}</b><span>累计已读节数</span></div>
    <div class="stat"><b>${u.cloze.revealed || 0}</b><span>挖空已回忆次数</span></div>
    <div class="stat"><b>${u.cards.seen || 0}</b><span>闪卡练习张数</span></div>
    <div class="stat"><b>${qzBest}</b><span>判断题单轮最佳（满分10）</span></div>`;
  $("#btn-dice2").addEventListener("click", openDice);
  $("#btn-theme2").addEventListener("click", toggleTheme);
  $$(".m-close").forEach(b => b.addEventListener("click", closeModal));
  $("#mask").addEventListener("click", closeModal);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
}

/* ---------- 启动 ---------- */
if (document.body.dataset.book === "home") bootHome(); else bootBook();


</script>
