<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高中生物必背知识点 · 交互复习</title>
<style>/* 生物必背知识点 · 交互版  */
* { box-sizing: border-box; }
:root {
  --bg:#eef2f6; --panel:#fff; --ink:#1e293b; --mut:#64748b; --line:#dbe2ea;
  --pri:#0e7490; --pri-soft:#e0f2fe; --gold:#b45309; --kbg:#fde68a;
  --side-w:270px; --rad:10px;
  --c-warn:#e11d48; --c-note:#4f46e5; --c-exam:#0d9488; --c-exp:#9333ea;
}
html[data-theme="dark"] {
  --bg:#0a1220; --panel:#111b2e; --ink:#d9e4f2; --mut:#8ba1b9; --line:#24344d;
  --pri:#38bdf8; --pri-soft:#0c2a42; --gold:#fbbf24; --kbg:rgba(253,230,138,.22);
  --c-warn:#fb7185; --c-note:#818cf8; --c-exam:#2dd4bf; --c-exp:#c084fc;
}
html, body { margin:0; padding:0; }
body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.75; }
button { font-family:inherit; cursor:pointer; }
a { color:var(--pri); }

/* ---------- 布局骨架 ---------- */
.app { display:flex; min-height:100vh; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }

/* ---------- 侧边栏 ---------- */
.sidebar { width:var(--side-w); flex:none; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0; z-index:40;
  transition:margin .25s ease; }
body.side-collapsed .sidebar { margin-left:calc(-1 * var(--side-w)); }
.side-head { display:flex; align-items:center; gap:8px; padding:14px 14px 10px; }
.side-brand { font-weight:800; font-size:15px; color:var(--ink); text-decoration:none; letter-spacing:.04em; }
.side-brand small { display:block; font-weight:500; font-size:10.5px; color:var(--mut); letter-spacing:.18em; }
.side-collapse { margin-left:auto; border:1px solid var(--line); background:none; color:var(--mut);
  border-radius:8px; width:28px; height:28px; font-size:14px; line-height:1; }
.side-collapse:hover { color:var(--pri); border-color:var(--pri); }
.side-user { margin:2px 12px 8px; }
.user-chip { width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line);
  border-radius:10px; background:var(--bg); color:var(--ink); font-size:13px; }
.user-chip:hover { border-color:var(--pri); }
.user-chip .u-dot { width:22px; height:22px; border-radius:50%; background:var(--pri); color:#fff; font-size:11px;
  display:flex; align-items:center; justify-content:center; flex:none; }
.user-chip .u-name { flex:1; text-align:left; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-chip .u-arr { color:var(--mut); font-size:11px; }
.side-search { padding:0 12px 10px; }
.side-search input { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:10px;
  background:var(--bg); color:var(--ink); font-size:13px; outline:none; }
.side-search input:focus { border-color:var(--pri); }
.toc { flex:1; overflow-y:auto; padding:4px 8px 30px; }
.toc-ch { margin-bottom:4px; }
.toc-ch-head { width:100%; display:flex; align-items:center; gap:8px; padding:7px 8px; border:0; background:none;
  border-radius:8px; color:var(--ink); font-size:13.5px; font-weight:600; text-align:left; }
.toc-ch-head:hover { background:var(--pri-soft); }
.toc-ch-head .n { flex:none; width:24px; height:24px; border-radius:7px; background:var(--ac,var(--pri)); color:#fff;
  font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.toc-ch-head .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toc-ch-head .prog { flex:none; font-size:10.5px; color:var(--mut); }
.toc-ch-head .arr { flex:none; color:var(--mut); font-size:10px; transition:transform .2s; }
.toc-ch.open .toc-ch-head .arr { transform:rotate(90deg); }
.toc-secs { display:none; padding:2px 0 4px 14px; }
.toc-ch.open .toc-secs { display:block; }
.toc-sec { display:flex; align-items:center; gap:6px; width:100%; border:0; background:none; text-align:left;
  padding:5px 8px; border-radius:8px; color:var(--mut); font-size:12.5px; }
.toc-sec:hover { color:var(--ink); background:var(--pri-soft); }
.toc-sec.active { color:var(--pri); font-weight:700; background:var(--pri-soft); }
.toc-sec .st { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.m-dot { flex:none; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line); background:transparent; padding:0; }
.m-dot.m1 { background:#3b82f6; border-color:#3b82f6; }
.m-dot.m2 { background:#22c55e; border-color:#22c55e; }
.side-expand { position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:39; border:1px solid var(--line);
  background:var(--panel); color:var(--mut); border-radius:0 10px 10px 0; padding:14px 6px; font-size:14px; display:none; }
body.side-collapsed .side-expand { display:block; }

/* ---------- 顶栏 ---------- */
.topbar { position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.topbar-in { display:flex; align-items:center; gap:10px; padding:10px 20px; flex-wrap:wrap; }
.crumb { font-size:13px; color:var(--mut); min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.crumb b { color:var(--ink); }
.tools { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tbtn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px;
  padding:5px 11px; font-size:12.5px; white-space:nowrap; }
.tbtn:hover { border-color:var(--pri); color:var(--pri); }
.tbtn.on { background:var(--pri); border-color:var(--pri); color:#fff; }
.cloze-group { display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.cloze-group .cg-label { padding:5px 9px; font-size:12.5px; color:var(--mut); background:var(--bg); }
.cloze-group .tbtn { border:0; border-left:1px solid var(--line); border-radius:0; }
.readbar { height:3px; background:transparent; }
/* ---------- 内容区 ---------- */
.content { max-width:920px; width:100%; margin:0 auto; padding:26px 26px 90px; }
.hero { background:linear-gradient(155deg,#0b1f33 0%,#123a5c 45%,#0e5e52 100%); color:#fff;
  border-radius:14px; padding:30px 32px 26px; margin-bottom:26px; }
.hero .h-badge { display:inline-block; font-size:11px; letter-spacing:.3em; border:1px solid rgba(255,255,255,.45);
  border-radius:99px; padding:4px 14px; color:#cfe8dd; }
.hero h1 { margin:16px 0 4px; font-size:27px; letter-spacing:.04em; line-height:1.4; }
.hero .h-sub { color:#9fd8c4; font-size:13.5px; letter-spacing:.12em; margin:0; }
.hero .h-owner { margin:16px 0 0; color:#ffe9b8; font-weight:700; font-size:15px; letter-spacing:.08em; }
.hero .h-meta { margin-top:12px; color:#a8bccb; font-size:12px; display:flex; gap:18px; flex-wrap:wrap; }

.chapter { background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:22px 26px 24px; margin-bottom:26px; scroll-margin-top:74px; }
.ch-head { display:flex; align-items:center; gap:14px; padding-bottom:12px; border-bottom:2px solid var(--ac,var(--pri)); margin-bottom:16px; }
.ch-num { width:44px; height:44px; border-radius:12px; background:var(--ac,var(--pri)); color:#fff; flex:none;
  font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.ch-head h1 { margin:0; font-size:21px; letter-spacing:.03em; }
.ch-sub { margin:2px 0 0; font-size:12px; color:var(--mut); }
.ch-flash { border-radius:6px; animation:flashBg 1.6s ease 1; }
@keyframes flashBg { 0% { background:color-mix(in srgb, var(--ac,var(--pri)) 22%, transparent); }
  100% { background:transparent; } }

h2 { font-size:17px; color:var(--ac,var(--pri)); margin:20px 0 8px; padding-left:10px;
  border-left:4px solid var(--ac,var(--pri)); scroll-margin-top:74px; }
h3 { font-size:15px; margin:12px 0 4px; }
p { margin:6px 0; }
ul,ol { margin:6px 0; padding-left:1.6em; }
li { margin:3px 0; }
b { font-weight:600; }
sub,sup { font-size:70%; }
.k { font-weight:600; background:linear-gradient(transparent 62%, var(--kbg) 62%); padding:0 1px; border-radius:2px; }
table { border-collapse:collapse; width:100%; margin:8px 0 12px; }
th,td { border:1px solid var(--line); padding:6px 9px; vertical-align:top; font-size:13.5px; line-height:1.6; text-align:left; }
th { font-weight:600; background:var(--bg); }
.table-scroll { overflow-x:auto; }

.bx { border-radius:10px; padding:12px 15px; margin:10px 0 14px; }
.bx .bx-tag { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:#fff;
  border-radius:99px; padding:2px 11px 3px; margin-bottom:6px; }
.note { background:color-mix(in srgb, var(--c-note) 10%, var(--panel)); border-left:4px solid var(--c-note); }
.note .bx-tag { background:var(--c-note); }
.warn { background:color-mix(in srgb, var(--c-warn) 9%, var(--panel)); border-left:4px solid var(--c-warn); }
.warn .bx-tag { background:var(--c-warn); }
.exam { background:color-mix(in srgb, var(--c-exam) 10%, var(--panel)); border-left:4px solid var(--c-exam); }
.exam .bx-tag { background:var(--c-exam); }
.exp { background:color-mix(in srgb, var(--c-exp) 9%, var(--panel)); border-left:4px solid var(--c-exp); }
.exp .bx-tag { background:var(--c-exp); }
.fgrid { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 12px; }
.fcard { flex:1 1 260px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; }
.fcard b { color:var(--ac,var(--pri)); }
.fcard .fm { display:block; font-family:Menlo,monospace; font-size:12.5px; margin-top:4px; }
.flow { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13.5px; margin:8px 0 12px; }
.flow b { color:var(--ac,var(--pri)); }
.recap { background:color-mix(in srgb, var(--ac,var(--pri)) 8%, var(--panel)); border:1px solid var(--ac,var(--pri));
  border-radius:12px; padding:12px 16px; margin-top:14px; }
/* ---------- 挖空 ---------- */
.k.cz { color:transparent !important; text-shadow:none; background:repeating-linear-gradient(45deg,
  color-mix(in srgb, var(--ink) 22%, transparent) 0 5px, transparent 5px 9px); border-radius:3px;
  cursor:pointer; transition:background .15s; min-width:2em; }
.k.cz:hover { background:repeating-linear-gradient(45deg,
  color-mix(in srgb, var(--pri) 40%, transparent) 0 5px, transparent 5px 9px); }
.k.cz.open { color:inherit !important; background:linear-gradient(transparent 62%, #86efac 62%); cursor:default; }
html[data-theme="dark"] .k.cz.open { background:linear-gradient(transparent 62%, rgba(134,239,172,.4) 62%); }

/* ---------- 互链 ---------- */
.xref { color:var(--pri); text-decoration:none; border-bottom:1px dashed var(--pri); cursor:pointer; padding:0 1px; }
.xref:hover { background:var(--pri-soft); border-bottom-style:solid; }
.xback { position:fixed; right:22px; bottom:22px; z-index:45; display:none; align-items:center; gap:8px;
  background:var(--pri); color:#fff; border:0; border-radius:99px; padding:10px 18px; font-size:13px; font-weight:600;
  box-shadow:0 6px 22px rgba(14,116,144,.4); max-width:46vw; }
.xback.show { display:flex; }
.xback span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- 浮动/菜单 ---------- */
.float-menu { position:fixed; z-index:60; background:var(--panel); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 10px 34px rgba(2,8,20,.18); padding:6px; min-width:200px; }
.fm-item { display:flex; width:100%; border:0; background:none; color:var(--ink); text-align:left; padding:9px 12px;
  border-radius:8px; font-size:13.5px; gap:8px; align-items:center; }
.fm-item:hover { background:var(--pri-soft); }
.fm-item.cur { color:var(--pri); font-weight:700; }
.fm-item.danger { color:var(--c-warn); }
.fm-sep { height:1px; background:var(--line); margin:4px 6px; }

/* ---------- 遮罩与弹窗 ---------- */
.mask { position:fixed; inset:0; background:rgba(4,10,20,.5); z-index:70; display:none; }
.mask.show { display:block; }
.modal { position:fixed; z-index:71; left:50%; top:50%; transform:translate(-50%,-50%); width:min(680px,92vw);
  max-height:86vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:22px 26px; display:none; }
.modal.show { display:block; }
.modal h3 { margin:0 0 14px; font-size:17px; display:flex; align-items:center; }
.modal .m-close { margin-left:auto; border:1px solid var(--line); background:none; color:var(--mut);
  border-radius:8px; width:28px; height:28px; font-size:13px; }
.sel-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.sel-chip { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px;
  padding:5px 14px; font-size:12.5px; }
.sel-chip.on { background:var(--pri); border-color:var(--pri); color:#fff; }

/* ---------- 判断快测 ---------- */
.qz-meta { color:var(--mut); font-size:12.5px; margin-bottom:10px; }
.qz-stem { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  font-size:15px; line-height:1.8; margin-bottom:16px; }
.qz-btns { display:flex; gap:12px; }
.qz-btns button { flex:1; padding:12px; font-size:16px; font-weight:700; border-radius:12px; border:1.5px solid var(--line);
  background:var(--bg); color:var(--ink); }
.qz-btns button:hover { border-color:var(--pri); }
.qz-fb { margin-top:14px; border-radius:10px; padding:12px 14px; font-size:13.5px; line-height:1.7; display:none; }
.qz-fb.show { display:block; }
.qz-fb.ok { background:color-mix(in srgb,#22c55e 12%, var(--panel)); border:1px solid #22c55e; }
.qz-fb.no { background:color-mix(in srgb,var(--c-warn) 10%, var(--panel)); border:1px solid var(--c-warn); }
.qz-next { margin-top:14px; width:100%; padding:10px; font-size:14px; font-weight:700; border-radius:10px;
  border:0; background:var(--pri); color:#fff; display:none; }
.qz-next.show { display:block; }

/* ---------- 闪卡 ---------- */
.fc-box { perspective:1200px; margin-bottom:16px; }
.fc-card { position:relative; min-height:190px; border-radius:14px; border:1px solid var(--line); background:var(--bg);
  display:flex; align-items:center; justify-content:center; text-align:center; padding:24px 28px;
  font-size:16.5px; line-height:1.85; cursor:pointer; transition:transform .4s; transform-style:preserve-3d; }
.fc-card.flip { transform:rotateY(180deg); }
.fc-face { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
/* overflow 会破坏 Chromium 对无自身 transform 元素的背面剔除，故只放在有 rotateY 的背面；翻转后直接隐藏正面兜底 */
.fc-card.flip .fc-face:not(.back) { visibility:hidden; }
.fc-face.back { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  transform:rotateY(180deg); font-size:14px; color:var(--ink); background:var(--bg); border-radius:inherit; overflow:auto; }
.fc-term { font-weight:700; color:var(--pri); font-size:20px; }
.fc-hint { position:absolute; bottom:8px; left:0; right:0; text-align:center; color:var(--mut); font-size:11px; }
.fc-btns { display:flex; gap:12px; }
.fc-btns button { flex:1; padding:11px; font-size:14.5px; font-weight:700; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); }
/* ---------- 搜索面板 ---------- */
.sp-input { width:100%; padding:11px 14px; font-size:15px; border:1.5px solid var(--pri); border-radius:12px;
  background:var(--bg); color:var(--ink); outline:none; margin-bottom:12px; }
.sp-list { max-height:52vh; overflow:auto; }
.sp-item { display:block; width:100%; text-align:left; border:0; background:none; color:var(--ink);
  padding:10px 12px; border-radius:10px; }
.sp-item:hover, .sp-item.cur { background:var(--pri-soft); }
.sp-item .sp-t { font-size:13.5px; font-weight:600; }
.sp-item .sp-c { font-size:12px; color:var(--mut); margin-top:2px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.sp-item .sp-c mark { background:none; color:var(--gold); font-weight:700; }
.sp-empty { color:var(--mut); font-size:13px; padding:16px; text-align:center; }
kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:11px; color:var(--mut); }

/* ---------- 统计 / 落地页 ---------- */
.home-wrap { max-width:1020px; margin:0 auto; padding:34px 24px 90px; }
.home-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
.book-card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 24px;
  display:block; text-decoration:none; color:var(--ink); position:relative; overflow:hidden; }
.book-card:hover { border-color:var(--pri); transform:translateY(-2px); transition:.2s; }
.book-card h2 { margin:0 0 4px; font-size:19px; border:0; padding:0; color:var(--ink); }
.book-card .bc-sub { color:var(--mut); font-size:12.5px; margin-bottom:14px; }
.book-card .bc-meta { display:flex; gap:16px; font-size:12.5px; color:var(--mut); flex-wrap:wrap; }
.bar { height:8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); overflow:hidden; margin:10px 0 6px; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,var(--pri),#22c55e); }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:16px; }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.stat b { display:block; font-size:22px; color:var(--pri); }
.stat span { font-size:12px; color:var(--mut); }

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .sidebar { position:fixed; left:0; top:0; box-shadow:0 0 40px rgba(2,8,20,.3); }
  body.side-collapsed .sidebar { margin-left:calc(-1 * var(--side-w) - 10px); }
  .side-collapse { display:none; }
  .side-expand { display:none !important; }
  .hamb { display:inline-block !important; }
  .content { padding:18px 14px 90px; }
  .chapter { padding:16px 16px 20px; }
  .hero { padding:22px 20px; }
}
.hamb { display:none; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:9px; padding:5px 11px; font-size:13px; }
.foot-note { text-align:center; color:var(--mut); font-size:12px; padding:26px 0 40px; }

/* ---------- 小狗彩蛋 ---------- */
.ch-end { margin:34px 0 6px; display:flex; justify-content:center; }
.dog-stage { position:relative; width:230px; height:180px; touch-action:none; -webkit-user-select:none; user-select:none; }
.dog-chain { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible; }
.chain-strap { fill:none; stroke:#c54444; stroke-width:4.5; stroke-linecap:round; }
.chain-links circle { fill:none; stroke:#d8a63c; stroke-width:2.4; }
.chain-clasp { fill:#d8a63c; stroke:#a8862e; stroke-width:1; }
.chain-anchor { fill:#b98a2e; }
.chain-ring { fill:rgba(255,255,255,.15); stroke:#d8a63c; stroke-width:3.5; }
.dog-body { position:absolute; left:41px; top:16px; width:148px; height:148px; z-index:1;
  cursor:grab; }
.dog-stage.grabbing .dog-body { cursor:grabbing; }
.ch-dog { width:100%; height:100%; object-fit:cover; border-radius:50%; border:3px solid var(--line);
  box-shadow:0 10px 24px rgba(2,8,20,.12); pointer-events:none; -webkit-user-drag:none; }
.dog-hint { position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); font-size:11px;
  color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:2px 10px; white-space:nowrap; transition:opacity .4s; pointer-events:none; }
.dog-hint.off { opacity:0; }
#puppy-run { position:fixed; left:50%; top:50%; width:144px; height:144px; margin:-72px 0 0 -72px;
  z-index:998; pointer-events:none; opacity:0; transition:opacity .18s; }
#puppy-run.run { opacity:1; }
.run-sprite { width:100%; height:100%; border-radius:50%; border:4px solid #fff;
  box-shadow:0 14px 36px rgba(2,8,20,.30); background-repeat:no-repeat; background-size:200% 200%;
  will-change:background-position,transform; }
#puppy-run.run .run-sprite { animation:puppy-bob .44s ease-in-out infinite; }
@keyframes puppy-bob {
  0%,100% { transform:translateY(4px) rotate(2deg); }
  50% { transform:translateY(-6px) rotate(-2deg); } }


</style>
</head>
<body data-book="home">

ue, "e": "生殖隔离一旦形成，标志着新物种的产生", "ch": 8}, {"q": "若某生物形成了新物种，则其基因频率一定发生了改变", "a": true, "e": "形成新物种的前提是发生了进化", "ch": 8}, {"q": "基因频率发生改变，生物一定发生了进化，但不一定形成新物种", "a": true, "e": "进化不一定产生生殖隔离", "ch": 8}, {"q": "自然选择直接作用于生物个体的基因型", "a": false, "e": "直接作用的是个体的表型", "ch": 8}, {"q": "基因型为Aa的个体连续自交，种群基因频率发生了改变", "a": false, "e": "自交后代基因型比例改变，但基因频率不变", "ch": 8}, {"q": "基因型为Aa的个体无论是连续自交还是多代自由交配，生物都没有发生进化", "a": true, "e": "两种情况下基因频率都不变", "ch": 8}, {"q": "一间屋子里的所有蟑螂构成一个种群", "a": false, "e": "种群需要是一定自然区域内的同种生物全部个体", "ch": 8}, {"q": "突变的有利和有害是绝对的", "a": false, "e": "取决于生物的生存环境", "ch": 8}, {"q": "生物多样性的根本原因是基因多样性，直接原因是蛋白质多样性", "a": true, "e": "生物多样性包括遗传、物种和生态系统多样性", "ch": 8}, {"q": "拉马克是历史上第一个提出比较完整的进化学说的人", "a": true, "e": "提出用进废退和获得性遗传", "ch": 8}, {"q": "化石是研究生物进化最直接、最重要的证据", "a": true, "e": "如始祖鸟化石、郑氏始孔子鸟化石", "ch": 8}, {"q": "捕食者的存在有利于增加物种的多样性", "a": true, "e": "收割理论：避免一种生物占绝对优势", "ch": 8}, {"q": "地球上最早出现的生物是需氧的单细胞生物", "a": false, "e": "原始大气没有氧气，最早出现的是厌氧的单细胞生物", "ch": 8}, {"q": "不同生物的DNA和蛋白质等生物大分子的差异，揭示了它们亲缘关系的远近和在进化史上出现的顺序", "a": true, "e": "细胞和分子水平的进化证据", "ch": 8}, {"q": "适应是普遍存在的，也是绝对的", "a": false, "e": "环境改变后原有适应可能不再适应，适应具有相对性", "ch": 8}, {"q": "自然选择学说的内容包括过度繁殖、生存斗争、遗传变异和适者生存", "a": true, "e": "达尔文自然选择学说的要点", "ch": 8}, {"q": "同一物种内部在相互斗争中共同进化", "a": false, "e": "协同进化发生在不同物种之间或生物与无机环境之间", "ch": 8}], "cards": [{"t": "细胞学说的建立者", "c": "主要是德国的施莱登和施旺；揭示了动物和植物的统一性，从而阐明了生物界的统一性", "ch": 0}, {"t": "细胞学说的内容", "c": "①动植物都由细胞发育而来，并由细胞和细胞产物构成②细胞是相对独立的单位③新细胞由老细胞分裂产生", "ch": 0}, {"t": "细胞学说相关科学家", "c": "胡克：细胞的发现者和命名者；列文虎克：观察到细菌、红细胞、精子等活细胞；魏尔肖：补充“细胞通过分裂产生新细胞”", "ch": 0}, {"t": "细胞学说与归纳法", "c": "由部分动植物总结出一般性结论，运用的是不完全归纳法", "ch": 0}, {"t": "生命系统的结构层次", "c": "细胞→组织→器官→系统→个体→种群→群落→生态系统→生物圈；最基本的是细胞，最大的是生物圈", "ch": 0}, {"t": "各生物的层次特例", "c": "植物没有系统层次；单细胞生物没有组织、器官、系统层次，既属细胞又属个体；病毒不属于生命系统", "ch": 0}, {"t": "种群、群落与生态系统", "c": "一定区域同种生物全部个体=种群；所有种群相互作用=群落；群落与无机环境相互作用=生态系统", "ch": 0}, {"t": "细胞是基本单位", "c": "除病毒以外，生物体都是以细胞作为结构和功能的基本单位", "ch": 0}, {"t": "生物界与非生物界", "c": "统一性：组成细胞的元素在无机自然界都能找到，没有一种为细胞所特有；差异性：各种元素的相对含量大不相同", "ch": 1}, {"t": "鲜重与干重之最", "c": "鲜重最多化合物是水（有机物是蛋白质）、元素是O；干重最多化合物是蛋白质、元素是C", "ch": 1}, {"t": "还原糖的检测", "c": "斐林试剂水浴加热（50~65℃）生成砖红色沉淀；葡萄糖、果糖、麦芽糖是还原糖，蔗糖、淀粉不是", "ch": 1}, {"t": "脂肪的检测", "c": "被苏丹Ⅲ染液染成橘黄色；需用50%的酒精洗去浮色，用显微镜观察", "ch": 1}, {"t": "蛋白质的检测", "c": "与双缩脲试剂作用产生紫色反应；变性后的蛋白质肽键没有断裂，仍可检测", "ch": 1}, {"t": "斐林试剂的用法", "c": "甲液0.1g/mL NaOH溶液，乙液0.05g/mL CuSO4溶液；等量混合、现配现用", "ch": 1}, {"t": "双缩脲试剂的用法", "c": "先加A液（0.1g/mL NaOH）1mL，再加B液（0.01g/mL CuSO4）4滴；先A后B，不需加热", "ch": 1}, {"t": "自由水及其功能", "c": "约占细胞内水分的95.5%；良好溶剂、参与生化反应、提供液体环境、运送营养物质和代谢废物", "ch": 1}, {"t": "结合水", "c": "与细胞内其他物质相结合的水，约占4.5%，是细胞结构的重要成分", "ch": 1}, {"t": "水的结构特点", "c": "水分子空间结构及电子不对称分布→极性分子→良好溶剂；氢键使水具有流动性和较高的比热容", "ch": 1}, {"t": "无机盐的存在与功能", "c": "绝大多数以离子形式存在；构成化合物、维持生命活动、维持酸碱平衡和渗透压", "ch": 1}, {"t": "无机盐与化合物实例", "c": "Mg2+是叶绿素的成分；Fe2+是血红素的成分；碘是甲状腺激素的成分", "ch": 1}, {"t": "缺钙与抽搐", "c": "动物缺Ca2+会出现抽搐；Ca2+过多则肌无力", "ch": 1}, {"t": "自由水与结合水转化", "c": "二者可相互转化；比值越大代谢越旺盛；休眠时结合水上升，晒干种子损失的主要是自由水", "ch": 1}, {"t": "糖类的元素与存在形式", "c": "组成元素一般是C、H、O；生物体内的糖类绝大多数以多糖的形式存在", "ch": 2}, {"t": "单糖", "c": "不能水解：葡萄糖（主要能源物质）、脱氧核糖（构成DNA）、核糖（构成RNA）、果糖（植物）、半乳糖（动物）", "ch": 2}, {"t": "二糖", "c": "水解生成两分子单糖：蔗糖=葡萄糖+果糖（植物）；麦芽糖=2分子葡萄糖（植物）；乳糖=葡萄糖+半乳糖（动物）", "ch": 2}, {"t": "多糖", "c": "基本单位都是葡萄糖：淀粉（植物储能）、纤维素（植物细胞壁成分）、糖原（动物储能）", "ch": 2}, {"t": "糖原", "c": "分布在人和动物的肝脏与肌肉中；肝糖原可分解为葡萄糖补充血糖，肌糖原不可以", "ch": 2}, {"t": "几丁质", "c": "存在于甲壳类动物和昆虫的外骨骼；可与重金属离子结合处理废水、制作食品包装和人造皮肤", "ch": 2}, {"t": "还原糖有哪些", "c": "葡萄糖、果糖、麦芽糖等（所有单糖+乳糖都是还原糖）；淀粉、蔗糖是非还原糖", "ch": 2}, {"t": "脂质的元素组成", "c": "脂肪只含C、H、O；磷脂含C、H、O、N、P；固醇只含C、H、O", "ch": 2}, {"t": "脂肪的功能", "c": "细胞内良好的储能物质；隔热保温；缓冲减压，保护内脏器官", "ch": 2}, {"t": "磷脂的功能", "c": "构成细胞膜和细胞器膜等生物膜的重要成分", "ch": 2}, {"t": "固醇的种类与功能", "c": "胆固醇（动物细胞膜成分、参与血液脂质运输）、性激素（促进生殖器官发育和生殖细胞形成）、维生素D（促进肠道吸收钙磷）", "ch": 2}, {"t": "动植物脂肪的差异", "c": "动物脂肪多含饱和脂肪酸，熔点高，室温呈固态；植物脂肪多含不饱和脂肪酸，室温呈液态", "ch": 2}, {"t": "脂肪与糖类的转化", "c": "脂肪O少H多，氧化分解耗氧更多、释放能量更多；糖类可大量转化为脂肪，脂肪不能大量转化为糖类", "ch": 2}, {"t": "蛋白质的组成元素", "c": "C、H、O、N，有的还含有S等", "ch": 3}, {"t": "蛋白质的五大功能", "c": "结构（羽毛肌肉头发）、催化（酶）、运输（血红蛋白、载体蛋白）、调节（胰岛素、生长激素）、免疫（抗体）", "ch": 3}, {"t": "氨基酸的结构特点", "c": "每种氨基酸至少含有一个氨基和一个羧基，且都有一个连在同一个碳原子上；区别在于R基不同", "ch": 3}, {"t": "必需氨基酸", "c": "人体细胞不能合成、必须从外界环境直接获取，共8种；非必需氨基酸人体能合成，有13种", "ch": 3}, {"t": "脱水缩合", "c": "一个氨基酸的氨基与另一个氨基酸的羧基连接，脱去一分子水；场所是核糖体", "ch": 3}, {"t": "肽键数的计算", "c": "肽键数=脱去水分子数=氨基酸数-肽链数；环状多肽中等于氨基酸数", "ch": 3}, {"t": "游离氨基/羧基数", "c": "至少等于肽链数；总数=肽链数+R基中的氨基或羧基数", "ch": 3}, {"t": "多肽分子量计算", "c": "氨基酸平均分子质量×氨基酸数-18×脱去水分子数", "ch": 3}, {"t": "蛋白质结构多样性", "c": "直接原因：氨基酸种类、数目、排列顺序及肽链空间结构不同；根本原因：DNA（基因）的多样性", "ch": 3}, {"t": "熟鸡蛋易消化的原因", "c": "高温使蛋白质空间结构变得伸展、松散，易被蛋白酶水解（肽键未断裂）", "ch": 3}, {"t": "核酸的元素与功能", "c": "元素C、H、O、N、P；是细胞内携带遗传信息的物质，在遗传、变异和蛋白质合成中起极其重要作用", "ch": 3}, {"t": "核苷酸的组成", "c": "一分子含氮碱基+一分子五碳糖+一分子磷酸；按五碳糖不同分为脱氧核苷酸和核糖核苷酸", "ch": 3}, {"t": "DNA与RNA的区别", "c": "DNA：脱氧核苷酸、碱基A G C T、双螺旋、主要在细胞核；RNA：核糖核苷酸、碱基A G C U、单链、主要在细胞质", "ch": 3}, {"t": "生物的遗传物质", "c": "绝大多数生物是DNA，只有部分病毒（HIV、流感病毒等）是RNA，故DNA是主要的遗传物质", "ch": 3}, {"t": "生物大分子", "c": "多糖、蛋白质、核酸都是由单体连接成的多聚体，以碳链为基本骨架；脂质不是生物大分子", "ch": 3}, {"t": "细胞生物的8与5", "c": "细胞生物含DNA和RNA两种核酸，碱基5种，核苷酸8种（脱氧4种+核糖4种），遗传物质是DNA", "ch": 3}, {"t": "细胞膜的三大功能", "c": "①将细胞与外界环境分隔开②控制物质进出细胞③进行细胞间的信息交流", "ch": 4}, {"t": "细胞间信息交流方式", "c": "①化学物质经体液运输②细胞膜直接接触（精卵识别）③形成通道（胞间连丝）；前两种需要膜表面受体", "ch": 4}, {"t": "细胞膜成分的探索", "c": "欧文顿→脂质；戈特和格伦德尔（单层面积为表面积2倍）→磷脂连续两层；丹尼利和戴维森→可能附有蛋白质", "ch": 4}, {"t": "细胞膜结构的探索", "c": "罗伯特森（暗-亮-暗）→静态统一模型；1970年人鼠细胞融合实验→膜具有流动性；辛格和尼科尔森→流动镶嵌模型", "ch": 4}, {"t": "细胞膜的成分", "c": "主要由脂质和蛋白质组成，含少量糖类；脂质中磷脂最丰富；功能越复杂，蛋白质的种类和数量越多", "ch": 4}, {"t": "流动镶嵌模型", "c": "磷脂双分子层构成基本支架；蛋白质镶在表面、嵌入或贯穿；磷脂分子可侧向运动，大多数蛋白质分子也能运动", "ch": 4}, {"t": "糖被", "c": "细胞膜外表面的糖类与蛋白质结合形成糖蛋白、与脂质结合形成糖脂；与细胞识别、信息传递密切相关", "ch": 4}, {"t": "水跨过疏水膜的原因", "c": "①水分子极小，可通过磷脂分子运动产生的间隙②细胞膜上存在水通道蛋白", "ch": 4}, {"t": "植物细胞壁", "c": "主要成分是纤维素和果胶；对细胞有支持和保护作用；具有全透性", "ch": 4}, {"t": "细胞核的结构", "c": "核膜（双层膜，上有核孔）、染色质（主要由DNA和蛋白质组成）、核仁（与某种RNA的合成及核糖体形成有关）", "ch": 4}, {"t": "核孔的选择性", "c": "mRNA和解旋酶、DNA聚合酶等蛋白质可通过核孔，DNA不能通过；物质进出核孔需消耗能量", "ch": 4}, {"t": "核仁的特点", "c": "代谢旺盛、蛋白质合成量大的细胞核孔数量多、核仁较大；原核细胞无核仁，其核糖体形成与核仁无关", "ch": 4}, {"t": "细胞核的功能", "c": "细胞核是遗传信息库，是细胞代谢和遗传的控制中心", "ch": 4}, {"t": "没有细胞核的细胞", "c": "高等植物成熟的筛管细胞、哺乳动物成熟的红细胞等极少数细胞没有细胞核", "ch": 4}, {"t": "模型的种类", "c": "物理模型（DNA双螺旋结构模型）、概念模型、数学模型；照片不属于模型", "ch": 4}, {"t": "细胞质的组成", "c": "包括细胞质基质和细胞器；基质是细胞进行新陈代谢的主要场所；分离细胞器常用差速离心法", "ch": 5}, {"t": "细胞器的膜分类", "c": "双层膜：线粒体、叶绿体；单层膜：内质网、高尔基体、液泡、溶酶体；无膜：核糖体、中心体", "ch": 5}, {"t": "含DNA/RNA/色素的细胞器", "c": "含DNA：线粒体、叶绿体；含RNA：再加核糖体；含色素：叶绿体、液泡", "ch": 5}, {"t": "细胞器的特有分布", "c": "植物特有：叶绿体、液泡；动物和低等植物特有：中心体；动植物都有但功能不同：高尔基体", "ch": 5}, {"t": "光镜下可见的细胞器", "c": "叶绿体、线粒体、液泡", "ch": 5}, {"t": "细胞器功能归纳", "c": "产生ATP：线粒体、叶绿体；能自我复制：线粒体、叶绿体、中心体；与能量转换有关：线粒体、叶绿体", "ch": 5}, {"t": "与分泌蛋白有关的细胞器", "c": "核糖体、内质网、高尔基体、线粒体", "ch": 5}, {"t": "分泌蛋白的合成运输", "c": "核糖体→内质网→高尔基体→细胞膜→细胞外；研究方法：同位素标记法（3H标记亮氨酸）", "ch": 5}, {"t": "分泌过程膜面积变化", "c": "内质网膜面积变小，高尔基体膜面积不变，细胞膜面积增大", "ch": 5}, {"t": "分泌蛋白与胞内蛋白", "c": "分泌蛋白：消化酶、抗体、血浆蛋白、蛋白质类激素；胞内蛋白：呼吸酶、血红蛋白", "ch": 5}, {"t": "生物膜系统", "c": "包括细胞膜、细胞器膜、核膜等结构；原核细胞没有生物膜系统", "ch": 5}, {"t": "生物膜系统的作用", "c": "①为多种酶提供大量附着位点②分隔细胞器使反应高效有序③在物质运输、能量转化、信息传递中起决定作用", "ch": 5}, {"t": "细胞骨架", "c": "由蛋白质纤维组成的网架结构；维持细胞形态、锚定支撑细胞器，与运动、分裂、分化、物质运输等有关", "ch": 5}, {"t": "观察叶绿体实验", "c": "材料用藓类小叶（或菠菜稍带叶肉的下表皮）；黑藻光照室温培养促进细胞质流动；以叶绿体运动为标志", "ch": 5}, {"t": "渗透作用及条件", "c": "水分子（溶剂分子）通过半透膜的扩散作用；条件：①具有半透膜②半透膜两侧溶液具有浓度差", "ch": 6}, {"t": "动物细胞的吸水失水", "c": "细胞膜相当于半透膜；吸水或失水取决于外界溶液与细胞质浓度的浓度差", "ch": 6}, {"t": "原生质层", "c": "细胞膜、液泡膜以及两层膜之间的细胞质；相当于一层半透膜", "ch": 6}, {"t": "质壁分离", "c": "外界溶液浓度>细胞液浓度时细胞失水；液泡变小、紫色加深、细胞液浓度升高", "ch": 6}, {"t": "质壁分离复原", "c": "外界溶液浓度<细胞液浓度时细胞吸水复原；液泡变大、紫色变浅、细胞液浓度降低", "ch": 6}, {"t": "质壁分离的内外因", "c": "外因：外界溶液浓度大于细胞液浓度；内因：原生质层比细胞壁的伸缩性大", "ch": 6}, {"t": "质壁分离实验注意", "c": "细胞壁与细胞膜之间充满外界溶液（壁全透）；KNO3等溶液先分离后自动复原；三次观察均用低倍镜", "ch": 6}, {"t": "被动运输", "c": "物质以扩散方式进出细胞、不消耗能量；分自由扩散（简单扩散）和协助扩散（易化扩散）", "ch": 6}, {"t": "载体蛋白与通道蛋白", "c": "载体蛋白只容许与结合部位适应的分子通过，转运时自身构象改变；通道蛋白按直径、形状、电荷选择，不需结合", "ch": 6}, {"t": "水的跨膜运输", "c": "水分子更多借助细胞膜上的水通道蛋白，以协助扩散的方式进出细胞", "ch": 6}, {"t": "主动运输", "c": "低浓度→高浓度，需要载体蛋白、消耗能量；如小肠吸收葡萄糖、甲状腺滤泡细胞吸收碘", "ch": 6}, {"t": "胞吞与胞吐", "c": "运输大分子、消耗能量、不需要转运蛋白（需膜蛋白）；体现膜的流动性；神经递质也经胞吐释放", "ch": 6}, {"t": "大分子运输特例", "c": "生物大分子不一定都以胞吞、胞吐方式运输，如RNA和蛋白质可通过核孔", "ch": 6}, {"t": "细胞膜两大特点", "c": "结构特点：流动性；功能特点：选择透过性；其结构基础是转运蛋白的种类数量及空间结构变化", "ch": 6}, {"t": "主动运输的意义", "c": "细胞按需选择吸收营养物质，排出代谢废物和有害物质，保证细胞和个体生命活动的需要", "ch": 6}, {"t": "影响跨膜运输的因素", "c": "物质浓度、转运蛋白数量；氧气通过影响细胞呼吸（供能）影响主动运输的速率", "ch": 6}, {"t": "细胞代谢", "c": "细胞内每时每刻都进行着的许多化学反应的统称；这些反应离不开酶的催化", "ch": 7}, {"t": "酶的发现历程", "c": "斯帕兰札尼（胃液消化肉）→巴斯德（发酵离不开活细胞）→李比希（发酵与活细胞无关）→毕希纳（无细胞提取液仍可发酵）→萨姆纳（提纯脲酶结晶、证明为蛋白质）", "ch": 7}, {"t": "酶的本质", "c": "活细胞产生的、具有催化作用的有机物，绝大多数是蛋白质，少数是RNA；基本单位：氨基酸或核糖核苷酸", "ch": 7}, {"t": "酶的作用机理", "c": "酶降低化学反应的活化能；同无机催化剂相比，降低活化能的作用更显著，催化效率更高", "ch": 7}, {"t": "酶的特性", "c": "①高效性②专一性③作用条件较温和；高温、过酸、过碱使酶的空间结构破坏而失活；低温抑制活性但不失活", "ch": 7}, {"t": "酶专一性的解释", "c": "酶活性中心的结构与底物的结构相适应；一种酶只能催化一种或一类化学反应", "ch": 7}, {"t": "影响酶活性的因素", "c": "温度、pH等；不同酶的最适温度、最适pH不同，如胃蛋白酶最适pH约1.5~2.0", "ch": 7}, {"t": "酶相关的实验变量", "c": "自变量：人为改变的变量（如温度）；因变量：随自变量变化而变化的量；无关变量：保持相同且适宜", "ch": 7}, {"t": "ATP的结构简式", "c": "A—P~P~P；A代表腺苷，P代表磷酸基团，~代表高能磷酸键；脱离两个磷酸基后剩余部分为腺嘌呤核糖核苷酸（AMP）", "ch": 7}, {"t": "ATP的元素组成", "c": "C、H、O、N、P；ATP与RNA的组成元素相同", "ch": 7}, {"t": "ATP与ADP的转化", "c": "ATP ⇌ ADP + Pi + 能量；合成时能量来自呼吸作用或光合作用，转化酶不同（合成酶、水解酶）、场所不同、能量不可逆", "ch": 7}, {"t": "ATP的利用", "c": "主动运输、胞吞胞吐、生物发电、大脑思考、肌细胞收缩等；细胞内ATP含量少、转化迅速，处于动态平衡", "ch": 7}, {"t": "ATP与荧光", "c": "萤火虫尾部发荧光需要ATP提供能量，证明ATP是直接能源物质", "ch": 7}, {"t": "探索酵母菌呼吸方式", "c": "有氧：澄清石灰水变浑浊且速度快、量大，无酒精；无氧：变浑浊但慢且少，出现酒精；都用酸性重铬酸钾检测酒精", "ch": 8}, {"t": "线粒体与有氧呼吸", "c": "线粒体内膜向内折叠形成嵴，增大膜面积；有氧呼吸第三阶段在线粒体内膜上进行；线粒体是有氧呼吸的主要场所", "ch": 8}, {"t": "有氧呼吸三个阶段", "c": "第一阶段：细胞质基质，葡萄糖→2丙酮酸+4[H]，少量ATP；第二阶段：线粒体基质，丙酮酸和水→CO₂+[H]，少量ATP；第三阶段：线粒体内膜，[H]+O₂→水，大量ATP", "ch": 8}, {"t": "有氧呼吸总反应式", "c": "C₆H₁₂O₆+6O₂+6H₂O →(酶) 6CO₂+12H₂O+能量；反应物中的水用于第二阶段，生成的水来自第三阶段", "ch": 8}, {"t": "无氧呼吸两种类型", "c": "①酵母菌、植物根细胞：C₆H₁₂O₆→2C₂H₅OH+2CO₂+少量能量②乳酸菌、人骨骼肌细胞：C₆H₁₂O₆→2C₃H₆O₃（乳酸）+少量能量", "ch": 8}, {"t": "无氧呼吸的特点", "c": "全过程都在细胞质基质中进行；不需要氧气；第二阶段不释放能量；有机物分解不彻底，大部分能量存留在酒精或乳酸中", "ch": 8}, {"t": "影响细胞呼吸的因素", "c": "内部：遗传物质决定呼吸酶的种类数量；外部：温度（通过影响酶活性）、氧气浓度、含水量、CO₂浓度", "ch": 8}, {"t": "细胞呼吸原理应用", "c": "中耕松土促进根部有氧呼吸；无氧呼吸产生酒精导致烂根；酸奶、泡菜利用乳酸菌；粮食储藏条件：低温、低氧、干燥", "ch": 8}, {"t": "光合色素的提取与分离", "c": "提取：无水乙醇（研磨时加SiO₂、CaCO₃）；分离：层析液（纸层析法）；滤纸条上从上到下：胡萝卜素、叶黄素、叶绿素a、叶绿素b", "ch": 9}, {"t": "四种色素的颜色与含量", "c": "叶绿素a蓝绿色（最多）、叶绿素b黄绿色、胡萝卜素橙黄色、叶黄素黄色；含量：叶绿素a>b>叶黄素>胡萝卜素", "ch": 9}, {"t": "色素的分布与功能", "c": "分布于类囊体薄膜上；主要吸收红光和蓝紫光；类胡萝卜素还吸收蓝紫光、可保护叶绿素免受强光伤害", "ch": 9}, {"t": "恩格尔曼实验", "c": "用水绵和好氧细菌证明：O₂由叶绿体释放，叶绿体是光合作用的场所；好氧细菌集中于红光和蓝紫光照射区域", "ch": 9}, {"t": "光合作用的光反应", "c": "场所：类囊体薄膜；①水的光解：2H₂O→4[H]+O₂②ATP合成：ADP+Pi→ATP；条件：光、色素、酶", "ch": 9}, {"t": "光合作用的暗反应", "c": "场所：叶绿体基质；①CO₂的固定：CO₂+C₅→2C₃②C₃的还原：C₃+[H]+ATP→(CH₂O)+C₅；需要光反应提供[H]和ATP", "ch": 9}, {"t": "光反应与暗反应的联系", "c": "光反应为暗反应提供[H]（NADPH）和ATP；暗反应为光反应提供ADP、Pi和NADP⁺", "ch": 9}, {"t": "突然停止光照的变化", "c": "[H]、ATP减少，C₃增多，C₅减少，（CH₂O）合成减少；恢复光照后C₃还原加快，C₃减少", "ch": 9}, {"t": "突然降低CO₂的变化", "c": "CO₂固定减弱，C₃减少，C₅增多；光反应产生的[H]和ATP积累，进而光反应也减弱", "ch": 9}, {"t": "影响光合作用的外因", "c": "光照强度、CO₂浓度、温度、水分、矿质元素（如Mg是叶绿素的组成元素）", "ch": 9}, {"t": "化能合成作用", "c": "硝化细菌等利用体外环境中的无机物氧化释放的能量合成有机物；与光合作用的区别：能量来源不同", "ch": 9}, {"t": "细胞周期", "c": "连续分裂的细胞从一次分裂完成时开始，到下一次分裂完成时为止；分裂间期约占90%~95%；只有连续分裂的细胞（如根尖分生区细胞）才有细胞周期", "ch": 10}, {"t": "分裂间期", "c": "完成DNA分子的复制和有关蛋白质的合成，为分裂期做物质准备；结果：DNA数加倍，染色体数不变", "ch": 10}, {"t": "有丝分裂前期", "c": "染色质→染色体；核膜核仁消失；出现纺锤体；染色体散乱分布；每条染色体含2条姐妹染色单体", "ch": 10}, {"t": "有丝分裂中期", "c": "染色体的着丝粒排列在赤道板上；染色体形态稳定、数目清晰，是观察染色体的最佳时期", "ch": 10}, {"t": "有丝分裂后期", "c": "着丝粒分裂，姐妹染色单体分开成为两条染色体；染色体数目加倍，DNA数不变", "ch": 10}, {"t": "有丝分裂末期", "c": "染色体→染色质；核膜核仁重现；植物细胞在赤道板位置出现细胞板，扩展形成细胞壁；动物细胞膜从中部向内凹陷缢裂", "ch": 10}, {"t": "动植物有丝分裂的区别", "c": "前期纺锤体形成方式：植物由细胞两极发出纺锤丝，动物由中心体发出星射线；末期细胞质分裂方式：植物形成细胞板，动物缢裂", "ch": 10}, {"t": "观察根尖分生区实验", "c": "流程：解离（盐酸酒精混合液，使细胞分离）→漂洗→染色（龙胆紫或醋酸洋红）→制片→观察；先低倍后高倍", "ch": 10}, {"t": "染色体与染色质", "c": "同一物质在细胞不同时期的两种存在状态，主要成分都是DNA和蛋白质；染色体数=着丝粒数", "ch": 10}, {"t": "有丝分裂的意义", "c": "将亲代细胞的染色体经过复制后，精确地平均分配到两个子细胞中，保持了遗传的稳定性", "ch": 10}, {"t": "细胞分化", "c": "在个体发育中，一个或一种细胞增殖产生的后代在形态、结构和生理功能上发生稳定性差异的过程；遗传物质不变", "ch": 11}, {"t": "细胞分化的特点与意义", "c": "特点：持久性、稳定性和不可逆性；意义：使多细胞生物体中的细胞趋向专门化，有利于提高各种生理功能的效率", "ch": 11}, {"t": "细胞分化的实质", "c": "基因的选择性表达；遗传物质（DNA）未改变，mRNA和蛋白质的种类发生改变", "ch": 11}, {"t": "细胞的全能性", "c": "已经分化的细胞仍具有发育成完整个体的潜能；原因：细胞核中含有该物种的全套遗传物质；植物组织培养的原理", "ch": 11}, {"t": "细胞全能性大小", "c": "受精卵>生殖细胞>体细胞；分化程度越低全能性越强；植物细胞>动物细胞；一般需要离体、适宜的营养和外界条件", "ch": 11}, {"t": "细胞衰老的特征", "c": "①细胞内水分减少②酶活性降低、代谢减慢③色素积累④呼吸速率减慢、核增大⑤细胞膜通透性改变⑥蛋白质合成能力下降", "ch": 11}, {"t": "细胞衰老的原因", "c": "①自由基学说：异常氧化反应产生自由基，攻击DNA和蛋白质②端粒学说：端粒DNA缩短导致细胞衰老", "ch": 11}, {"t": "细胞凋亡", "c": "由基因决定的细胞自动结束生命的过程，又称细胞编程性死亡；如蝌蚪尾消失、人胚胎指间细胞消失；对机体有利", "ch": 11}, {"t": "细胞坏死与凋亡区别", "c": "细胞坏死：在不利因素作用下细胞正常代谢活动受损或中断所致，是被动过程，对机体有害；凋亡是主动的基因控制过程", "ch": 11}, {"t": "细胞癌变", "c": "原癌基因和抑癌基因发生突变的结果；癌细胞特征：无限增殖、形态结构改变、细胞膜表面糖蛋白减少（易扩散转移）", "ch": 11}, {"t": "生物界统一性的体现", "c": "动植物的细胞具有相似的基本结构；ATP与ADP相互转化的能量供应机制是生物界的共性；所有生物共用一套遗传密码", "ch": 0}, {"t": "供能的顺序", "c": "糖类→脂肪→蛋白质；糖类是主要能源物质，蛋白质在糖类、脂肪供能不足时才大量分解供能", "ch": 2}, {"t": "脂肪非主要能源的原因", "c": "脂肪氧化分解时耗氧量大、供能过程较慢；糖类供能快，且是细胞结构的重要组成，故糖类是主要能源物质", "ch": 2}, {"t": "细胞反应互不干扰", "c": "酶具有专一性；生物膜又把各种酶分隔在特定区域，使细胞内能够同时进行多种化学反应而互不干扰", "ch": 7}, {"t": "细胞呼吸能量的去路", "c": "有氧呼吸释放的能量大部分以热能形式散失，少部分储存在ATP中，供各项生命活动利用", "ch": 8}, {"t": "减数分裂的概念", "c": "进行有性生殖的生物在形成生殖细胞的过程中发生的染色体数目减半的细胞分裂", "ch": 0}, {"t": "减数分裂与细胞周期", "c": "减数分裂没有细胞周期；细胞周期只针对连续分裂的细胞，减数分裂产生的生殖细胞不再分裂", "ch": 0}, {"t": "精子的形成", "c": "睾丸曲细精管中的精原细胞（原始生殖细胞）先经有丝分裂增殖，性成熟后部分精原细胞进行减数分裂形成精子", "ch": 0}, {"t": "染色体减半的原因", "c": "染色体只复制一次而细胞连续分裂两次；减半发生在减Ⅰ完成时，直接原因是同源染色体分离", "ch": 0}, {"t": "前期的判别", "c": "有丝分裂：有同源染色体，散乱分布；减Ⅰ：同源染色体联会形成四分体；减Ⅱ：无同源染色体，散乱分布", "ch": 0}, {"t": "中期的判别", "c": "有丝分裂：着丝粒排列在赤道板上（有同源）；减Ⅰ：成对同源染色体排列在赤道板两侧；减Ⅱ：无同源，着丝粒排在赤道板上", "ch": 0}, {"t": "后期的判别", "c": "有丝分裂：着丝粒分裂（有同源）；减Ⅰ：同源染色体分离、非同源染色体自由组合；减Ⅱ：无同源，着丝粒分裂", "ch": 0}, {"t": "配子多样性的原因", "c": "①非同源染色体的自由组合②四分体中非姐妹染色单体之间发生互换", "ch": 0}, {"t": "减数分裂过程的时间点", "c": "复制在间期；联会在减Ⅰ前期；同源分离在减Ⅰ后期；染色体减半发生在减Ⅰ完成时；DNA减半在减Ⅰ和减Ⅱ完成时", "ch": 0}, {"t": "精子与卵细胞形成的区别", "c": "减Ⅰ后期初级卵母细胞不均等分裂；减Ⅱ后期次级卵母细胞不均等分裂，第一极体均等分裂", "ch": 0}, {"t": "受精作用的实质", "c": "精子的细胞核与卵细胞的细胞核融合；受精卵中染色体数目恢复到体细胞数目", "ch": 0}, {"t": "受精作用的意义", "c": "减数分裂使染色体减半，受精作用使其恢复，保证每种生物前后代染色体数目的恒定", "ch": 0}, {"t": "生物遗传多样性的原因", "c": "①四分体中非姐妹染色单体互换②非同源染色体自由组合③受精时精卵结合的随机性", "ch": 0}, {"t": "21三体综合征的成因", "c": "父方或母方都可能；减Ⅰ后期同源染色体未分离，或减Ⅱ后期两条子染色体移向同一极", "ch": 0}, {"t": "XYY综合征的成因", "c": "减Ⅱ后期复制的两条Y子染色体一同移向精子一极，形成含YY的精子", "ch": 0}, {"t": "一个精原细胞的产物", "c": "正常产生2种4个精子；发生互换可产生4种4个；卵原细胞无论是否互换都只产生1种卵细胞", "ch": 0}, {"t": "一个生物体的配子种类", "c": "不考虑互换，可产生2ⁿ种配子（n为同源染色体对数）；含互换则更多", "ch": 0}, {"t": "遗传因子与染色体的对应", "c": "孟德尔说的一对遗传因子即一对同源染色体上的等位基因；不同对的遗传因子即非同源染色体上的非等位基因", "ch": 0}, {"t": "有性生殖后代多样的根本原因", "c": "有性生殖过程中的基因重组使产生的配子种类多样化，进而产生基因组合多样的子代", "ch": 0}, {"t": "精子变形", "c": "精细胞变形为精子：细胞核保留，大部分细胞质丢弃，但线粒体全部保留并集中在尾部，为精子运动供能", "ch": 0}, {"t": "豌豆作实验材料的优点", "c": "①自花传粉、闭花受粉，自然状态下一般都是纯种②具有多对易于区分的相对性状③花大易人工杂交④生长周期短、种子多", "ch": 1}, {"t": "人工异花传粉的流程", "c": "去雄（除去母本未成熟花的全部雄蕊）→套袋→授粉（雌蕊成熟时）→套袋；去雄只针对母本", "ch": 1}, {"t": "孟德尔成功的原因", "c": "①选豌豆作材料②先研究一对相对性状再到多对③应用统计学方法④应用假说-演绎法设计测交实验", "ch": 1}, {"t": "假说-演绎法的步骤", "c": "提出问题→提出假说→演绎推理→实验检验；F2出现3:1属于提出问题，设计测交属于实验检验", "ch": 1}, {"t": "相对性状", "c": "一种生物同一性状的不同表现类型", "ch": 1}, {"t": "显性与隐性性状", "c": "具有相对性状的两纯合亲本杂交，F1中显现出来的性状叫显性性状，未显现出来的叫隐性性状", "ch": 1}, {"t": "性状分离", "c": "杂种后代中同时出现显性性状和隐性性状的现象", "ch": 1}, {"t": "Dd自交的结果", "c": "4种组合方式、3种基因型（DD:Dd:dd=1:2:1）、2种表现型（3:1）；显性个体中杂合子占2/3", "ch": 1}, {"t": "分离定律的内容", "c": "体细胞中控制同一性状的遗传因子成对存在、不相融合；形成配子时成对的遗传因子彼此分离，分别进入不同配子", "ch": 1}, {"t": "分离定律的实质", "c": "形成配子时，等位基因随同源染色体的分开而分离", "ch": 1}, {"t": "验证分离定律的方法", "c": "①杂合子自交：后代3:1②杂合子测交：后代1:1③花粉鉴定法：2种花粉1:1", "ch": 1}, {"t": "测交的作用", "c": "检测被测个体的基因型和产生配子的种类及比例；检测动物基因型用测交", "ch": 1}, {"t": "自交的作用", "c": "可判断显隐性、提高纯合度、验证分离定律；检测植物基因型最简单的方法是自交", "ch": 1}, {"t": "正反交的作用", "c": "判断基因位于常染色体还是X染色体上（结果相同为常染色体），也可判断显隐性", "ch": 1}, {"t": "表型与基因型的关系", "c": "基因型是性状表现的内在因素，表型是基因型的表现形式；表型=基因型+环境", "ch": 1}, {"t": "表型相同与基因型", "c": "表型相同，基因型不一定相同；基因型相同，表型也不一定相同（受环境影响）", "ch": 1}, {"t": "淀粉与豌豆圆皱", "c": "圆粒豌豆淀粉含量高、保留水分多；皱粒豌豆淀粉含量低、成熟失水多而皱缩", "ch": 1}, {"t": "性状分离比的模拟实验", "c": "用小球模拟雌雄配子，两种彩球大小、形状、质地必须一致；绿豆和黄豆大小不同，不能代替", "ch": 1}, {"t": "两对相对性状的F2比例", "c": "黄圆:黄皱:绿圆:绿皱=9:3:3:1；该比例的出现属于假说-演绎法中的提出问题", "ch": 2}, {"t": "F1产生的配子", "c": "雌雄配子各有4种：YR:Yr:yR:yr=1:1:1:1；该假设属于提出假说", "ch": 2}, {"t": "测交的演绎与检验", "c": "预测四种表型1:1:1:1属于演绎推理；测交实际结果接近1:1:1:1属于实验检验", "ch": 2}, {"t": "自由组合定律的内容", "c": "形成配子时，决定同一性状的遗传因子彼此分离，决定不同性状的遗传因子自由组合", "ch": 2}, {"t": "自由组合定律的实质", "c": "同源染色体上的等位基因彼此分离的同时，非同源染色体上的非等位基因自由组合", "ch": 2}, {"t": "验证自由组合定律的方法", "c": "①杂合子自交：后代9:3:3:1②杂合子测交：后代1:1:1:1③花粉鉴定法：4种花粉1:1:1:1", "ch": 2}, {"t": "两定律的关系", "c": "自由组合定律以分离定律为基础；两定律都发生在有性生殖的生物形成配子的过程中", "ch": 2}, {"t": "两定律的适用范围", "c": "真核生物、有性生殖、细胞核遗传；原核生物和病毒不符合，真核生物的细胞质遗传也不符合", "ch": 2}, {"t": "分离定律分析两对基因", "c": "每对等位基因都遵循分离定律，可逐对分析后再组合出后代的比例", "ch": 2}, {"t": "非同源染色体与组合数", "c": "非同源染色体数量越多，非等位基因组合的种类也越多", "ch": 2}, {"t": "萨顿的假说", "c": "用蝗虫作材料，采用类比推理法提出基因在染色体上的假说", "ch": 3}, {"t": "摩尔根的实验", "c": "用果蝇（白眼雄果蝇）作材料，用假说-演绎法证明基因位于染色体上", "ch": 3}, {"t": "摩尔根的核心假说", "c": "控制白眼的基因在X染色体上，Y染色体上不含有它的等位基因", "ch": 3}, {"t": "基因在染色体上呈线性排列", "c": "摩尔根和他的学生们发明了测定基因位于染色体上相对位置的方法，说明基因在染色体上呈线性排列", "ch": 3}, {"t": "性别决定的类型", "c": "人为XY型（XX雌、XY雄）；鸡为ZW型（ZZ雄、ZW雌）", "ch": 3}, {"t": "伴性遗传的概念", "c": "位于性染色体上的基因所控制的性状，在遗传上总是和性别相关联的现象", "ch": 3}, {"t": "性染色体上的基因", "c": "并非所有基因都与性别决定有关（如色盲基因与性别形成无关），但它们的遗传与性别相关联", "ch": 3}, {"t": "伴X隐性遗传的特点", "c": "男患者多于女患者、隔代遗传、交叉遗传（男患者的致病基因从母亲传来，以后只能传给女儿）", "ch": 3}, {"t": "伴X显性遗传的特点", "c": "女患者多于男患者、连续遗传（代代都有患者）", "ch": 3}, {"t": "系谱图判断口诀", "c": "无中生有为隐性，隐性看女病，父子正常为常染色体；有中生无为显性，显性看男病，母女正常为常染色体", "ch": 3}, {"t": "道尔顿与色盲", "c": "道尔顿第一个发现色盲症，也是第一个被发现的色盲患者，色盲又称道尔顿症", "ch": 3}, {"t": "色盲女儿的成因", "c": "表现正常的夫妇生下患色盲的女儿，最可能的原因是发生了基因突变（而不是基因重组）", "ch": 3}, {"t": "人类遗传病的分类", "c": "单基因遗传病、多基因遗传病、染色体异常遗传病", "ch": 3}, {"t": "单基因遗传病实例", "c": "常显：多指、并指、软骨发育不全；常隐：白化病、镰状细胞贫血、苯丙酮尿症；伴X显：抗维生素D佝偻病；伴X隐：红绿色盲、血友病", "ch": 3}, {"t": "多基因遗传病", "c": "受两对以上等位基因控制，如原发性高血压、冠心病、哮喘、青少年型糖尿病；群体发病率高、易受环境影响", "ch": 3}, {"t": "染色体异常遗传病实例", "c": "21三体综合征（唐氏综合征）、猫叫综合征（5号染色体部分缺失）", "ch": 3}, {"t": "遗传病的调查", "c": "调查发病率需在广大人群中随机抽样；调查遗传方式需在患者家系中调查", "ch": 3}, {"t": "遗传病的监测预防", "c": "主要手段：遗传咨询（了解病史→分析传递方式→推算再发风险率→提出对策）和产前诊断", "ch": 3}, {"t": "产前诊断的手段", "c": "B超检查、孕妇血细胞检查、羊水检查、基因检测等", "ch": 3}, {"t": "B超检查的局限", "c": "B超在表观水平检查胎儿外观和性别，不能检查染色体异常遗传病和基因异常遗传病", "ch": 3}, {"t": "基因检测与基因治疗", "c": "基因检测：检测人体细胞中的DNA序列；基因治疗：用正常基因取代或修补患者细胞中有缺陷的基因", "ch": 3}, {"t": "遗传病的易混概念", "c": "家族性疾病不等于遗传病（如传染病）；先天性疾病不一定是遗传病", "ch": 3}, {"t": "S型与R型肺炎链球菌", "c": "S型：菌落光滑、有多糖类荚膜、有毒性；R型：菌落粗糙、无荚膜、无毒性", "ch": 4}, {"t": "格里菲思的实验", "c": "小鼠体内转化实验：加热杀死的S型细菌中含有某种促使R型活细菌转化为S型活细菌的活性物质——转化因子", "ch": 4}, {"t": "转化实验的实质", "c": "少部分R型细菌转化为S型细菌，实质是S型细菌DNA片段与R型细菌的基因重组（广义）", "ch": 4}, {"t": "艾弗里的实验", "c": "体外转化实验证明DNA是转化因子（遗传物质），蛋白质不是；控制自变量采用减法原理", "ch": 4}, {"t": "艾弗里实验的思路", "c": "设法把DNA和蛋白质分开，单独地、直接地观察DNA和蛋白质的作用；最大困难是彻底去除某种物质", "ch": 4}, {"t": "噬菌体侵染实验", "c": "用35S标记蛋白质、32P标记DNA的T2噬菌体分别侵染大肠杆菌；先标记大肠杆菌再培养噬菌体", "ch": 4}, {"t": "搅拌与离心的目的", "c": "搅拌：使吸附在大肠杆菌上的噬菌体外壳与细菌分离；离心：让较轻的噬菌体颗粒进入上清液，细菌留在沉淀中", "ch": 4}, {"t": "35S组的结果", "c": "上清液放射性很高、沉淀放射性很低；沉淀中出现少量放射性的原因是搅拌不充分", "ch": 4}, {"t": "32P组的结果", "c": "沉淀放射性很高、上清液放射性很低；上清液出现少量放射性的原因是保温时间过短（DNA未进入）或过长（子代噬菌体释放）", "ch": 4}, {"t": "噬菌体实验的结论", "c": "噬菌体的遗传物质是DNA；不能证明蛋白质不是遗传物质（蛋白质未进入细菌，未观察其作用）", "ch": 4}, {"t": "噬菌体的标记方法", "c": "噬菌体是病毒，不能直接用培养基培养；应先标记大肠杆菌，再用其培养噬菌体", "ch": 4}, {"t": "侵染时原料的来源", "c": "T2噬菌体侵染细菌时，只提供DNA作模板，以大肠杆菌的脱氧核苷酸和氨基酸为原料", "ch": 4}, {"t": "实验生物的辨析", "c": "肺炎链球菌是原核生物，噬菌体是DNA病毒；几个实验涉及的生物不都是原核生物", "ch": 4}, {"t": "烟草花叶病毒的实验", "c": "烟草花叶病毒重建实验证明RNA是烟草花叶病毒的遗传物质", "ch": 4}, {"t": "DNA是主要的遗传物质", "c": "绝大多数生物的遗传物质是DNA，只有少数RNA病毒的遗传物质是RNA", "ch": 4}, {"t": "实验设计的关键思路", "c": "艾弗里和赫尔希实验的关键设计相同：都设法把DNA和蛋白质分开，单独观察各自的作用", "ch": 4}, {"t": "DNA双螺旋结构的特点", "c": "双链反向平行；脱氧核糖与磷酸交替连接排列在外侧构成基本骨架；碱基对排列在内侧，通过氢键连接", "ch": 5}, {"t": "碱基互补配对原则", "c": "A与T配对（2个氢键），C与G配对（3个氢键）", "ch": 5}, {"t": "脱氧核糖与磷酸的连接", "c": "DNA分子中每个脱氧核糖连接1或2个磷酸；每个磷酸基团连接1或2个脱氧核糖", "ch": 5}, {"t": "游离的磷酸基团", "c": "线性双链DNA有2个游离的磷酸基团；环状DNA分子没有游离的磷酸基团", "ch": 5}, {"t": "相邻碱基的连接", "c": "一条单链上相邻碱基靠“脱氧核糖—磷酸—脱氧核糖”连接；两条链互补的碱基之间靠氢键连接", "ch": 5}, {"t": "DNA的三大特性", "c": "稳定性（双螺旋结构、氢键、互补配对）、多样性（碱基排列顺序千变万化）、特异性（特定的碱基排列顺序）", "ch": 5}, {"t": "遗传信息的位置", "c": "遗传信息蕴藏在4种碱基（脱氧核苷酸）的排列顺序之中，而不是脱氧核苷酸本身", "ch": 5}, {"t": "DNA与生物多样性", "c": "DNA分子的多样性和特异性是生物体多样性和特异性的物质基础和根本原因（直接原因是蛋白质多样性）", "ch": 5}, {"t": "AT与GC碱基对", "c": "AT碱基对与GC碱基对的形状和直径相同，使DNA分子具有恒定的直径", "ch": 5}, {"t": "DNA复制的时间与场所", "c": "时间：有丝分裂间期、减数分裂前的间期；场所：主要是细胞核，线粒体和叶绿体中也进行", "ch": 5}, {"t": "DNA复制的条件", "c": "模板：亲代DNA两条链；原料：4种游离的脱氧核苷酸；酶：解旋酶、DNA聚合酶等；能量：ATP", "ch": 5}, {"t": "解旋酶与DNA聚合酶", "c": "解旋酶断开碱基对之间的氢键；DNA聚合酶连接磷酸二酯键，不能催化两个游离脱氧核苷酸之间的连接", "ch": 5}, {"t": "DNA复制的特点", "c": "边解旋边复制、半保留复制；快速的原因：多起点、双向复制", "ch": 5}, {"t": "复制准确性的保证", "c": "①独特的双螺旋结构为复制提供了精确的模板②碱基互补配对原则保证复制能够准确地进行", "ch": 5}, {"t": "DNA聚合酶的移动方向", "c": "合成两条子链时，DNA聚合酶的移动方向相反", "ch": 5}, {"t": "半保留复制", "c": "DNA复制n代共得2ⁿ个DNA；无论复制多少代，含有亲代链的DNA始终只有2个", "ch": 5}, {"t": "梅塞尔森与斯塔尔", "c": "用同位素标记结合密度梯度离心法证明DNA以半保留方式复制", "ch": 5}, {"t": "差速离心法", "c": "分离各种细胞器常用差速离心法；密度梯度离心法用于DNA半保留复制的实验", "ch": 5}, {"t": "人类基因组计划", "c": "测定24条染色体（22条常染色体+X+Y）上的全部DNA序列", "ch": 5}, {"t": "基因的概念", "c": "基因通常是有遗传效应的DNA片段；RNA病毒的基因在RNA上，因此“基因一定是有遗传效应的DNA片段”说法不严谨", "ch": 5}, {"t": "基因与染色体的关系", "c": "基因和DNA的主要载体是染色体；线粒体和叶绿体中也含有基因", "ch": 5}, {"t": "染色体、DNA与基因", "c": "染色体由DNA和蛋白质组成；基因是有遗传效应的DNA片段；大小关系：染色体＞DNA＞基因＞脱氧核苷酸", "ch": 5}, {"t": "薛定谔的贡献", "c": "第一个把遗传物质设定为一种信息分子，提出遗传是遗传信息的复制、传递与表达", "ch": 5}, {"t": "A与a的本质区别", "c": "脱氧核苷酸（碱基对）的排列顺序不同", "ch": 5}, {"t": "DNA复制的过程", "c": "场所主要在细胞核；模板：DNA的两条链；原料：4种脱氧核苷酸；产物：DNA", "ch": 6}, {"t": "转录的过程", "c": "场所主要在细胞核；模板：DNA的一条链；原料：4种核糖核苷酸；产物：RNA", "ch": 6}, {"t": "翻译的过程", "c": "场所：核糖体；模板：mRNA；原料：21种氨基酸；产物：多肽（蛋白质）", "ch": 6}, {"t": "三种过程的配对", "c": "复制：A—T；转录：A—U；翻译：A—U、U—A；与复制相比，转录特有的配对方式是A—U", "ch": 6}, {"t": "RNA聚合酶的作用", "c": "与DNA上的启动子结合，既能断开氢键（解旋），又能连接磷酸二酯键（催化转录）", "ch": 6}, {"t": "转录与复制的单位", "c": "转录以一个基因为单位，复制以整个DNA分子为单位", "ch": 6}, {"t": "原核与真核表达的差异", "c": "真核细胞核基因先转录后翻译（核转录、质翻译）；原核细胞没有核膜，转录和翻译同时进行", "ch": 6}, {"t": "密码子", "c": "mRNA上3个相邻的碱基决定1个氨基酸，共64种；终止密码子不决定氨基酸", "ch": 6}, {"t": "密码子的简并性", "c": "一种氨基酸可以对应一种或多种密码子；1种密码子只能决定1种氨基酸", "ch": 6}, {"t": "tRNA与反密码子", "c": "tRNA一端有反密码子，能与mRNA上的密码子互补配对；一种tRNA只能转运一种氨基酸", "ch": 6}, {"t": "一种氨基酸与tRNA", "c": "一种氨基酸能由一种或多种tRNA转运（因密码子的简并性）", "ch": 6}, {"t": "tRNA的结构", "c": "tRNA不是只有3个碱基；整个tRNA含几十个碱基，存在部分双链结构，含有氢键", "ch": 6}, {"t": "多聚核糖体", "c": "一个mRNA相继结合多个核糖体，迅速合成大量蛋白质，提高翻译效率", "ch": 6}, {"t": "原核多聚核糖体的产物", "c": "原核生物转录出的mRNA同时结合多个核糖体时，翻译出的多肽不一定相同（原核mRNA可编码多种蛋白质）", "ch": 6}, {"t": "中心法则的内容", "c": "DNA→DNA（复制）、DNA→RNA（转录）、RNA→蛋白质（翻译）；补充：RNA复制、逆转录", "ch": 6}, {"t": "RNA病毒的信息传递", "c": "含RNA复制酶的病毒：RNA→RNA、翻译；含逆转录酶的病毒：RNA→DNA→RNA→蛋白质", "ch": 6}, {"t": "高度分化的细胞", "c": "不再分裂，不进行DNA复制，但仍进行转录和翻译", "ch": 6}, {"t": "基因控制性状的途径", "c": "①通过控制酶的合成控制代谢过程（间接控制）②通过控制蛋白质的结构直接控制性状", "ch": 6}, {"t": "基因与性状的关系", "c": "不一定一一对应；一个性状可受多个基因影响，一个基因也可影响多个性状", "ch": 6}, {"t": "性状的决定因素", "c": "主要由基因决定，也受环境影响；基因与基因、基因与基因产物、基因与环境相互作用，精细调控性状", "ch": 6}, {"t": "表观遗传", "c": "基因的碱基序列保持不变，但基因表达和表型发生可遗传变化的现象；如DNA甲基化、组蛋白修饰", "ch": 6}, {"t": "表观遗传与基因突变", "c": "表观遗传中碱基序列不变；基因突变中碱基序列改变", "ch": 6}, {"t": "DNA甲基化与吸烟", "c": "吸烟会使人体细胞内DNA甲基化水平升高，影响相关基因的表达", "ch": 6}, {"t": "基因表达的产物", "c": "基因转录出tRNA、rRNA也属于基因的表达；基因指导合成的终产物可以是蛋白质，也可以是RNA", "ch": 6}, {"t": "大肠杆菌合成胰岛素", "c": "大肠杆菌能合成胰岛素肽链，但不能加工成具有生理功能的胰岛素（无内质网、高尔基体）", "ch": 6}, {"t": "基因突变的概念", "c": "DNA分子中发生碱基的替换、增添或缺失，引起的基因碱基序列的改变（替换/增添/缺失+基因序列改变）", "ch": 7}, {"t": "基因突变的时期", "c": "主要发生在DNA复制时（有丝分裂间期、减数分裂前的间期）；个体发育的任何时期都可发生", "ch": 7}, {"t": "基因突变的场所", "c": "真核生物的基因突变主要发生在细胞核，也可发生在线粒体、叶绿体中", "ch": 7}, {"t": "基因突变的原因", "c": "外因：物理（紫外线、X射线）、化学（亚硝酸盐、碱基类似物）、生物（病毒）；内因：DNA复制偶尔出错", "ch": 7}, {"t": "基因突变的特点", "c": "普遍性、随机性、不定向性、低频性、多害少利性", "ch": 7}, {"t": "基因突变的意义", "c": "产生新基因的途径，是生物变异的根本来源，为生物进化提供丰富的原始材料", "ch": 7}, {"t": "基因突变与性状", "c": "基因突变一定改变DNA（基因结构），不一定改变性状；原因：非编码区突变、密码子简并、显性纯合中隐性突变等", "ch": 7}, {"t": "基 一性和生物体结构的统一性 原核生物、真菌、病毒 多样性 不完全归纳法", "x": "1.1 细胞学说 建立者：施莱登、施旺（提出）；魏尔肖补充「细胞通过分裂产生新细胞」。 内容（三点）：①细胞是一个有机体，一切动植物都由细胞发育而来，并由细胞和细胞产物构成；②细胞是一个相对独立的单位，既有自己的生命，又对与其他细胞共同组成的整体生命起作用；③新细胞是由老细胞分裂产生的。 意义：揭示细胞的统一性和生物体结构的统一性（证明动植物有共同的结构基础与亲缘关系）。 局限：未涉及原核生物、真菌、病毒；未揭示细胞的多样性。 启示：科学发现离不开技术支持；理论经修正补充而完善；运用了不完全归纳法——结论可信但可能有例外。"}, {"id": "c0s1", "ch": 0, "chT": "走近细胞", "t": "1.2 生命系统的结构层次", "terms": "个体 → 种群 → 群落 → 生态系统 → 生物圈 细胞层次即个体层次 非生物的环境", "x": "1.2 生命系统的结构层次 层次：细胞 → 组织 → 器官 → 系统 → 个体 → 种群 → 群落 → 生态系统 → 生物圈。 植物没有「系统」层次（六大器官直接构成个体）；单细胞生物没有组织、器官、系统层次，细胞层次即个体层次；病毒没有结构层次（不属于生命系统的任何层次，但属于生物）。 生态系统包括生物群落与非生物的环境（阳光、空气、水等），仍属于生命系统。 细胞是最基本的生命系统：单细胞生物一个细胞完成全部生命活动；多细胞生物依赖各种分化的细胞密切合作。"}, {"id": "c0s2", "ch": 0, "chT": "走近细胞", "t": "1.3 病毒", "terms": "核酸（DNA 或 RNA）+ 蛋白质 寄生在活细胞 结构不稳定、易变异", "x": "1.3 病毒 结构：核酸（DNA 或 RNA）+ 蛋白质；无细胞结构，必须寄生在活细胞中才能增殖（培养病毒须用活细胞/活鸡胚，不能用普通培养基）。 分类：DNA 病毒（T2 噬菌体、乙肝病毒）；RNA 病毒（HIV、流感病毒、SARS 冠状病毒、新冠病毒）。RNA 病毒遗传物质一般为单链，结构不稳定、易变异，疫苗研发难度大。 增殖过程：吸附 → 注入核酸（噬菌体注射式；动物病毒多经膜融合或胞吞）→ 合成核酸与蛋白质 → 组装 → 释放。合成场所利用宿主细胞的核糖体、原料和能量。"}, {"id": "c0s3", "ch": 0, "chT": "走近细胞", "t": "1.4 真核细胞与原核细胞", "terms": "拟核 核糖体 肽聚糖 二分裂 同时同地进行 叶绿素和藻蓝素 没有叶绿体 质粒 绝大多数原核生物 富营养化（N、P 含量高） 64 ÷ 16 = 4 16 ÷ 4 = 4", "x": "1.4 真核细胞与原核细胞 比较项原核细胞（蓝细菌、细菌等）真核细胞（动植物、真菌） 细胞核拟核：无核膜、核仁，大型环状 DNA 集中分布有核膜包被的细胞核，染色质（DNA+蛋白质） 染色体无（DNA 不与蛋白质结合）有 细胞器只有核糖体核糖体及其他多种复杂细胞器 细胞壁主要成分肽聚糖（支原体无细胞壁）植物：纤维素和果胶；真菌：几丁质 分裂方式二分裂（不遵循孟德尔遗传定律）有丝分裂、无丝分裂、减数分裂 转录与翻译同时同地进行（边转录边翻译）先后不同空间进行（核内转录、质中翻译） 共同点均有细胞膜、核糖体、DNA 和 RNA，遗传物质均为 DNA；都通过 ATP 供能 蓝细菌（原核）：含叶绿素和藻蓝素，能进行光合作用，但没有叶绿体。 质粒：小型环状 DNA，存在于绝大多数原核生物中，酵母菌中也存在；是基因工程的常用载体。 常见原核生物：蓝细菌（念珠藻、色球藻、颤藻、发菜）、大肠杆菌、乳酸菌、硝化细菌、醋酸杆菌、根瘤菌、支原体（原核"}, {"id": "c1", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "细胞的元素与化合物 · 水和无机盐", "terms": "", "x": "02 细胞的元素与化合物 · 水和无机盐组成细胞的元素 · 检测生物组织中的糖类、脂肪和蛋白质 · 细胞中的水和无机盐"}, {"id": "c1s0", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.1 组成细胞的元素", "terms": "C 是最基本元素 O 干重含量最多的是 C", "x": "2.1 组成细胞的元素 大量元素：C、H、O、N、P、S、K、Ca、Mg；微量元素：Fe、Mn、Zn、Cu、B、Mo。 C 是最基本元素（碳链构成生物大分子骨架）；鲜重含量最多的是 O，干重含量最多的是 C；占细胞鲜重最多的化合物是水，最多的有机物是蛋白质。 生物界与非生物界的统一性：元素种类大体相同；差异性：元素含量相差很大。"}, {"id": "c1s1", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.2 检测生物组织中的有机物（必背数据）", "terms": "斐林试剂 浅蓝色 → 棕色 → 砖红色（Cu2O） 双缩脲试剂 紫色 橘黄色 红色 蔗糖不是还原糖 甘蔗、甜菜（蔗糖非还原糖）、西瓜、番茄（红色干扰）均不合适 含两个及以上肽键", "x": "2.2 检测生物组织中的有机物（必背数据） 待测物试剂与配制操作与颜色反应 还原糖斐林试剂：甲液 0.1 g/mL NaOH + 乙液 0.05 g/mL CuSO4，现配现用、等量混合50~65 ℃ 水浴加热约 2 min：浅蓝色 → 棕色 → 砖红色（Cu2O） 蛋白质双缩脲试剂：A 液 0.1 g/mL NaOH 1 mL + B 液 0.01 g/mL CuSO4 3~4 滴不加热，先加 A 液再加 B 液，呈紫色 脂肪苏丹Ⅲ染液（橘黄色）或苏丹Ⅳ染液（红色）切片法需显微镜观察；匀浆法可直接观察，不需显微镜 淀粉碘液变蓝 还原糖：葡萄糖、果糖、麦芽糖、乳糖；蔗糖不是还原糖。选材要求「组织颜色浅、富含待测物」——甘蔗、甜菜（蔗糖非还原糖）、西瓜、番茄（红色干扰）均不合适，常用苹果、梨的匀浆。 双缩脲试剂检测蛋白质要求分子中含两个及以上肽键——二肽不能被检测。"}, {"id": "c1s2", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.3 细胞中的水", "terms": "自由水 结合水 升高 → 代谢旺盛 降低 → 抗逆性（抗寒、抗旱）增强 比热容大", "x": "2.3 细胞中的水 存在形式：自由水（良好溶剂、参与反应、运输物质）与结合水（细胞结构的重要组成成分，如与蛋白质、多糖结合）。 自由水/结合水比值：升高 → 代谢旺盛；降低 → 抗逆性（抗寒、抗旱）增强。冬眠动物、越冬植物比值下降。 水的性质：极性分子（良好的溶剂）、液体（氢键缔合）、比热容大（恒温、缓冲温度变化）。 产生水的反应：氨基酸脱水缩合、ATP 合成、有氧呼吸第三阶段、暗反应（糖类合成）；消耗水的反应：多肽水解、有氧呼吸第二阶段、光反应（水的光解）、光合作用的光反应阶段。"}, {"id": "c1s3", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.4 细胞中的无机盐", "terms": "离子 血 Ca²⁺过低→抽搐，过高→肌无力 Fe²⁺ 结合水被破坏后细胞死亡", "x": "2.4 细胞中的无机盐 存在形式：主要以离子形式存在（少量构成化合物，如 Fe2+ 于血红蛋白、Mg 于叶绿素、P 于核苷酸）。 功能：①复杂化合物的组成成分；②维持细胞和生物体的生命活动；③维持细胞的酸碱平衡；④维持细胞的渗透压与形态。 缺乏症：血 Ca²⁺过低→抽搐，过高→肌无力；缺 Fe → 缺铁性贫血；缺 Mg → 叶片变黄；缺 B → 「花而不实」；缺 I → 甲状腺肿大（大脖子病）。 边角小字 血红素：含 Fe²⁺ 的卟啉环辅基；血红蛋白 = 珠蛋白 + 4 个血红素。生物体内没有含 Fe 的氨基酸，Fe 是肽链折叠后与辅基结合的。 等质量的脂肪比糖类含 H 多、含 O 少，氧化分解释放能量多、耗 O 多——脂肪是良好的储能物质。 结合水与抗逆性的关系：结合水比例越高，原生质黏度越大、代谢越慢、抗逆性越强。 易错警示 斐林试剂需现配现用、甲乙液混合后加入，不能像双缩脲那样先后单独加入。 不加热时还原糖与斐林试剂反应极"}, {"id": "c2", "ch": 2, "chT": "糖类和脂质", "t": "糖类和脂质", "terms": "", "x": "03 糖类和脂质细胞中的糖类 · 细胞中的脂质 · 种子成熟与萌发过程中的物质变化"}, {"id": "c2s0", "ch": 2, "chT": "糖类和脂质", "t": "3.1 糖类（主要能源物质）", "terms": "纤维素不供能 几丁质（壳多糖）", "x": "3.1 糖类（主要能源物质） 类别代表物分布与功能 单糖葡萄糖（细胞重要能源）、果糖、半乳糖；核糖、脱氧核糖（构成核酸）不能再水解；葡萄糖是细胞呼吸最常利用的底物 二糖植物：蔗糖（葡萄糖+果糖）、麦芽糖（两分子葡萄糖）；动物：乳糖须水解为单糖才能被吸收；蔗糖、麦芽糖是运输/储存形式 多糖植物：淀粉（储能）、纤维素（细胞壁成分）；动物：糖原（肝糖原、肌糖原）淀粉储能、可水解供能；纤维素不供能，构成植物细胞壁；糖原暂时储能 几丁质（壳多糖）：广泛存在于甲壳类动物和昆虫的外骨骼、真菌的细胞壁中；可用于制作人造皮肤、缝合线等，含 N 元素。"}, {"id": "c2s1", "ch": 2, "chT": "糖类和脂质", "t": "3.2 脂质（C、H、O 为主，有的含 N、P）", "terms": "储能物质 所有细胞膜（生物膜） 脂质的运输 钙和磷", "x": "3.2 脂质（C、H、O 为主，有的含 N、P） 类别功能备注 脂肪①细胞内良好的储能物质；②保温；③缓冲、减压，保护内脏等质量产能比糖类多、耗 O 多；动物脂肪饱和程度高、熔点高 磷脂构成所有细胞膜（生物膜）的重要成分脑、卵细胞、大豆中丰富 固醇胆固醇：构成动物细胞膜的重要成分、参与血液中脂质的运输；性激素：促进生殖器官发育与生殖细胞形成；维生素 D：促进肠道对钙和磷的吸收胆固醇过高会导致血管堵塞，但其本身是必需成分，不可完全缺乏"}, {"id": "c2s2", "ch": 2, "chT": "糖类和脂质", "t": "3.3 种子成熟与萌发过程中的物质变化（课件拓展）", "terms": "转变为脂肪 水解并转变为糖类 增加", "x": "3.3 种子成熟与萌发过程中的物质变化（课件拓展） 油料种子（花生、油菜）成熟过程中：光合产物（糖类）转变为脂肪储存，游离脂肪酸减少、脂肪增多，磷脂含量上升。 种子萌发时：脂肪水解并转变为糖类（经过乙醛酸循环途径），自由水含量增多、呼吸作用增强。 萌发初期干重先增加（吸收 O2 与 H2O 参与氧化，质量来自氧）后持续减少（呼吸消耗）。 边角小字 糖类「甜」与「不甜」与是否为还原糖无关；蔗糖水解产物（葡萄糖+果糖）都是还原糖。 脂肪检测试剂同样可用苏丹Ⅲ/Ⅳ染色后显微镜观察颗粒大小与分布。 植物细胞储能：淀粉；动物细胞储能：糖原和脂肪。纤维素虽然由葡萄糖构成，但不能被人消化（无相应酶）。 易错警示 「糖类是主要能源物质，脂肪是主要储能物质」不要混淆。 所有活细胞都含糖类与脂质；但并非所有细胞都含脂肪（磷脂是膜成分，普遍存在）。 胆固醇过多有害，但缺少会影响膜的稳定性与脂质运输——「胆固醇有害无益」说法错误。"}, {"id": "c3", "ch": 3, "chT": "蛋白质和核酸", "t": "蛋白质和核酸", "terms": "", "x": "04 蛋白质和核酸蛋白质的结构与功能 · 核酸的结构与功能 · 生物大分子以碳链为骨架"}, {"id": "c3s0", "ch": 3, "chT": "蛋白质和核酸", "t": "4.1 蛋白质（生命活动的主要承担者）", "terms": "不供能 一个氨基和一个羧基连接在同一个碳原子上 必需氨基酸 非必需氨基酸 核糖体 肽键（—CO—NH—） 种类、数目、排列顺序 空间结构 基因（DNA）的多样性 肽链间不能形成肽键 变性 不可恢复 盐析 加水可复溶", "x": "4.1 蛋白质（生命活动的主要承担者） 功能（五大类，教材 P28 黑体） 结构蛋白（肌肉、羽毛、头发）；催化（绝大多数酶）；运输（血红蛋白、通道蛋白、载体蛋白）；调节（胰岛素、生长激素）；免疫（抗体）。正常代谢中蛋白质不供能，仅在病理或衰老状态才氧化分解。 基本单位——氨基酸 结构通式：至少含一个氨基和一个羧基连接在同一个碳原子上，该碳原子还连一个氢和一个 R 基。区别在于 R 基不同；有的 R 基中也含氨基或羧基。 组成人体蛋白质的氨基酸约 21 种，其中 8 种（婴儿 9 种）为必需氨基酸，只能从食物获得，人体不能合成；非必需氨基酸可由转氨基作用合成。 必需氨基酸口诀：「携（缬）一（异亮）两（亮）本（苯丙）单（蛋）色（色）书（苏）来（赖）」。 脱水缩合在核糖体上进行：一个氨基酸的羧基与另一个的氨基结合，脱去一分子水，形成肽键（—CO—NH—）。水中 H 来自氨基和羧基，O 只来自羧基。 脱水缩合计算全套公式 肽键数 / 脱"}, {"id": "c3s1", "ch": 3, "chT": "蛋白质和核酸", "t": "4.2 核酸（遗传信息的携带者）", "terms": "磷酸 + 五碳糖 + 含氮碱基 数目与排列顺序 碳链为基本骨架 基因的选择性表达 同一个基因", "x": "4.2 核酸（遗传信息的携带者） 项目DNA（脱氧核糖核酸）RNA（核糖核酸） 元素均为 C、H、O、N、P 基本单位脱氧核糖核苷酸（4 种）核糖核苷酸（4 种） 五碳糖脱氧核糖核糖 碱基A、T、G、CA、U、G、C 结构一般双链，双螺旋一般单链 分布细胞核（染色质）、线粒体、叶绿体、拟核、质粒细胞核、线粒体、叶绿体、核糖体（rRNA） 功能绝大多数生物的遗传物质mRNA 传递遗传信息；tRNA 转运氨基酸；rRNA 构成核糖体；少数 RNA 有催化作用（酶） 核苷酸 = 磷酸 + 五碳糖 + 含氮碱基，连接处：磷酸—酯键连五碳糖。核苷 = 五碳糖 + 碱基（无磷酸）。腺苷 = 腺嘌呤 + 核糖。 DNA 多样性：脱氧核苷酸（碱基对）的数目与排列顺序千变万化（数学模型 4n）；特异性：每种 DNA 有特定的排列顺序——DNA 指纹、核酸检测的依据。 新冠病毒核酸（RNA）有特定核苷酸排列顺序，故可用核酸检测判断感染。 生物类型核"}, {"id": "c4", "ch": 4, "chT": "细胞膜与细胞核", "t": "细胞膜与细胞核", "terms": "", "x": "05 细胞膜与细胞核细胞膜的结构和功能 · 细胞器与生物膜系统前置知识 · 细胞核的结构和功能"}, {"id": "c4s0", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.1 细胞膜的功能（三条，教材 P40-41）", "terms": "分隔开 控制物质进出 细胞间的信息交流 胞间连丝 细胞膜上 甲状腺激素（小分子脂溶性）和固醇类激素受体在细胞质或细胞核中", "x": "5.1 细胞膜的功能（三条，教材 P40-41） ①将细胞与外界环境分隔开（保障内部环境相对稳定；也是系统的边界）；②控制物质进出（相对性：控制作用有普遍性和相对性）；③进行细胞间的信息交流。 信息交流三种方式：化学物质随体液运输（激素—靶细胞受体）；相邻细胞膜直接接触（精卵识别与结合）；相邻细胞形成通道（高等植物细胞的胞间连丝）。 受体位置：蛋白质类（大分子）激素受体在靶细胞细胞膜上；甲状腺激素（小分子脂溶性）和固醇类激素受体在细胞质或细胞核中。 台盼蓝染色：活细胞不让染料进入（膜的选择透过性），死细胞被染蓝——鉴别细胞死活。"}, {"id": "c4s1", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.2 细胞膜的制备与成分（教材 P42-43）", "terms": "成熟红细胞 无细胞核和众多细胞器 连续两层 磷脂最丰富 功能越复杂的膜，蛋白质的种类和数量越多", "x": "5.2 细胞膜的制备与成分（教材 P42-43） 选材：哺乳动物成熟红细胞——无细胞壁；无细胞核和众多细胞器，排除其他膜干扰；吸水涨破后差速离心得较纯净细胞膜。 成分探索历程：欧文顿（脂溶性物质更易通过 → 膜由脂质组成）→ 戈特、格伦德尔（红细胞膜脂质铺展单分子层面积为表面积 2 倍 → 磷脂连续两层）→ 丹尼利、戴维森（表面张力低于油水界面 → 推测附有蛋白质）→ 后发现糖蛋白（1950s，纽伯格等）、糖脂、糖被。 成分：脂质（约 50%，磷脂最丰富；动物细胞膜还含胆固醇）+ 蛋白质（约 40%）+ 糖类（约 2%~10%，与蛋白质或脂质结合为糖蛋白/糖脂）。功能越复杂的膜，蛋白质的种类和数量越多。"}, {"id": "c4s2", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.3 流动镶嵌模型（教材 P44-45，必背）", "terms": "磷脂双分子层 镶、嵌、贯穿 细胞膜外表面 流动性 选择透过性 转运蛋白的种类和数量 空间结构的变化", "x": "5.3 流动镶嵌模型（教材 P44-45，必背） 磷脂双分子层构成膜的基本支架，具有流动性；蛋白质分子镶、嵌、贯穿（部分或全部嵌入、贯穿于双层，或附着在表面）——分布是不对称、不均匀的。 糖蛋白（糖被）只分布于细胞膜外表面，与细胞识别、信息传递有关——据此判断膜的内外侧。 流动性实例：变形虫运动与摄食、动物细胞缢裂、细胞融合与受精、巨噬细胞吞噬（胞吞）、分泌蛋白与神经递质释放（胞吐）、质壁分离与复原、细胞吸水膨胀失水皱缩。 选择透过性的结构基础：细胞膜上转运蛋白的种类和数量，或转运蛋白空间结构的变化（教材 P66-72）。"}, {"id": "c4s3", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.4 细胞壁（教材 P48）", "terms": "纤维素和果胶 细胞壁不是系统的边界", "x": "5.4 细胞壁（教材 P48） 主要成分：植物——纤维素和果胶；真菌——几丁质；细菌——肽聚糖。全透性（对进出物质无选择性），细胞壁不是系统的边界。功能：支持和保护。 去壁方法：酶解法（纤维素酶+果胶酶）——植物细胞吸水不涨破的原因是有细胞壁。"}, {"id": "c4s4", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.5 细胞核（教材 P54-58）", "terms": "细胞核是遗传信息库，是细胞代谢和遗传的控制中心 核孔 选择透过性 某种 RNA 的合成及核糖体的形成 结构完整性 核孔数目多、核仁较大 大于 2S 核质比", "x": "5.5 细胞核（教材 P54-58） 功能（黑体）：细胞核是遗传信息库，是细胞代谢和遗传的控制中心。 结构：核膜（双层膜，外膜连内质网、附核糖体）、核孔（大分子如 mRNA、蛋白质进出的通道，具选择透过性，DNA 不能随意出核，大分子进出需能量）、核仁（与某种 RNA 的合成及核糖体的形成有关）、染色质（DNA+蛋白质，易被碱性染料染成深色）。 染色质与染色体：同一物质在细胞不同时期的两种存在状态——染色质（细丝状，利于复制转录）⇄ 染色体（高度螺旋，利于分裂时平均分配）；前期出现、末期变为染色质。 四个经典实验结论：美西螈核移植——肤色由细胞核控制；蝾螈受精卵横缢——细胞核控制分裂分化；变形虫切割/核移植——细胞核是生命活动控制中心；伞藻嫁接与核移植——形态结构建成由核控制（伞帽形状取决于核）。只做嫁接实验不能完全说明核的作用（假说需核移植验证）。 核质依存：精子和哺乳动物成熟红细胞寿命短；细胞需保持结构完整性。代谢旺盛细胞："}, {"id": "c5", "ch": 5, "chT": "细胞器与生物膜系统", "t": "细胞器与生物膜系统", "terms": "", "x": "06 细胞器与生物膜系统细胞器之间的分工合作 · 分泌蛋白的合成与运输 · 细胞的生物膜系统"}, {"id": "c5s0", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.1 细胞质与细胞骨架（教材 P47-50）", "terms": "胶质状 差速离心法 细胞骨架 蛋白质纤维", "x": "6.1 细胞质与细胞骨架（教材 P47-50） 细胞质 = 细胞质基质（胶质状，细胞代谢的主要场所，含水、无机盐、脂质、糖类、氨基酸、核苷酸、多种酶）+ 细胞器。 分离细胞器的方法：差速离心法——细胞核最先沉淀，依次为叶绿体、线粒体与溶酶体、内质网与高尔基体，核糖体最后。 细胞骨架：由蛋白质纤维组成的网架结构；功能：维持细胞形态、锚定支撑细胞器，与细胞运动、分裂、分化及物质运输、能量转化、信息传递等密切相关。"}, {"id": "c5s1", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.2 八大细胞器（识图+功能重点）", "terms": "有氧呼吸的主要场所 光合作用的场所 加工、分类、包装 无膜 合成蛋白质 酸性水解酶 高尔基体 细胞液 动物和低等植物 中心体", "x": "6.2 八大细胞器（识图+功能重点） 细胞器结构功能 线粒体双层膜，内膜折叠成嵴，基质有氧呼吸的主要场所（二、三阶段）；「动力车间」；含少量 DNA（半自主） 叶绿体双层膜，类囊体堆叠成基粒，基质绿色植物光合作用的场所；「养料制造车间、能量转换站」 内质网单层膜，网状粗面：蛋白质合成、加工、运输；光面：脂质合成；增大膜面积 高尔基体单层膜，扁平囊对来自内质网的蛋白质加工、分类、包装；植物：与细胞壁形成有关；「发送站」 核糖体无膜，rRNA+蛋白质合成蛋白质（「生产蛋白质的机器」）；游离型合成胞内蛋白，附着型合成分泌蛋白/膜蛋白 溶酶体单层膜，内含多种酸性水解酶（pH≈5）分解衰老损伤的细胞器；吞噬杀死入侵病毒病菌；「消化车间」；来源于高尔基体 液泡单层膜，内含细胞液（糖类、无机盐、色素、蛋白质）调节植物细胞内环境、保持坚挺 中心体无膜，两个垂直中心粒+周围物质与动物和低等植物细胞的有丝分裂有关 典型细胞：根尖分生区——无叶绿体、"}, {"id": "c5s2", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.3 线粒体与叶绿体对比（高频）", "terms": "蛔虫除外 仅用于暗反应 C3 的还原 半自主性细胞器", "x": "6.3 线粒体与叶绿体对比（高频） 项目线粒体叶绿体 分布真核细胞（蛔虫除外）植物的绿色部分 增大膜面积方式内膜折叠成嵴类囊体堆叠成基粒 完成生理过程有氧呼吸第二、三阶段光合作用全过程 ATP 去路各项生命活动仅用于暗反应 C3 的还原 相同点均双层膜；均能量转换；均既产水又耗水；均含少量 DNA、RNA（半自主性细胞器）；均与自然界碳循环有关 内共生起源学说证据链（支持观点）：①线粒体、叶绿体有与细菌/蓝细菌相似的裸露环状 DNA 和核糖体；③自身 DNA 指导合成少数蛋白质；④内膜与细菌质膜相似、外膜与真核内膜系统相似；⑥以分裂方式繁殖。不支持：②细菌基因组无内含子而线粒体、叶绿体有；⑤拥有的聚合酶恰说明其「自主但依赖核基因」需辩证判断。"}, {"id": "c5s3", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.4 分泌蛋白的合成与运输（教材 P51-52，必背）", "terms": "跨膜 0 层 同位素标记（示踪）法 交通枢纽/转化中心", "x": "6.4 分泌蛋白的合成与运输（教材 P51-52，必背） 途径：核糖体（附着型，氨基酸脱水缩合）→ 内质网（初步加工，肽链折叠组装糖基化）→ 囊泡 → 高尔基体（进一步加工分类包装）→ 囊泡 → 细胞膜 → 胞吐。全过程跨膜 0 层，需能量，不需转运蛋白。 研究方法：同位素标记（示踪）法（3H 标记亮氨酸注入豚鼠胰腺腺泡细胞），放射性依次出现于：核糖体 → 内质网 → 高尔基体 → 细胞膜 → 分泌物。 参与分泌蛋白合成的 4 个细胞器：核糖体、内质网、高尔基体、线粒体；5 个有关结构：+ 细胞膜；3 个直接相关的膜结构：内质网膜、高尔基体膜、细胞膜。 膜面积变化：内质网减少；高尔基体先增后减（基本不变）——膜流的交通枢纽/转化中心；细胞膜增加。 需要内质网和高尔基体加工的蛋白：分泌蛋白（消化酶、抗体、蛋白类激素、细胞因子）、膜蛋白、溶酶体水解酶。"}, {"id": "c5s4", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.5 生物膜系统（教材 P53）", "terms": "核糖体和中心体无膜，不属于生物膜系统 原核生物有生物膜（细胞膜）但无生物膜系统", "x": "6.5 生物膜系统（教材 P53） 组成：细胞膜、核膜 + 细胞器膜（内质网、高尔基体、溶酶体、液泡、线粒体、叶绿体等）。核糖体和中心体无膜，不属于生物膜系统；原核生物有生物膜（细胞膜）但无生物膜系统。 功能（三条必背）：①使细胞具有相对稳定的内部环境，同时在物质运输、能量转换和信息传递中起决定作用；②广阔的膜面积为多种酶提供大量附着位点；③使各类细胞器分工协作、把各种反应分隔开，保证高效有序进行。 结构联系：直接联系（内质网膜→核膜外膜、细胞膜；内质网腔与高尔基体囊泡间接联系）；功能联系：分泌蛋白的合成运输体现。"}, {"id": "c5s5", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.6 实验：用高倍镜观察叶绿体和细胞质的流动（教材 P49）", "terms": "叶绿体运动 光照、室温 亚显微结构", "x": "6.6 实验：用高倍镜观察叶绿体和细胞质的流动（教材 P49） 原理：叶绿体绿色、扁平椭球形，不需染色可直接观察；观察细胞质流动以叶绿体运动为标志。活细胞的细胞质处于不断流动状态（环流式）。 选材：黑藻幼嫩小叶、藓类叶片或菠菜稍带叶肉的下表皮（叶薄、叶绿体少、易观察）。制片后随时保持有水，防止叶绿体变形。 先低倍镜找细胞，再高倍镜观察；黑藻提前在光照、室温下培养可提高流速。同一细胞中叶绿体流动方向一致；若显微镜下顺时针环流，实际也是顺时针（显微镜不上下颠倒旋转方向）。 意义：细胞质流动为细胞内物质运输创造条件，保障生命活动正常进行。 边角小字 显微结构（光镜可见）：细胞壁、细胞质、细胞核、核仁、染色体、叶绿体、线粒体、液泡；亚显微结构（需电镜）：细胞膜、内质网膜、核膜厚度、核糖体、细胞骨架（ 溶酶体膜不被自身水解酶分解的可能机制（教材 P48 思考）：膜成分被修饰使酶无法识别；膜所带电荷/特定基团排斥酶；膜转运 H⁺ 维持内部酸"}, {"id": "c6", "ch": 6, "chT": "细胞的物质输入和输出", "t": "细胞的物质输入和输出", "terms": "", "x": "07 细胞的物质输入和输出渗透作用 · 质壁分离与复原 · 物质跨膜运输的方式 · 影响跨膜运输的因素"}, {"id": "c6s0", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.1 渗透作用（教材 P62，必背第三段）", "terms": "水分子（或其他溶剂分子）通过半透膜的扩散 半透膜 浓度差 选择透过性膜是生物膜 仍然较高 物质的量浓度 先升后降，最终内外相等 先甲高后乙高", "x": "7.1 渗透作用（教材 P62，必背第三段） 概念：水分子（或其他溶剂分子）通过半透膜的扩散。方向：双向移动、总体单向。 条件：①具有半透膜；②膜两侧溶液具有浓度差。 半透膜：某些物质可透过而另一些不能透过的多孔性薄膜；选择透过性膜是生物膜，具有选择透过性（活性依赖）。 动态平衡时：水分子仍在进出（数目相等），液面高的一侧浓度仍然较高（水柱压力所致）；浓度指物质的量浓度而非质量浓度。 漏斗实验：蔗糖酶加入后，若单糖不能透过半透膜→液面继续上升后稳定；若单糖能透过→先升后降，最终内外相等。 经典题：等体积等质量浓度的葡萄糖与蔗糖溶液被半透膜隔开——①只允许水通过：葡萄糖一侧（摩尔浓度高）液面升高；②水与葡萄糖可通过、蔗糖不能：先甲高后乙高（葡萄糖先使甲侧升高，后葡萄糖透过使乙侧浓度增大）。"}, {"id": "c6s1", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.2 动物细胞与植物细胞的吸水和失水", "terms": "质壁分离 原生质层", "x": "7.2 动物细胞与植物细胞的吸水和失水 条件动物细胞（红细胞）成熟植物细胞 外界浓度 = 内部正常无变化正常无变化 外界浓度 &lt; 内部吸水膨胀甚至涨破吸水（膨胀，受细胞壁限制） 外界浓度 &gt; 内部失水皱缩质壁分离 半透膜细胞膜原生质层：细胞膜+液泡膜+两层膜之间的细胞质 成熟植物细胞是一个渗透系统：大液泡 + 半透性原生质层。水进出细胞主要指水经原生质层进出液泡（教材 P63）。"}, {"id": "c6s2", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.3 实验：观察植物细胞的质壁分离与复原（教材 P64-65）", "terms": "原生质层伸缩性大于细胞壁 外表皮 浸润 三次低倍镜观察、自身前后对照 首先发生在细胞的角隅处 外界溶液 主动运输 能自动复原的溶液：KNO₃、甘油、尿素、乙二醇、葡萄糖", "x": "7.3 实验：观察植物细胞的质壁分离与复原（教材 P64-65） 原理：内因——原生质层伸缩性大于细胞壁、原生质层相当于半透膜；外因——外界溶液浓度＞细胞液浓度。 选材：紫色洋葱鳞片叶外表皮（有大液泡、细胞液紫色便于观察）；黑藻（叶绿体绿色可观察）；洋葱内表皮可发生但不宜观察。 试剂：0.3 g/mL 蔗糖溶液——既明显质壁分离又不致细胞失水死亡。引流法：滴蔗糖/清水+吸水纸吸引，重复几次，目的是让细胞浸润在相应溶液中。 三次低倍镜观察、自身前后对照：正常态 → 质壁分离 → 复原。第二次观察时质壁分离首先发生在细胞的角隅处；第一次观察不能省略。 变化分析：失水越多 → 液泡变小、颜色变深、细胞液浓度变大、吸水能力越强；细胞体积略缩小（壁限制）。原生质层与细胞壁之间充满外界溶液（细胞壁全透）。 自动复原：外界浓度＞细胞液浓度先失水质壁分离，但 K⁺、NO₃⁻ 等被主动运输吸收进入细胞，细胞液浓度升高后渗透吸水复原。能自动复原的溶"}, {"id": "c6s3", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.4 物质跨膜运输的方式（离子与小分子，教材 P66-70）", "terms": "小部分水、气体（O2、CO2）、脂溶性物质（苯、乙醇、甘油、脂肪酸、尿素、胆固醇、维生素 D、性激素） 红细胞吸收葡萄糖 耗能 载体蛋白 自身构象（空间结构）改变 不与运输分子结合 主动选择吸收 协同转运（离子梯度动力，如 Na⁺-葡萄糖同向转运） 流动性", "x": "7.4 物质跨膜运输的方式（离子与小分子，教材 P66-70） 方式方向能量转运蛋白影响因素实例 自由扩散高→低（顺浓度）不耗能不需要浓度差小部分水、气体（O2、CO2）、脂溶性物质（苯、乙醇、甘油、脂肪酸、尿素、胆固醇、维生素 D、性激素） 协助扩散高→低不耗能载体蛋白或通道蛋白浓度差、转运蛋白数量红细胞吸收葡萄糖、水经水通道蛋白、K⁺ 经 K⁺ 通道、Na⁺ 内流、K⁺ 外流 主动运输低→高（逆浓度）耗能载体蛋白能量、载体蛋白数量大多数离子、肾小管重吸收葡萄糖、小肠吸收葡萄糖与氨基酸 载体蛋白：只容许与自身结合部位相适应的分子/离子通过，转运时自身构象（空间结构）改变，如 CFTR 蛋白转运 Cl⁻（氯离子大小与性质与其结合部位相适应）。 通道蛋白：只容许大小和电荷相适应的分子通过，不与运输分子结合；水通道蛋白、离子通道。 主动运输意义：保证细胞按生命活动需要，主动选择吸收所需营养物质，排出代谢废物和对细胞有害的物质（教材 "}, {"id": "c6s4", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.5 影响跨膜运输的因素", "terms": "", "x": "7.5 影响跨膜运输的因素 物质浓度：自由扩散——在一定范围内速率随浓度增大而增大后达平台；协助扩散/主动运输——需转运蛋白，会饱和。 氧气浓度：自由扩散/协助扩散不受影响；主动运输在有氧呼吸范围内随 O₂ 增大而增大（能量来自呼吸作用），无氧时仍有一定速率（无氧呼吸供能）。 温度：影响膜流动性、酶活性、呼吸供能。载体蛋白数量：限制最大速率。 边角小字 教材 P74-T2：主动运输的机理图——ATP 水解使载体蛋白磷酸化而改变构象（膜上 Na⁺-K⁺ 泵，每消耗 1 个 ATP 运出 3 个 Na⁺、运入 2 个 K⁺）。 小肠上皮细胞吸收葡萄糖：肠腔侧 Na⁺-葡萄糖同向协同转运（主动运输，动力来自 Na⁺ 电化学梯度）；基底侧葡萄糖经载体协助扩散出细胞；Na⁺ 由 Na-K 泵（ATP）泵出。教材 P69 强调：小肠液中氨基酸、葡萄糖浓度远低于细胞内浓度。 蔗糖运入筛管：H⁺ 泵（①）消耗 ATP 建立 H⁺ 梯度，蔗糖- "}, {"id": "c7", "ch": 7, "chT": "酶与 ATP", "t": "酶与 ATP", "terms": "", "x": "08 酶与 ATP降低化学反应活化能的酶 · 细胞的能量「货币」ATP"}, {"id": "c7s0", "ch": 7, "chT": "酶与 ATP", "t": "8.1 酶的本质与作用机理（教材 P78-80）", "terms": "降低化学反应的活化能 毕希纳 萨姆纳 切赫、奥特曼 有机物，绝大多数是蛋白质，少数是 RNA", "x": "8.1 酶的本质与作用机理（教材 P78-80） 作用：催化；机理：降低化学反应的活化能（分子从常态转变为容易发生反应的活跃状态所需的能量）。与加热（给反应物能量）机理不同。 本质探索（课本 P79）：巴斯德（发酵与活酵母细胞有关）→ 李比希（酵母死亡裂解后物质起作用）→ 毕希纳（获得无细胞提取液「酿酶」）→ 萨姆纳（提取脲酶结晶，证明是蛋白质）→ 切赫、奥特曼（少数 RNA 也有催化功能）。 酶的概念：活细胞产生的、具有催化作用的有机物，绝大多数是蛋白质，少数是 RNA。 合成原料：氨基酸（CHON）或核糖核苷酸（CHONP）；合成场所：核糖体（蛋白质类）或细胞核（真核生物 RNA 类）；作用场所：细胞内外、体外均可。 鉴定蛋白质类酶：双缩脲试剂（紫色）。"}, {"id": "c7s1", "ch": 7, "chT": "酶与 ATP", "t": "8.2 酶的特性与验证实验", "terms": "高效性 专一性 碘液 斐林试剂 作用条件温和 低温抑制活性但空间结构稳定，升温可恢复 不改变平衡点", "x": "8.2 酶的特性与验证实验 高效性：与无机催化剂相比降低活化能更显著——H₂O₂ 实验：3、4 号对照（Fe³⁺ vs 过氧化氢酶），气泡多、卫生香复燃猛。 专一性：每种酶只能催化一种或一类化学反应。两套方案：①「一底物多酶」淀粉+唾液淀粉酶/蔗糖酶，用碘液检测（蔗糖不与碘反应，不能用碘液检蔗糖是否水解）；②「一酶多底物」淀粉/蔗糖+淀粉酶，用斐林试剂（60 ℃ 保温、沸水浴；不能用碘液，因为碘液无法检测蔗糖是否水解）。 作用条件温和：适宜温度、pH。过酸过碱、高温破坏空间结构永久失活；低温抑制活性但空间结构稳定，升温可恢复——酶保存：低温、最适 pH。 酶促反应原理与催化剂共性：①改变化学反应速率而本身不被消耗；②只能缩短达到平衡的时间，不改变平衡点；③反应前后性质数量不变（但酶自身需要更新）；④都降低活化能。"}, {"id": "c7s2", "ch": 7, "chT": "酶与 ATP", "t": "8.3 探究温度、pH 对酶活性的影响（实验设计细节）", "terms": "先各自保温 5 min 再混合 不能用 H₂O₂ 酶 不能用斐林试剂 再 不能用淀粉酶 单位时间内底物减少量或产物生成量 温度、pH 通过影响酶活性 酶浓度、底物浓度通过影响酶与底物接触面积", "x": "8.3 探究温度、pH 对酶活性的影响（实验设计细节） 实验要点与「不能」 温度（淀粉+淀粉酶+碘液）冰浴（不变蓝）0 ℃、60 ℃（变蓝浅/消失）、沸水浴（变蓝）三组；先各自保温 5 min 再混合（防止未达预设温度即反应）；沸水浴后自来水冲凉再加碘（100 ℃ 直链淀粉螺旋结构破坏遇碘不变蓝；防止碘蒸发）；不能用 H₂O₂ 酶（加热本身促进 H₂O₂ 分解）；不能用斐林试剂（需加热检测，低温酶活性恢复造成错觉） pH（H₂O₂+过氧化氢酶）先加酶+不同 pH 溶液（蒸馏水/HCl/NaOH）再加底物（否则未调 pH 反应已结束）；不能用淀粉酶（淀粉在酸性下自行水解；斐林试剂与酸反应干扰；碱性环境碘与碱反应干扰） 酶活性：酶催化特定化学反应的能力，用单位时间内底物减少量或产物生成量表示。 影响因素分两类：温度、pH 通过影响酶活性影响反应速率；酶浓度、底物浓度通过影响酶与底物接触面积影响速率，不影响酶活性。"}, {"id": "c7s3", "ch": 7, "chT": "酶与 ATP", "t": "8.4 激活剂与抑制剂（课件拓展）", "terms": "Km 增大、Vmax 不变 Km 不变、Vmax 降低 Km 减小、Vmax 降低 酶与底物的亲和力", "x": "8.4 激活剂与抑制剂（课件拓展） 激活剂：提高酶活性的物质（无机离子如 Mg²⁺、K⁺、Cl⁻；有机分子如维生素 C、半胱氨酸）。酶原需激活剂激活后才有活性。 抑制剂三种：竞争性抑制——抑制剂与底物结构相似，竞争活性中心；Km 增大、Vmax 不变，增加底物浓度可解除。非竞争性抑制——结合活性中心以外必需基团；Km 不变、Vmax 降低，加底物不能解除。反竞争性抑制——只结合酶-底物复合物（ES）；Km 减小、Vmax 降低。 Km（米氏常数）：反应速率达最大速率一半时的底物浓度，反映酶与底物的亲和力（越小亲和力越大）。"}, {"id": "c7s4", "ch": 7, "chT": "酶与 ATP", "t": "8.5 ATP（教材 P87-89）", "terms": "A—P~P~P 特殊的化学键 ATP 去掉两个磷酸基团（即 AMP，腺苷一磷酸）是 RNA 的基本组成单位之一 直接的能源物质 能口服 转化迅速且处于动态平衡 不可逆反应 能量不可逆 货币", "x": "8.5 ATP（教材 P87-89） 结构简式 A—P~P~P：A=腺苷（腺嘌呤+核糖）；P=磷酸基团；—普通化学键；~特殊的化学键（远离 A 的那个易断裂，水解释能约 30.54 kJ/mol）。元素：C、H、O、N、P。 ATP 彻底水解产物：磷酸、核糖、腺嘌呤；ATP 去掉两个磷酸基团（即 AMP，腺苷一磷酸）是 RNA 的基本组成单位之一（腺嘌呤核糖核苷酸）。 功能：直接的能源物质——糖类、脂肪中能量稳定不能直接利用，须转化为 ATP 中活跃化学能。ATP 是物质不是能量；能口服（被消化分解，意义不大）。 ATP 含量少但供能及时持续：ATP 与 ADP 转化迅速且处于动态平衡；该转化机制是生物界的共性。 ATP ⇄ ADP + Pi + 能量：不可逆反应——酶不同（水解酶/合成酶）、场所不同、物质可逆而能量不可逆。合成能量来源：动物——呼吸作用；植物——呼吸作用+光合作用。 能量流通：吸能反应与 ATP 水解相联系；放"}, {"id": "c8", "ch": 8, "chT": "细胞呼吸", "t": "细胞呼吸", "terms": "", "x": "09 细胞呼吸探究酵母菌的呼吸方式 · 有氧呼吸 · 无氧呼吸 · 细胞呼吸原理的应用"}, {"id": "c8s0", "ch": 8, "chT": "细胞呼吸", "t": "9.1 细胞呼吸的概念与实质（教材 P90）", "terms": "有机物在细胞内经过一系列的氧化分解，生成二氧化碳或其他产物，释放能量并生成 ATP 的过程 条件温和 逐步释放", "x": "9.1 细胞呼吸的概念与实质（教材 P90） 细胞呼吸（黑体）：有机物在细胞内经过一系列的氧化分解，生成二氧化碳或其他产物，释放能量并生成 ATP 的过程。实质：氧化分解有机物、释放能量。 与体外燃烧相比：有氧呼吸条件温和；能量逐步释放；一部分储存在 ATP 中。意义：能量逐步转移到 ATP、充分利用；缓慢有序释放维持细胞相对稳定。"}, {"id": "c8s1", "ch": 8, "chT": "细胞呼吸", "t": "9.2 探究酵母菌细胞的呼吸方式（教材 P91-92）", "terms": "兼性厌氧 对比实验法 澄清石灰水变浑浊 溴麝香草酚蓝水溶液：蓝→绿→黄 酸性（浓硫酸）重铬酸钾：橙色→灰绿色 NaOH 溶液 先封口放置一段时间耗尽 O₂ 煮沸灭菌 过滤取滤液", "x": "9.2 探究酵母菌细胞的呼吸方式（教材 P91-92） 酵母菌：真核单细胞真菌，兼性厌氧，繁殖（出芽生殖为主），细胞壁+细胞膜+细胞核+液泡+线粒体。 方法：对比实验法（有氧、无氧装置相互对照）。检测 CO₂：澄清石灰水变浑浊；溴麝香草酚蓝水溶液：蓝→绿→黄（由变黄时间长短判断 CO₂ 多少）。检测酒精：酸性（浓硫酸）重铬酸钾：橙色→灰绿色。 装置要点：空气先经 NaOH 溶液（除去 CO₂，排除干扰）；B 瓶（无氧组）先封口放置一段时间耗尽 O₂ 再连通检测瓶；培养液煮沸灭菌（排除杂菌呼吸干扰）；检测酒精需过滤取滤液（培养液浑浊有色会干扰，且葡萄糖可被重铬酸钾氧化产生类似颜色）。 有氧组气泵间歇通空气保证供氧；无氧组可加石蜡油/植物油液封。"}, {"id": "c8s2", "ch": 8, "chT": "细胞呼吸", "t": "9.3 有氧呼吸（教材 P92-93）", "terms": "细胞质基质 2 丙酮酸 + [H](NADH) 线粒体基质 H₂O 线粒体内膜 O₂ 大量 ATP", "x": "9.3 有氧呼吸（教材 P92-93） 阶段场所反应物 → 产物能量 第一阶段细胞质基质葡萄糖 → 2 丙酮酸 + [H](NADH)少量 ATP（少量能量） 第二阶段线粒体基质丙酮酸 + H₂O → CO₂ + [H]少量 ATP 第三阶段线粒体内膜[H] + O₂ → H₂O大量 ATP（最多） 总反应式C6H12O6 + 6O2 + 6H2O →(酶) 6CO2 + 12H2O + 能量 元素去向CO2 中 O：来自葡萄糖和水H2O 中 O：来自 O2；H：来自葡萄糖和水 转移路径C：葡萄糖 → 丙酮酸 → CO218O2 → H218O（第三阶段产物） [H] 是 NADH（还原型辅酶Ⅰ），来源于第一、二阶段，只在第三阶段被消耗（与 O₂ 结合）。 有氧呼吸第三阶段机理：电子传递链（NADH→…→O₂），电子传递释放能量驱动 H⁺ 泵至膜间隙建立梯度，H⁺ 经 ATP 合酶回流推动 ATP 合成；电子供体 NADH、受体"}, {"id": "c8s3", "ch": 8, "chT": "细胞呼吸", "t": "9.4 无氧呼吸（教材 P94）", "terms": "存留在酒精或乳酸中 控制酶合成的基因不同", "x": "9.4 无氧呼吸（教材 P94） 产酒精型C6H12O6 →(酶) 2C2H5OH + 2CO2 + 少量能量代表：酵母菌、大多数植物细胞 产乳酸型C6H12O6 →(酶) 2C3H6O3 + 少量能量代表：人及动物细胞、马铃薯块茎、甜菜块根、玉米胚、乳酸菌 共同点场所全程在细胞质基质第一阶段与有氧呼吸相同；只在第一阶段产 ATP 无氧呼吸释放能量少的原因：葡萄糖中大部分能量存留在酒精或乳酸中；无氧呼吸释放的能量大部分（其余部分）以热能散失。 不同生物无氧呼吸产物不同的直接原因：酶种类不同；根本原因：控制酶合成的基因不同。"}, {"id": "c8s4", "ch": 8, "chT": "细胞呼吸", "t": "9.5 呼吸方式的判断（高频方法）", "terms": "O₂ 吸收量 = CO₂ 释放量 CO₂ &gt; O₂ 遮光", "x": "9.5 呼吸方式的判断（高频方法） 据产物：产 H₂O → 一定有有氧呼吸；耗 O₂ → 一定有有氧呼吸；无 CO₂ → 一定为产乳酸无氧呼吸（或死亡）。 据气体：O₂ 吸收量 = CO₂ 释放量 → 只进行有氧呼吸（或同时有产乳酸无氧呼吸）；CO₂ &gt; O₂ → 有氧呼吸 + 产酒精无氧呼吸（差值 = 无氧呼吸释放的 CO₂，差值的一半 = 酒精量）；只无 CO₂ 无 O₂ → 产乳酸无氧呼吸（未死）。 液滴移动法（装置一 NaOH 吸收 CO₂：左移距离 = 有氧呼吸耗 O₂ 量；装置二清水对照：左移 = 耗 O₂ − 放 CO₂，右移 = 放 CO₂ − 耗 O₂）。设死种子（等量灭活）对照排除气压温度物理因素；装置需遮光（绿色材料）；种子需消毒、灭菌。 底物为脂肪时：耗 O₂ &gt; 释放 CO₂（脂肪 H 多 O 少）。"}, {"id": "c8s5", "ch": 8, "chT": "细胞呼吸", "t": "9.6 影响细胞呼吸的因素与应用", "terms": "温度（影响酶活性） R 点：有氧呼吸弱+无氧呼吸被抑制，总呼吸最弱，有机物消耗最少——果蔬储存最适 稻田定期排水（避免无氧呼吸产酒精烂根）", "x": "9.6 影响细胞呼吸的因素与应用 内因：遗传因素（不同生物呼吸速率不同；同一植物生殖器官＞营养器官；幼苗、花期速率高）。 外因：温度（影响酶活性）、O₂ 浓度、CO₂ 浓度（高浓度抑制呼吸）、含水量。 O₂ 浓度曲线关键点：Q 点只无氧呼吸；P 点无氧呼吸消失；QP 段（不含端点）两种呼吸并存；R 点：有氧呼吸弱+无氧呼吸被抑制，总呼吸最弱，有机物消耗最少——果蔬储存最适。 应用（背诵）：包扎伤口用透气纱布（抑制厌氧菌）；酿酒先通气后密封；花盆松土（促进根有氧呼吸、利于无机盐吸收）；储粮晒干、果蔬低温低氧高 CO₂；破伤风杆菌厌氧需清创；提倡慢跑（避免乳酸堆积）；稻田定期排水（避免无氧呼吸产酒精烂根）；长途运输蔬菜充 N₂、调至 R 点对应 O₂ 浓度。 运动时体内主要呼吸方式仍是有氧呼吸；剧烈运动骨骼肌产乳酸——「能量由乳酸分解提供」×（能量来自葡萄糖分解）。 边角小字 教材 P92 科学方法：对比实验——设置两个或两个以上实"}, {"id": "c9", "ch": 9, "chT": "光合作用与能量转化", "t": "光合作用与能量转化", "terms": "", "x": "10 光合作用与能量转化捕获光能的色素和结构 · 光合作用的原理和应用 · 化能合成作用"}, {"id": "c9s0", "ch": 9, "chT": "光合作用与能量转化", "t": "10.1 叶绿体与光合色素（教材 P97-99）", "terms": "无水乙醇（有机溶剂） 层析液中溶解度不同 SiO₂ CaCO₃ 单层尼龙布 细、直、齐 滤液细线不能触及层析液 胡萝卜素（橙黄色，最快）→ 叶黄素（黄色）→ 叶绿素 a（蓝绿色，最宽/含量最多）→ 叶绿素 b（黄绿色） Mg 吸收、传递、转化光能 红光和蓝紫光", "x": "10.1 叶绿体与光合色素（教材 P97-99） 色素提取：色素能溶解在无水乙醇（有机溶剂）中；分离：色素在层析液中溶解度不同，溶解度高者随层析液在滤纸上扩散得快。 步骤细节：加 SiO₂（研磨充分）、CaCO₃（防止研磨中色素被破坏）；研磨迅速（防乙醇挥发）充分（破坏叶绿体释出色素）；过滤用单层尼龙布（滤纸吸附色素、色素分子不易透过）；滤纸条剪两角（防边缘扩散过快使色素带不齐）；画滤液细线要细、直、齐（起点相同），干后重复画 1~2 次（积累色素）；滤液细线不能触及层析液（色素会溶入层析液）；试管口塞棉塞（防层析液挥发）。 结果（从上到下）：胡萝卜素（橙黄色，最快）→ 叶黄素（黄色）→ 叶绿素 a（蓝绿色，最宽/含量最多）→ 叶绿素 b（黄绿色）。类胡萝卜素占 1/3（含 C、H 或 C、H、O），叶绿素占 2/3（含 C、H、O、N、Mg）。 色素功能：吸收、传递、转化光能；叶绿素主要吸收红光和蓝紫光，类胡萝卜素主要吸收蓝紫"}, {"id": "c9s1", "ch": 9, "chT": "光合作用与能量转化", "t": "10.2 光合作用的探索（教材 P100-102）", "terms": "水的光解与糖的合成不是同一反应 鲁宾、卡门（同位素标记法，对比实验） 全部来自水 卡尔文（小球藻、¹⁴CO₂、双向纸层析） 煮沸乙醇杀死小球藻", "x": "10.2 光合作用的探索（教材 P100-102） 恩格尔曼：水绵+好氧细菌，极细光束照射——好氧细菌只向叶绿体被光束照射部位集中，全部曝光时细菌分布在叶绿体所有受光部位。结论：①O₂ 由叶绿体释放，叶绿体是光合作用场所；②叶绿体主要吸收红光和蓝紫光。 希尔反应：离体叶绿体加铁盐（有 H₂O 无 CO₂），光照下放 O₂——说明水的光解与糖的合成不是同一反应；但不能证明 O₂ 中氧全部来自水（未排除叶绿体其他物质干扰、未直接观察氧的转移）。 鲁宾、卡门（同位素标记法，对比实验）：H₂18O 组放 18O₂，C18O₂ 组放 O₂——证明光合作用释放的 O₂ 全部来自水。 卡尔文（小球藻、¹⁴CO₂、双向纸层析）：缩短取样时间至 0.5 s，¹⁴C 首先出现在 3-磷酸甘油酸（C₃）→ 5 s 出现在 RuBP（C₅）和六碳糖——C 的转移路径：CO₂ → C₃ →（CH₂O）/C₅。取样后立即煮沸乙醇杀死小球藻终止反应。 卡尔文"}, {"id": "c9s2", "ch": 9, "chT": "光合作用与能量转化", "t": "10.3 光合作用的过程（教材 P103-104，必背）", "terms": "类囊体薄膜 叶绿体基质 不直接需光但依赖光反应产物 2C₃ 活跃化学能 稳定化学能 水的光解 主动运输 既消耗水又产生水 只用于暗反应", "x": "10.3 光合作用的过程（教材 P103-104，必背） 项目光反应暗反应（卡尔文循环） 场所类囊体薄膜叶绿体基质 条件光、色素、酶、H₂O多种酶、CO₂；不直接需光但依赖光反应产物 物质变化①水的光解：H₂O → [H](NADPH) + O₂；②ATP 合成（ADP+Pi+能量→ATP）①CO₂ 固定：CO₂ + C₅ → 2C₃；②C₃ 的还原：C₃ + [H] + ATP →（CH₂O）+ C₅ 能量变化光能 → NADPH、ATP 中活跃化学能活跃化学能 → 有机物中稳定化学能 联系光反应为暗反应提供 NADPH、ATP；暗反应为光反应提供 ADP、Pi、NADP⁺（相互依存、不可分割） 唯一不需要酶催化的反应：水的光解。 移动方向：NADPH、ATP 由类囊体薄膜 → 叶绿体基质；ADP、Pi、NADP⁺ 由基质 → 类囊体薄膜。 NADPH 作用：①作还原剂还原 C₃；②储存部分能量。ATP 作用：为 C₃ 还原供"}, {"id": "c9s3", "ch": 9, "chT": "光合作用与能量转化", "t": "10.4 条件改变时物质量的短期变化（高频题型）", "terms": "C₃ 分子数是 C₅ 的 2 倍", "x": "10.4 条件改变时物质量的短期变化（高频题型） 条件改变（短暂时间）NADPH/[H]、ATPC₃C₅(CH₂O) 光照减弱 / 停止光照（阴天）减少增加减少减少 CO₂ 供应减少（气孔关闭/降温）增加减少增加减少 光照增强（CO₂ 不变）增加减少增加增加 分析思路：先判断受影响的环节（光反应 or 暗反应），再从「生成速率 vs 消耗速率」比较含量变化。 暗反应稳定时，C₃ 分子数是 C₅ 的 2 倍（1
