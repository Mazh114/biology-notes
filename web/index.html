胞和细胞产物构成；②细胞是一个相对独立的单位，既有自己的生命，又对与其他细胞共同组成的整体生命起作用；③新细胞是由老细胞分裂产生的。 意义：揭示细胞的统一性和生物体结构的统一性（证明动植物有共同的结构基础与亲缘关系）。 局限：未涉及原核生物、真菌、病毒；未揭示细胞的多样性。 启示：科学发现离不开技术支持；理论经修正补充而完善；运用了不完全归纳法——结论可信但可能有例外。"}, {"id": "c0s1", "ch": 0, "chT": "走近细胞", "t": "1.2 生命系统的结构层次", "terms": "个体 → 种群 → 群落 → 生态系统 → 生物圈 细胞层次即个体层次 非生物的环境", "x": "1.2 生命系统的结构层次 层次：细胞 → 组织 → 器官 → 系统 → 个体 → 种群 → 群落 → 生态系统 → 生物圈。 植物没有「系统」层次（六大器官直接构成个体）；单细胞生物没有组织、器官、系统层次，细胞层次即个体层次；病毒没有结构层次（不属于生命系统的任何层次，但属于生物）。 生态系统包括生物群落与非生物的环境（阳光、空气、水等），仍属于生命系统。 细胞是最基本的生命系统：单细胞生物一个细胞完成全部生命活动；多细胞生物依赖各种分化的细胞密切合作。"}, {"id": "c0s2", "ch": 0, "chT": "走近细胞", "t": "1.3 病毒", "terms": "核酸（DNA 或 RNA）+ 蛋白质 寄生在活细胞 结构不稳定、易变异", "x": "1.3 病毒 结构：核酸（DNA 或 RNA）+ 蛋白质；无细胞结构，必须寄生在活细胞中才能增殖（培养病毒须用活细胞/活鸡胚，不能用普通培养基）。 分类：DNA 病毒（T2 噬菌体、乙肝病毒）；RNA 病毒（HIV、流感病毒、SARS 冠状病毒、新冠病毒）。RNA 病毒遗传物质一般为单链，结构不稳定、易变异，疫苗研发难度大。 增殖过程：吸附 → 注入核酸（噬菌体注射式；动物病毒多经膜融合或胞吞）→ 合成核酸与蛋白质 → 组装 → 释放。合成场所利用宿主细胞的核糖体、原料和能量。"}, {"id": "c0s3", "ch": 0, "chT": "走近细胞", "t": "1.4 真核细胞与原核细胞", "terms": "拟核 核糖体 肽聚糖 二分裂 同时同地进行 叶绿素和藻蓝素 没有叶绿体 质粒 绝大多数原核生物 富营养化（N、P 含量高） 64 ÷ 16 = 4 16 ÷ 4 = 4", "x": "1.4 真核细胞与原核细胞 比较项原核细胞（蓝细菌、细菌等）真核细胞（动植物、真菌） 细胞核拟核：无核膜、核仁，大型环状 DNA 集中分布有核膜包被的细胞核，染色质（DNA+蛋白质） 染色体无（DNA 不与蛋白质结合）有 细胞器只有核糖体核糖体及其他多种复杂细胞器 细胞壁主要成分肽聚糖（支原体无细胞壁）植物：纤维素和果胶；真菌：几丁质 分裂方式二分裂（不遵循孟德尔遗传定律）有丝分裂、无丝分裂、减数分裂 转录与翻译同时同地进行（边转录边翻译）先后不同空间进行（核内转录、质中翻译） 共同点均有细胞膜、核糖体、DNA 和 RNA，遗传物质均为 DNA；都通过 ATP 供能 蓝细菌（原核）：含叶绿素和藻蓝素，能进行光合作用，但没有叶绿体。 质粒：小型环状 DNA，存在于绝大多数原核生物中，酵母菌中也存在；是基因工程的常用载体。 常见原核生物：蓝细菌（念珠藻、色球藻、颤藻、发菜）、大肠杆菌、乳酸菌、硝化细菌、醋酸杆菌、根瘤菌、支原体（原核"}, {"id": "c1", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "细胞的元素与化合物 · 水和无机盐", "terms": "", "x": "02 细胞的元素与化合物 · 水和无机盐组成细胞的元素 · 检测生物组织中的糖类、脂肪和蛋白质 · 细胞中的水和无机盐"}, {"id": "c1s0", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.1 组成细胞的元素", "terms": "C 是最基本元素 O 干重含量最多的是 C", "x": "2.1 组成细胞的元素 大量元素：C、H、O、N、P、S、K、Ca、Mg；微量元素：Fe、Mn、Zn、Cu、B、Mo。 C 是最基本元素（碳链构成生物大分子骨架）；鲜重含量最多的是 O，干重含量最多的是 C；占细胞鲜重最多的化合物是水，最多的有机物是蛋白质。 生物界与非生物界的统一性：元素种类大体相同；差异性：元素含量相差很大。"}, {"id": "c1s1", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.2 检测生物组织中的有机物（必背数据）", "terms": "斐林试剂 浅蓝色 → 棕色 → 砖红色（Cu2O） 双缩脲试剂 紫色 橘黄色 红色 蔗糖不是还原糖 甘蔗、甜菜（蔗糖非还原糖）、西瓜、番茄（红色干扰）均不合适 含两个及以上肽键", "x": "2.2 检测生物组织中的有机物（必背数据） 待测物试剂与配制操作与颜色反应 还原糖斐林试剂：甲液 0.1 g/mL NaOH + 乙液 0.05 g/mL CuSO4，现配现用、等量混合50~65 ℃ 水浴加热约 2 min：浅蓝色 → 棕色 → 砖红色（Cu2O） 蛋白质双缩脲试剂：A 液 0.1 g/mL NaOH 1 mL + B 液 0.01 g/mL CuSO4 3~4 滴不加热，先加 A 液再加 B 液，呈紫色 脂肪苏丹Ⅲ染液（橘黄色）或苏丹Ⅳ染液（红色）切片法需显微镜观察；匀浆法可直接观察，不需显微镜 淀粉碘液变蓝 还原糖：葡萄糖、果糖、麦芽糖、乳糖；蔗糖不是还原糖。选材要求「组织颜色浅、富含待测物」——甘蔗、甜菜（蔗糖非还原糖）、西瓜、番茄（红色干扰）均不合适，常用苹果、梨的匀浆。 双缩脲试剂检测蛋白质要求分子中含两个及以上肽键——二肽不能被检测。"}, {"id": "c1s2", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.3 细胞中的水", "terms": "自由水 结合水 升高 → 代谢旺盛 降低 → 抗逆性（抗寒、抗旱）增强 比热容大", "x": "2.3 细胞中的水 存在形式：自由水（良好溶剂、参与反应、运输物质）与结合水（细胞结构的重要组成成分，如与蛋白质、多糖结合）。 自由水/结合水比值：升高 → 代谢旺盛；降低 → 抗逆性（抗寒、抗旱）增强。冬眠动物、越冬植物比值下降。 水的性质：极性分子（良好的溶剂）、液体（氢键缔合）、比热容大（恒温、缓冲温度变化）。 产生水的反应：氨基酸脱水缩合、ATP 合成、有氧呼吸第三阶段、暗反应（糖类合成）；消耗水的反应：多肽水解、有氧呼吸第二阶段、光反应（水的光解）、光合作用的光反应阶段。"}, {"id": "c1s3", "ch": 1, "chT": "细胞的元素与化合物 · 水和无机盐", "t": "2.4 细胞中的无机盐", "terms": "离子 血 Ca²⁺过低→抽搐，过高→肌无力 Fe²⁺ 结合水被破坏后细胞死亡", "x": "2.4 细胞中的无机盐 存在形式：主要以离子形式存在（少量构成化合物，如 Fe2+ 于血红蛋白、Mg 于叶绿素、P 于核苷酸）。 功能：①复杂化合物的组成成分；②维持细胞和生物体的生命活动；③维持细胞的酸碱平衡；④维持细胞的渗透压与形态。 缺乏症：血 Ca²⁺过低→抽搐，过高→肌无力；缺 Fe → 缺铁性贫血；缺 Mg → 叶片变黄；缺 B → 「花而不实」；缺 I → 甲状腺肿大（大脖子病）。 边角小字 血红素：含 Fe²⁺ 的卟啉环辅基；血红蛋白 = 珠蛋白 + 4 个血红素。生物体内没有含 Fe 的氨基酸，Fe 是肽链折叠后与辅基结合的。 等质量的脂肪比糖类含 H 多、含 O 少，氧化分解释放能量多、耗 O 多——脂肪是良好的储能物质。 结合水与抗逆性的关系：结合水比例越高，原生质黏度越大、代谢越慢、抗逆性越强。 易错警示 斐林试剂需现配现用、甲乙液混合后加入，不能像双缩脲那样先后单独加入。 不加热时还原糖与斐林试剂反应极"}, {"id": "c2", "ch": 2, "chT": "糖类和脂质", "t": "糖类和脂质", "terms": "", "x": "03 糖类和脂质细胞中的糖类 · 细胞中的脂质 · 种子成熟与萌发过程中的物质变化"}, {"id": "c2s0", "ch": 2, "chT": "糖类和脂质", "t": "3.1 糖类（主要能源物质）", "terms": "纤维素不供能 几丁质（壳多糖）", "x": "3.1 糖类（主要能源物质） 类别代表物分布与功能 单糖葡萄糖（细胞重要能源）、果糖、半乳糖；核糖、脱氧核糖（构成核酸）不能再水解；葡萄糖是细胞呼吸最常利用的底物 二糖植物：蔗糖（葡萄糖+果糖）、麦芽糖（两分子葡萄糖）；动物：乳糖须水解为单糖才能被吸收；蔗糖、麦芽糖是运输/储存形式 多糖植物：淀粉（储能）、纤维素（细胞壁成分）；动物：糖原（肝糖原、肌糖原）淀粉储能、可水解供能；纤维素不供能，构成植物细胞壁；糖原暂时储能 几丁质（壳多糖）：广泛存在于甲壳类动物和昆虫的外骨骼、真菌的细胞壁中；可用于制作人造皮肤、缝合线等，含 N 元素。"}, {"id": "c2s1", "ch": 2, "chT": "糖类和脂质", "t": "3.2 脂质（C、H、O 为主，有的含 N、P）", "terms": "储能物质 所有细胞膜（生物膜） 脂质的运输 钙和磷", "x": "3.2 脂质（C、H、O 为主，有的含 N、P） 类别功能备注 脂肪①细胞内良好的储能物质；②保温；③缓冲、减压，保护内脏等质量产能比糖类多、耗 O 多；动物脂肪饱和程度高、熔点高 磷脂构成所有细胞膜（生物膜）的重要成分脑、卵细胞、大豆中丰富 固醇胆固醇：构成动物细胞膜的重要成分、参与血液中脂质的运输；性激素：促进生殖器官发育与生殖细胞形成；维生素 D：促进肠道对钙和磷的吸收胆固醇过高会导致血管堵塞，但其本身是必需成分，不可完全缺乏"}, {"id": "c2s2", "ch": 2, "chT": "糖类和脂质", "t": "3.3 种子成熟与萌发过程中的物质变化（课件拓展）", "terms": "转变为脂肪 水解并转变为糖类 增加", "x": "3.3 种子成熟与萌发过程中的物质变化（课件拓展） 油料种子（花生、油菜）成熟过程中：光合产物（糖类）转变为脂肪储存，游离脂肪酸减少、脂肪增多，磷脂含量上升。 种子萌发时：脂肪水解并转变为糖类（经过乙醛酸循环途径），自由水含量增多、呼吸作用增强。 萌发初期干重先增加（吸收 O2 与 H2O 参与氧化，质量来自氧）后持续减少（呼吸消耗）。 边角小字 糖类「甜」与「不甜」与是否为还原糖无关；蔗糖水解产物（葡萄糖+果糖）都是还原糖。 脂肪检测试剂同样可用苏丹Ⅲ/Ⅳ染色后显微镜观察颗粒大小与分布。 植物细胞储能：淀粉；动物细胞储能：糖原和脂肪。纤维素虽然由葡萄糖构成，但不能被人消化（无相应酶）。 易错警示 「糖类是主要能源物质，脂肪是主要储能物质」不要混淆。 所有活细胞都含糖类与脂质；但并非所有细胞都含脂肪（磷脂是膜成分，普遍存在）。 胆固醇过多有害，但缺少会影响膜的稳定性与脂质运输——「胆固醇有害无益」说法错误。"}, {"id": "c3", "ch": 3, "chT": "蛋白质和核酸", "t": "蛋白质和核酸", "terms": "", "x": "04 蛋白质和核酸蛋白质的结构与功能 · 核酸的结构与功能 · 生物大分子以碳链为骨架"}, {"id": "c3s0", "ch": 3, "chT": "蛋白质和核酸", "t": "4.1 蛋白质（生命活动的主要承担者）", "terms": "不供能 一个氨基和一个羧基连接在同一个碳原子上 必需氨基酸 非必需氨基酸 核糖体 肽键（—CO—NH—） 种类、数目、排列顺序 空间结构 基因（DNA）的多样性 肽链间不能形成肽键 变性 不可恢复 盐析 加水可复溶", "x": "4.1 蛋白质（生命活动的主要承担者） 功能（五大类，教材 P28 黑体） 结构蛋白（肌肉、羽毛、头发）；催化（绝大多数酶）；运输（血红蛋白、通道蛋白、载体蛋白）；调节（胰岛素、生长激素）；免疫（抗体）。正常代谢中蛋白质不供能，仅在病理或衰老状态才氧化分解。 基本单位——氨基酸 结构通式：至少含一个氨基和一个羧基连接在同一个碳原子上，该碳原子还连一个氢和一个 R 基。区别在于 R 基不同；有的 R 基中也含氨基或羧基。 组成人体蛋白质的氨基酸约 21 种，其中 8 种（婴儿 9 种）为必需氨基酸，只能从食物获得，人体不能合成；非必需氨基酸可由转氨基作用合成。 必需氨基酸口诀：「携（缬）一（异亮）两（亮）本（苯丙）单（蛋）色（色）书（苏）来（赖）」。 脱水缩合在核糖体上进行：一个氨基酸的羧基与另一个的氨基结合，脱去一分子水，形成肽键（—CO—NH—）。水中 H 来自氨基和羧基，O 只来自羧基。 脱水缩合计算全套公式 肽键数 / 脱"}, {"id": "c3s1", "ch": 3, "chT": "蛋白质和核酸", "t": "4.2 核酸（遗传信息的携带者）", "terms": "磷酸 + 五碳糖 + 含氮碱基 数目与排列顺序 碳链为基本骨架 基因的选择性表达 同一个基因", "x": "4.2 核酸（遗传信息的携带者） 项目DNA（脱氧核糖核酸）RNA（核糖核酸） 元素均为 C、H、O、N、P 基本单位脱氧核糖核苷酸（4 种）核糖核苷酸（4 种） 五碳糖脱氧核糖核糖 碱基A、T、G、CA、U、G、C 结构一般双链，双螺旋一般单链 分布细胞核（染色质）、线粒体、叶绿体、拟核、质粒细胞核、线粒体、叶绿体、核糖体（rRNA） 功能绝大多数生物的遗传物质mRNA 传递遗传信息；tRNA 转运氨基酸；rRNA 构成核糖体；少数 RNA 有催化作用（酶） 核苷酸 = 磷酸 + 五碳糖 + 含氮碱基，连接处：磷酸—酯键连五碳糖。核苷 = 五碳糖 + 碱基（无磷酸）。腺苷 = 腺嘌呤 + 核糖。 DNA 多样性：脱氧核苷酸（碱基对）的数目与排列顺序千变万化（数学模型 4n）；特异性：每种 DNA 有特定的排列顺序——DNA 指纹、核酸检测的依据。 新冠病毒核酸（RNA）有特定核苷酸排列顺序，故可用核酸检测判断感染。 生物类型核"}, {"id": "c4", "ch": 4, "chT": "细胞膜与细胞核", "t": "细胞膜与细胞核", "terms": "", "x": "05 细胞膜与细胞核细胞膜的结构和功能 · 细胞器与生物膜系统前置知识 · 细胞核的结构和功能"}, {"id": "c4s0", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.1 细胞膜的功能（三条，教材 P40-41）", "terms": "分隔开 控制物质进出 细胞间的信息交流 胞间连丝 细胞膜上 甲状腺激素（小分子脂溶性）和固醇类激素受体在细胞质或细胞核中", "x": "5.1 细胞膜的功能（三条，教材 P40-41） ①将细胞与外界环境分隔开（保障内部环境相对稳定；也是系统的边界）；②控制物质进出（相对性：控制作用有普遍性和相对性）；③进行细胞间的信息交流。 信息交流三种方式：化学物质随体液运输（激素—靶细胞受体）；相邻细胞膜直接接触（精卵识别与结合）；相邻细胞形成通道（高等植物细胞的胞间连丝）。 受体位置：蛋白质类（大分子）激素受体在靶细胞细胞膜上；甲状腺激素（小分子脂溶性）和固醇类激素受体在细胞质或细胞核中。 台盼蓝染色：活细胞不让染料进入（膜的选择透过性），死细胞被染蓝——鉴别细胞死活。"}, {"id": "c4s1", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.2 细胞膜的制备与成分（教材 P42-43）", "terms": "成熟红细胞 无细胞核和众多细胞器 连续两层 磷脂最丰富 功能越复杂的膜，蛋白质的种类和数量越多", "x": "5.2 细胞膜的制备与成分（教材 P42-43） 选材：哺乳动物成熟红细胞——无细胞壁；无细胞核和众多细胞器，排除其他膜干扰；吸水涨破后差速离心得较纯净细胞膜。 成分探索历程：欧文顿（脂溶性物质更易通过 → 膜由脂质组成）→ 戈特、格伦德尔（红细胞膜脂质铺展单分子层面积为表面积 2 倍 → 磷脂连续两层）→ 丹尼利、戴维森（表面张力低于油水界面 → 推测附有蛋白质）→ 后发现糖蛋白（1950s，纽伯格等）、糖脂、糖被。 成分：脂质（约 50%，磷脂最丰富；动物细胞膜还含胆固醇）+ 蛋白质（约 40%）+ 糖类（约 2%~10%，与蛋白质或脂质结合为糖蛋白/糖脂）。功能越复杂的膜，蛋白质的种类和数量越多。"}, {"id": "c4s2", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.3 流动镶嵌模型（教材 P44-45，必背）", "terms": "磷脂双分子层 镶、嵌、贯穿 细胞膜外表面 流动性 选择透过性 转运蛋白的种类和数量 空间结构的变化", "x": "5.3 流动镶嵌模型（教材 P44-45，必背） 磷脂双分子层构成膜的基本支架，具有流动性；蛋白质分子镶、嵌、贯穿（部分或全部嵌入、贯穿于双层，或附着在表面）——分布是不对称、不均匀的。 糖蛋白（糖被）只分布于细胞膜外表面，与细胞识别、信息传递有关——据此判断膜的内外侧。 流动性实例：变形虫运动与摄食、动物细胞缢裂、细胞融合与受精、巨噬细胞吞噬（胞吞）、分泌蛋白与神经递质释放（胞吐）、质壁分离与复原、细胞吸水膨胀失水皱缩。 选择透过性的结构基础：细胞膜上转运蛋白的种类和数量，或转运蛋白空间结构的变化（教材 P66-72）。"}, {"id": "c4s3", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.4 细胞壁（教材 P48）", "terms": "纤维素和果胶 细胞壁不是系统的边界", "x": "5.4 细胞壁（教材 P48） 主要成分：植物——纤维素和果胶；真菌——几丁质；细菌——肽聚糖。全透性（对进出物质无选择性），细胞壁不是系统的边界。功能：支持和保护。 去壁方法：酶解法（纤维素酶+果胶酶）——植物细胞吸水不涨破的原因是有细胞壁。"}, {"id": "c4s4", "ch": 4, "chT": "细胞膜与细胞核", "t": "5.5 细胞核（教材 P54-58）", "terms": "细胞核是遗传信息库，是细胞代谢和遗传的控制中心 核孔 选择透过性 某种 RNA 的合成及核糖体的形成 结构完整性 核孔数目多、核仁较大 大于 2S 核质比", "x": "5.5 细胞核（教材 P54-58） 功能（黑体）：细胞核是遗传信息库，是细胞代谢和遗传的控制中心。 结构：核膜（双层膜，外膜连内质网、附核糖体）、核孔（大分子如 mRNA、蛋白质进出的通道，具选择透过性，DNA 不能随意出核，大分子进出需能量）、核仁（与某种 RNA 的合成及核糖体的形成有关）、染色质（DNA+蛋白质，易被碱性染料染成深色）。 染色质与染色体：同一物质在细胞不同时期的两种存在状态——染色质（细丝状，利于复制转录）⇄ 染色体（高度螺旋，利于分裂时平均分配）；前期出现、末期变为染色质。 四个经典实验结论：美西螈核移植——肤色由细胞核控制；蝾螈受精卵横缢——细胞核控制分裂分化；变形虫切割/核移植——细胞核是生命活动控制中心；伞藻嫁接与核移植——形态结构建成由核控制（伞帽形状取决于核）。只做嫁接实验不能完全说明核的作用（假说需核移植验证）。 核质依存：精子和哺乳动物成熟红细胞寿命短；细胞需保持结构完整性。代谢旺盛细胞："}, {"id": "c5", "ch": 5, "chT": "细胞器与生物膜系统", "t": "细胞器与生物膜系统", "terms": "", "x": "06 细胞器与生物膜系统细胞器之间的分工合作 · 分泌蛋白的合成与运输 · 细胞的生物膜系统"}, {"id": "c5s0", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.1 细胞质与细胞骨架（教材 P47-50）", "terms": "胶质状 差速离心法 细胞骨架 蛋白质纤维", "x": "6.1 细胞质与细胞骨架（教材 P47-50） 细胞质 = 细胞质基质（胶质状，细胞代谢的主要场所，含水、无机盐、脂质、糖类、氨基酸、核苷酸、多种酶）+ 细胞器。 分离细胞器的方法：差速离心法——细胞核最先沉淀，依次为叶绿体、线粒体与溶酶体、内质网与高尔基体，核糖体最后。 细胞骨架：由蛋白质纤维组成的网架结构；功能：维持细胞形态、锚定支撑细胞器，与细胞运动、分裂、分化及物质运输、能量转化、信息传递等密切相关。"}, {"id": "c5s1", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.2 八大细胞器（识图+功能重点）", "terms": "有氧呼吸的主要场所 光合作用的场所 加工、分类、包装 无膜 合成蛋白质 酸性水解酶 高尔基体 细胞液 动物和低等植物 中心体", "x": "6.2 八大细胞器（识图+功能重点） 细胞器结构功能 线粒体双层膜，内膜折叠成嵴，基质有氧呼吸的主要场所（二、三阶段）；「动力车间」；含少量 DNA（半自主） 叶绿体双层膜，类囊体堆叠成基粒，基质绿色植物光合作用的场所；「养料制造车间、能量转换站」 内质网单层膜，网状粗面：蛋白质合成、加工、运输；光面：脂质合成；增大膜面积 高尔基体单层膜，扁平囊对来自内质网的蛋白质加工、分类、包装；植物：与细胞壁形成有关；「发送站」 核糖体无膜，rRNA+蛋白质合成蛋白质（「生产蛋白质的机器」）；游离型合成胞内蛋白，附着型合成分泌蛋白/膜蛋白 溶酶体单层膜，内含多种酸性水解酶（pH≈5）分解衰老损伤的细胞器；吞噬杀死入侵病毒病菌；「消化车间」；来源于高尔基体 液泡单层膜，内含细胞液（糖类、无机盐、色素、蛋白质）调节植物细胞内环境、保持坚挺 中心体无膜，两个垂直中心粒+周围物质与动物和低等植物细胞的有丝分裂有关 典型细胞：根尖分生区——无叶绿体、"}, {"id": "c5s2", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.3 线粒体与叶绿体对比（高频）", "terms": "蛔虫除外 仅用于暗反应 C3 的还原 半自主性细胞器", "x": "6.3 线粒体与叶绿体对比（高频） 项目线粒体叶绿体 分布真核细胞（蛔虫除外）植物的绿色部分 增大膜面积方式内膜折叠成嵴类囊体堆叠成基粒 完成生理过程有氧呼吸第二、三阶段光合作用全过程 ATP 去路各项生命活动仅用于暗反应 C3 的还原 相同点均双层膜；均能量转换；均既产水又耗水；均含少量 DNA、RNA（半自主性细胞器）；均与自然界碳循环有关 内共生起源学说证据链（支持观点）：①线粒体、叶绿体有与细菌/蓝细菌相似的裸露环状 DNA 和核糖体；③自身 DNA 指导合成少数蛋白质；④内膜与细菌质膜相似、外膜与真核内膜系统相似；⑥以分裂方式繁殖。不支持：②细菌基因组无内含子而线粒体、叶绿体有；⑤拥有的聚合酶恰说明其「自主但依赖核基因」需辩证判断。"}, {"id": "c5s3", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.4 分泌蛋白的合成与运输（教材 P51-52，必背）", "terms": "跨膜 0 层 同位素标记（示踪）法 交通枢纽/转化中心", "x": "6.4 分泌蛋白的合成与运输（教材 P51-52，必背） 途径：核糖体（附着型，氨基酸脱水缩合）→ 内质网（初步加工，肽链折叠组装糖基化）→ 囊泡 → 高尔基体（进一步加工分类包装）→ 囊泡 → 细胞膜 → 胞吐。全过程跨膜 0 层，需能量，不需转运蛋白。 研究方法：同位素标记（示踪）法（3H 标记亮氨酸注入豚鼠胰腺腺泡细胞），放射性依次出现于：核糖体 → 内质网 → 高尔基体 → 细胞膜 → 分泌物。 参与分泌蛋白合成的 4 个细胞器：核糖体、内质网、高尔基体、线粒体；5 个有关结构：+ 细胞膜；3 个直接相关的膜结构：内质网膜、高尔基体膜、细胞膜。 膜面积变化：内质网减少；高尔基体先增后减（基本不变）——膜流的交通枢纽/转化中心；细胞膜增加。 需要内质网和高尔基体加工的蛋白：分泌蛋白（消化酶、抗体、蛋白类激素、细胞因子）、膜蛋白、溶酶体水解酶。"}, {"id": "c5s4", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.5 生物膜系统（教材 P53）", "terms": "核糖体和中心体无膜，不属于生物膜系统 原核生物有生物膜（细胞膜）但无生物膜系统", "x": "6.5 生物膜系统（教材 P53） 组成：细胞膜、核膜 + 细胞器膜（内质网、高尔基体、溶酶体、液泡、线粒体、叶绿体等）。核糖体和中心体无膜，不属于生物膜系统；原核生物有生物膜（细胞膜）但无生物膜系统。 功能（三条必背）：①使细胞具有相对稳定的内部环境，同时在物质运输、能量转换和信息传递中起决定作用；②广阔的膜面积为多种酶提供大量附着位点；③使各类细胞器分工协作、把各种反应分隔开，保证高效有序进行。 结构联系：直接联系（内质网膜→核膜外膜、细胞膜；内质网腔与高尔基体囊泡间接联系）；功能联系：分泌蛋白的合成运输体现。"}, {"id": "c5s5", "ch": 5, "chT": "细胞器与生物膜系统", "t": "6.6 实验：用高倍镜观察叶绿体和细胞质的流动（教材 P49）", "terms": "叶绿体运动 光照、室温 亚显微结构", "x": "6.6 实验：用高倍镜观察叶绿体和细胞质的流动（教材 P49） 原理：叶绿体绿色、扁平椭球形，不需染色可直接观察；观察细胞质流动以叶绿体运动为标志。活细胞的细胞质处于不断流动状态（环流式）。 选材：黑藻幼嫩小叶、藓类叶片或菠菜稍带叶肉的下表皮（叶薄、叶绿体少、易观察）。制片后随时保持有水，防止叶绿体变形。 先低倍镜找细胞，再高倍镜观察；黑藻提前在光照、室温下培养可提高流速。同一细胞中叶绿体流动方向一致；若显微镜下顺时针环流，实际也是顺时针（显微镜不上下颠倒旋转方向）。 意义：细胞质流动为细胞内物质运输创造条件，保障生命活动正常进行。 边角小字 显微结构（光镜可见）：细胞壁、细胞质、细胞核、核仁、染色体、叶绿体、线粒体、液泡；亚显微结构（需电镜）：细胞膜、内质网膜、核膜厚度、核糖体、细胞骨架（ 溶酶体膜不被自身水解酶分解的可能机制（教材 P48 思考）：膜成分被修饰使酶无法识别；膜所带电荷/特定基团排斥酶；膜转运 H⁺ 维持内部酸"}, {"id": "c6", "ch": 6, "chT": "细胞的物质输入和输出", "t": "细胞的物质输入和输出", "terms": "", "x": "07 细胞的物质输入和输出渗透作用 · 质壁分离与复原 · 物质跨膜运输的方式 · 影响跨膜运输的因素"}, {"id": "c6s0", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.1 渗透作用（教材 P62，必背第三段）", "terms": "水分子（或其他溶剂分子）通过半透膜的扩散 半透膜 浓度差 选择透过性膜是生物膜 仍然较高 物质的量浓度 先升后降，最终内外相等 先甲高后乙高", "x": "7.1 渗透作用（教材 P62，必背第三段） 概念：水分子（或其他溶剂分子）通过半透膜的扩散。方向：双向移动、总体单向。 条件：①具有半透膜；②膜两侧溶液具有浓度差。 半透膜：某些物质可透过而另一些不能透过的多孔性薄膜；选择透过性膜是生物膜，具有选择透过性（活性依赖）。 动态平衡时：水分子仍在进出（数目相等），液面高的一侧浓度仍然较高（水柱压力所致）；浓度指物质的量浓度而非质量浓度。 漏斗实验：蔗糖酶加入后，若单糖不能透过半透膜→液面继续上升后稳定；若单糖能透过→先升后降，最终内外相等。 经典题：等体积等质量浓度的葡萄糖与蔗糖溶液被半透膜隔开——①只允许水通过：葡萄糖一侧（摩尔浓度高）液面升高；②水与葡萄糖可通过、蔗糖不能：先甲高后乙高（葡萄糖先使甲侧升高，后葡萄糖透过使乙侧浓度增大）。"}, {"id": "c6s1", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.2 动物细胞与植物细胞的吸水和失水", "terms": "质壁分离 原生质层", "x": "7.2 动物细胞与植物细胞的吸水和失水 条件动物细胞（红细胞）成熟植物细胞 外界浓度 = 内部正常无变化正常无变化 外界浓度 &lt; 内部吸水膨胀甚至涨破吸水（膨胀，受细胞壁限制） 外界浓度 &gt; 内部失水皱缩质壁分离 半透膜细胞膜原生质层：细胞膜+液泡膜+两层膜之间的细胞质 成熟植物细胞是一个渗透系统：大液泡 + 半透性原生质层。水进出细胞主要指水经原生质层进出液泡（教材 P63）。"}, {"id": "c6s2", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.3 实验：观察植物细胞的质壁分离与复原（教材 P64-65）", "terms": "原生质层伸缩性大于细胞壁 外表皮 浸润 三次低倍镜观察、自身前后对照 首先发生在细胞的角隅处 外界溶液 主动运输 能自动复原的溶液：KNO₃、甘油、尿素、乙二醇、葡萄糖", "x": "7.3 实验：观察植物细胞的质壁分离与复原（教材 P64-65） 原理：内因——原生质层伸缩性大于细胞壁、原生质层相当于半透膜；外因——外界溶液浓度＞细胞液浓度。 选材：紫色洋葱鳞片叶外表皮（有大液泡、细胞液紫色便于观察）；黑藻（叶绿体绿色可观察）；洋葱内表皮可发生但不宜观察。 试剂：0.3 g/mL 蔗糖溶液——既明显质壁分离又不致细胞失水死亡。引流法：滴蔗糖/清水+吸水纸吸引，重复几次，目的是让细胞浸润在相应溶液中。 三次低倍镜观察、自身前后对照：正常态 → 质壁分离 → 复原。第二次观察时质壁分离首先发生在细胞的角隅处；第一次观察不能省略。 变化分析：失水越多 → 液泡变小、颜色变深、细胞液浓度变大、吸水能力越强；细胞体积略缩小（壁限制）。原生质层与细胞壁之间充满外界溶液（细胞壁全透）。 自动复原：外界浓度＞细胞液浓度先失水质壁分离，但 K⁺、NO₃⁻ 等被主动运输吸收进入细胞，细胞液浓度升高后渗透吸水复原。能自动复原的溶"}, {"id": "c6s3", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.4 物质跨膜运输的方式（离子与小分子，教材 P66-70）", "terms": "小部分水、气体（O2、CO2）、脂溶性物质（苯、乙醇、甘油、脂肪酸、尿素、胆固醇、维生素 D、性激素） 红细胞吸收葡萄糖 耗能 载体蛋白 自身构象（空间结构）改变 不与运输分子结合 主动选择吸收 协同转运（离子梯度动力，如 Na⁺-葡萄糖同向转运） 流动性", "x": "7.4 物质跨膜运输的方式（离子与小分子，教材 P66-70） 方式方向能量转运蛋白影响因素实例 自由扩散高→低（顺浓度）不耗能不需要浓度差小部分水、气体（O2、CO2）、脂溶性物质（苯、乙醇、甘油、脂肪酸、尿素、胆固醇、维生素 D、性激素） 协助扩散高→低不耗能载体蛋白或通道蛋白浓度差、转运蛋白数量红细胞吸收葡萄糖、水经水通道蛋白、K⁺ 经 K⁺ 通道、Na⁺ 内流、K⁺ 外流 主动运输低→高（逆浓度）耗能载体蛋白能量、载体蛋白数量大多数离子、肾小管重吸收葡萄糖、小肠吸收葡萄糖与氨基酸 载体蛋白：只容许与自身结合部位相适应的分子/离子通过，转运时自身构象（空间结构）改变，如 CFTR 蛋白转运 Cl⁻（氯离子大小与性质与其结合部位相适应）。 通道蛋白：只容许大小和电荷相适应的分子通过，不与运输分子结合；水通道蛋白、离子通道。 主动运输意义：保证细胞按生命活动需要，主动选择吸收所需营养物质，排出代谢废物和对细胞有害的物质（教材 "}, {"id": "c6s4", "ch": 6, "chT": "细胞的物质输入和输出", "t": "7.5 影响跨膜运输的因素", "terms": "", "x": "7.5 影响跨膜运输的因素 物质浓度：自由扩散——在一定范围内速率随浓度增大而增大后达平台；协助扩散/主动运输——需转运蛋白，会饱和。 氧气浓度：自由扩散/协助扩散不受影响；主动运输在有氧呼吸范围内随 O₂ 增大而增大（能量来自呼吸作用），无氧时仍有一定速率（无氧呼吸供能）。 温度：影响膜流动性、酶活性、呼吸供能。载体蛋白数量：限制最大速率。 边角小字 教材 P74-T2：主动运输的机理图——ATP 水解使载体蛋白磷酸化而改变构象（膜上 Na⁺-K⁺ 泵，每消耗 1 个 ATP 运出 3 个 Na⁺、运入 2 个 K⁺）。 小肠上皮细胞吸收葡萄糖：肠腔侧 Na⁺-葡萄糖同向协同转运（主动运输，动力来自 Na⁺ 电化学梯度）；基底侧葡萄糖经载体协助扩散出细胞；Na⁺ 由 Na-K 泵（ATP）泵出。教材 P69 强调：小肠液中氨基酸、葡萄糖浓度远低于细胞内浓度。 蔗糖运入筛管：H⁺ 泵（①）消耗 ATP 建立 H⁺ 梯度，蔗糖- "}, {"id": "c7", "ch": 7, "chT": "酶与 ATP", "t": "酶与 ATP", "terms": "", "x": "08 酶与 ATP降低化学反应活化能的酶 · 细胞的能量「货币」ATP"}, {"id": "c7s0", "ch": 7, "chT": "酶与 ATP", "t": "8.1 酶的本质与作用机理（教材 P78-80）", "terms": "降低化学反应的活化能 毕希纳 萨姆纳 切赫、奥特曼 有机物，绝大多数是蛋白质，少数是 RNA", "x": "8.1 酶的本质与作用机理（教材 P78-80） 作用：催化；机理：降低化学反应的活化能（分子从常态转变为容易发生反应的活跃状态所需的能量）。与加热（给反应物能量）机理不同。 本质探索（课本 P79）：巴斯德（发酵与活酵母细胞有关）→ 李比希（酵母死亡裂解后物质起作用）→ 毕希纳（获得无细胞提取液「酿酶」）→ 萨姆纳（提取脲酶结晶，证明是蛋白质）→ 切赫、奥特曼（少数 RNA 也有催化功能）。 酶的概念：活细胞产生的、具有催化作用的有机物，绝大多数是蛋白质，少数是 RNA。 合成原料：氨基酸（CHON）或核糖核苷酸（CHONP）；合成场所：核糖体（蛋白质类）或细胞核（真核生物 RNA 类）；作用场所：细胞内外、体外均可。 鉴定蛋白质类酶：双缩脲试剂（紫色）。"}, {"id": "c7s1", "ch": 7, "chT": "酶与 ATP", "t": "8.2 酶的特性与验证实验", "terms": "高效性 专一性 碘液 斐林试剂 作用条件温和 低温抑制活性但空间结构稳定，升温可恢复 不改变平衡点", "x": "8.2 酶的特性与验证实验 高效性：与无机催化剂相比降低活化能更显著——H₂O₂ 实验：3、4 号对照（Fe³⁺ vs 过氧化氢酶），气泡多、卫生香复燃猛。 专一性：每种酶只能催化一种或一类化学反应。两套方案：①「一底物多酶」淀粉+唾液淀粉酶/蔗糖酶，用碘液检测（蔗糖不与碘反应，不能用碘液检蔗糖是否水解）；②「一酶多底物」淀粉/蔗糖+淀粉酶，用斐林试剂（60 ℃ 保温、沸水浴；不能用碘液，因为碘液无法检测蔗糖是否水解）。 作用条件温和：适宜温度、pH。过酸过碱、高温破坏空间结构永久失活；低温抑制活性但空间结构稳定，升温可恢复——酶保存：低温、最适 pH。 酶促反应原理与催化剂共性：①改变化学反应速率而本身不被消耗；②只能缩短达到平衡的时间，不改变平衡点；③反应前后性质数量不变（但酶自身需要更新）；④都降低活化能。"}, {"id": "c7s2", "ch": 7, "chT": "酶与 ATP", "t": "8.3 探究温度、pH 对酶活性的影响（实验设计细节）", "terms": "先各自保温 5 min 再混合 不能用 H₂O₂ 酶 不能用斐林试剂 再 不能用淀粉酶 单位时间内底物减少量或产物生成量 温度、pH 通过影响酶活性 酶浓度、底物浓度通过影响酶与底物接触面积", "x": "8.3 探究温度、pH 对酶活性的影响（实验设计细节） 实验要点与「不能」 温度（淀粉+淀粉酶+碘液）冰浴（不变蓝）0 ℃、60 ℃（变蓝浅/消失）、沸水浴（变蓝）三组；先各自保温 5 min 再混合（防止未达预设温度即反应）；沸水浴后自来水冲凉再加碘（100 ℃ 直链淀粉螺旋结构破坏遇碘不变蓝；防止碘蒸发）；不能用 H₂O₂ 酶（加热本身促进 H₂O₂ 分解）；不能用斐林试剂（需加热检测，低温酶活性恢复造成错觉） pH（H₂O₂+过氧化氢酶）先加酶+不同 pH 溶液（蒸馏水/HCl/NaOH）再加底物（否则未调 pH 反应已结束）；不能用淀粉酶（淀粉在酸性下自行水解；斐林试剂与酸反应干扰；碱性环境碘与碱反应干扰） 酶活性：酶催化特定化学反应的能力，用单位时间内底物减少量或产物生成量表示。 影响因素分两类：温度、pH 通过影响酶活性影响反应速率；酶浓度、底物浓度通过影响酶与底物接触面积影响速率，不影响酶活性。"}, {"id": "c7s3", "ch": 7, "chT": "酶与 ATP", "t": "8.4 激活剂与抑制剂（课件拓展）", "terms": "Km 增大、Vmax 不变 Km 不变、Vmax 降低 Km 减小、Vmax 降低 酶与底物的亲和力", "x": "8.4 激活剂与抑制剂（课件拓展） 激活剂：提高酶活性的物质（无机离子如 Mg²⁺、K⁺、Cl⁻；有机分子如维生素 C、半胱氨酸）。酶原需激活剂激活后才有活性。 抑制剂三种：竞争性抑制——抑制剂与底物结构相似，竞争活性中心；Km 增大、Vmax 不变，增加底物浓度可解除。非竞争性抑制——结合活性中心以外必需基团；Km 不变、Vmax 降低，加底物不能解除。反竞争性抑制——只结合酶-底物复合物（ES）；Km 减小、Vmax 降低。 Km（米氏常数）：反应速率达最大速率一半时的底物浓度，反映酶与底物的亲和力（越小亲和力越大）。"}, {"id": "c7s4", "ch": 7, "chT": "酶与 ATP", "t": "8.5 ATP（教材 P87-89）", "terms": "A—P~P~P 特殊的化学键 ATP 去掉两个磷酸基团（即 AMP，腺苷一磷酸）是 RNA 的基本组成单位之一 直接的能源物质 能口服 转化迅速且处于动态平衡 不可逆反应 能量不可逆 货币", "x": "8.5 ATP（教材 P87-89） 结构简式 A—P~P~P：A=腺苷（腺嘌呤+核糖）；P=磷酸基团；—普通化学键；~特殊的化学键（远离 A 的那个易断裂，水解释能约 30.54 kJ/mol）。元素：C、H、O、N、P。 ATP 彻底水解产物：磷酸、核糖、腺嘌呤；ATP 去掉两个磷酸基团（即 AMP，腺苷一磷酸）是 RNA 的基本组成单位之一（腺嘌呤核糖核苷酸）。 功能：直接的能源物质——糖类、脂肪中能量稳定不能直接利用，须转化为 ATP 中活跃化学能。ATP 是物质不是能量；能口服（被消化分解，意义不大）。 ATP 含量少但供能及时持续：ATP 与 ADP 转化迅速且处于动态平衡；该转化机制是生物界的共性。 ATP ⇄ ADP + Pi + 能量：不可逆反应——酶不同（水解酶/合成酶）、场所不同、物质可逆而能量不可逆。合成能量来源：动物——呼吸作用；植物——呼吸作用+光合作用。 能量流通：吸能反应与 ATP 水解相联系；放"}, {"id": "c8", "ch": 8, "chT": "细胞呼吸", "t": "细胞呼吸", "terms": "", "x": "09 细胞呼吸探究酵母菌的呼吸方式 · 有氧呼吸 · 无氧呼吸 · 细胞呼吸原理的应用"}, {"id": "c8s0", "ch": 8, "chT": "细胞呼吸", "t": "9.1 细胞呼吸的概念与实质（教材 P90）", "terms": "有机物在细胞内经过一系列的氧化分解，生成二氧化碳或其他产物，释放能量并生成 ATP 的过程 条件温和 逐步释放", "x": "9.1 细胞呼吸的概念与实质（教材 P90） 细胞呼吸（黑体）：有机物在细胞内经过一系列的氧化分解，生成二氧化碳或其他产物，释放能量并生成 ATP 的过程。实质：氧化分解有机物、释放能量。 与体外燃烧相比：有氧呼吸条件温和；能量逐步释放；一部分储存在 ATP 中。意义：能量逐步转移到 ATP、充分利用；缓慢有序释放维持细胞相对稳定。"}, {"id": "c8s1", "ch": 8, "chT": "细胞呼吸", "t": "9.2 探究酵母菌细胞的呼吸方式（教材 P91-92）", "terms": "兼性厌氧 对比实验法 澄清石灰水变浑浊 溴麝香草酚蓝水溶液：蓝→绿→黄 酸性（浓硫酸）重铬酸钾：橙色→灰绿色 NaOH 溶液 先封口放置一段时间耗尽 O₂ 煮沸灭菌 过滤取滤液", "x": "9.2 探究酵母菌细胞的呼吸方式（教材 P91-92） 酵母菌：真核单细胞真菌，兼性厌氧，繁殖（出芽生殖为主），细胞壁+细胞膜+细胞核+液泡+线粒体。 方法：对比实验法（有氧、无氧装置相互对照）。检测 CO₂：澄清石灰水变浑浊；溴麝香草酚蓝水溶液：蓝→绿→黄（由变黄时间长短判断 CO₂ 多少）。检测酒精：酸性（浓硫酸）重铬酸钾：橙色→灰绿色。 装置要点：空气先经 NaOH 溶液（除去 CO₂，排除干扰）；B 瓶（无氧组）先封口放置一段时间耗尽 O₂ 再连通检测瓶；培养液煮沸灭菌（排除杂菌呼吸干扰）；检测酒精需过滤取滤液（培养液浑浊有色会干扰，且葡萄糖可被重铬酸钾氧化产生类似颜色）。 有氧组气泵间歇通空气保证供氧；无氧组可加石蜡油/植物油液封。"}, {"id": "c8s2", "ch": 8, "chT": "细胞呼吸", "t": "9.3 有氧呼吸（教材 P92-93）", "terms": "细胞质基质 2 丙酮酸 + [H](NADH) 线粒体基质 H₂O 线粒体内膜 O₂ 大量 ATP", "x": "9.3 有氧呼吸（教材 P92-93） 阶段场所反应物 → 产物能量 第一阶段细胞质基质葡萄糖 → 2 丙酮酸 + [H](NADH)少量 ATP（少量能量） 第二阶段线粒体基质丙酮酸 + H₂O → CO₂ + [H]少量 ATP 第三阶段线粒体内膜[H] + O₂ → H₂O大量 ATP（最多） 总反应式C6H12O6 + 6O2 + 6H2O →(酶) 6CO2 + 12H2O + 能量 元素去向CO2 中 O：来自葡萄糖和水H2O 中 O：来自 O2；H：来自葡萄糖和水 转移路径C：葡萄糖 → 丙酮酸 → CO218O2 → H218O（第三阶段产物） [H] 是 NADH（还原型辅酶Ⅰ），来源于第一、二阶段，只在第三阶段被消耗（与 O₂ 结合）。 有氧呼吸第三阶段机理：电子传递链（NADH→…→O₂），电子传递释放能量驱动 H⁺ 泵至膜间隙建立梯度，H⁺ 经 ATP 合酶回流推动 ATP 合成；电子供体 NADH、受体"}, {"id": "c8s3", "ch": 8, "chT": "细胞呼吸", "t": "9.4 无氧呼吸（教材 P94）", "terms": "存留在酒精或乳酸中 控制酶合成的基因不同", "x": "9.4 无氧呼吸（教材 P94） 产酒精型C6H12O6 →(酶) 2C2H5OH + 2CO2 + 少量能量代表：酵母菌、大多数植物细胞 产乳酸型C6H12O6 →(酶) 2C3H6O3 + 少量能量代表：人及动物细胞、马铃薯块茎、甜菜块根、玉米胚、乳酸菌 共同点场所全程在细胞质基质第一阶段与有氧呼吸相同；只在第一阶段产 ATP 无氧呼吸释放能量少的原因：葡萄糖中大部分能量存留在酒精或乳酸中；无氧呼吸释放的能量大部分（其余部分）以热能散失。 不同生物无氧呼吸产物不同的直接原因：酶种类不同；根本原因：控制酶合成的基因不同。"}, {"id": "c8s4", "ch": 8, "chT": "细胞呼吸", "t": "9.5 呼吸方式的判断（高频方法）", "terms": "O₂ 吸收量 = CO₂ 释放量 CO₂ &gt; O₂ 遮光", "x": "9.5 呼吸方式的判断（高频方法） 据产物：产 H₂O → 一定有有氧呼吸；耗 O₂ → 一定有有氧呼吸；无 CO₂ → 一定为产乳酸无氧呼吸（或死亡）。 据气体：O₂ 吸收量 = CO₂ 释放量 → 只进行有氧呼吸（或同时有产乳酸无氧呼吸）；CO₂ &gt; O₂ → 有氧呼吸 + 产酒精无氧呼吸（差值 = 无氧呼吸释放的 CO₂，差值的一半 = 酒精量）；只无 CO₂ 无 O₂ → 产乳酸无氧呼吸（未死）。 液滴移动法（装置一 NaOH 吸收 CO₂：左移距离 = 有氧呼吸耗 O₂ 量；装置二清水对照：左移 = 耗 O₂ − 放 CO₂，右移 = 放 CO₂ − 耗 O₂）。设死种子（等量灭活）对照排除气压温度物理因素；装置需遮光（绿色材料）；种子需消毒、灭菌。 底物为脂肪时：耗 O₂ &gt; 释放 CO₂（脂肪 H 多 O 少）。"}, {"id": "c8s5", "ch": 8, "chT": "细胞呼吸", "t": "9.6 影响细胞呼吸的因素与应用", "terms": "温度（影响酶活性） R 点：有氧呼吸弱+无氧呼吸被抑制，总呼吸最弱，有机物消耗最少——果蔬储存最适 稻田定期排水（避免无氧呼吸产酒精烂根）", "x": "9.6 影响细胞呼吸的因素与应用 内因：遗传因素（不同生物呼吸速率不同；同一植物生殖器官＞营养器官；幼苗、花期速率高）。 外因：温度（影响酶活性）、O₂ 浓度、CO₂ 浓度（高浓度抑制呼吸）、含水量。 O₂ 浓度曲线关键点：Q 点只无氧呼吸；P 点无氧呼吸消失；QP 段（不含端点）两种呼吸并存；R 点：有氧呼吸弱+无氧呼吸被抑制，总呼吸最弱，有机物消耗最少——果蔬储存最适。 应用（背诵）：包扎伤口用透气纱布（抑制厌氧菌）；酿酒先通气后密封；花盆松土（促进根有氧呼吸、利于无机盐吸收）；储粮晒干、果蔬低温低氧高 CO₂；破伤风杆菌厌氧需清创；提倡慢跑（避免乳酸堆积）；稻田定期排水（避免无氧呼吸产酒精烂根）；长途运输蔬菜充 N₂、调至 R 点对应 O₂ 浓度。 运动时体内主要呼吸方式仍是有氧呼吸；剧烈运动骨骼肌产乳酸——「能量由乳酸分解提供」×（能量来自葡萄糖分解）。 边角小字 教材 P92 科学方法：对比实验——设置两个或两个以上实"}, {"id": "c9", "ch": 9, "chT": "光合作用与能量转化", "t": "光合作用与能量转化", "terms": "", "x": "10 光合作用与能量转化捕获光能的色素和结构 · 光合作用的原理和应用 · 化能合成作用"}, {"id": "c9s0", "ch": 9, "chT": "光合作用与能量转化", "t": "10.1 叶绿体与光合色素（教材 P97-99）", "terms": "无水乙醇（有机溶剂） 层析液中溶解度不同 SiO₂ CaCO₃ 单层尼龙布 细、直、齐 滤液细线不能触及层析液 胡萝卜素（橙黄色，最快）→ 叶黄素（黄色）→ 叶绿素 a（蓝绿色，最宽/含量最多）→ 叶绿素 b（黄绿色） Mg 吸收、传递、转化光能 红光和蓝紫光", "x": "10.1 叶绿体与光合色素（教材 P97-99） 色素提取：色素能溶解在无水乙醇（有机溶剂）中；分离：色素在层析液中溶解度不同，溶解度高者随层析液在滤纸上扩散得快。 步骤细节：加 SiO₂（研磨充分）、CaCO₃（防止研磨中色素被破坏）；研磨迅速（防乙醇挥发）充分（破坏叶绿体释出色素）；过滤用单层尼龙布（滤纸吸附色素、色素分子不易透过）；滤纸条剪两角（防边缘扩散过快使色素带不齐）；画滤液细线要细、直、齐（起点相同），干后重复画 1~2 次（积累色素）；滤液细线不能触及层析液（色素会溶入层析液）；试管口塞棉塞（防层析液挥发）。 结果（从上到下）：胡萝卜素（橙黄色，最快）→ 叶黄素（黄色）→ 叶绿素 a（蓝绿色，最宽/含量最多）→ 叶绿素 b（黄绿色）。类胡萝卜素占 1/3（含 C、H 或 C、H、O），叶绿素占 2/3（含 C、H、O、N、Mg）。 色素功能：吸收、传递、转化光能；叶绿素主要吸收红光和蓝紫光，类胡萝卜素主要吸收蓝紫"}, {"id": "c9s1", "ch": 9, "chT": "光合作用与能量转化", "t": "10.2 光合作用的探索（教材 P100-102）", "terms": "水的光解与糖的合成不是同一反应 鲁宾、卡门（同位素标记法，对比实验） 全部来自水 卡尔文（小球藻、¹⁴CO₂、双向纸层析） 煮沸乙醇杀死小球藻", "x": "10.2 光合作用的探索（教材 P100-102） 恩格尔曼：水绵+好氧细菌，极细光束照射——好氧细菌只向叶绿体被光束照射部位集中，全部曝光时细菌分布在叶绿体所有受光部位。结论：①O₂ 由叶绿体释放，叶绿体是光合作用场所；②叶绿体主要吸收红光和蓝紫光。 希尔反应：离体叶绿体加铁盐（有 H₂O 无 CO₂），光照下放 O₂——说明水的光解与糖的合成不是同一反应；但不能证明 O₂ 中氧全部来自水（未排除叶绿体其他物质干扰、未直接观察氧的转移）。 鲁宾、卡门（同位素标记法，对比实验）：H₂18O 组放 18O₂，C18O₂ 组放 O₂——证明光合作用释放的 O₂ 全部来自水。 卡尔文（小球藻、¹⁴CO₂、双向纸层析）：缩短取样时间至 0.5 s，¹⁴C 首先出现在 3-磷酸甘油酸（C₃）→ 5 s 出现在 RuBP（C₅）和六碳糖——C 的转移路径：CO₂ → C₃ →（CH₂O）/C₅。取样后立即煮沸乙醇杀死小球藻终止反应。 卡尔文"}, {"id": "c9s2", "ch": 9, "chT": "光合作用与能量转化", "t": "10.3 光合作用的过程（教材 P103-104，必背）", "terms": "类囊体薄膜 叶绿体基质 不直接需光但依赖光反应产物 2C₃ 活跃化学能 稳定化学能 水的光解 主动运输 既消耗水又产生水 只用于暗反应", "x": "10.3 光合作用的过程（教材 P103-104，必背） 项目光反应暗反应（卡尔文循环） 场所类囊体薄膜叶绿体基质 条件光、色素、酶、H₂O多种酶、CO₂；不直接需光但依赖光反应产物 物质变化①水的光解：H₂O → [H](NADPH) + O₂；②ATP 合成（ADP+Pi+能量→ATP）①CO₂ 固定：CO₂ + C₅ → 2C₃；②C₃ 的还原：C₃ + [H] + ATP →（CH₂O）+ C₅ 能量变化光能 → NADPH、ATP 中活跃化学能活跃化学能 → 有机物中稳定化学能 联系光反应为暗反应提供 NADPH、ATP；暗反应为光反应提供 ADP、Pi、NADP⁺（相互依存、不可分割） 唯一不需要酶催化的反应：水的光解。 移动方向：NADPH、ATP 由类囊体薄膜 → 叶绿体基质；ADP、Pi、NADP⁺ 由基质 → 类囊体薄膜。 NADPH 作用：①作还原剂还原 C₃；②储存部分能量。ATP 作用：为 C₃ 还原供"}, {"id": "c9s3", "ch": 9, "chT": "光合作用与能量转化", "t": "10.4 条件改变时物质量的短期变化（高频题型）", "terms": "C₃ 分子数是 C₅ 的 2 倍", "x": "10.4 条件改变时物质量的短期变化（高频题型） 条件改变（短暂时间）NADPH/[H]、ATPC₃C₅(CH₂O) 光照减弱 / 停止光照（阴天）减少增加减少减少 CO₂ 供应减少（气孔关闭/降温）增加减少增加减少 光照增强（CO₂ 不变）增加减少增加增加 分析思路：先判断受影响的环节（光反应 or 暗反应），再从「生成速率 vs 消耗速率」比较含量变化。 暗反应稳定时，C₃ 分子数是 C₅ 的 2 倍（1 C₅ 固定 1 CO₂ 生成 2 C₃）。 间隔光照（亮暗交替）比连续光照合成有机物多：暗期光反应产物 NADPH、ATP 继续被利用、基本不积累；连续光照反而利用不充分。"}, {"id": "c9s4", "ch": 9, "chT": "光合作用与能量转化", "t": "10.5 影响光合作用的因素与应用（教材 P105-107）", "terms": "光补偿点 光饱和点 真正（总）光合 = 净（表观）光合 + 呼吸消耗", "x": "10.5 影响光合作用的因素与应用（教材 P105-107） 外因：CO₂ 浓度、光照强度/光质/光照面积/时间、温度（酶活性，主要制约暗反应）、水、矿质元素（N、Mg、P 等）。内因：色素的数量、酶的数量和活性。 光补偿点：光合强度=呼吸强度（植物需整株光合＞呼吸才能生长）；光饱和点以后限制因素为 CO₂ 浓度、温度等。阳生植物补偿点、饱和点均高；阴生植物均低（连续阴雨时阴生植物受影响小）。 关键指标：真正（总）光合 = 净（表观）光合 + 呼吸消耗。「制造/产生/固定/合成/消耗」为总光合；「吸收/释放/测定/积累」为净光合。 午休现象（盛夏晴天）：温度过高蒸腾过强 → 气孔开放程度减小 → CO₂ 吸收减少 → 光合下降（FG 段），主要影响暗反应。 密闭容器一昼夜曲线：I 点低于 A 点 → 光合＞呼吸，植物生长；高于则不能正常生长。 增产措施：「正其行，通其风」、增施有机肥（微生物分解释 CO₂ 与矿质）、施用碳酸氢铵"}, {"id": "c9s5", "ch": 9, "chT": "光合作用与能量转化", "t": "10.6 化能合成作用（教材 P105）", "terms": "硝化细菌 浮起的数量 盛水玻璃槽 花青素", "x": "10.6 化能合成作用（教材 P105） 硝化细菌等：利用体外环境中无机物氧化（NH₃ → HNO₂ → HNO₃）释放的化学能合成有机物。与光合作用同为自养，但能源不同（化学能 vs 光能）。 边角小字（高频细节） 光合作用影响因素实验（教材 P105）：探究光照强度——调整灯与烧杯距离；CO₂ 浓度——吹气时间或不同浓度 NaHCO₃ 溶液；温度——水浴保温；光质——功率相同的不同色光 LED。因变量：圆形小叶片浮起的数量（或浮起相同数量所需时间）。灯与烧杯间加盛水玻璃槽吸热防温度干扰。 秋叶变黄：低温叶绿素合成受阻且易降解，类胡萝卜素稳定显现黄色；变红：可溶性糖积累形成花青素。遮光条件下叶绿素含量升高、叶绿素 a/b 比值降低（适应蓝紫光比例高的阴生环境）。 海洋藻类垂直分布：水层对红橙光吸收多，深水为短波长光——绿藻（浅）、褐藻（中）、红藻（深）。 植物细胞中色素不全在叶绿体：液泡含花青素等；幼嫩茎、果实细胞也含光合色素"}, {"id": "c10", "ch": 10, "chT": "细胞的增殖", "t": "细胞的增殖", "terms": "", "x": "11 细胞的增殖细胞周期 · 有丝分裂各期 · 实验：观察根尖分生区组织细胞的有丝分裂 · 无丝分裂"}, {"id": "c10s0", "ch": 10, "chT": "细胞的增殖", "t": "11.1 细胞增殖与细胞周期（教材 P110-111）", "terms": "生长和分裂 表面积与体积之比（相对表面积） 核质比 细胞周期（黑体） 一次分裂完成时开始 下一次分裂完成时为止 分裂间期（约占 90%~95%）和分裂期（M 期） S 期（DNA 复制）", "x": "11.1 细胞增殖与细胞周期（教材 P110-111） 细胞增殖：细胞生长和分裂的过程（物质准备+细胞分裂）；是生物体生长、发育、繁殖、遗传的基础。 细胞不能无限长大的原因：①表面积与体积之比（相对表面积）限制——体积越大相对表面积越小，物质运输效率越低；②核质比限制——一个核的控制能力有限。细胞也不能太小（容纳必要结构与物质）。 细胞周期（黑体）：连续分裂的细胞，从一次分裂完成时开始，到下一次分裂完成时为止；包括分裂间期（约占 90%~95%）和分裂期（M 期）。有丝分裂严格指分裂期。 有细胞周期的细胞：茎形成层、根尖分生区、皮肤生发层、造血干细胞、癌细胞、受精卵、精原/卵原细胞、肝细胞（受刺激后）等；神经细胞、成熟红细胞、叶肉细胞等无。 分裂间期细分：G1（RNA、蛋白质合成，为 S 期准备）、S 期（DNA 复制）、G2（合成微管蛋白等，为 M 期准备）。"}, {"id": "c10s1", "ch": 10, "chT": "细胞的增殖", "t": "11.2 有丝分裂各期特点（教材 P112-113，必背）", "terms": "DNA 分子的复制 有关蛋白质的合成 「膜仁消失显两体」 「形定数晰赤道齐」 赤道板 「点裂数数加均极」 加倍 「两消两现重开始」 中心粒发出星射线 两极发出纺锤丝 细胞膜中部内陷缢裂 赤道板位置出现细胞板 中心体 精确地平均分配 亲代和子代细胞之间遗传性状的稳定性", "x": "11.2 有丝分裂各期特点（教材 P112-113，必背） 时期主要特点 间期完成 DNA 分子的复制和有关蛋白质的合成，细胞适度生长；动物细胞中心粒倍增 前期「膜仁消失显两体」：核膜核仁消失，出现染色体和纺锤体，染色体散乱分布 中期「形定数晰赤道齐」：染色体形态稳定、数目清晰，着丝粒整齐排列在赤道板上——观察染色体最佳时期 后期「点裂数数加均极」：着丝粒分裂，姐妹染色单体分开成为两条染色体，染色体数目加倍，平均移向两极 末期「两消两现重开始」：染色体、纺锤体消失，核膜核仁重现 动植物细胞有丝分裂区别：①前期纺锤体形成方式——动物中心粒发出星射线；植物两极发出纺锤丝；②末期细胞质分裂——动物细胞膜中部内陷缢裂；植物赤道板位置出现细胞板扩展成新细胞壁。区分动植物细胞最可靠依据：细胞质分裂方式（有无细胞板）。 赤道板是假想平面（不存在），细胞板是真实结构（植物末期出现）。 数目变化口诀：DNA 加倍在间期（S 期）；染色体加倍在后期"}, {"id": "c10s2", "ch": 10, "chT": "细胞的增殖", "t": "11.3 无丝分裂（教材 P115）", "terms": "没有出现纺锤丝和染色体的变化 蛙的红细胞", "x": "11.3 无丝分裂（教材 P115） 过程：细胞核先延长缢裂为二，然后整个细胞从中部缢裂为二。特点：没有出现纺锤丝和染色体的变化（但有 DNA 复制）；过程简单迅速耗能少，核膜核仁不消失。典型实例：蛙的红细胞（高等植物薄壁组织如胚乳细胞中也常见）。"}, {"id": "c10s3", "ch": 10, "chT": "细胞的增殖", "t": "11.4 实验：观察根尖分生区组织细胞的有丝分裂（教材 P116）", "terms": "解离后细胞已死亡 呈正方形、排列紧密", "x": "11.4 实验：观察根尖分生区组织细胞的有丝分裂（教材 P116） 流程：培养根尖（葱/蒜，根长约 5 cm，取 2~3 mm）→ 解离（15% HCl : 95% 酒精 = 1:1，使组织细胞相互分离）→ 漂洗（清水，洗去药液防解离过度）→ 染色（甲紫溶液或醋酸洋红液 3~5 min，使染色体着色）→ 制片（弄碎根尖、压片使细胞分散）→ 镜检。 解离后细胞已死亡——不能观察到连续分裂过程，需移动装片寻找不同时期的细胞。 分生区细胞特点：呈正方形、排列紧密；先低倍镜找分生区，再高倍镜观察；视野中间期细胞最多（间期时间最长——各期细胞数目与该期持续时间成正比）。 选材要求：选分裂期占细胞周期比例大的材料便于观察分裂相。 甲紫溶液是「碱性染料」但 pH 小于 7——碱性/酸性由电离后助色基团所带电荷决定。"}, {"id": "c10s4", "ch": 10, "chT": "细胞的增殖", "t": "11.5 细胞周期调控与同步化（课件拓展）", "terms": "间期 秋水仙素抑制纺锤体形成", "x": "11.5 细胞周期调控与同步化（课件拓展） 检验点系统：G1/S 检验点（细胞是否足够大、DNA 是否损伤）、S 期检验点（DNA 复制是否正确）、G2/M 检验点、纺锤体组装检验点（中期——染色体是否都与纺锤体正确连接，如 MAD2 蛋白监控单附着染色体）、分离后检验点（染色体是否到达两极，决定是否胞质分裂）。 原癌基因（调节细胞周期、控制生长分裂进程）与抑癌基因（阻止细胞不正常增殖）协同维持细胞周期正常。 药物：抑制 DNA 复制的抗癌药使细胞停留在间期；秋水仙素抑制纺锤体形成→着丝粒正常分裂但染色体不能移向两极→染色体数目加倍（多倍体育种、中期阻断法）。 同步化方法：①DNA 合成双阻断法（胸苷/TdR 两次阻断，使细胞停在 G1/S 交界）；②秋水仙素中期阻断法；③血清饥饿法（停滞于间期）。 CDK1 蛋白（2020 山东）：推动间期→分裂期；DNA 复制未完成时 CDK1 磷酸化失活，复制完成后去磷酸化激活。 边角小字"}, {"id": "c11", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "细胞的分化、衰老和死亡", "terms": "", "x": "12 细胞的分化、衰老和死亡细胞分化 · 细胞的全能性 · 细胞的衰老 · 细胞的死亡（凋亡与自噬）"}, {"id": "c11s0", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.1 细胞分化（教材 P118-119）", "terms": "形态、结构和生理功能上发生稳定性差异 基因的选择性表达", "x": "12.1 细胞分化（教材 P118-119） 概念（黑体）：在个体发育中，由一个或一种细胞增殖产生的后代，在形态、结构和生理功能上发生稳定性差异的过程。 特点：普遍性（贯穿生命历程）、持久性/稳定性（一般保持分化后状态直到死亡）、不可逆性。 根本原因（实质）：基因的选择性表达（遗传物质 DNA 不变；mRNA、蛋白质种类改变）。 「不变与变」：不变——DNA、tRNA、rRNA、细胞数目（核 DNA）；改变——mRNA、蛋白质种类、细胞形态结构功能。 分化与分裂的关系：分裂是分化的基础，二者相伴相随；分化程度越高，分裂能力一般越低。 意义：使多细胞生物体中的细胞趋向专门化，有利于提高各种生理功能的效率。"}, {"id": "c11s1", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.2 细胞的全能性（教材 P120）", "terms": "分裂和分化后，仍具有产生完整有机体或分化成其他各种细胞的潜能和特性 全套遗传信息（全套基因） 离体 已分化的动物细胞核具有全能性 不是 生殖细胞（卵细胞）分化程度高而全能性较高", "x": "12.2 细胞的全能性（教材 P120） 概念（黑体）：细胞经分裂和分化后，仍具有产生完整有机体或分化成其他各种细胞的潜能和特性。 原因：细胞含有本物种的全套遗传信息（全套基因）。条件：①离体；②适宜的营养、激素等条件。标志：发育成完整个体或分化成其他各种细胞。 实例：植物组织培养（植物细胞全能性）；克隆羊多莉（已分化的动物细胞核具有全能性）。种子萌发长成植株不是体现全能性（胚本身是幼体，属正常发育）。 一般规律：分化程度越高，全能性越低；但生殖细胞（卵细胞）分化程度高而全能性较高（孤雌生殖）——特例。 干细胞：全能干细胞（胚胎干细胞，可发育成完整个体）→ 多能干细胞（骨髓造血干细胞）→ 专能干细胞（神经干细胞）；应用：干细胞移植治疗白血病、体外培养组织器官。"}, {"id": "c11s2", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.3 细胞的衰老（教材 P122-124）", "terms": "体积增大 体积变小 自由基学说 端粒学说 特殊序列的 DNA-蛋白质复合体 细胞普遍衰老的过程 自我更新", "x": "12.3 细胞的衰老（教材 P122-124） 特征口诀「一大一小、一多一少、两慢两低」：细胞核体积增大（核膜内折、染色质收缩）、细胞体积变小；色素（脂褐素）积累；水分减少；酶活性降低、代谢减慢；膜通透性改变、物质运输功能降低。 染色质收缩 → 影响 DNA 解旋 → 影响复制与转录。多数酶活性降低，但与衰老相关的酶活性可升高。 自由基学说：异常活泼的带电分子或基团攻击磷脂（破坏生物膜）、DNA（基因突变）、蛋白质（活性下降）→ 细胞衰老。 端粒学说：端粒是染色体两端特殊序列的 DNA-蛋白质复合体；细胞每分裂一次端粒缩短一截，内侧正常 DNA 序列受损 → 细胞活动异常。端粒酶（含 RNA 模板的逆转录酶）可补添端粒（生殖细胞、癌细胞中活跃）。 个体衰老与细胞衰老的关系：单细胞生物——细胞衰老=个体衰老；多细胞生物——个体衰老=细胞普遍衰老的过程，但年轻个体也有衰老细胞，衰老个体也有新生细胞（造血干细胞）。 正常细胞衰老有利于"}, {"id": "c11s3", "ch": 11, "chT": "细胞的分化、衰老和死亡", "t": "12.4 细胞的死亡（教材 P125-127）", "terms": "细胞凋亡（黑体） 基因所决定的细胞自动结束生命的过程 细胞坏死 被动 细胞自噬 溶酶体 激烈的细胞自噬可能诱导细胞凋亡 双层膜自噬泡", "x": "12.4 细胞的死亡（教材 P125-127） 细胞凋亡（黑体）：由基因所决定的细胞自动结束生命的过程（程序性死亡，主动、生理性、对机体有利）。实例：胚胎发育中尾的消失、指间细胞自动死亡、被病原体感染细胞的清除、成熟个体细胞的自然更新。 意义：完成正常发育、维持内部环境稳定、抵御外界干扰。机理：凋亡信号与膜受体结合 → 信号转导 → 凋亡相关基因表达 → DNase 切割 DNA、Caspase 降解蛋白 → 形成凋亡小体 → 被吞噬清除（内容物不释放到内环境）。 细胞坏死：外界不利因素导致的被动死亡，膜破裂内容物释放引发炎症，对机体有害。长期吸烟肺部细胞病变死亡属于坏死。 细胞自噬：细胞「吃掉」自身结构和物质——依赖溶酶体清除变性/错误折叠蛋白、衰老损伤细胞器；养分不足时自噬增强；产物可回收利用；激烈的细胞自噬可能诱导细胞凋亡；随年龄增长肌肉细胞自噬减弱。 白细胞凋亡速率远快于红细胞（白细胞吞噬病菌，功能损伤大）；胚胎期尾的消"}, {"id": "c12", "ch": 12, "chT": "高考考情速览与复习建议", "t": "高考考情速览与复习建议", "terms": "", "x": "附 高考考情速览与复习建议基于近年全国卷与各省真题的分布规律 必修 1 在高考中通常占选择题 3~4 个，第 1~4 章（细胞概述与分子组成）合计约 6 分。 非选择题几乎必考光合作用与细胞呼吸的综合（曲线分析、装置计算、实验设计），其次是细胞增殖图像与实验、酶实验设计。 近年高考题明显偏好教材小字与拓展信息：磷酸戊糖途径（2022 山东）、瓦堡效应（2020 全国Ⅰ）、CDK1/BYDV（2020 山东）、染色体桥（2020 山东）、细胞焦亡与凋亡对比（2025 山东）、KDEL 回收、Rubisco 光呼吸、C4 与 CAM 途径等。 复习策略：①黑体字定义逐字背；②边角小字按章过一遍；③易错判断题考前自测；④曲线题掌握「生成速率 vs 消耗速率」「总/净光合」「气体量差值」三套方法。 一册在手 · 每日一背 每章按「核心知识 → 边角小字 → "}, {"id": "c0", "ch": 0, "chT": "减数分裂和受精作用", "t": "减数分裂和受精作用", "terms": "", "x": "01 减数分裂和受精作用 必修2 第1章第1节 · 配图判读、曲线分析与配子异常是高考主线"}, {"id": "c0s0", "ch": 0, "chT": "减数分裂和受精作用", "t": "减数分裂的概念（背诵）", "terms": "减数分裂", "x": "减数分裂的概念（背诵） 减数分裂：进行有性生殖的生物，在产生成熟生殖细胞时进行的染色体数目减半的细胞分裂。染色体复制一次，细胞连续分裂两次，结果成熟生殖细胞中染色体数目比原始生殖细胞减少一半。"}, {"id": "c0s1", "ch": 0, "chT": "减数分裂和受精作用", "t": "分裂过程", "terms": "同源染色体 联会 四分体 交叉互换", "x": "分裂过程 精子形成：精原细胞 →（复制）→ 初级精母细胞 →（减Ⅰ：同源染色体分离、细胞质均分）→ 2个次级精母细胞 →（减Ⅱ：着丝粒分裂）→ 精细胞 →（变形）→ 4个精子 卵细胞形成：卵原细胞 → 初级卵母细胞 →（减Ⅰ不均等分裂）→ 次级卵母细胞 + 第一极体 →（减Ⅱ不均等 / 均等）→ 1个卵细胞 + 3个极体（极体退化消失） 关键概念 同源染色体：减Ⅰ中配对的两条染色体，形状大小一般相同，一条来自父方、一条来自母方。 联会：同源染色体两两配对（减Ⅰ前期）；联会后每对同源染色体含4条染色单体，称四分体（1四分体=1对同源=2条染色体=4条单体=2个着丝粒）。 交叉互换：四分体时期，同源染色体的非姐妹染色单体之间交换对应片段（属于基因重组）。 减Ⅰ后期：同源染色体分离（等位基因随之分离），非同源染色体自由组合；减Ⅱ后期：着丝粒分裂，姐妹染色单体分开。 易错警示 图像三步判断：①无同源染色体→减Ⅱ；②有同源且同源分离→减Ⅰ"}, {"id": "c0s2", "ch": 0, "chT": "减数分裂和受精作用", "t": "配子种类与规律", "terms": "", "x": "配子种类与规律 1个精原细胞2种4个精子（两两相同、互补） 1个卵原细胞1种1个卵细胞 个体配子种类n对同源染色体（不考虑互换）→ 2n 种 互换率发生交换的初级精母细胞比例 = 重组型配子比例 × 2 易错警示 异常配子：减Ⅰ同源染色体未分离→4个配子全部异常；减Ⅱ着丝粒分裂后单体未移向两极→2个正常、2个异常。异常精子 XbY 与 X 卵结合→XXY（21 三体综合征的形成机理与之同类，见课后题）；减Ⅱ时 Y 单体未分开→含 YY 的精子→XYY。"}, {"id": "c0s3", "ch": 0, "chT": "减数分裂和受精作用", "t": "受精作用", "terms": "透明带反应 卵细胞膜反应", "x": "受精作用 过程：精子头部进入卵细胞，尾部留外；透明带反应、卵细胞膜反应阻止多个精子入卵。 意义（背诵）：受精卵的染色体数目恢复到本物种体细胞数目，其中一半来自精子、一半来自卵细胞；配子多样性 + 精卵随机结合 → 同一双亲后代呈多样性。 减数分裂使染色体减半、受精作用使之恢复，对维持每种生物前后代染色体数目的恒定，以及遗传和变异，都具有重要意义。 边角小字 观察蝗虫精母细胞减数分裂实验（P24）：选雄性生殖器官——精母细胞数量多且持续分裂，而卵巢中减Ⅱ常未完成、形成的卵细胞少；装片中视野方向不一的分裂相多；雄蜂（单倍体）无同源染色体，经特殊的假减数分裂仍能产生精子，且具有一整套基因。 高考真题链接 山东卷（2022/2023/2024/2026）反复考查：减Ⅱ姐妹染色单体互锁、环状染色体交换后子细胞基因组成、配子异常的成因判定——核心抓手是\"减Ⅰ异常→全异常；减Ⅱ异常→半数异常\"。"}, {"id": "c1", "ch": 1, "chT": "基因的分离定律", "t": "基因的分离定律", "terms": "", "x": "02 基因的分离定律 必修2 第1章第2节 · 假说-演绎法与显隐性判断是方法学核心"}, {"id": "c1s0", "ch": 1, "chT": "基因的分离定律", "t": "实验材料与基本操作", "terms": "自交 相对性状 等位基因", "x": "实验材料与基本操作 豌豆优点：①自花传粉、闭花受粉，自然状态下都是纯种；②具有易于区分的相对性状；③生长周期短、后代数量大；④花大，易操作。 果蝇优点：易饲养、繁殖快、后代数量多；相对性状多而明显；染色体少、易观察。玉米优点：繁殖快、后代多；相对性状明显；雌雄同株异花，杂交易操作。 人工异花传粉：花蕾期人工去雄 → 套袋 → 人工授粉 → 再套袋（母本去雄须在开花前）。 基本概念 自交：基因型相同个体间交配（闭花授粉、同株授粉）；杂交：基因型不同个体交配；测交：与隐性纯合子杂交。 相对性状：一种生物同一种性状的不同表现类型；性状分离：杂种后代中同时出现显性性状和隐性性状。 等位基因：同源染色体相同位置上控制相对性状的基因（纯合子同位置为相同基因；本质区别是碱基排列顺序不同）。 融合遗传≠不完全显性：紫茉莉红×白→粉花，粉花自交后代 1红:2粉:1白，可重新出现红、白，属于颗粒遗传。"}, {"id": "c1s1", "ch": 1, "chT": "基因的分离定律", "t": "假说-演绎法（背诵）", "terms": "", "x": "假说-演绎法（背诵） 四步：提出问题 → 提出假说 → 演绎推理（若假说成立，测交后代应为 1:1）→ 实验验证（实际 1:1）→ 得出结论 假说内容：①生物性状由遗传因子决定；②体细胞中遗传因子成对存在；③形成配子时每对遗传因子分离，分别进入不同配子；④受精时雌雄配子随机结合。 核心：F1 产生数量相等的两种配子。测交后代比例反映被测个体配子种类及比例。"}, {"id": "c1s2", "ch": 1, "chT": "基因的分离定律", "t": "分离定律的实质与验证", "terms": "等位基因随同源染色体的分开而分离", "x": "分离定律的实质与验证 实质（背诵·P32）：杂合子细胞中，位于一对同源染色体上的等位基因具有一定的独立性；在减数分裂形成配子时，等位基因随同源染色体的分开而分离，独立地随配子遗传给后代（减Ⅰ后期）。 易错警示 符合分离定律不一定出现 3:1，3:1 成立需同时满足：①配子成活率均等；②基因型个体成活率均等；③子代数目足够多；④完全显性；⑤等位基因仅一对且无致死。最能说明实质的是 F1 产生配子比为 1:1。 特殊分离比 显性纯合致死杂合子自交 → 显:隐 = 2:1 隐性纯合致死杂合子自交 → 后代全显性 配子致死如 AB 雄配子致死 → 5:3:3:1 变式（见第3章）"}, {"id": "c1s3", "ch": 1, "chT": "基因的分离定律", "t": "应用一：显隐性判断", "terms": "", "x": "应用一：显隐性判断 定义法（杂交）：两不同性状亲本杂交，子代只出现一种性状→子代性状为显性；同性状亲本杂交出现分离→新性状为隐性。 自交法：自交后代出现性状分离→亲本为显性（适用于植物，最简便）。 动物判断显隐性：多对杂交统计比例（单次交配后代少，不能直接下结论）。"}, {"id": "c1s4", "ch": 1, "chT": "基因的分离定律", "t": "应用二：纯合子/杂合子鉴定", "terms": "", "x": "应用二：纯合子/杂合子鉴定 方法操作与判断适用 自交后代无性状分离→纯合子；有分离→杂合子植物（最简便） 测交×隐性纯合子，子代一种性状→纯合；两种→杂合动物（雄性需与多只隐性雌性交配）、植物均可 花粉鉴定两种花粉1:1→杂合（如糯性与非糯性碘染）仅部分特殊植物，最直接证明"}, {"id": "c1s5", "ch": 1, "chT": "基因的分离定律", "t": "应用三：连续自交与自由交配", "terms": "", "x": "应用三：连续自交与自由交配 杂合子连续自交 n 代Aa 占 (1/2)n；纯合子 1−(1/2)n；显纯=隐纯=[1−(1/2)n]/2 连续自交逐代淘汰 aaAA:Aa 比例每代不变，淘汰后按比例重新归一化 自由交配基因频率不变，基因型频率自 F1 起稳定（遗传平衡） 高频考点 性状分离比模拟实验：甲乙两桶代表雌雄生殖器官，彩球代表配子，两色球代表两种配子；随机抓取组合模拟雌雄配子随机结合。要求：每桶两色球数量相等、抓取随机、记录后放回摇匀、重复 30 次以上以减少误差。"}, {"id": "c2", "ch": 2, "chT": "基因的自由组合定律", "t": "基因的自由组合定律", "terms": "", "x": "03 基因的自由组合定律 必修2 第1章第2节 · 9:3:3:1 变式与两对基因位置判断是解题难点"}, {"id": "c2s0", "ch": 2, "chT": "基因的自由组合定律", "t": "两对相对性状的杂交实验", "terms": "重组类型", "x": "两对相对性状的杂交实验 F1 全为黄圆（黄对绿、圆对皱均为显性）；F2 出现亲本没有的重组类型，四种表现型之比 9:3:3:1。 每一对相对性状单独分析均符合分离定律（黄:绿=3:1，圆:皱=3:1）。 F2 结构：4种纯合子各占 1/16；4种单杂合子各占 2/16；双杂合子 YyRr 占 4/16。 测交结果 1:1:1:1，可检测 F1 配子种类及比例、基因型、纯合杂合。"}, {"id": "c2s1", "ch": 2, "chT": "基因的自由组合定律", "t": "实质（背诵）", "terms": "同源染色体上的等位基因分离的同时，非同源染色体上的非等位基因自由组合", "x": "实质（背诵） 同源染色体上的等位基因分离的同时，非同源染色体上的非等位基因自由组合（减Ⅰ后期）。两定律同时进行、同时起作用；自由组合发生在产生配子时，配子的随机结合不属于自由组合。 易错警示 非等位基因不一定位于非同源染色体上——同一条染色体上的多个基因也是非等位基因，但不能自由组合（连锁）。\"非同源染色体自由组合，使所有非等位基因自由组合\"错误。"}, {"id": "c2s2", "ch": 2, "chT": "基因的自由组合定律", "t": "解题方法：先分后合（乘法原理）", "terms": "", "x": "解题方法：先分后合（乘法原理） 正推：AaBb×Aabb → 子代基因型 3×2=6 种，表现型 2×2=4 种；某基因型概率=两对概率相乘。 逆推：由子代表现型及比例倒推双亲基因型（先拆分每对性状）。 两种遗传病概率：每对先算，再乘（自由组合为前提）。 分解组合法的前提是两对基因独立遗传（配子中比例互不干扰）；若配子比例随搭配改变则不适用（连锁）。"}, {"id": "c2s3", "ch": 2, "chT": "基因的自由组合定律", "t": "9:3:3:1 的变式（高频）", "terms": "", "x": "9:3:3:1 的变式（高频） F2 分离比原因（配子致死类用棋盘法：列出配子→删除致死→重新归纳） 5:3:3:1AB 的雄配子或雌配子致死 7:3:1:1Ab 的雄配子或雌配子致死 7:1:3:1aB 的雄配子或雌配子致死 8:2:2ab 的雄配子或雌配子致死 6:3:2:1AA 或 BB 显性纯合致死 4:2:2:1AA 和 BB 同时显性纯合致死 3:1aa 或 bb 隐性纯合致死 9:3:3aabb 受精卵（胚胎）致死"}, {"id": "c2s4", "ch": 2, "chT": "基因的自由组合定律", "t": "验证自由组合的四种方法", "terms": "", "x": "验证自由组合的四种方法 自交法：F1（AaBb）自交后代 9:3:3:1； 测交法：后代 1:1:1:1； 花粉鉴定法：四种花粉 1:1:1:1； 单倍体育种法：花药培养加倍后四种表现型 1:1:1:1。"}, {"id": "c2s5", "ch": 2, "chT": "基因的自由组合定律", "t": "两对基因的位置判断（连锁与互换）", "terms": "", "x": "两对基因的位置判断（连锁与互换） 同一对同源染色体·不考虑互换完全连锁：自交后代全显性或 显:隐=3:1（比例型同单基因）；测交后代 1:1 同一对同源染色体·考虑互换重组型配子少：测交后代两多两少；自交后代两种单显性比例始终相等 亲本型判断aabb 占比＞1/16 → ab 为亲本型配子；＜1/16 → ab 为重组型配子"}, {"id": "c2s6", "ch": 2, "chT": "基因的自由组合定律", "t": "杂交育种", "terms": "", "x": "杂交育种 植物：选纯合双亲杂交 → F1 自交 → F2 选优 → 连续自交至不再发生性状分离（可用分区域种植法加快）。动物：杂交 → 选优 → 与隐性（或双隐）类型测交检验纯合度，不通过逐代自交。 若所需优良性状为种子（果实）性状，当年即可收获选用；若为植株性状，需种到植株表现性状再选。 高频考点 2022 山东卷：6种纯合突变体互交判突变基因——\"突×突→突\"为相同基因突变（非等位），\"突×突→野\"为不同基因突变。"}, {"id": "c3", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "基因在染色体上、伴性遗传与人类遗传病", "terms": "", "x": "04 基因在染色体上、伴性遗传与人类遗传病 必修2 第2章 · 系谱图判断与正反交设计是考试必出题型"}, {"id": "c3s0", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "萨顿假说（类比推理法）", "terms": "", "x": "萨顿假说（类比推理法） 依据：基因和染色体的行为存在明显的平行关系——①基因在体细胞中成对、染色体也成对；②体细胞中一对基因一个来自父方一个来自母方，同源染色体亦然；③形成配子时成对的基因（染色体）一个进入配子；④非同源染色体自由组合时，非同源染色体上的非等位基因也自由组合。结论：基因在染色体上。"}, {"id": "c3s1", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "摩尔根实验（假说-演绎法）", "terms": "呈线性排列", "x": "摩尔根实验（假说-演绎法） 提出问题：F1 全红眼、F2 3:1 且白眼只在雄性中出现。 假说：控制白眼的基因 w 位于 X 染色体上，Y 染色体上不含其等位基因。 验证：F1 红眼雌 × 白眼雄 → 4种表型 1:1:1:1；关键证据是白眼雌 × F1 红眼雄 → 子代雌全红、雄全白（1:1）。 结论：基因在染色体上；后又发明测定基因相对位置的方法（三点测交），证明基因在染色体上呈线性排列。 边角小字 测交实验不能排除\"基因位于 XY 同源区段\"的假说——可用反交实验（白眼雌 × 红眼雄）排除：若子代雌全红、雄全白且与假说预测矛盾即可排除。荧光标记的 DNA 探针与染色体杂交可直观显示基因位置。 易错警示 基因并非全部位于染色体上：线粒体、叶绿体、原核拟核与质粒、病毒中的基因无染色体。X、Y 染色体同源区段存在等位基因，非同源区段没有。果蝇的 Y 染色体比 X 大（P31）。"}, {"id": "c3s2", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "性别决定与伴性遗传", "terms": "", "x": "性别决定与伴性遗传 XY 型：含两个 X 为雌性，XY 为雄性；性别比例 1:1 的原因是含 X 与含 Y 的精子比例 1:1。ZW 型：ZZ 雄、ZW 雌（鸟类、蛾类）。 性别决定不全是 XY/ZW：有的取决于染色体数目，有的取决于环境（如后螠）；雌雄同体生物无性染色体。 类型实例特点 伴X隐性红绿色盲、血友病隔代遗传；男患者多于女；女病其父、子必病（交叉遗传） 伴X显性抗维生素D佝偻病世代连续；女患者多于男；男病其母、女必病 伴Y外耳道多毛症限雄遗传，父传子、子传孙，世代连续，无显隐之分 细胞质线粒体基因病母系遗传：子女表现型与母亲相同 易错警示 XY 同源区段（Ⅰ）：基因男女都可患病，男患病率可能≠女；X 特有区段（Ⅱ）：隐性病男＞女；Y 特有区段（Ⅲ）：患者全为男性。伴X隐性致病基因：男患者只能来自母亲、只能传给女儿。"}, {"id": "c3s3", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "遗传系谱图判断（准确/最可能）", "terms": "", "x": "遗传系谱图判断（准确/最可能） 三步：先排除伴Y遗传和细胞质遗传（母系）→ 判显隐性：\"无中生有为隐性，有中生无为显性\" → 判位置：女病其父、子全病→伴X隐性；男病其母、女全病→伴X显性；否则常染色体。\"可能\"与\"最可能\"审题：可能一般有多种，最可能只有一种。 正反交的应用（一代交配判位置） 未知显隐性：正反交结果不同（有性别差异）→伴X；结果相同（无性别差异）→常染色体；后代总与母本相同→细胞质遗传。 已知显隐性：用\"同隐异显\"（隐性雌 × 显性纯合雄）判断常/伴X。 判断父本/母本来源致死：双杂合子分别作父本、母本分别测交比较。"}, {"id": "c3s4", "ch": 3, "chT": "基因在染色体上、伴性遗传与人类遗传病", "t": "人类遗传病", "terms": "", "x": "人类遗传病 单基因遗传病：受一对等位基因控制，符合分离定律（白化病、红绿色盲、抗维生素D佝偻病）。 多基因遗传病：两对以上等位基因控制，群体发病率高，易受环境影响（原发性高血压、青少年型糖尿病）。 染色体异常遗传病：猫叫综合征=5号染色体片段缺失；21三体综合征=体细胞多一条21号染色体（是\"三条染色体\"而非三个染色体组）。 易错警示 五个\"不一定\"：携带致病基因不一定患病（女性携带者）；不携带致病基因也可能患病（染色体异常病）；先天性疾病不一定遗传；家族性疾病不一定遗传（缺维生素A夜盲）；遗传病不一定出生即表现。人类所有的病不都是基因病。 高频考点 调查：发病率→在广大人群随机抽样、群体足够大、选发病率较高的单基因遗传病；遗传方式→在患者家系中调查。多基因遗传病易受环境影响，不宜作为调查对象。基因组测序：人测 24 条（22常+X+Y），玉米（2n=20）测 11 条，果蝇同理。 高考真题链接 伴X基因频率在男女中相等（交叉遗"}, {"id": "c4", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "DNA 是主要的遗传物质", "terms": "", "x": "05 DNA 是主要的遗传物质 必修2 第3章第1节 · 三大经典实验的过程、结论与异常分析必须记准"}, {"id": "c4s0", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "肺炎链球菌转化实验", "terms": "转化因子", "x": "肺炎链球菌转化实验 材料特点：S型菌有多糖类荚膜、有毒、菌落光滑；R型菌无荚膜、无毒、菌落粗糙（P43）。 格里菲思体内转化：加热杀死的S型菌 + 活R型菌 → 小鼠死亡，体内分离出活S型菌 → 加热杀死的S型菌中含有\"转化因子\"，使R型转化为S型。 艾弗里体外转化：S型菌破碎→去除绝大部分糖类、蛋白质和脂质制成细胞提取物→分别加入蛋白酶、RNA酶、酯酶、DNA酶（减法原理：每组特异性去除一种物质）→只有 DNA 酶组转化消失 → DNA 是遗传物质，蛋白质等不是。 边角小字 加热致死后 DNA 仍保持活性的原因：80~100℃ 时蛋白质变性失活，而 DNA 双链解开、温度恢复后可复性（P43 小字）。转化的实质是基因重组；转化效率低，只有少部分R型菌转化。艾弗里实验还证明 DNA 可在同种生物不同个体间转移（为基因工程奠基，Ca²⁺处理大肠杆菌=人工转化）。"}, {"id": "c4s1", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "噬菌体侵染细菌实验", "terms": "", "x": "噬菌体侵染细菌实验 四步：①标记噬菌体：先分别用含 ³⁵S、³²P 的培养基培养大肠杆菌，再用其培养噬菌体 → ②侵染未标记的大肠杆菌 → ③搅拌（使吸附在细菌上的噬菌体与细菌分离）→ ④离心（轻的噬菌体颗粒进上清液，重的细菌留沉淀）→ ⑤检测放射性 ³⁵S 标记蛋白质理论上沉淀物无放射性；实测有少量→搅拌不充分，噬菌体仍吸附在细菌表面 ³²P 标记 DNA理论上上清液无放射性；实测有少量→保温过短（未全部侵入）或过长（细菌裂解释放子代） 结论DNA 是遗传物质，蛋白质不是（有争议说\"没证明\"） 易错警示 ①不能用培养基直接培养噬菌体（病毒必须寄生）；②³⁵S、³²P 必须分两组分别标记（同位素检测只能定位不能辨元素）；③不能标记 C、H、O、N（DNA 与蛋白质共有）；④短时间保温=让噬菌体充分侵染又不裂解释放；⑤实验间接证明 DNA 能自我复制、指导蛋白质合成，不能证明 DNA 可产生可遗传变异；⑥子代噬菌体只有少数被 ³²"}, {"id": "c4s2", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "烟草花叶病毒的重建实验", "terms": "", "x": "烟草花叶病毒的重建实验 烟草花叶病毒侵染烟草细胞时，RNA 与蛋白质没有分开（完整病毒侵入），故 TMV 实验不能用噬菌体的操作思路（噬菌体只向细菌注入 DNA，两者天然分开）。 方法：人工分离提纯 RNA 与蛋白质，分别感染烟草 → RNA 组出现病斑并分离出正常 TMV → RNA 是烟草花叶病毒的遗传物质。"}, {"id": "c4s3", "ch": 4, "chT": "DNA 是主要的遗传物质", "t": "总结与辨析", "terms": "", "x": "总结与辨析 高频考点 实验共同设计思路（考填空）：将 DNA、蛋白质等物质分开，单独、直接观察各自的作用（分离提纯法/减法原理/同位素标记）。 结论：真核、原核生物及 DNA 病毒的遗传物质都是 DNA；少数病毒（HIV、流感、新冠、烟草花叶病毒）是 RNA → DNA 是主要的遗传物质（统计分析结论，非实验直接验证）。细胞生物的遗传物质只能是 DNA。 高考真题链接 2017 全国Ⅰ卷：判断新病毒类型需甲、乙两组相互印证——用标记特定碱基（如分别标记 T 或 U）的宿主细胞培养病毒，检测子代放射性确定核酸种类。"}, {"id": "c5", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "DNA 的结构、基因的本质与 DNA 复制", "terms": "", "x": "06 DNA 的结构、基因的本质与 DNA 复制 必修2 第3章第2、3节 · 碱基计算与半保留复制证据是计算题主线"}, {"id": "c5s0", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "DNA 双螺旋结构的特点（背诵·P50）", "terms": "碱基互补配对原则", "x": "DNA 双螺旋结构的特点（背诵·P50） 由两条脱氧核苷酸长链构成，按反向平行方式盘旋成双螺旋结构。 外侧：脱氧核糖与磷酸交替连接构成基本骨架；内侧：碱基通过氢键形成碱基对（A=T，G≡C），遵循碱基互补配对原则。 A=T 之间2个氢键，G≡C 之间3个氢键 → G-C 碱基对越多 DNA 越稳定（耐高温）。 1个双链 DNA 含 2个游离磷酸基团、0个游离脱氧核糖；每个磷酸基团连接1~2个脱氧核糖（2个游离磷酸各只连1个），每个脱氧核糖连接1~2个磷酸。 模型构建：沃森、克里克（构建物理模型）；富兰克林拍摄\"照片51号\"（X射线衍射）；威尔金斯展示照片；查哥夫法则（A=T、G=C）提供化学依据。 边角小字 两条链反向平行的意义：DNA 两条链走向相反，使碱基对能整齐配对排布（P50）。酶与化学键：解旋酶、高温断氢键；DNA 聚合酶、DNA 连接酶形成磷酸二酯键；限制酶、DNA 酶破坏磷酸二酯键。"}, {"id": "c5s1", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "碱基计算", "terms": "", "x": "碱基计算 不互补碱基之和恒定A+G = T+C = 50% 互补碱基比例相等单链(A+T)% = 互补链(A+T)% = 双链(A+T)% 氢键数n对碱基中G-C有m对：2(n−m)+3m = 2n+m 磷酸二酯键2n−2 个（n为碱基对数）"}, {"id": "c5s2", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "遗传信息与基因的本质（背诵）", "terms": "遗传信息 基因 遗传效应", "x": "遗传信息与基因的本质（背诵） 遗传信息：基因中 4 种碱基（脱氧核苷酸）的排列顺序。多样性：碱基对的数目和排列顺序千变万化；特异性：每种生物有特定的碱基排列顺序（β-珠蛋白基因1700对→41700 种排列）。 基因：通常是有遗传效应的 DNA 片段。基因在 DNA 上不连续分布（被碱基序列分隔）；染色体是 DNA 的主要载体，基因在染色体上呈线性排列；RNA 病毒的基因在 RNA 上。 数量关系：1条染色体含1个（无单体）或2个（有单体）DNA，DNA 上有许多基因；基因中脱氧核苷酸排列顺序代表遗传信息。"}, {"id": "c5s3", "ch": 5, "chT": "DNA 的结构、基因的本质与 DNA 复制", "t": "DNA 的复制（背诵·P56）", "terms": "冈崎片段", "x": "DNA 的复制（背诵·P56） 时间有丝分裂间期、减数第一次分裂前的间期 场所主要细胞核；其次线粒体、叶绿体；原核在拟核、质粒 条件模板（两条母链）、原料（4种游离脱氧核苷酸）、能量、酶（解旋酶、DNA聚合酶等） 过程解旋 → 合成子链 → 重新螺旋（边解旋边复制） 特点半保留复制；多起点、双向复制 结果与意义1个DNA→2个完全相同的DNA；保持遗传信息连续性 高频考点 准确复制的原因：①独特的双螺旋结构提供精确模板；②碱基互补配对保证准确进行。方向：DNA 聚合酶只能催化子链 5'→3' 延伸（从引物 3' 端连接脱氧核苷酸）→ 后随链形成冈崎片段（不连续，由 DNA 连接酶连接）；两条链反向平行+酶的方向性 → 双向复制。引物：DNA 聚合酶不能从头合成，需 RNA 引物，随后被替换保证准确性。 半保留复制的实验证据（梅塞尔森、斯塔尔） 方法：假说-演绎法 + 同位素标记技术（¹⁵N）+ 密度梯度离心技术。 流程：¹⁵N "}, {"id": "c6", "ch": 6, "chT": "基因的表达", "t": "基因的表达", "terms": "", "x": "07 基因的表达 必修2 第4章 · 转录翻译全程、中心法则与表观遗传"}, {"id": "c6s0", "ch": 6, "chT": "基因的表达", "t": "RNA 与密码子", "terms": "密码子 反密码子", "x": "RNA 与密码子 RNA 适合做信使的原因（P65）：能储存遗传信息；一般为单链、比 DNA 短，能通过核孔从细胞核转移到细胞质。 3种 RNA：mRNA——携带遗传信息，翻译的模板；tRNA——识别并转运氨基酸、识别密码子；rRNA——构成核糖体，催化肽键形成。RNA 还是 RNA 病毒的遗传物质、少数酶的成分。3种 RNA 都是转录产物，都参与翻译。 密码子：mRNA 上决定一个氨基酸的 3 个相邻碱基，共 4³=64 种（3 种终止密码子、61 种决定氨基酸）；反密码子在 tRNA 上。一种密码子只决定一种氨基酸，一种氨基酸可由一种或多种密码子决定。 边角小字 简并性意义（P67 思考·讨论）：①碱基改变可能不改变氨基酸，增强容错性；②多种密码子编码同一氨基酸可保证翻译速度。通用性：所有生物共用一套密码子（病毒基因导入宿主仍表达病毒蛋白）。特殊：原核 GUG 可作起始密码子；UGA 特殊情况编码硒代半胱氨酸。"}, {"id": "c6s1", "ch": 6, "chT": "基因的表达", "t": "转录", "terms": "启动子 终止子", "x": "转录 场所：主要细胞核（也在线粒体、叶绿体、拟核、质粒）；模板：DNA 的一条链（模板链/反义链）；原料：4种游离核糖核苷酸；酶：RNA 聚合酶（兼具解旋、识别结合启动子、连接磷酸二酯键功能）；产物 mRNA 等。 mRNA 延伸方向 5'→3'；转录与复制都遵循碱基互补配对，保证信息传递准确。 启动子：基因上游，RNA 聚合酶识别结合位点，本身不被转录；终止子：编码区下游，终止转录（RNA 水平形成茎-环结构）。 起始密码子、终止密码子位于 mRNA 上；一个基因的有义链可能是另一基因的反义链。"}, {"id": "c6s2", "ch": 6, "chT": "基因的表达", "t": "翻译", "terms": "肽键", "x": "翻译 场所：核糖体；模板：mRNA；原料：20种氨基酸；搬运工：tRNA（一种 tRNA 只转运一种氨基酸）；方向：核糖体沿 mRNA 由 5'→3' 移动（肽链从 N 端向 C 端合成），mRNA 不移动。 核糖体有 2 个 tRNA 结合位点；氨基酸间脱水缩合形成肽键；遇终止密码子合成终止。 准确翻译的原因：mRNA 提供精确模板 + 碱基互补配对（密码子-反密码子）。 多聚核糖体（P69）：一个 mRNA 上结合多个核糖体同时翻译→少量 mRNA 迅速合成大量蛋白质；按肽链长短判断先后（长的在前）。各核糖体产物完全相同。 时空：真核——核内转录、质内翻译，时空分隔；原核——边转录边翻译；线粒体、叶绿体同原核。"}, {"id": "c6s3", "ch": 6, "chT": "基因的表达", "t": "数量关系与中心法则", "terms": "", "x": "数量关系与中心法则 碱基数比例基因 : mRNA : 氨基酸 ≈ 6 : 3 : 1；实际不符原因：内含子转录后被剪切、非编码区不转录、终止密码子不编码氨基酸、肽链加工剪切 中心法则：DNA复制、转录、翻译三主线 + RNA复制（烟草花叶病毒）+ 逆转录（HIV）。 RNA 复制酶、逆转录酶由病毒自身基因组编码、在宿主细胞合成。 体现基因两大功能：传递遗传信息（复制）与表达遗传信息（转录、翻译）。 不同细胞：分裂旺盛细胞三条途径都有；高度分化细胞只有转录翻译；哺乳动物成熟红细胞无。 遗传密码破译（P70）：尼伦伯格体外合成实验——人工多聚尿嘧啶核苷酸（UUU）→多聚苯丙氨酸；需除去提取液中 DNA 和 mRNA 排除干扰。"}, {"id": "c6s4", "ch": 6, "chT": "基因的表达", "t": "基因与性状的关系（背诵·P71）", "terms": "酶的合成控制代谢过程 蛋白质的结构 选择性表达", "x": "基因与性状的关系（背诵·P71） 间接控制：基因通过控制酶的合成控制代谢过程，进而控制性状——白化病（酪氨酸酶）、豌豆皱粒（淀粉分支酶）。 直接控制：基因通过控制蛋白质的结构直接控制性状——镰刀型细胞贫血（血红蛋白）、囊性纤维化（CFTR）。 基因与性状不都是一一对应：一个基因可影响多个性状，一个性状可受多个基因影响；表型 = 基因型 + 环境（单双眼皮、表型模拟）。 细胞分化的实质：基因的选择性表达；不同细胞 mRNA 不同，但 tRNA、rRNA 无差异。"}, {"id": "c6s5", "ch": 6, "chT": "基因的表达", "t": "表观遗传（P74）", "terms": "碱基序列保持不变 基因表达和表型发生可遗传变化", "x": "表观遗传（P74） 概念（背诵）：生物体基因的碱基序列保持不变，但基因表达和表型发生可遗传变化的现象。 机制：①DNA 甲基化；②组蛋白甲基化/乙酰化；③RNA 干扰——主要影响转录过程。 特点：可遗传、可逆（甲基化可去）；不遵循孟德尔遗传规律；通过有丝分裂、减数分裂传递。 实例：柳穿鱼花形、小鼠毛色、蜂王浆使幼虫发育成蜂王（减少 DNA 甲基化改变基因表达）。 高考真题链接 遗传印记（甲基化随配子重建）常考：亲代雌鼠某基因来自父方（雄配子印记去甲基化）；反义 RNA 与 mRNA 形成双链阻断翻译=基因沉默，杂交分子含 4 种核苷酸、4 种碱基。"}, {"id": "c7", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "基因突变、基因重组和染色体变异", "terms": "", "x": "08 基因突变、基因重组和染色体变异 必修2 第5章 · 三种可遗传变异比较与育种方法选择"}, {"id": "c7s0", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "基因突变", "terms": "替换、增添或缺失 碱基序列的改变 普遍性、随机性、不定向性、低频性、多害少利性", "x": "基因突变 概念（背诵·P81）：DNA 分子中发生碱基的替换、增添或缺失，而引起的基因碱基序列的改变。 时间：主要是有丝分裂前的间期、减数第一次分裂前的间期（DNA 复制时出现差错）；原因：物理、化学、生物因素（诱发）+ 自发突变。 5个特点：普遍性、随机性、不定向性、低频性、多害少利性。 意义：产生新基因的途径；生物变异的根本来源；为生物进化提供原材料。 易错警示 一定改变：碱基序列、遗传信息、基因种类（突变产生原基因的等位基因）；不一定改变：氨基酸序列（密码子简并性）、生物性状（隐性突变、突变发生在非编码区或内含子、个别氨基酸改变不影响蛋白功能）；基因数目和位置不变。能否遗传：发生在配子中→遵循遗传规律传给后代；体细胞→一般不能（植物可通过无性生殖）；父方细胞质基因突变一般不传子代。基因突变光镜下不可见；红细胞（无核无线粒体）不会突变。 显性/隐性突变判断：将突变体与未突变体（野生型）杂交——子一代全为野生型→隐性突变；子一"}, {"id": "c7s1", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "基因重组", "terms": "", "x": "基因重组 类型：①减Ⅰ后期——非同源染色体上非等位基因自由组合；②减Ⅰ前期（四分体时期）——同源染色体非姐妹染色单体间交叉互换。 本质：原有基因的重新组合，产生新基因型，不产生新基因。广义还包括基因工程、肺炎链球菌的转化。 意义：生物变异的来源之一；形成生物多样性的重要原因；为进化提供原材料（配子多样化→有性生殖加快进化，P84/P122）。 判断：基因重组不发生在受精作用中；姐妹染色单体间\"交换\"不属于基因重组；Aa 自交的性状分离是等位基因分离所致，不是基因重组。"}, {"id": "c7s2", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "三种可遗传变异的比较", "terms": "", "x": "三种可遗传变异的比较 项目基因突变基因重组染色体变异 适用范围所有生物（含病毒）均可发生真核生物有性生殖核基因；人工基因工程真核生物 发生时间间期（DNA复制时）减Ⅰ前期、减Ⅰ后期随时可发生 结果产生新基因产生新基因型基因数目或排列顺序改变 光镜观察不可见（分子水平）不可见可见（细胞水平） 意义变异的根本来源变异来源之一变异来源之一 易错警示 互换 vs 易位：互换发生在同源染色体的非姐妹染色单体之间（基因重组，不可见）；易位发生在非同源染色体之间（染色体结构变异，可见）。基因突变 vs 染色体缺失：基因突变是基因内若干碱基对的改变；染色体缺失是 DNA 上若干基因的缺失。姐妹染色单体上出现等位基因：基因突变或交叉互换均可导致。"}, {"id": "c7s3", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "染色体结构变异", "terms": "缺失 重复 倒位 易位", "x": "染色体结构变异 四种类型：缺失（猫叫综合征=5号缺失）、重复、倒位、易位——基因的数目或排列顺序发生改变。判读依据：染色体上基因数目或排列顺序改变；联会时可出现缺失环、重复环、倒位环、十字形（易位）。"}, {"id": "c7s4", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "染色体数目变异与染色体组", "terms": "染色体组 单倍体", "x": "染色体数目变异与染色体组 染色体组（背诵·P87）：细胞中的一组非同源染色体，形态和功能各不相同，携带着控制生物生长发育的全部遗传信息。 组数判断：①同种形态染色体有几条→几个组；②基因型中同一字母（不分大小写）出现几次→几个组（AaBb=2组、AAaaBbbb=4组）。 二倍体：受精卵发育、含2个组；多倍体：受精卵发育、含3个及以上组；单倍体：体细胞染色体数与本物种配子相同——由配子直接发育，不论几个组都是单倍体（雄蜂、四倍体的单倍体含2组）。 育性：染色体组为偶数、能联会→一般可育；奇数→联会紊乱→高度不育（三倍体、骡）。异源多倍体的单倍体加倍后仍可能是杂合子。"}, {"id": "c7s5", "ch": 7, "chT": "基因突变、基因重组和染色体变异", "t": "育种方法", "terms": "纺锤体形成", "x": "育种方法 方法原理方法要点优缺点 杂交育种基因重组杂交→自交→选优→连续自交至纯合集中双亲优良性状、操作简单；时间长 诱变育种基因突变物理化学因素处理萌发种子/幼苗提高突变率、大幅改良；盲目、需大量材料 单倍体育种染色体数目变异花药离体培养→单倍体幼苗→秋水仙素加倍→纯合子明显缩短育种年限，后代全纯合；技术复杂 多倍体育种染色体数目变异秋水仙素/低温处理萌发的种子或幼苗茎秆粗壮、果实种子大、营养高；发育迟缓、结实率低 基因工程基因重组定向改造生物性状（外源基因表达）定向、高效；克服远缘杂交不亲和 秋水仙素/低温原理：作用于分裂前期，抑制纺锤体形成→染色体不能移向两极→细胞不分裂→染色体数目加倍（秋水仙素诱导基因突变则作用于间期）。 无子西瓜（P91）：二倍体×四倍体→三倍体种子→种下，授二倍体花粉刺激子房发育→三倍体无子西瓜（联会紊乱不育故无子）。两次授粉：第一次授粉（四倍体 × 二倍体）获得三倍体种子；第二次给三倍体植株授二倍"}, {"id": "c8", "ch": 8, "chT": "生物的进化", "t": "生物的进化", "terms": "", "x": "09 生物的进化 必修2 第6章 · 现代生物进化理论五大要点与基因频率计算"}, {"id": "c8s0", "ch": 8, "chT": "生物的进化", "t": "进化理论的发展", "terms": "", "x": "进化理论的发展 拉马克：用进废退、获得性遗传——进步：否定物种不变论、所有生物由更古老生物进化而来；局限：认为变异是定向的（环境变化直接导致物种改变）。 达尔文：①共同由来学说（所有生物由原始的共同祖先进化而来，揭示生物的统一性）；②自然选择学说——过度繁殖（基础）、生存斗争（动力）、遗传变异（内因）、适者生存（结果），揭示生物的多样性和适应性。 自然选择学说局限（P109）：对遗传变异的认识局限于性状水平，不能解释本质；研究对象局限于个体水平；认为物种形成是渐变的，不能解释物种大爆发。"}, {"id": "c8s1", "ch": 8, "chT": "生物的进化", "t": "共同由来学说的证据", "terms": "化石", "x": "共同由来学说的证据 化石：保存在地层中的古代生物遗体、遗物或生活痕迹——研究生物进化最直接、最重要的证据；越早地层生物越低等、越简单，证实生物由共同祖先经漫长地质年代逐渐进化（简单→复杂、低等→高等、水生→陆生，P101）。 比较解剖学：同源器官（人的上肢与其他脊椎动物前肢结构一致）→共同祖先，适应不同环境出现形态功能差异。 胚胎学：人及脊椎动物胚胎发育都经历鳃裂、尾阶段。 细胞和分子水平：都含 DNA、细胞色素 C 氨基酸序列高度相似、密码子通用、都遵循中心法则；DNA/蛋白质差异大小反映亲缘关系远近与出现顺序。"}, {"id": "c8s2", "ch": 8, "chT": "生物的进化", "t": "适应的形成（P107-108）", "terms": "可遗传变异 自然选择 可遗传的有利变异 定向选择", "x": "适应的形成（P107-108） 适应的两层含义：形态结构适合完成一定功能；形态结构及其功能适合该生物在一定环境中生存和繁殖。 特点：普遍性（拟态、保护色）+ 相对性（雷鸟换白羽遇降雪延迟易被天敌发现）——根本原因：遗传的稳定性与环境不断变化之间的矛盾；适应性特征是对之前环境适应的结果。 拉马克：适应=用进废退+获得性遗传；达尔文：适应的来源是可遗传变异，适应是自然选择的结果。 适应形成的必要条件（背诵）：群体中出现可遗传的有利变异和环境的定向选择。"}, {"id": "c8s3", "ch": 8, "chT": "生物的进化", "t": "用进化观点解释现象", "terms": "", "x": "用进化观点解释现象 细菌抗药性：达尔文——繁殖中产生各种可遗传变异（含抗药性强变异），抗生素使抗药弱者大量死亡、抗药强者生存繁殖，抗药个体增多；现代——抗生素滥用使耐药菌生存繁殖机会增加，耐药基因频率逐年上升形成超级细菌。 防止超级细菌：建立耐药预警机制，耐药率超限时及时更换抗生素，将耐药率控制在低水平（抑制单一抗生素的定向选择）。 变异发生在环境选择之前（不定向），环境只起选择作用——拉马克认为环境变化在前、生物为适应环境产生变异是错误的。"}, {"id": "c8s4", "ch": 8, "chT": "生物的进化", "t": "现代生物进化理论（背诵·P123）", "terms": "适应是自然选择的结果 种群是生物进化的基本单位 突变和基因重组提供进化的原材料", "x": "现代生物进化理论（背诵·P123） 适应是自然选择的结果；种群是生物进化的基本单位。 突变和基因重组提供进化的原材料，自然选择使种群基因频率定向改变，进而通过隔离形成新物种。 进化过程是生物与生物、生物与环境协同进化的过程；生物多样性是协同进化的结果。"}, {"id": "c8s5", "ch": 8, "chT": "生物的进化", "t": "种群基因频率与基因库", "terms": "", "x": "种群基因频率与基因库 种群 / 基因库 / 基因频率生活在一定区域的同种生物全部个体；全部基因；某个基因占全部等位基因数的比值 定义法某基因频率 = 该基因数 ÷ 全部等位基因数（伴X：男 = Xⁿ% ÷ (X+Y)） 遗传平衡定律5条件：种群极大、随机交配、无突变、无选择、无迁入迁出；p²+2pq+q²，AA=p²、Aa=2pq、aa=q² 易错警示 进化的实质：种群基因频率的定向改变（自然选择决定进化方向）。引起基因频率改变的因素：突变和基因重组、自然选择、迁入迁出、遗传漂变等。变异不定向，不能决定进化方向，只提供原材料；自发突变频率低但种群巨大，突变和重组的随机组合数极大。自然选择直接作用对象是生物个体（表型），本质是改变种群的基因频率。"}, {"id": "c8s6", "ch": 8, "chT": "生物的进化", "t": "隔离与物种形成", "terms": "物种 隔离 生殖隔离", "x": "隔离与物种形成 物种（P116）：能在自然状态下相互交配并产生可育后代的一群生物。隔离：不同种群间个体在自然条件下不能自由交配或不能产生可育后代的现象；实质=阻断基因交流。 生殖隔离范畴：不能交配、杂种不活（胚胎致死）、杂种不育（骡子联会紊乱）；地理隔离只是阻碍基因交流，不一定形成新物种。 物种形成三环节：突变和基因重组（原材料）→ 自然选择（决定进化方向）→ 隔离（物种形成的必要条件）；新物种形成的标志=生殖隔离。 关系：基因频率改变→一定发生进化，但不一定形成新物种；只有基因库差异达到不能实现基因交流的程度才形成新物种。 四倍体西瓜与二倍体杂交所得三倍体不育，故四倍体是新物种；三倍体西瓜、骡不是物种（无性生殖生物以表型特征区分）。"}, {"id": "c8s7", "ch": 8, "chT": "生物的进化", "t": "协同进化与生物多样性", "terms": "协同进化 基因（遗传）多样性、物种多样性、生态系统多样性", "x": "协同进化与生物多样性 协同进化（P121）：不同物种之间、生物与无机环境之间在相互影响中不断进化和发展；结果=形成生物多样性。 捕食者作用（P119）：捕食个体数量多的物种，避免一种或少数几种生物占绝对优势（收割理论）；吃掉年老病弱幼小个体促进种群发展；促进协同进化。 生物多样性三个层次：基因（遗传）多样性、物种多样性、生态系统多样性；形成过程：由原始生命进化出原核→真核→多细胞→各类生物。 边角小字 探究抗生素对细菌的选择作用（P115）：抑菌圈直径逐代变小=耐药菌比例升高；结论：耐药性来自可遗传变异（基因突变），抗生素起定向选择作用。 高考真题链接 ZW 型基因频率计算：雌性 ZaW%=10% → 种群短口器雌性占 5%；遗传平衡计算伴X性状：男 7%→女 0.49%。拓展概念：中性学说（中性突变靠遗传漂变固定）、遗传漂变（小种群随机波动更显著）。"}]}; const DOG_PULL=null, DOG_RUN="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAACMKADAAQAAAABAAACMAAAAAD/wAARCAIwAjAD <script>
/* 生物必背知识点 · 交互版 逻辑 */
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KEY = "bio_interactive_v2";

/* ---------- 用户数据存储 ---------- */
let store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } })() || { users:{}, current:null };
function saveStore(){ localStorage.setItem(KEY, JSON.stringify(store)); }
function defUser(){ return { created:Date.now(), visited:{}, mastery:{}, cloze:{revealed:0,secs:{}},
  quiz:{}, cards:{known:{},seen:0}, theme:"light", clozeMode:"off", side:true, last:{} }; }
function curUser(){
  if (!store.current || !store.users[store.current]) store.current = Object.keys(store.users)[0] || null;
  if (!store.current) { store.users["默认用户"] = defUser(); store.current = "默认用户"; saveStore(); }
  return store.users[store.current];
}
const U = () => curUser();

/* ---------- 主题 ---------- */
function applyTheme(){ document.documentElement.dataset.theme = U().theme || "light"; }
function toggleTheme(){ const u=U(); u.theme = (u.theme==="dark") ? "light" : "dark"; saveStore(); applyTheme(); }

/* ---------- 章节结构（书籍页） ---------- */
let SECS = [];      // {id, el, chIdx, chT, title}
let CHS  = [];      // {i, n, t, el, secEls:[h2]}
function buildStructure(){
  const chaps = $$(".chapter");
  chaps.forEach((el, i) => {
    el.id = "c" + i;
    const meta = (BOOK && BOOK.chapters[i]) || { n:String(i+1), t: el.querySelector(".ch-head h1")?.textContent || "" };
    const h2s = [...el.querySelectorAll("h2")];
    h2s.forEach((h, j) => { h.id = "c" + i + "s" + j; });
    CHS.push({ i, n: meta.n, t: meta.t, el, secEls: h2s });
    if (h2s.length === 0) SECS.push({ id: el.id, el, chIdx: i, chT: meta.t, title: meta.t });
    h2s.forEach((h, j) => {
      SECS.push({ id: h.id, el: h, chIdx: i, chT: meta.t, title: h.textContent });
    });
  });
}

/* ---------- 侧边目录 ---------- */
function buildTOC(){
  const toc = $("#toc"); if (!toc) return;
  toc.innerHTML = CHS.map(ch => {
    const secs = ch.secEls.length ? ch.secEls.map(h =>
      `<button class="toc-sec" data-jump="${h.id}" data-sid="${h.id}"><span class="st">${esc(h.textContent)}</span><span class="m-dot" title="掌握度"></span></button>`
    ).join("") : `<button class="toc-sec" data-jump="${ch.el.id}" data-sid="${ch.el.id}"><span class="st">本章速览</span><span class="m-dot" title="掌握度"></span></button>`;
    return `<div class="toc-ch" data-ch="${ch.i}">
      <button class="toc-ch-head" data-jump="${ch.el.id}" data-sid="${ch.el.id}">
        <span class="n" style="background:var(--ac, var(--pri))">${esc(ch.n)}</span><span class="t">${esc(ch.t)}</span>
        <span class="prog"></span><span class="arr">▶</span>
      </button><div class="toc-secs">${secs}</div></div>`;
  }).join("");
  $$(".toc-sec .m-dot, .toc-ch-head .m-dot").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); cycleMastery(b.closest("[data-sid]").dataset.sid, b);
  }));
  $$(".toc-ch-head").forEach(b => b.addEventListener("click", e => {
    const box = b.parentElement;
    box.classList.toggle("open");
    if (e.target.closest(".m-dot")) return;
    if (window.innerWidth > 900) { puppyRun(); jumpTo(b.dataset.jump, {}); }
  }));
  $$(".toc-sec").forEach(b => b.addEventListener("click", e => {
    if (e.target.closest(".m-dot")) return;
    puppyRun();
    jumpTo(b.dataset.jump, {});
  }));
  refreshSidebarState();
}
function refreshSidebarState(){
  $$(".toc-ch").forEach(box => {
    const ch = CHS[+box.dataset.ch];
    const sids = ch.secEls.length ? ch.secEls.map(h => h.id) : [ch.el.id];
    const read = sids.filter(s => (U().visited[DATA.id]||[]).includes(s)).length;
    const done = sids.filter(s => U().mastery[s] === 2).length;
    box.querySelector(".prog").textContent = done === sids.length ? "已掌握" : `${read}/${sids.length}`;
  });
}
function cycleMastery(sid, dot){
  const u = U(); const cur = u.mastery[sid] || 0;
  u.mastery[sid] = (cur + 1) % 3; saveStore();
  syncDots();
}
function syncDots(){
  $$("[data-sid]").forEach(el => {
    const d = el.querySelector(".m-dot"); if (!d) return;
    const m = U().mastery[el.dataset.sid] || 0;
    d.className = "m-dot" + (m === 1 ? " m1" : m === 2 ? " m2" : "");
    d.title = ["标记：学习中", "标记：已掌握", "清除标记"][m];
  });
  refreshSidebarState();
}

/* ---------- 跳转 / 滚动 ---------- */
let BACK = [];   // 页内互链返回栈 {id, y, label}
function jumpTo(id, opts){
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({ behavior: opts.instant ? "auto" : "smooth", block: opts.block || "start" });
  if (opts.flash !== false) {
    const box = el.closest(".chapter") || el;
    box.classList.remove("ch-flash"); void box.offsetWidth; box.classList.add("ch-flash");
    setTimeout(() => box.classList.remove("ch-flash"), 1700);
  }
  if (window.innerWidth <= 900) document.body.classList.add("side-collapsed");
  if (opts.afterScroll) setTimeout(opts.afterScroll, 450);
}
function showBack(){
  const pill = $("#xback"); if (!pill) return;
  const top = BACK[BACK.length - 1];
  if (top) { pill.querySelector("span").textContent = "返回：" + top.label; pill.classList.add("show"); }
  else pill.classList.remove("show");
}
/* ---------- 互链 ---------- */
function buildXrefs(){
  if (typeof XREFS === "undefined" || !XREFS.length) return;
  const sidOf = (bk, c, s) => (bk === DATA.id ? "" : bk + ".html") + "#c" + c + (s == null ? "" : "s" + s);
  const entries = XREFS.slice().sort((a, b) => (b.t || "").length - (a.t || "").length);
  $$(".chapter").forEach(chEl => {
    const chIdx = +chEl.id.slice(1);
    const headText = chEl.querySelector(".ch-head")?.textContent || "";
    const used = new Set();
    const walker = document.createTreeWalker(chEl, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        const p = n.parentElement;
        if (!p || p.closest("a, .k, h1, h2, h3, .bx-tag, script, style, .ch-head")) return NodeFilter.FILTER_REJECT;
        return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      let text = node.nodeValue, hits = [];
      entries.forEach(en => {
        const key = en.t;
        if (used.has(key)) return;
        const terms = en.v ? [en.t, ...en.v] : [en.t];
        if (headText.includes(en.t)) return;
        for (const t of terms) {
          const pos = text.indexOf(t);
          if (pos >= 0) { hits.push({ pos, t, en }); break; }
        }
      });
      if (!hits.length) return;
      hits.sort((a, b) => a.pos - b.pos);
      const frag = document.createDocumentFragment();
      let last = 0;
      hits.forEach(h => {
        if (h.pos < last) return;
        frag.appendChild(document.createTextNode(text.slice(last, h.pos)));
        const a = document.createElement("a");
        a.className = "xref"; a.href = sidOf(h.en.b, h.en.c, h.en.s); a.textContent = h.t;

function injectDogEnds(){
  if (typeof DOG_PULL === "undefined" || !DOG_PULL) return;
  $$(".chapter").forEach(ch => {
    if (ch.querySelector(".dog-stage")) return;
    const d = document.createElement("div");
    d.className = "ch-end";
    d.innerHTML = `<div class="dog-stage">
      <svg class="dog-chain" viewBox="0 0 230 180" aria-hidden="true">
        <path class="chain-strap" d=""/><g class="chain-links"></g><circle class="chain-clasp" r="4.5"/><circle class="chain-anchor" r="5"/><circle class="chain-ring" r="6"/>
      </svg>
      <div class="dog-body"><img class="ch-dog" alt="戴着项圈的小狗" draggable="false"></div>
      <span class="dog-hint">拉一拉狗绳</span>
    </div>`;
    ch.appendChild(d);
  });
  DOG_PULL.forEach(src => { const im = new Image(); im.src = src; });
  $$(".ch-end .ch-dog").forEach(i => { i.src = DOG_PULL[0]; });
  bindDogPull();
}
function bindDogPull(){
  $$(".dog-stage").forEach(stage => {
    const body = stage.querySelector(".dog-body");
    const img = stage.querySelector(".ch-dog");
    const strap = stage.querySelector(".chain-strap");
    const links = stage.querySelector(".chain-links");
    const clasp = stage.querySelector(".chain-clasp");
    const anchor = stage.querySelector(".chain-anchor");
    const ring = stage.querySelector(".chain-ring");
    const hint = stage.querySelector(".dog-hint");
    const R = 52, K = 130, DAMP = 9;
    const DOG_X = 41, DOG_Y = 16, DOG_S = 148;
    const RING = { x: DOG_X + 0.468 * DOG_S, y: DOG_Y + 0.678 * DOG_S };
    const A = { x: 18, y: 18 };
    const T = [0.15, 0.45, 0.78];
    ring.setAttribute("cx", RING.x.toFixed(1)); ring.setAttribute("cy", RING.y.toFixed(1));
    clasp.setAttribute("cx", RING.x.toFixed(1)); clasp.setAttribute("cy", RING.y.toFixed(1));
    const st = { ax:0, ay:0, vx:0, vy:0, tx:0, ty:0, drag:null, raf:0, f:0 };
    const settled = () => !st.drag && Math.hypot(st.ax, st.ay) < .4 && Math.hypot(st.vx, st.vy) < .4;
    function render(){
      const p = Math.min(1, Math.hypot(st.ax, st.ay) / R);
      while (st.f < 3 && p >= T[st.f] + 0.02) st.f++;
      while (st.f > 0 && p <= T[st.f - 1] - 0.02) st.f--;
      const src = DOG_PULL[st.f];
      if (img.getAttribute("src") !== src) img.setAttribute("src", src);
      const ax = A.x + st.ax, ay = A.y + st.ay;
      anchor.setAttribute("cx", ax.toFixed(1)); anchor.setAttribute("cy", ay.toFixed(1));
      const dist = Math.hypot(RING.x - ax, RING.y - ay);
      const sag = Math.max(4, Math.min(40, 58 - dist * 0.3));
      const mx = (ax + RING.x) / 2, my = (ay + RING.y) / 2 + sag;
      const B = t => ({ x: (1-t)*(1-t)*ax + 2*(1-t)*t*mx + t*t*RING.x, y: (1-t)*(1-t)*ay + 2*(1-t)*t*my + t*t*RING.y });
      const j = B(0.86);
      strap.setAttribute("d", `M ${ax.toFixed(1)} ${ay.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${j.x.toFixed(1)} ${j.y.toFixed(1)}`);
      let lk = "";
      for (let i = 1; i <= 4; i++) {
        const q = B(0.86 + 0.14 * i / 4);
        lk += `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.2"/>`;
      }
      links.innerHTML = lk;
    }
    function start(){
      const raf = cb => document.hidden ? setTimeout(cb, 16) : requestAnimationFrame(cb);
      const loop = () => {
        if (st.drag) {
          st.ax += (st.tx - st.ax) * .35; st.ay += (st.ty - st.ay) * .35;
        } else {
          const dt = 1 / 60;
          st.vx += (-K * st.ax - DAMP * st.vx) * dt; st.vy += (-K * st.ay - DAMP * st.vy) * dt;
          st.ax += st.vx * dt; st.ay += st.vy * dt;
        }
        render();
        if (settled()) { st.ax = st.ay = st.vx = st.vy = 0; render(); st.raf = 0; return; }
        st.raf = raf(loop);
      };
      st.raf = raf(loop);
    }
    body.addEventListener("pointerdown", e => {
      e.preventDefault();
      try { body.setPointerCapture(e.pointerId); } catch(err) {}
      const r = stage.getBoundingClientRect();
      st.drag = { w: r.width, h: r.height };
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const dx = px - A.x, dy = py - A.y;
      const d = Math.hypot(dx, dy);
      const eff = d > R ? R + (d - R) * .2 : d;
      const k = d ? eff / d : 0;
      st.tx = dx * k; st.ty = dy * k;
      st.raf || start();
      stage.classList.add("grabbing");
      hint.classList.add("off");
    });
    body.addEventListener("pointermove", e => {
      if (!st.drag) return;
      const r = stage.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const dx = px - A.x, dy = py - A.y;
      const d = Math.hypot(dx, dy);
      const eff = d > R ? R + (d - R) * .2 : d;
      const k = d ? eff / d : 0;
      st.tx = dx * k; st.ty = dy * k;
    });
    const end = () => {
      if (!st.drag) return;
      st.drag = null; st.tx = st.ty = 0;
      stage.classList.remove("grabbing");
    };
    body.addEventListener("pointerup", end);
    body.addEventListener("pointercancel", end);
  });
}

/* ---------- 搜索 ---------- */
function searchAll(qs){
  const q = qs.trim().toLowerCase(); if (!q) return [];
  const idx = typeof BOOK !== "undefined" && BOOK ? DATA.search : HOME.search;
  const out = [];
  idx.forEach(it => {
    const hay = (it.t + " " + it.chT + " " + (it.terms || "") + " " + it.x).toLowerCase();
    if (!hay.includes(q)) return;
    let score = 0;
    if (it.t.toLowerCase().includes(q)) score += 6;
    if ((it.terms || "").toLowerCase().includes(q)) score += 4;
    if (it.chT.toLowerCase().includes(q)) score += 2;
    out.push({ ...it, score });
  });
  return out.sort((a, b) => b.score - a.score).slice(0, 20);
}

  $$(".cloze-group .tbtn").forEach(b => b.addEventListener("click", () => { U().clozeMode = b.dataset.mode; saveStore(); applyClozeMode(); }));
  $("#btn-quiz").addEventListener("click", () => openModal("#m-quiz"));
  $("#btn-cards").addEventListener("click", () => openModal("#m-cards"));
  $("#btn-dice").addEventListener("click", openDice);
  $("#btn-theme").addEventListener("click", toggleTheme);
  $("#btn-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  $("#search-in").addEventListener("click", () => openSearch());
  $("#sp-input").addEventListener("input", e => renderSearch(e.target.value));
  $("#dice-again").addEventListener("click", openDice);
  $("#qz-yes").addEventListener("click", () => answerQuiz(true));
  $("#qz-no").addEventListener("click", () => answerQuiz(false));
  $("#qz-next").addEventListener("click", quizNext);
  $("#fc-yes").addEventListener("click", () => rateCard(true));
  $("#fc-no").addEventListener("click", () => rateCard(false));
  $$(".m-close").forEach(b => b.addEventListener("click", closeModal));
  $("#mask").addEventListener("click", closeModal);
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
    if (e.key === "Escape") closeModal();
  });
}
function bindQuizChips(){
  const box = $("#qz-chips"); if (!box) return;
  box.innerHTML = `<button class="sel-chip on" data-k="all">全部</button>`
    + BOOK.chapters.map((c, i) => `<button class="sel-chip" data-k="c${i}">${esc(c.n)} ${esc(c.t)}</button>`).join("");
  box.querySelectorAll(".sel-chip").forEach(b => b.addEventListener("click", () => {
    box.querySelectorAll(".sel-chip").forEach(x => x.classList.toggle("on", x === b));
    openQuiz(b.dataset.k);
  }));
}
function bindCardChips(){
  const box = $("#fc-chips"); if (!box) return;
  box.innerHTML = `<button class="sel-chip on" data-k="all">全部</button>`
    + BOOK.chapters.map((c, i) => `<button class="sel-chip" data-k="c${i}">${esc(c.n)} ${esc(c.t)}</button>`).join("");
  box.querySelectorAll(".sel-chip").forEach(b => b.addEventListener("click", () => {
    box.querySelectorAll(".sel-chip").forEach(x => x.classList.toggle("on", x === b));
    openCards(b.dataset.k);
  }));
}
function openDice(){
  const bank = typeof BOOK !== "undefined" && BOOK ? BOOK.cards : HOME.cards;
  const c = bank[Math.floor(Math.random() * bank.length)];
  openModal("#m-dice");
  $("#dice-term").textContent = c.t;
  $("#dice-ctx").textContent = c.c;
}

/* ---------- 落地页 ---------- */
function bootHome(){
  applyTheme(); bindUserChip();
  $("#hs-user").textContent = store.current || "";
  const u = U();
  $("#home-books").innerHTML = HOME.books.map(b => {
    const read = (u.visited[b.id] || []).length;
    const pct = Math.min(100, Math.round(read / b.secs * 100));
    return `<a class="book-card" href="${b.file}">
      <h2>${esc(b.label)}</h2><div class="bc-sub">${esc(b.sub)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="bc-meta"><span>已读 ${read} / ${b.secs} 节</span><span>${b.chN} 章</span><span>判断题 ${b.quizN} 条</span><span>闪卡 ${b.cardN} 张</span></div></a>`;
  }).join("");
  $("#home-books").addEventListener("click", e => {
    const a = e.target.closest("a.book-card"); if (!a) return;
    e.preventDefault(); puppyRun();
    setTimeout(() => { location.href = a.getAttribute("href"); }, 750);
  });
  const qzBest = Math.max(0, ...Object.values(u.quiz).map(r => r.best || 0));
  $("#home-stats").innerHTML = `
    <div class="stat"><b>${(u.visited.m1 || []).length + (u.visited.m2 || []).length}</b><span>累计已读节数</span></div>
    <div class="stat"><b>${u.cloze.revealed || 0}</b><span>挖空已回忆次数</span></div>
    <div class="stat"><b>${u.cards.seen || 0}</b><span>闪卡练习张数</span></div>
    <div class="stat"><b>${qzBest}</b><span>判断题单轮最佳（满分10）</span></div>`;
  $("#btn-dice2").addEventListener("click", openDice);
  $("#btn-theme2").addEventListener("click", toggleTheme);
  $$(".m-close").forEach(b => b.addEventListener("click", closeModal));
  $("#mask").addEventListener("click", closeModal);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
}

/* ---------- 启动 ---------- */
if (document.body.dataset.book === "home") bootHome(); else bootBook();


</script>
