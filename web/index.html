<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高中生物必背知识点 · 交互复习</title>
<style>/* 生物必背知识点 · 交互版  */
* { box-sizing: border-box; }
:root {
  --bg:#eef2f6; --panel:#fff; --ink:#1e293b; --mut:#64748b; --line:#dbe2ea;
  --pri:#0e7490; --pri-soft:#e0f2fe; --gold:#b45309; --kbg:#fde68a;
  --side-w:270px; --rad:10px;
  --c-warn:#e11d48; --c-note:#4f46e5; --c-exam:#0d9488; --c-exp:#9333ea;
}
html[data-theme="dark"] {
  --bg:#0a1220; --panel:#111b2e; --ink:#d9e4f2; --mut:#8ba1b9; --line:#24344d;
  --pri:#38bdf8; --pri-soft:#0c2a42; --gold:#fbbf24; --kbg:rgba(253,230,138,.22);
  --c-warn:#fb7185; --c-note:#818cf8; --c-exam:#2dd4bf; --c-exp:#c084fc;
}
html, body { margin:0; padding:0; }
body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.75; }
button { font-family:inherit; cursor:pointer; }
a { color:var(--pri); }

/* ---------- 布局骨架 ---------- */
.app { display:flex; min-height:100vh; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }

/* ---------- 侧边栏 ---------- */
.sidebar { width:var(--side-w); flex:none; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0; z-index:40;
  transition:margin .25s ease; }
body.side-collapsed .sidebar { margin-left:calc(-1 * var(--side-w)); }
.side-head { display:flex; align-items:center; gap:8px; padding:14px 14px 10px; }
.side-brand { font-weight:800; font-size:15px; color:var(--ink); text-decoration:none; letter-spacing:.04em; }
.side-brand small { display:block; font-weight:500; font-size:10.5px; color:var(--mut); letter-spacing:.18em; }
.side-collapse { margin-left:auto; border:1px solid var(--line); background:none; color:var(--mut);
  border-radius:8px; width:28px; height:28px; font-size:14px; line-height:1; }
.side-collapse:hover { color:var(--pri); border-color:var(--pri); }
.side-user { margin:2px 12px 8px; }
.user-chip { width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line);
  border-radius:10px; background:var(--bg); color:var(--ink); font-size:13px; }
.user-chip:hover { border-color:var(--pri); }
.user-chip .u-dot { width:22px; height:22px; border-radius:50%; background:var(--pri); color:#fff; font-size:11px;
  display:flex; align-items:center; justify-content:center; flex:none; }
.user-chip .u-name { flex:1; text-align:left; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-chip .u-arr { color:var(--mut); font-size:11px; }
.side-search { padding:0 12px 10px; }
.side-search input { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:10px;
  background:var(--bg); color:var(--ink); font-size:13px; outline:none; }
.side-search input:focus { border-color:var(--pri); }
.toc { flex:1; overflow-y:auto; padding:4px 8px 30px; }
.toc-ch { margin-bottom:4px; }
.toc-ch-head { width:100%; display:flex; align-items:center; gap:8px; padding:7px 8px; border:0; background:none;
  border-radius:8px; color:var(--ink); font-size:13.5px; font-weight:600; text-align:left; }
.toc-ch-head:hover { background:var(--pri-soft); }
.toc-ch-head .n { flex:none; width:24px; height:24px; border-radius:7px; background:var(--ac,var(--pri)); color:#fff;
  font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.toc-ch-head .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toc-ch-head .prog { flex:none; font-size:10.5px; color:var(--mut); }
.toc-ch-head .arr { flex:none; color:var(--mut); font-size:10px; transition:transform .2s; }
.toc-ch.open .toc-ch-head .arr { transform:rotate(90deg); }
.toc-secs { display:none; padding:2px 0 4px 14px; }
.toc-ch.open .toc-secs { display:block; }
.toc-sec { display:flex; align-items:center; gap:6px; width:100%; border:0; background:none; text-align:left;
  padding:5px 8px; border-radius:8px; color:var(--mut); font-size:12.5px; }
.toc-sec:hover { color:var(--ink); background:var(--pri-soft); }
.toc-sec.active { color:var(--pri); font-weight:700; background:var(--pri-soft); }
.toc-sec .st { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.m-dot { flex:none; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line); background:transparent; padding:0; }
.m-dot.m1 { background:#3b82f6; border-color:#3b82f6; }
.m-dot.m2 { background:#22c55e; border-color:#22c55e; }
.side-expand { position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:39; border:1px solid var(--line);
  background:var(--panel); color:var(--mut); border-radius:0 10px 10px 0; padding:14px 6px; font-size:14px; display:none; }
body.side-collapsed .side-expand { display:block; }

/* ---------- 顶栏 ---------- */
.topbar { position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.topbar-in { display:flex; align-items:center; gap:10px; padding:10px 20px; flex-wrap:wrap; }
.crumb { font-size:13px; color:var(--mut); min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.crumb b { color:var(--ink); }
.tools { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tbtn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px;
  padding:5px 11px; font-size:12.5px; white-space:nowrap; }
.tbtn:hover { border-color:var(--pri); color:var(--pri); }
.tbtn.on { background:var(--pri); border-color:var(--pri); color:#fff; }
.cloze-group { display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.cloze-group .cg-label { padding:5px 9px; font-size:12.5px; color:var(--mut); background:var(--bg); }
.cloze-group .tbtn { border:0; border-left:1px solid var(--line); border-radius:0; }
.readbar { height:3px; background:transparent; }
/* ---------- 内容区 ---------- */
.content { max-width:920px; width:100%; margin:0 auto; padding:26px 26px 90px; }
.hero { background:linear-gradient(155deg,#0b1f33 0%,#123a5c 45%,#0e5e52 100%); color:#fff;
  border-radius:14px; padding:30px 32px 26px; margin-bottom:26px; }
.hero .h-badge { display:inline-block; font-size:11px; letter-spacing:.3em; border:1px solid rgba(255,255,255,.45);
  border-radius:99px; padding:4px 14px; color:#cfe8dd; }
.hero h1 { margin:16px 0 4px; font-size:27px; letter-spacing:.04em; line-height:1.4; }
.hero .h-sub { color:#9fd8c4; font-size:13.5px; letter-spacing:.12em; margin:0; }
.hero .h-owner { margin:16px 0 0; color:#ffe9b8; font-weight:700; font-size:15px; letter-spacing:.08em; }
.hero .h-meta { margin-top:12px; color:#a8bccb; font-size:12px; display:flex; gap:18px; flex-wrap:wrap; }

.chapter { background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:22px 26px 24px; margin-bottom:26px; scroll-margin-top:74px; }
.ch-head { display:flex; align-items:center; gap:14px; padding-bottom:12px; border-bottom:2px solid var(--ac,var(--pri)); margin-bottom:16px; }
.ch-num { width:44px; height:44px; border-radius:12px; background:var(--ac,var(--pri)); color:#fff; flex:none;
  font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.ch-head h1 { margin:0; font-size:21px; letter-spacing:.03em; }
.ch-sub { margin:2px 0 0; font-size:12px; color:var(--mut); }
.ch-flash { border-radius:6px; animation:flashBg 1.6s ease 1; }
@keyframes flashBg { 0% { background:color-mix(in srgb, var(--ac,var(--pri)) 22%, transparent); }
  100% { background:transparent; } }

h2 { font-size:17px; color:var(--ac,var(--pri)); margin:20px 0 8px; padding-left:10px;
  border-left:4px solid var(--ac,var(--pri)); scroll-margin-top:74px; }
h3 { font-size:15px; margin:12px 0 4px; }
p { margin:6px 0; }
ul,ol { margin:6px 0; padding-left:1.6em; }
li { margin:3px 0; }
b { font-weight:600; }
sub,sup { font-size:70%; }
.k { font-weight:600; background:linear-gradient(transparent 62%, var(--kbg) 62%); padding:0 1px; border-radius:2px; }
table { border-collapse:collapse; width:100%; margin:8px 0 12px; }
th,td { border:1px solid var(--line); padding:6px 9px; vertical-align:top; font-size:13.5px; line-height:1.6; text-align:left; }
th { font-weight:600; background:var(--bg); }
.table-scroll { overflow-x:auto; }

.bx { border-radius:10px; padding:12px 15px; margin:10px 0 14px; }
.bx .bx-tag { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:#fff;
  border-radius:99px; padding:2px 11px 3px; margin-bottom:6px; }
.note { background:color-mix(in srgb, var(--c-note) 10%, var(--panel)); border-left:4px solid var(--c-note); }
.note .bx-tag { background:var(--c-note); }
.warn { background:color-mix(in srgb, var(--c-warn) 9%, var(--panel)); border-left:4px solid var(--c-warn); }
.warn .bx-tag { background:var(--c-warn); }
.exam { background:color-mix(in srgb, var(--c-exam) 10%, var(--panel)); border-left:4px solid var(--c-exam); }
.exam .bx-tag { background:var(--c-exam); }
.exp { background:color-mix(in srgb, var(--c-exp) 9%, var(--panel)); border-left:4px solid var(--c-exp); }
.exp .bx-tag { background:var(--c-exp); }
.fgrid { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 12px; }
.fcard { flex:1 1 260px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; }
.fcard b { color:var(--ac,var(--pri)); }
.fcard .fm { display:block; font-family:Menlo,monospace; font-size:12.5px; margin-top:4px; }
.flow { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13.5px; margin:8px 0 12px; }
.flow b { color:var(--ac,var(--pri)); }
.recap { background:color-mix(in srgb, var(--ac,var(--pri)) 8%, var(--panel)); border:1px solid var(--ac,var(--pri));
  border-radius:12px; padding:12px 16px; margin-top:14px; }
/* ---------- 挖空 ---------- */
.k.cz { color:transparent !important; text-shadow:none; background:repeating-linear-gradient(45deg,
  color-mix(in srgb, var(--ink) 22%, transparent) 0 5px, transparent 5px 9px); border-radius:3px;
  cursor:pointer; transition:background .15s; min-width:2em; }
.k.cz:hover { background:repeating-linear-gradient(45deg,
  color-mix(in srgb, var(--pri) 40%, transparent) 0 5px, transparent 5px 9px); }
.k.cz.open { color:inherit !important; background:linear-gradient(transparent 62%, #86efac 62%); cursor:default; }
html[data-theme="dark"] .k.cz.open { background:linear-gradient(transparent 62%, rgba(134,239,172,.4) 62%); }

/* ---------- 互链 ---------- */
.xref { color:var(--pri); text-decoration:none; border-bottom:1px dashed var(--pri); cursor:pointer; padding:0 1px; }
.xref:hover { background:var(--pri-soft); border-bottom-style:solid; }
.xback { position:fixed; right:22px; bottom:22px; z-index:45; display:none; align-items:center; gap:8px;
  background:var(--pri); color:#fff; border:0; border-radius:99px; padding:10px 18px; font-size:13px; font-weight:600;
  box-shadow:0 6px 22px rgba(14,116,144,.4); max-width:46vw; }
.xback.show { display:flex; }
.xback span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- 浮动/菜单 ---------- */
.float-menu { position:fixed; z-index:60; background:var(--panel); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 10px 34px rgba(2,8,20,.18); padding:6px; min-width:200px; }
.fm-item { display:flex; width:100%; border:0; background:none; color:var(--ink); text-align:left; padding:9px 12px;
  border-radius:8px; font-size:13.5px; gap:8px; align-items:center; }
.fm-item:hover { background:var(--pri-soft); }
.fm-item.cur { color:var(--pri); font-weight:700; }
.fm-item.danger { color:var(--c-warn); }
.fm-sep { height:1px; background:var(--line); margin:4px 6px; }

/* ---------- 遮罩与弹窗 ---------- */
.mask { position:fixed; inset:0; background:rgba(4,10,20,.5); z-index:70; display:none; }
.mask.show { display:block; }
.modal { position:fixed; z-index:71; left:50%; top:50%; transform:translate(-50%,-50%); width:min(680px,92vw);
  max-height:86vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:22px 26px; display:none; }
.modal.show { display:block; }
.modal h3 { margin:0 0 14px; font-size:17px; display:flex; align-items:center; }
.modal .m-close { margin-left:auto; border:1px solid var(--line); background:none; color:var(--mut);
  border-radius:8px; width:28px; height:28px; font-size:13px; }
.sel-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.sel-chip { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px;
  padding:5px 14px; font-size:12.5px; }
.sel-chip.on { background:var(--pri); border-color:var(--pri); color:#fff; }

/* ---------- 判断快测 ---------- */
.qz-meta { color:var(--mut); font-size:12.5px; margin-bottom:10px; }
.qz-stem { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  font-size:15px; line-height:1.8; margin-bottom:16px; }
.qz-btns { display:flex; gap:12px; }
.qz-btns button { flex:1; padding:12px; font-size:16px; font-weight:700; border-radius:12px; border:1.5px solid var(--line);
  background:var(--bg); color:var(--ink); }
.qz-btns button:hover { border-color:var(--pri); }
.qz-fb { margin-top:14px; border-radius:10px; padding:12px 14px; font-size:13.5px; line-height:1.7; display:none; }
.qz-fb.show { display:block; }
.qz-fb.ok { background:color-mix(in srgb,#22c55e 12%, var(--panel)); border:1px solid #22c55e; }
.qz-fb.no { background:color-mix(in srgb,var(--c-warn) 10%, var(--panel)); border:1px solid var(--c-warn); }
.qz-next { margin-top:14px; width:100%; padding:10px; font-size:14px; font-weight:700; border-radius:10px;
  border:0; background:var(--pri); color:#fff; display:none; }
.qz-next.show { display:block; }

/* ---------- 闪卡 ---------- */
.fc-box { perspective:1200px; margin-bottom:16px; }
.fc-card { position:relative; min-height:190px; border-radius:14px; border:1px solid var(--line); background:var(--bg);
  display:flex; align-items:center; justify-content:center; text-align:center; padding:24px 28px;
  font-size:16.5px; line-height:1.85; cursor:pointer; transition:transform .4s; transform-style:preserve-3d; }
.fc-card.flip { transform:rotateY(180deg); }
.fc-face { backface-visibility:hidden; -webkit-backface-visibility:hidden; max-height:280px; overflow:auto; }
.fc-face.back { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  transform:rotateY(180deg); font-size:14px; color:var(--ink); }
.fc-term { font-weight:700; color:var(--pri); font-size:20px; }
.fc-hint { position:absolute; bottom:8px; left:0; right:0; text-align:center; color:var(--mut); font-size:11px; }
.fc-btns { display:flex; gap:12px; }
.fc-btns button { flex:1; padding:11px; font-size:14.5px; font-weight:700; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); }
/* ---------- 搜索面板 ---------- */
.sp-input { width:100%; padding:11px 14px; font-size:15px; border:1.5px solid var(--pri); border-radius:12px;
  background:var(--bg); color:var(--ink); outline:none; margin-bottom:12px; }
.sp-list { max-height:52vh; overflow:auto; }
.sp-item { display:block; width:100%; text-align:left; border:0; background:none; color:var(--ink);
  padding:10px 12px; border-radius:10px; }
.sp-item:hover, .sp-item.cur { background:var(--pri-soft); }
.sp-item .sp-t { font-size:13.5px; font-weight:600; }
.sp-item .sp-c { font-size:12px; color:var(--mut); margin-top:2px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.sp-item .sp-c mark { background:none; color:var(--gold); font-weight:700; }
.sp-empty { color:var(--mut); font-size:13px; padding:16px; text-align:center; }
kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:11px; color:var(--mut); }

/* ---------- 统计 / 落地页 ---------- */
.home-wrap { max-width:1020px; margin:0 auto; padding:34px 24px 90px; }
.home-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
.book-card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 24px;
  display:block; text-decoration:none; color:var(--ink); position:relative; overflow:hidden; }
.book-card:hover { border-color:var(--pri); transform:translateY(-2px); transition:.2s; }
.book-card h2 { margin:0 0 4px; font-size:19px; border:0; padding:0; color:var(--ink); }
.book-card .bc-sub { color:var(--mut); font-size:12.5px; margin-bottom:14px; }
.book-card .bc-meta { display:flex; gap:16px; font-size:12.5px; color:var(--mut); flex-wrap:wrap; }
.bar { height:8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); overflow:hidden; margin:10px 0 6px; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,var(--pri),#22c55e); }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:16px; }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.stat b { display:block; font-size:22px; color:var(--pri); }
.stat span { font-size:12px; color:var(--mut); }

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .sidebar { position:fixed; left:0; top:0; box-shadow:0 0 40px rgba(2,8,20,.3); }
  body.side-collapsed .sidebar { margin-left:calc(-1 * var(--side-w) - 10px); }
  .side-collapse { display:none; }
  .side-expand { display:none !important; }
  .hamb { display:inline-block !important; }
  .content { padding:18px 14px 90px; }
  .chapter { padding:16px 16px 20px; }
  .hero { padding:22px 20px; }
}
.hamb { display:none; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:9px; padding:5px 11px; font-size:13px; }
.foot-note { text-align:center; color:var(--mut); font-size:12px; padding:26px 0 40px; }

/* ---------- 小狗彩蛋 ---------- */
.ch-end { margin:34px 0 6px; display:flex; justify-content:center; }
.dog-stage { position:relative; width:230px; height:180px; touch-action:none; -webkit-user-select:none; user-select:none; }
.dog-chain { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible; }
.chain-strap { fill:none; stroke:#c54444; stroke-width:4.5; stroke-linecap:round; }
.chain-links circle { fill:none; stroke:#d8a63c; stroke-width:2.4; }
.chain-clasp { fill:#d8a63c; stroke:#a8862e; stroke-width:1; }
.chain-anchor { fill:#b98a2e; }
.chain-ring { fill:rgba(255,255,255,.15); stroke:#d8a63c; stroke-width:3.5; }
.dog-body { position:absolute; left:41px; top:16px; width:148px; height:148px; z-index:1;
  cursor:grab; }
.dog-stage.grabbing .dog-body { cursor:grabbing; }
.ch-dog { width:100%; height:100%; object-fit:cover; border-radius:50%; border:3px solid var(--line);
  box-shadow:0 10px 24px rgba(2,8,20,.12); pointer-events:none; -webkit-user-drag:none; }
.dog-hint { position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); font-size:11px;
  color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:2px 10px; white-space:nowrap; transition:opacity .4s; pointer-events:none; }
.dog-hint.off { opacity:0; }
#puppy-run { position:fixed; left:50%; top:50%; width:144px; height:144px; margin:-72px 0 0 -72px;
  z-index:998; pointer-events:none; opacity:0; transition:opacity .18s; }
#puppy-run.run { opacity:1; }
.run-sprite { width:100%; height:100%; border-radius:50%; border:4px solid #fff;
  box-shadow:0 14px 36px rgba(2,8,20,.30); background-repeat:no-repeat; background-size:200% 200%;
  will-change:background-position,transform; }
#puppy-run.run .run-sprite { animation:puppy-bob .44s ease-in-out infinite; }
@keyframes puppy-bob {
  0%,100% { transform:translateY(4px) rotate(2deg); }
  50% { transform:translateY(-6px) rotate(-2deg); } }


</style>
</head>
<body data-book="home">
<div class="home-wrap">
  <header class="hero">

 {"q": "杂合子 Aa 自交后代的性状分离比为 3:1", "a": true, "e": "", "ch": 1}, {"q": "杂合子测交后代的显隐比为 3:1", "a": false, "e": "测交后代为 1:1，比例反映被测个体配子种类及比例", "ch": 1}, {"q": "显性纯合致死时，杂合子自交后代显:隐 = 2:1", "a": true, "e": "AA 致死，存活个体为 Aa:aa = 2:1", "ch": 1}, {"q": "隐性纯合致死时，杂合子自交后代全为隐性", "a": false, "e": "后代全为显性", "ch": 1}, {"q": "非同源染色体上的非等位基因自由组合发生在减Ⅰ后期", "a": true, "e": "", "ch": 2}, {"q": "AaBb 测交后代四种表现型的比例为 9:3:3:1", "a": false, "e": "测交为 1:1:1:1；9:3:3:1 是自交结果", "ch": 2}, {"q": "不考虑互换，n 对同源染色体的个体可产生 2ⁿ 种配子", "a": true, "e": "", "ch": 2}, {"q": "红绿色盲是伴 X 染色体隐性遗传病", "a": true, "e": "男患者多于女患者，存在交叉遗传", "ch": 3}, {"q": "抗维生素 D 佝偻病是常染色体显性遗传病", "a": false, "e": "伴 X 染色体显性遗传，女多于男、世代连续", "ch": 3}, {"q": "调查遗传病发病率应在患者家系中抽样", "a": false, "e": "发病率在广大人群中随机抽样；家系调查用于确定遗传方式", "ch": 3}, {"q": "噬菌体侵染细菌实验证明 DNA 是遗传物质", "a": true, "e": "", "ch": 4}, {"q": "TMV 实验证明 RNA 是烟草花叶病毒的遗传物质", "a": true, "e": "RNA 病毒的基因在 RNA 上", "ch": 4}, {"q": "所有生物的遗传物质都是 DNA", "a": false, "e": "RNA 病毒以 RNA 为遗传物质，故称 DNA 是主要的遗传物质", "ch": 4}, {"q": "DNA 双链中每个磷酸基团都连接 2 个脱氧核糖", "a": false, "e": "每个磷酸连接 1~2 个脱氧核糖，两端 2 个游离磷酸各只连 1 个", "ch": 5}, {"q": "DNA 复制 n 代后共 2ⁿ 个 DNA，含亲代链的只有 2 个", "a": true, "e": "半保留复制", "ch": 5}, {"q": "人类基因组测序需测定 24 条染色体", "a": true, "e": "22 条常染色体 + X + Y", "ch": 5}, {"q": "翻译的直接模板是 DNA", "a": false, "e": "翻译模板是 mRNA", "ch": 6}, {"q": "密码子位于 mRNA 上，反密码子位于 tRNA 上", "a": true, "e": "", "ch": 6}, {"q": "中心法则包括 DNA 复制、转录和翻译等信息传递过程", "a": true, "e": "", "ch": 6}, {"q": "基因突变能产生新基因，是生物变异的根本来源", "a": true, "e": "为生物进化提供原材料", "ch": 7}, {"q": "秋水仙素诱导多倍体的原理是抑制纺锤体形成", "a": true, "e": "作用于分裂前期；诱导基因突变则作用于间期", "ch": 7}, {"q": "21 三体综合征是由基因突变引起的遗传病", "a": false, "e": "染色体异常遗传病（体细胞多一条 21 号染色体）", "ch": 7}, {"q": "单倍体的体细胞染色体数目与本物种配子相同", "a": true, "e": "", "ch": 7}, {"q": "受精作用过程中会发生基因重组", "a": false, "e": "基因重组不发生在受精作用中", "ch": 7}, {"q": "生物进化的基本单位是种群", "a": true, "e": "", "ch": 8}, {"q": "生物进化的实质是种群基因频率的改变", "a": true, "e": "自然选择使基因频率定向改变", "ch": 8}, {"q": "共同进化只发生在不同物种之间", "a": false, "e": "还包括生物与无机环境之间", "ch": 8}, {"q": "新物种形成的标志是产生生殖隔离", "a": true, "e": "隔离是物种形成的必要条件", "ch": 8}], "cards": [{"t": "施莱登、施旺", "c": "建立者：施莱登、施旺（提出）；魏尔肖补充「细胞通过分裂产生新细胞」。", "ch": 0}, {"t": "魏尔肖", "c": "建立者：施莱登、施旺（提出）；魏尔肖补充「细胞通过分裂产生新细胞」。", "ch": 0}, {"t": "细胞发育而来", "c": "内容（三点）：①细胞是一个有机体，一切动植物都由细胞发育而来，并由细胞和细胞产物构成；②细胞是一个相对独立的单位，既有自己的生命，又对与其他细胞共同组成的整体生命起作用；③新细胞是由老细胞分裂产生的。", "ch": 0}, {"t": "老细胞分裂", "c": "内容（三点）：①细胞是一个有机体，一切动植物都由细胞发育而来，并由细胞和细胞产物构成；②细胞是一个相对独立的单位，既有自己的生命，又对与其他细胞共同组成的整体生命起作用；③新细胞是由老细胞分裂产生的。", "ch": 0}, {"t": "细胞的统一性和生物体结构的统一性", "c": "意义：揭示细胞的统一性和生物体结构的统一性（证明动植物有共同的结构基础与亲缘关系）。", "ch": 0}, {"t": "原核生物、真菌、病毒", "c": "局限：未涉及原核生物、真菌、病毒；未揭示细胞的多样性。", "ch": 0}, {"t": "多样性", "c": "局限：未涉及原核生物、真菌、病毒；未揭示细胞的多样性。", "ch": 0}, {"t": "不完全归纳法", "c": "启示：科学发现离不开技术支持；理论经修正补充而完善；运用了不完全归纳法——结论可信但可能有例外。", "ch": 0}, {"t": "细胞层次即个体层次", "c": "植物没有「系统」层次（六大器官直接构成个体）；单细胞生物没有组织、器官、系统层次，细胞层次即个体层次；病毒没有结构层次（不属于生命系统的任何层次，但属于生物）。", "ch": 0}, {"t": "非生物的环境", "c": "生态系统包括生物群落与非生物的环境（阳光、空气、水等），仍属于生命系统。", "ch": 0}, {"t": "核酸（DNA 或 RNA）+ 蛋白质", "c": "结构：核酸（DNA 或 RNA）+ 蛋白质；无细胞结构，必须寄生在活细胞中才能增殖（培养病毒须用活细胞/活鸡胚，不能用普通培养基）。", "ch": 0}, {"t": "寄生在活细胞", "c": "结构：核酸（DNA 或 RNA）+ 蛋白质；无细胞结构，必须寄生在活细胞中才能增殖（培养病毒须用活细胞/活鸡胚，不能用普通培养基）。", "ch": 0}, {"t": "结构不稳定、易变异", "c": "分类：DNA 病毒（T2 噬菌体、乙肝病毒）；RNA 病毒（HIV、流感病毒、SARS 冠状病毒、新冠病毒）。RNA 病毒遗传物质一般为单链，结构不稳定、易变异，疫苗研发难度大。", "ch": 0}, {"t": "拟核", "c": "拟核：无核膜、核仁，大型环状 DNA 集中分布", "ch": 0}, {"t": "核糖体", "c": "只有核糖体", "ch": 0}, {"t": "肽聚糖", "c": "主要成分肽聚糖（支原体无细胞壁）", "ch": 0}, {"t": "二分裂", "c": "二分裂（不遵循孟德尔遗传定律）", "ch": 0}, {"t": "同时同地进行", "c": "同时同地进行（边转录边翻译）", "ch": 0}, {"t": "叶绿素和藻蓝素", "c": "蓝细菌（原核）：含叶绿素和藻蓝素，能进行光合作用，但没有叶绿体。", "ch": 0}, {"t": "没有叶绿体", "c": "蓝细菌（原核）：含叶绿素和藻蓝素，能进行光合作用，但没有叶绿体。", "ch": 0}, {"t": "质粒", "c": "质粒：小型环状 DNA，存在于绝大多数原核生物中，酵母菌中也存在；是基因工程的常用载体。", "ch": 0}, {"t": "绝大多数原核生物", "c": "质粒：小型环状 DNA，存在于绝大多数原核生物中，酵母菌中也存在；是基因工程的常用载体。", "ch": 0}, {"t": "富营养化（N、P 含量高）", "c": "水华与赤潮：水体富营养化（N、P 含量高）导致蓝细菌和绿藻等大量繁殖，淡水称水华，海水称赤潮。", "ch": 0}, {"t": "64 ÷ 16 = 4", "c": "视野内细胞数目计算：目镜 10×、物镜 10× 时圆形视野中有 64 个充满视野的细胞，换 40× 物镜后为 64 ÷ 16 = 4 个；若细胞呈单行排布，则按长度计算 16 ÷ 4 = 4 个。", "ch": 0}, {"t": "16 ÷ 4 = 4", "c": "视野内细胞数目计算：目镜 10×、物镜 10× 时圆形视野中有 64 个充满视野的细胞，换 40× 物镜后为 64 ÷ 16 = 4 个；若细胞呈单行排布，则按长度计算 16 ÷ 4 = 4 个。", "ch": 0}, {"t": "C 是最基本元素", "c": "C 是最基本元素（碳链构成生物大分子骨架）；鲜重含量最多的是 O，干重含量最多的是 C；占细胞鲜重最多的化合物是水，最多的有机物是蛋白质。", "ch": 1}, {"t": "干重含量最多的是 C", "c": "C 是最基本元素（碳链构成生物大分子骨架）；鲜重含量最多的是 O，干重含量最多的是 C；占细胞鲜重最多的化合物是水，最多的有机物是蛋白质。", "ch": 1}, {"t": "斐林试剂", "c": "斐林试剂：甲液 0.1 g/mL NaOH + 乙液 0.05 g/mL CuSO4，现配现用、等量混合", "ch": 1}, {"t": "浅蓝色 → 棕色 → 砖红色（Cu2O）", "c": "50~65 ℃ 水浴加热约 2 min：浅蓝色 → 棕色 → 砖红色（Cu2O）", "ch": 1}, {"t": "双缩脲试剂", "c": "双缩脲试剂：A 液 0.1 g/mL NaOH 1 mL + B 液 0.01 g/mL CuSO4 3~4 滴", "ch": 1}, {"t": "紫色", "c": "不加热，先加 A 液再加 B 液，呈紫色", "ch": 1}, {"t": "橘黄色", "c": "苏丹Ⅲ染液（橘黄色）或苏丹Ⅳ染液（红色）", "ch": 1}, {"t": "红色", "c": "苏丹Ⅲ染液（橘黄色）或苏丹Ⅳ染液（红色）", "ch": 1}, {"t": "蔗糖不是还原糖", "c": "还原糖：葡萄糖、果糖、麦芽糖、乳糖；蔗糖不是还原糖。选材要求「组织颜色浅、富含待测物」——甘蔗、甜菜（蔗糖非还原糖）、西瓜、番茄（红色干扰）均不合适，常用苹果、梨的匀浆。", "ch": 1}, {"t": "含两个及以上肽键", "c": "双缩脲试剂检测蛋白质要求分子中含两个及以上肽键——二肽不能被检测。", "ch": 1}, {"t": "自由水", "c": "存在形式：自由水（良好溶剂、参与反应、运输物质）与结合水（细胞结构的重要组成成分，如与蛋白质、多糖结合）。", "ch": 1}, {"t": "结合水", "c": "存在形式：自由水（良好溶剂、参与反应、运输物质）与结合水（细胞结构的重要组成成分，如与蛋白质、多糖结合）。", "ch": 1}, {"t": "升高 → 代谢旺盛", "c": "自由水/结合水比值：升高 → 代谢旺盛；降低 → 抗逆性（抗寒、抗旱）增强。冬眠动物、越冬植物比值下降。", "ch": 1}, {"t": "降低 → 抗逆性（抗寒、抗旱）增强", "c": "自由水/结合水比值：升高 → 代谢旺盛；降低 → 抗逆性（抗寒、抗旱）增强。冬眠动物、越冬植物比值下降。", "ch": 1}, {"t": "比热容大", "c": "水的性质：极性分子（良好的溶剂）、液体（氢键缔合）、比热容大（恒温、缓冲温度变化）。", "ch": 1}, {"t": "离子", "c": "存在形式：主要以离子形式存在（少量构成化合物，如 Fe2+ 于血红蛋白、Mg 于叶绿素、P 于核苷酸）。", "ch": 1}, {"t": "血 Ca²⁺过低→抽搐，过高→肌无力", "c": "缺乏症：血 Ca²⁺过低→抽搐，过高→肌无力；缺 Fe → 缺铁性贫血；缺 Mg → 叶片变黄；缺 B → 「花而不实」；缺 I → 甲状腺肿大（大脖子病）。", "ch": 1}, {"t": "Fe²⁺", "c": "血红素：含 Fe²⁺ 的卟啉环辅基；血红蛋白 = 珠蛋白 + 4 个血红素。生物体内没有含 Fe 的氨基酸，Fe 是肽链折叠后与辅基结合的。", "ch": 1}, {"t": "结合水被破坏后细胞死亡", "c": "晒干的种子与烘烤干种子：失去的主要分别是自由水和结合水——结合水被破坏后细胞死亡。", "ch": 1}, {"t": "纤维素不供能", "c": "淀粉储能、可水解供能；纤维素不供能，构成植物细胞壁；糖原暂时储能", "ch": 2}, {"t": "几丁质（壳多糖）", "c": "几丁质（壳多糖）：广泛存在于甲壳类动物和昆虫的外骨骼、真菌的细胞壁中；可用于制作人造皮肤、缝合线等，含 N 元素。", "ch": 2}, {"t": "储能物质", "c": "①细胞内良好的储能物质；②保温；③缓冲、减压，保护内脏", "ch": 2}, {"t": "所有细胞膜（生物膜）", "c": "构成所有细胞膜（生物膜）的重要成分", "ch": 2}, {"t": "脂质的运输", "c": "胆固醇：构成动物细胞膜的重要成分、参与血液中脂质的运输；性激素：促进生殖器官发育与生殖细胞形成；维生素 D：促进肠道对钙和磷的吸收", "ch": 2}, {"t": "钙和磷", "c": "胆固醇：构成动物细胞膜的重要成分、参与血液中脂质的运输；性激素：促进生殖器官发育与生殖细胞形成；维生素 D：促进肠道对钙和磷的吸收", "ch": 2}, {"t": "转变为脂肪", "c": "油料种子（花生、油菜）成熟过程中：光合产物（糖类）转变为脂肪储存，游离脂肪酸减少、脂肪增多，磷脂含量上升。", "ch": 2}, {"t": "水解并转变为糖类", "c": "种子萌发时：脂肪水解并转变为糖类（经过乙醛酸循环途径），自由水含量增多、呼吸作用增强。", "ch": 2}, {"t": "增加", "c": "萌发初期干重先增加（吸收 O2 与 H2O 参与氧化，质量来自氧）后持续减少（呼吸消耗）。", "ch": 2}, {"t": "肽键数 / 脱去水分子数", "c": "= 氨基酸数 − 肽链数（链状）", "ch": 3}, {"t": "至少含氨基 / 羧基数", "c": "= 肽链数（链状，环状为 0；R 基另计）", "ch": 3}, {"t": "N 原子数", "c": "= 氨基酸数 + R 基中 N 数", "ch": 3}, {"t": "O 原子数", "c": "= 各氨基酸 O 之和 − 脱去水数（链状）", "ch": 3}, {"t": "相对分子质量", "c": "= Σ氨基酸 − 18 × 脱水数 − 2 × 二硫键数", "ch": 3}, {"t": "二硫键", "c": "由两个半胱氨酸的巯基（—SH）脱 2 个 H 形成", "ch": 3}, {"t": "不供能", "c": "结构蛋白（肌肉、羽毛、头发）；催化（绝大多数酶）；运输（血红蛋白、通道蛋白、载体蛋白）；调节（胰岛素、生长激素）；免疫（抗体）。正常代谢中蛋白质不供能，仅在病理或衰老状态才氧化分解。", "ch": 3}, {"t": "一个氨基和一个羧基连接在同一个碳原子上", "c": "结构通式：至少含一个氨基和一个羧基连接在同一个碳原子上，该碳原子还连一个氢和一个 R 基。区别在于 R 基不同；有的 R 基中也含氨基或羧基。", "ch": 3}, {"t": "必需氨基酸", "c": "组成人体蛋白质的氨基酸约 21 种，其中 8 种（婴儿 9 种）为必需氨基酸，只能从食物获得，人体不能合成；非必需氨基酸可由转氨基作用合成。", "ch": 3}, {"t": "非必需氨基酸", "c": "组成人体蛋白质的氨基酸约 21 种，其中 8 种（婴儿 9 种）为必需氨基酸，只能从食物获得，人体不能合成；非必需氨基酸可由转氨基作用合成。", "ch": 3}, {"t": "核糖体", "c": "脱水缩合在核糖体上进行：一个氨基酸的羧基与另一个的氨基结合，脱去一分子水，形成肽键（—CO—NH—）。水中 H 来自氨基和羧基，O 只来自羧基。", "ch": 3}, {"t": "肽键（—CO—NH—）", "c": "脱水缩合在核糖体上进行：一个氨基酸的羧基与另一个的氨基结合，脱去一分子水，形成肽键（—CO—NH—）。水中 H 来自氨基和羧基，O 只来自羧基。", "ch": 3}, {"t": "种类、数目、排列顺序", "c": "蛋白质结构多样性直接原因：氨基酸的种类、数目、排列顺序不同 + 肽链盘曲折叠形成的空间结构千差万别；根本原因：基因（DNA）的多样性。", "ch": 3}, {"t": "空间结构", "c": "蛋白质结构多样性直接原因：氨基酸的种类、数目、排列顺序不同 + 肽链盘曲折叠形成的空间结构千差万别；根本原因：基因（DNA）的多样性。", "ch": 3}, {"t": "基因（DNA）的多样性", "c": "蛋白质结构多样性直接原因：氨基酸的种类、数目、排列顺序不同 + 肽链盘曲折叠形成的空间结构千差万别；根本原因：基因（DNA）的多样性。", "ch": 3}, {"t": "肽链间不能形成肽键", "c": "肽链间的连接：二硫键、氢键等（肽链间不能形成肽键）；二硫键可存在于肽链内或肽链间。", "ch": 3}, {"t": "变性", "c": "变性：高温、过酸、过碱、重金属、酒精等破坏空间结构（肽键不断裂），失去活性且不可恢复；变性后仍能用双缩脲试剂检测。高温消毒灭菌、熟鸡蛋易消化的原理。", "ch": 3}, {"t": "不可恢复", "c": "变性：高温、过酸、过碱、重金属、酒精等破坏空间结构（肽键不断裂），失去活性且不可恢复；变性后仍能用双缩脲试剂检测。高温消毒灭菌、熟鸡蛋易消化的原理。", "ch": 3}, {"t": "盐析", "c": "盐析：盐溶液降低蛋白质溶解度使其析出，空间结构不变、活性保持，加水可复溶——可逆。低温也不破坏空间结构。", "ch": 3}, {"t": "加水可复溶", "c": "盐析：盐溶液降低蛋白质溶解度使其析出，空间结构不变、活性保持，加水可复溶——可逆。低温也不破坏空间结构。", "ch": 3}, {"t": "磷酸 + 五碳糖 + 含氮碱基", "c": "核苷酸 = 磷酸 + 五碳糖 + 含氮碱基，连接处：磷酸—酯键连五碳糖。核苷 = 五碳糖 + 碱基（无磷酸）。腺苷 = 腺嘌呤 + 核糖。", "ch": 3}, {"t": "数目与排列顺序", "c": "DNA 多样性：脱氧核苷酸（碱基对）的数目与排列顺序千变万化（数学模型 4n）；特异性：每种 DNA 有特定的排列顺序——DNA 指纹、核酸检测的依据。", "ch": 3}, {"t": "碳链为基本骨架", "c": "生物大分子（多糖、蛋白质、核酸）以碳链为基本骨架，由单体（单体→多聚体）连接而成；「碳原子的排列方式和碳链的长短是生物大分子多样性的基础」（教材 P36）。", "ch": 3}, {"t": "基因的选择性表达", "c": "同一个体不同细胞 DNA 相同（都来自同一受精卵的有丝分裂），RNA 不完全相同（基因的选择性表达）。", "ch": 3}, {"t": "同一个基因", "c": "胰岛素 A、B 链由同一个基因编码，先合成前胰岛素原，加工切除 C 肽后形成 A、B 链。", "ch": 3}, {"t": "分隔开", "c": "①将细胞与外界环境分隔开（保障内部环境相对稳定；也是系统的边界）；②控制物质进出（相对性：控制作用有普遍性和相对性）；③进行细胞间的信息交流。", "ch": 4}, {"t": "控制物质进出", "c": "①将细胞与外界环境分隔开（保障内部环境相对稳定；也是系统的边界）；②控制物质进出（相对性：控制作用有普遍性和相对性）；③进行细胞间的信息交流。", "ch": 4}, {"t": "细胞间的信息交流", "c": "①将细胞与外界环境分隔开（保障内部环境相对稳定；也是系统的边界）；②控制物质进出（相对性：控制作用有普遍性和相对性）；③进行细胞间的信息交流。", "ch": 4}, {"t": "胞间连丝", "c": "信息交流三种方式：化学物质随体液运输（激素—靶细胞受体）；相邻细胞膜直接接触（精卵识别与结合）；相邻细胞形成通道（高等植物细胞的胞间连丝）。", "ch": 4}, {"t": "细胞膜上", "c": "受体位置：蛋白质类（大分子）激素受体在靶细胞细胞膜上；甲状腺激素（小分子脂溶性）和固醇类激素受体在细胞质或细胞核中。", "ch": 4}, {"t": "成熟红细胞", "c": "选材：哺乳动物成熟红细胞——无细胞壁；无细胞核和众多细胞器，排除其他膜干扰；吸水涨破后差速离心得较纯净细胞膜。", "ch": 4}, {"t": "无细胞核和众多细胞器", "c": "选材：哺乳动物成熟红细胞——无细胞壁；无细胞核和众多细胞器，排除其他膜干扰；吸水涨破后差速离心得较纯净细胞膜。", "ch": 4}, {"t": "连续两层", "c": "成分探索历程：欧文顿（脂溶性物质更易通过 → 膜由脂质组成）→ 戈特、格伦德尔（红细胞膜脂质铺展单分子层面积为表面积 2 倍 → 磷脂连续两层）→ 丹尼利、戴维森（表面张力低于油水界面 → 推测附有蛋白质）→ 后发现糖蛋…", "ch": 4}, {"t": "磷脂最丰富", "c": "成分：脂质（约 50%，磷脂最丰富；动物细胞膜还含胆固醇）+ 蛋白质（约 40%）+ 糖类（约 2%~10%，与蛋白质或脂质结合为糖蛋白/糖脂）。功能越复杂的膜，蛋白质的种类和数量越多。", "ch": 4}, {"t": "功能越复杂的膜，蛋白质的种类和数量越多", "c": "成分：脂质（约 50%，磷脂最丰富；动物细胞膜还含胆固醇）+ 蛋白质（约 40%）+ 糖类（约 2%~10%，与蛋白质或脂质结合为糖蛋白/糖脂）。功能越复杂的膜，蛋白质的种类和数量越多。", "ch": 4}, {"t": "磷脂双分子层", "c": "磷脂双分子层构成膜的基本支架，具有流动性；蛋白质分子镶、嵌、贯穿（部分或全部嵌入、贯穿于双层，或附着在表面）——分布是不对称、不均匀的。", "ch": 4}, {"t": "镶、嵌、贯穿", "c": "磷脂双分子层构成膜的基本支架，具有流动性；蛋白质分子镶、嵌、贯穿（部分或全部嵌入、贯穿于双层，或附着在表面）——分布是不对称、不均匀的。", "ch": 4}, {"t": "细胞膜外表面", "c": "糖蛋白（糖被）只分布于细胞膜外表面，与细胞识别、信息传递有关——据此判断膜的内外侧。", "ch": 4}, {"t": "流动性", "c": "流动性实例：变形虫运动与摄食、动物细胞缢裂、细胞融合与受精、巨噬细胞吞噬（胞吞）、分泌蛋白与神经递质释放（胞吐）、质壁分离与复原、细胞吸水膨胀失水皱缩。", "ch": 4}, {"t": "选择透过性", "c": "选择透过性的结构基础：细胞膜上转运蛋白的种类和数量，或转运蛋白空间结构的变化（教材 P66-72）。", "ch": 4}, {"t": "转运蛋白的种类和数量", "c": "选择透过性的结构基础：细胞膜上转运蛋白的种类和数量，或转运蛋白空间结构的变化（教材 P66-72）。", "ch": 4}, {"t": "空间结构的变化", "c": "选择透过性的结构基础：细胞膜上转运蛋白的种类和数量，或转运蛋白空间结构的变化（教材 P66-72）。", "ch": 4}, {"t": "纤维素和果胶", "c": "主要成分：植物——纤维素和果胶；真菌——几丁质；细菌——肽聚糖。全透性（对进出物质无选择性），细胞壁不是系统的边界。功能：支持和保护。", "ch": 4}, {"t": "细胞壁不是系统的边界", "c": "主要成分：植物——纤维素和果胶；真菌——几丁质；细菌——肽聚糖。全透性（对进出物质无选择性），细胞壁不是系统的边界。功能：支持和保护。", "ch": 4}, {"t": "细胞核是遗传信息库，是细胞代谢和遗传的控制中心", "c": "功能（黑体）：细胞核是遗传信息库，是细胞代谢和遗传的控制中心。", "ch": 4}, {"t": "核孔", "c": "结构：核膜（双层膜，外膜连内质网、附核糖体）、核孔（大分子如 mRNA、蛋白质进出的通道，具选择透过性，DNA 不能随意出核，大分子进出需能量）、核仁（与某种 RNA 的合成及核糖体的形成有关）、染色质（DNA+蛋白质，…", "ch": 4}, {"t": "某种 RNA 的合成及核糖体的形成", "c": "结构：核膜（双层膜，外膜连内质网、附核糖体）、核孔（大分子如 mRNA、蛋白质进出的通道，具选择透过性，DNA 不能随意出核，大分子进出需能量）、核仁（与某种 RNA 的合成及核糖体的形成有关）、染色质（DNA+蛋白质，…", "ch": 4}, {"t": "结构完整性", "c": "核质依存：精子和哺乳动物成熟红细胞寿命短；细胞需保持结构完整性。代谢旺盛细胞：核孔数目多、核仁较大。", "ch": 4}, {"t": "核孔数目多、核仁较大", "c": "核质依存：精子和哺乳动物成熟红细胞寿命短；细胞需保持结构完整性。代谢旺盛细胞：核孔数目多、核仁较大。", "ch": 4}, {"t": "大于 2S", "c": "提取人口腔上皮细胞膜脂质铺单分子层面积 大于 2S（含核膜、细胞器膜等）；哺乳动物成熟红细胞则恰好等于 2S；细菌因无核膜等也接近 2S。", "ch": 4}, {"t": "核质比", "c": "双小核草履虫有两个核、肌肉细胞多核：维持正常核质比。", "ch": 4}, {"t": "胶质状", "c": "细胞质 = 细胞质基质（胶质状，细胞代谢的主要场所，含水、无机盐、脂质、糖类、氨基酸、核苷酸、多种酶）+ 细胞器。", "ch": 5}, {"t": "差速离心法", "c": "分离细胞器的方法：差速离心法——细胞核最先沉淀，依次为叶绿体、线粒体与溶酶体、内质网与高尔基体，核糖体最后。", "ch": 5}, {"t": "细胞骨架", "c": "细胞骨架：由蛋白质纤维组成的网架结构；功能：维持细胞形态、锚定支撑细胞器，与细胞运动、分裂、分化及物质运输、能量转化、信息传递等密切相关。", "ch": 5}, {"t": "蛋白质纤维", "c": "细胞骨架：由蛋白质纤维组成的网架结构；功能：维持细胞形态、锚定支撑细胞器，与细胞运动、分裂、分化及物质运输、能量转化、信息传递等密切相关。", "ch": 5}, {"t": "有氧呼吸的主要场所", "c": "有氧呼吸的主要场所（二、三阶段）；「动力车间」；含少量 DNA（半自主）", "ch": 5}, {"t": "光合作用的场所", "c": "绿色植物光合作用的场所；「养料制造车间、能量转换站」", "ch": 5}, {"t": "加工、分类、包装", "c": "对来自内质网的蛋白质加工、分类、包装；植物：与细胞壁形成有关；「发送站」", "ch": 5}, {"t": "无膜", "c": "无膜，rRNA+蛋白质", "ch": 5}, {"t": "合成蛋白质", "c": "合成蛋白质（「生产蛋白质的机器」）；游离型合成胞内蛋白，附着型合成分泌蛋白/膜蛋白", "ch": 5}, {"t": "酸性水解酶", "c": "单层膜，内含多种酸性水解酶（pH≈5）", "ch": 5}, {"t": "高尔基体", "c": "分解衰老损伤的细胞器；吞噬杀死入侵病毒病菌；「消化车间」；来源于高尔基体", "ch": 5}, {"t": "细胞液", "c": "单层膜，内含细胞液（糖类、无机盐、色素、蛋白质）", "ch": 5}, {"t": "动物和低等植物", "c": "与动物和低等植物细胞的有丝分裂有关", "ch": 5}, {"t": "中心体", "c": "能自我复制的细胞器：线粒体、叶绿体（半自主，含环状 DNA）和中心体（间期复制，不含 DNA）。", "ch": 5}, {"t": "蛔虫除外", "c": "真核细胞（蛔虫除外）", "ch": 5}, {"t": "仅用于暗反应 C3 的还原", "c": "仅用于暗反应 C3 的还原", "ch": 5}, {"t": "同位素标记（示踪）法", "c": "研究方法：同位素标记（示踪）法（3H 标记亮氨酸注入豚鼠胰腺腺泡细胞），放射性依次出现于：核糖体 → 内质网 → 高尔基体 → 细胞膜 → 分泌物。", "ch": 5}, {"t": "交通枢纽/转化中心", "c": "膜面积变化：内质网减少；高尔基体先增后减（基本不变）——膜流的交通枢纽/转化中心；细胞膜增加。", "ch": 5}, {"t": "核糖体和中心体无膜，不属于生物膜系统", "c": "组成：细胞膜、核膜 + 细胞器膜（内质网、高尔基体、溶酶体、液泡、线粒体、叶绿体等）。核糖体和中心体无膜，不属于生物膜系统；原核生物有生物膜（细胞膜）但无生物膜系统。", "ch": 5}, {"t": "原核生物有生物膜（细胞膜）但无生物膜系统", "c": "组成：细胞膜、核膜 + 细胞器膜（内质网、高尔基体、溶酶体、液泡、线粒体、叶绿体等）。核糖体和中心体无膜，不属于生物膜系统；原核生物有生物膜（细胞膜）但无生物膜系统。", "ch": 5}, {"t": "叶绿体运动", "c": "原理：叶绿体绿色、扁平椭球形，不需染色可直接观察；观察细胞质流动以叶绿体运动为标志。活细胞的细胞质处于不断流动状态（环流式）。", "ch": 5}, {"t": "光照、室温", "c": "先低倍镜找细胞，再高倍镜观察；黑藻提前在光照、室温下培养可提高流速。同一细胞中叶绿体流动方向一致；若显微镜下顺时针环流，实际也是顺时针（显微镜不上下颠倒旋转方向）。", "ch": 5}, {"t": "亚显微结构", "c": "显微结构（光镜可见）：细胞壁、细胞质、细胞核、核仁、染色体、叶绿体、线粒体、液泡；亚显微结构（需电镜）：细胞膜、内质网膜、核膜厚度、核糖体、细胞骨架（<0.2 μm）。", "ch": 5}, {"t": "水分子（或其他溶剂分子）通过半透膜的扩散", "c": "概念：水分子（或其他溶剂分子）通过半透膜的扩散。方向：双向移动、总体单向。", "ch": 6}, {"t": "半透膜", "c": "条件：①具有半透膜；②膜两侧溶液具有浓度差。", "ch": 6}, {"t": "浓度差", "c": "条件：①具有半透膜；②膜两侧溶液具有浓度差。", "ch": 6}, {"t": "选择透过性膜是生物膜", "c": "半透膜：某些物质可透过而另一些不能透过的多孔性薄膜；选择透过性膜是生物膜，具有选择透过性（活性依赖）。", "ch": 6}, {"t": "仍然较高", "c": "动态平衡时：水分子仍在进出（数目相等），液面高的一侧浓度仍然较高（水柱压力所致）；浓度指物质的量浓度而非质量浓度。", "ch": 6}, {"t": "物质的量浓度", "c": "动态平衡时：水分子仍在进出（数目相等），液面高的一侧浓度仍然较高（水柱压力所致）；浓度指物质的量浓度而非质量浓度。", "ch": 6}, {"t": "先升后降，最终内外相等", "c": "漏斗实验：蔗糖酶加入后，若单糖不能透过半透膜→液面继续上升后稳定；若单糖能透过→先升后降，最终内外相等。", "ch": 6}, {"t": "质壁分离", "c": "质壁分离", "ch": 6}, {"t": "原生质层", "c": "原生质层：细胞膜+液泡膜+两层膜之间的细胞质", "ch": 6}, {"t": "原生质层伸缩性大于细胞壁", "c": "原理：内因——原生质层伸缩性大于细胞壁、原生质层相当于半透膜；外因——外界溶液浓度＞细胞液浓度。", "ch": 6}, {"t": "外表皮", "c": "选材：紫色洋葱鳞片叶外表皮（有大液泡、细胞液紫色便于观察）；黑藻（叶绿体绿色可观察）；洋葱内表皮可发生但不宜观察。", "ch": 6}, {"t": "浸润", "c": "试剂：0.3 g/mL 蔗糖溶液——既明显质壁分离又不致细胞失水死亡。引流法：滴蔗糖/清水+吸水纸吸引，重复几次，目的是让细胞浸润在相应溶液中。", "ch": 6}, {"t": "三次低倍镜观察、自身前后对照", "c": "三次低倍镜观察、自身前后对照：正常态 → 质壁分离 → 复原。第二次观察时质壁分离首先发生在细胞的角隅处；第一次观察不能省略。", "ch": 6}, {"t": "首先发生在细胞的角隅处", "c": "三次低倍镜观察、自身前后对照：正常态 → 质壁分离 → 复原。第二次观察时质壁分离首先发生在细胞的角隅处；第一次观察不能省略。", "ch": 6}, {"t": "外界溶液", "c": "变化分析：失水越多 → 液泡变小、颜色变深、细胞液浓度变大、吸水能力越强；细胞体积略缩小（壁限制）。原生质层与细胞壁之间充满外界溶液（细胞壁全透）。", "ch": 6}, {"t": "主动运输", "c": "自动复原：外界浓度＞细胞液浓度先失水质壁分离，但 K⁺、NO₃⁻ 等被主动运输吸收进入细胞，细胞液浓度升高后渗透吸水复原。能自动复原的溶液：KNO₃、甘油、尿素、乙二醇、葡萄糖（0.5 mol/L 尿素先分离后复原；0.…", "ch": 6}, {"t": "红细胞吸收葡萄糖", "c": "红细胞吸收葡萄糖、水经水通道蛋白、K⁺ 经 K⁺ 通道、Na⁺ 内流、K⁺ 外流", "ch": 6}, {"t": "耗能", "c": "耗能", "ch": 6}, {"t": "载体蛋白", "c": "载体蛋白", "ch": 6}, {"t": "自身构象（空间结构）改变", "c": "载体蛋白：只容许与自身结合部位相适应的分子/离子通过，转运时自身构象（空间结构）改变，如 CFTR 蛋白转运 Cl⁻（氯离子大小与性质与其结合部位相适应）。", "ch": 6}, {"t": "不与运输分子结合", "c": "通道蛋白：只容许大小和电荷相适应的分子通过，不与运输分子结合；水通道蛋白、离子通道。", "ch": 6}, {"t": "主动选择吸收", "c": "主动运输意义：保证细胞按生命活动需要，主动选择吸收所需营养物质，排出代谢废物和对细胞有害的物质（教材 P70）。", "ch": 6}, {"t": "流动性", "c": "胞吞胞吐（大分子等）：依赖膜的流动性，需要膜上蛋白质参与，耗能；跨膜 0 层；运输的不一定是大分子（神经递质小分子也经胞吐）；大分子也可经核孔出（不用胞吞胞吐）。", "ch": 6}, {"t": "降低化学反应的活化能", "c": "作用：催化；机理：降低化学反应的活化能（分子从常态转变为容易发生反应的活跃状态所需的能量）。与加热（给反应物能量）机理不同。", "ch": 7}, {"t": "毕希纳", "c": "本质探索（课本 P79）：巴斯德（发酵与活酵母细胞有关）→ 李比希（酵母死亡裂解后物质起作用）→ 毕希纳（获得无细胞提取液「酿酶」）→ 萨姆纳（提取脲酶结晶，证明是蛋白质）→ 切赫、奥特曼（少数 RNA 也有催化功能）。", "ch": 7}, {"t": "萨姆纳", "c": "本质探索（课本 P79）：巴斯德（发酵与活酵母细胞有关）→ 李比希（酵母死亡裂解后物质起作用）→ 毕希纳（获得无细胞提取液「酿酶」）→ 萨姆纳（提取脲酶结晶，证明是蛋白质）→ 切赫、奥特曼（少数 RNA 也有催化功能）。", "ch": 7}, {"t": "切赫、奥特曼", "c": "本质探索（课本 P79）：巴斯德（发酵与活酵母细胞有关）→ 李比希（酵母死亡裂解后物质起作用）→ 毕希纳（获得无细胞提取液「酿酶」）→ 萨姆纳（提取脲酶结晶，证明是蛋白质）→ 切赫、奥特曼（少数 RNA 也有催化功能）。", "ch": 7}, {"t": "有机物，绝大多数是蛋白质，少数是 RNA", "c": "酶的概念：活细胞产生的、具有催化作用的有机物，绝大多数是蛋白质，少数是 RNA。", "ch": 7}, {"t": "高效性", "c": "高效性：与无机催化剂相比降低活化能更显著——H₂O₂ 实验：3、4 号对照（Fe³⁺ vs 过氧化氢酶），气泡多、卫生香复燃猛。", "ch": 7}, {"t": "专一性", "c": "专一性：每种酶只能催化一种或一类化学反应。两套方案：①「一底物多酶」淀粉+唾液淀粉酶/蔗糖酶，用碘液检测（蔗糖不与碘反应，不能用碘液检蔗糖是否水解）；②「一酶多底物」淀粉/蔗糖+淀粉酶，用斐林试剂（60 ℃ 保温、沸水浴…", "ch": 7}, {"t": "碘液", "c": "专一性：每种酶只能催化一种或一类化学反应。两套方案：①「一底物多酶」淀粉+唾液淀粉酶/蔗糖酶，用碘液检测（蔗糖不与碘反应，不能用碘液检蔗糖是否水解）；②「一酶多底物」淀粉/蔗糖+淀粉酶，用斐林试剂（60 ℃ 保温、沸水浴…", "ch": 7}, {"t": "斐林试剂", "c": "专一性：每种酶只能催化一种或一类化学反应。两套方案：①「一底物多酶」淀粉+唾液淀粉酶/蔗糖酶，用碘液检测（蔗糖不与碘反应，不能用碘液检蔗糖是否水解）；②「一酶多底物」淀粉/蔗糖+淀粉酶，用斐林试剂（60 ℃ 保温、沸水浴…", "ch": 7}, {"t": "作用条件温和", "c": "作用条件温和：适宜温度、pH。过酸过碱、高温破坏空间结构永久失活；低温抑制活性但空间结构稳定，升温可恢复——酶保存：低温、最适 pH。", "ch": 7}, {"t": "低温抑制活性但空间结构稳定，升温可恢复", "c": "作用条件温和：适宜温度、pH。过酸过碱、高温破坏空间结构永久失活；低温抑制活性但空间结构稳定，升温可恢复——酶保存：低温、最适 pH。", "ch": 7}, {"t": "不改变平衡点", "c": "酶促反应原理与催化剂共性：①改变化学反应速率而本身不被消耗；②只能缩短达到平衡的时间，不改变平衡点；③反应前后性质数量不变（但酶自身需要更新）；④都降低活化能。", "ch": 7}, {"t": "先各自保温 5 min 再混合", "c": "冰浴（不变蓝）0 ℃、60 ℃（变蓝浅/消失）、沸水浴（变蓝）三组；先各自保温 5 min 再混合（防止未达预设温度即反应）；沸水浴后自来水冲凉再加碘（100 ℃ 直链淀粉螺旋结构破坏遇碘不变蓝；防止碘蒸发）；不能用 H…", "ch": 7}, {"t": "不能用 H₂O₂ 酶", "c": "冰浴（不变蓝）0 ℃、60 ℃（变蓝浅/消失）、沸水浴（变蓝）三组；先各自保温 5 min 再混合（防止未达预设温度即反应）；沸水浴后自来水冲凉再加碘（100 ℃ 直链淀粉螺旋结构破坏遇碘不变蓝；防止碘蒸发）；不能用 H…", "ch": 7}, {"t": "不能用斐林试剂", "c": "冰浴（不变蓝）0 ℃、60 ℃（变蓝浅/消失）、沸水浴（变蓝）三组；先各自保温 5 min 再混合（防止未达预设温度即反应）；沸水浴后自来水冲凉再加碘（100 ℃ 直链淀粉螺旋结构破坏遇碘不变蓝；防止碘蒸发）；不能用 H…", "ch": 7}, {"t": "不能用淀粉酶", "c": "先加酶+不同 pH 溶液（蒸馏水/HCl/NaOH）再加底物（否则未调 pH 反应已结束）；不能用淀粉酶（淀粉在酸性下自行水解；斐林试剂与酸反应干扰；碱性环境碘与碱反应干扰）", "ch": 7}, {"t": "单位时间内底物减少量或产物生成量", "c": "酶活性：酶催化特定化学反应的能力，用单位时间内底物减少量或产物生成量表示。", "ch": 7}, {"t": "温度、pH 通过影响酶活性", "c": "影响因素分两类：温度、pH 通过影响酶活性影响反应速率；酶浓度、底物浓度通过影响酶与底物接触面积影响速率，不影响酶活性。", "ch": 7}, {"t": "酶浓度、底物浓度通过影响酶与底物接触面积", "c": "影响因素分两类：温度、pH 通过影响酶活性影响反应速率；酶浓度、底物浓度通过影响酶与底物接触面积影响速率，不影响酶活性。", "ch": 7}, {"t": "Km 增大、Vmax 不变", "c": "抑制剂三种：竞争性抑制——抑制剂与底物结构相似，竞争活性中心；Km 增大、Vmax 不变，增加底物浓度可解除。非竞争性抑制——结合活性中心以外必需基团；Km 不变、Vmax 降低，加底物不能解除。反竞争性抑制——只结合酶…", "ch": 7}, {"t": "Km 不变、Vmax 降低", "c": "抑制剂三种：竞争性抑制——抑制剂与底物结构相似，竞争活性中心；Km 增大、Vmax 不变，增加底物浓度可解除。非竞争性抑制——结合活性中心以外必需基团；Km 不变、Vmax 降低，加底物不能解除。反竞争性抑制——只结合酶…", "ch": 7}, {"t": "Km 减小、Vmax 降低", "c": "抑制剂三种：竞争性抑制——抑制剂与底物结构相似，竞争活性中心；Km 增大、Vmax 不变，增加底物浓度可解除。非竞争性抑制——结合活性中心以外必需基团；Km 不变、Vmax 降低，加底物不能解除。反竞争性抑制——只结合酶…", "ch": 7}, {"t": "酶与底物的亲和力", "c": "Km（米氏常数）：反应速率达最大速率一半时的底物浓度，反映酶与底物的亲和力（越小亲和力越大）。", "ch": 7}, {"t": "A—P~P~P", "c": "结构简式 A—P~P~P：A=腺苷（腺嘌呤+核糖）；P=磷酸基团；—普通化学键；~特殊的化学键（远离 A 的那个易断裂，水解释能约 30.54 kJ/mol）。元素：C、H、O、N、P。", "ch": 7}, {"t": "特殊的化学键", "c": "结构简式 A—P~P~P：A=腺苷（腺嘌呤+核糖）；P=磷酸基团；—普通化学键；~特殊的化学键（远离 A 的那个易断裂，水解释能约 30.54 kJ/mol）。元素：C、H、O、N、P。", "ch": 7}, {"t": "直接的能源物质", "c": "功能：直接的能源物质——糖类、脂肪中能量稳定不能直接利用，须转化为 ATP 中活跃化学能。ATP 是物质不是能量；能口服（被消化分解，意义不大）。", "ch": 7}, {"t": "能口服", "c": "功能：直接的能源物质——糖类、脂肪中能量稳定不能直接利用，须转化为 ATP 中活跃化学能。ATP 是物质不是能量；能口服（被消化分解，意义不大）。", "ch": 7}, {"t": "转化迅速且处于动态平衡", "c": "ATP 含量少但供能及时持续：ATP 与 ADP 转化迅速且处于动态平衡；该转化机制是生物界的共性。", "ch": 7}, {"t": "不可逆反应", "c": "ATP ⇄ ADP + Pi + 能量：不可逆反应——酶不同（水解酶/合成酶）、场所不同、物质可逆而能量不可逆。合成能量来源：动物——呼吸作用；植物——呼吸作用+光合作用。", "ch": 7}, {"t": "能量不可逆", "c": "ATP ⇄ ADP + Pi + 能量：不可逆反应——酶不同（水解酶/合成酶）、场所不同、物质可逆而能量不可逆。合成能量来源：动物——呼吸作用；植物——呼吸作用+光合作用。", "ch": 7}, {"t": "货币", "c": "能量流通：吸能反应与 ATP 水解相联系；放能反应与 ATP 合成相联系。ATP 是细胞内流通的能量「货币」。", "ch": 7}, {"t": "总反应式", "c": "C6H12O6 + 6O2 + 6H2O →(酶) 6CO2 + 12H2O + 能量", "ch": 8}, {"t": "元素去向", "c": "CO2 中 O：来自葡萄糖和水", "ch": 8}, {"t": "转移路径", "c": "C：葡萄糖 → 丙酮酸 → CO2", "ch": 8}, {"t": "产酒精型", "c": "C6H12O6 →(酶) 2C2H5OH + 2CO2 + 少量能量", "ch": 8}, {"t": "产乳酸型", "c": "C6H12O6 →(酶) 2C3H6O3 + 少量能量", "ch": 8}, {"t": "共同点", "c": "场所全程在细胞质基质", "ch": 8}, {"t": "条件温和", "c": "与体外燃烧相比：有氧呼吸条件温和；能量逐步释放；一部分储存在 ATP 中。意义：能量逐步转移到 ATP、充分利用；缓慢有序释放维持细胞相对稳定。", "ch": 8}, {"t": "逐步释放", "c": "与体外燃烧相比：有氧呼吸条件温和；能量逐步释放；一部分储存在 ATP 中。意义：能量逐步转移到 ATP、充分利用；缓慢有序释放维持细胞相对稳定。", "ch": 8}, {"t": "兼性厌氧", "c": "酵母菌：真核单细胞真菌，兼性厌氧，繁殖（出芽生殖为主），细胞壁+细胞膜+细胞核+液泡+线粒体。", "ch": 8}, {"t": "对比实验法", "c": "方法：对比实验法（有氧、无氧装置相互对照）。检测 CO₂：澄清石灰水变浑浊；溴麝香草酚蓝水溶液：蓝→绿→黄（由变黄时间长短判断 CO₂ 多少）。检测酒精：酸性（浓硫酸）重铬酸钾：橙色→灰绿色。", "ch": 8}, {"t": "澄清石灰水变浑浊", "c": "方法：对比实验法（有氧、无氧装置相互对照）。检测 CO₂：澄清石灰水变浑浊；溴麝香草酚蓝水溶液：蓝→绿→黄（由变黄时间长短判断 CO₂ 多少）。检测酒精：酸性（浓硫酸）重铬酸钾：橙色→灰绿色。", "ch": 8}, {"t": "溴麝香草酚蓝水溶液：蓝→绿→黄", "c": "方法：对比实验法（有氧、无氧装置相互对照）。检测 CO₂：澄清石灰水变浑浊；溴麝香草酚蓝水溶液：蓝→绿→黄（由变黄时间长短判断 CO₂ 多少）。检测酒精：酸性（浓硫酸）重铬酸钾：橙色→灰绿色。", "ch": 8}, {"t": "酸性（浓硫酸）重铬酸钾：橙色→灰绿色", "c": "方法：对比实验法（有氧、无氧装置相互对照）。检测 CO₂：澄清石灰水变浑浊；溴麝香草酚蓝水溶液：蓝→绿→黄（由变黄时间长短判断 CO₂ 多少）。检测酒精：酸性（浓硫酸）重铬酸钾：橙色→灰绿色。", "ch": 8}, {"t": "NaOH 溶液", "c": "装置要点：空气先经 NaOH 溶液（除去 CO₂，排除干扰）；B 瓶（无氧组）先封口放置一段时间耗尽 O₂ 再连通检测瓶；培养液煮沸灭菌（排除杂菌呼吸干扰）；检测酒精需过滤取滤液（培养液浑浊有色会干扰，且葡萄糖可被重铬酸…", "ch": 8}, {"t": "先封口放置一段时间耗尽 O₂", "c": "装置要点：空气先经 NaOH 溶液（除去 CO₂，排除干扰）；B 瓶（无氧组）先封口放置一段时间耗尽 O₂ 再连通检测瓶；培养液煮沸灭菌（排除杂菌呼吸干扰）；检测酒精需过滤取滤液（培养液浑浊有色会干扰，且葡萄糖可被重铬酸…", "ch": 8}, {"t": "煮沸灭菌", "c": "装置要点：空气先经 NaOH 溶液（除去 CO₂，排除干扰）；B 瓶（无氧组）先封口放置一段时间耗尽 O₂ 再连通检测瓶；培养液煮沸灭菌（排除杂菌呼吸干扰）；检测酒精需过滤取滤液（培养液浑浊有色会干扰，且葡萄糖可被重铬酸…", "ch": 8}, {"t": "过滤取滤液", "c": "装置要点：空气先经 NaOH 溶液（除去 CO₂，排除干扰）；B 瓶（无氧组）先封口放置一段时间耗尽 O₂ 再连通检测瓶；培养液煮沸灭菌（排除杂菌呼吸干扰）；检测酒精需过滤取滤液（培养液浑浊有色会干扰，且葡萄糖可被重铬酸…", "ch": 8}, {"t": "细胞质基质", "c": "细胞质基质", "ch": 8}, {"t": "2 丙酮酸 + [H](NADH)", "c": "葡萄糖 → 2 丙酮酸 + [H](NADH)", "ch": 8}, {"t": "线粒体基质", "c": "线粒体基质", "ch": 8}, {"t": "H₂O", "c": "丙酮酸 + H₂O → CO₂ + [H]", "ch": 8}, {"t": "线粒体内膜", "c": "线粒体内膜", "ch": 8}, {"t": "O₂", "c": "[H] + O₂ → H₂O", "ch": 8}, {"t": "大量 ATP", "c": "大量 ATP（最多）", "ch": 8}, {"t": "存留在酒精或乳酸中", "c": "无氧呼吸释放能量少的原因：葡萄糖中大部分能量存留在酒精或乳酸中；无氧呼吸释放的能量大部分（其余部分）以热能散失。", "ch": 8}, {"t": "控制酶合成的基因不同", "c": "不同生物无氧呼吸产物不同的直接原因：酶种类不同；根本原因：控制酶合成的基因不同。", "ch": 8}, {"t": "O₂ 吸收量 = CO₂ 释放量", "c": "据气体：O₂ 吸收量 = CO₂ 释放量 → 只进行有氧呼吸（或同时有产乳酸无氧呼吸）；CO₂ &gt; O₂ → 有氧呼吸 + 产酒精无氧呼吸（差值 = 无氧呼吸释放的 CO₂，差值的一半 = 酒精量）；只无 CO₂ …", "ch": 8}, {"t": "CO₂ &gt; O₂", "c": "据气体：O₂ 吸收量 = CO₂ 释放量 → 只进行有氧呼吸（或同时有产乳酸无氧呼吸）；CO₂ &gt; O₂ → 有氧呼吸 + 产酒精无氧呼吸（差值 = 无氧呼吸释放的 CO₂，差值的一半 = 酒精量）；只无 CO₂ …", "ch": 8}, {"t": "遮光", "c": "液滴移动法（装置一 NaOH 吸收 CO₂：左移距离 = 有氧呼吸耗 O₂ 量；装置二清水对照：左移 = 耗 O₂ − 放 CO₂，右移 = 放 CO₂ − 耗 O₂）。设死种子（等量灭活）对照排除气压温度物理因素；装置…", "ch": 8}, {"t": "温度（影响酶活性）", "c": "外因：温度（影响酶活性）、O₂ 浓度、CO₂ 浓度（高浓度抑制呼吸）、含水量。", "ch": 8}, {"t": "稻田定期排水（避免无氧呼吸产酒精烂根）", "c": "应用（背诵）：包扎伤口用透气纱布（抑制厌氧菌）；酿酒 "ch": 9}, {"t": "类囊体薄膜", "c": "类囊体薄膜", "ch": 9}, {"t": "叶绿体基质", "c": "叶绿体基质", "ch": 9}, {"t": "不直接需光但依赖光反应产物", "c": "多种酶、CO₂；不直接需光但依赖光反应产物", "ch": 9}, {"t": "2C₃", "c": "①CO₂ 固定：CO₂ + C₅ → 2C₃；②C₃ 的还原：C₃ + [H] + ATP →（CH₂O）+ C₅", "ch": 9}, {"t": "活跃化学能", "c": "光能 → NADPH、ATP 中活跃化学能", "ch": 9}, {"t": "稳定化学能", "c": "活跃化学能 → 有机物中稳定化学能", "ch": 9}, {"t": "水的光解", "c": "唯一不需要酶催化的反应：水的光解。", "ch": 9}, {"t": "主动运输", "c": "光反应中 ATP 合成：PQ 载体主动运输泵 H⁺ 入类囊体腔 + 水光解产 H⁺；H⁺ 经 ATP 合酶（协助扩散）回流合成 ATP。", "ch": 9}, {"t": "既消耗水又产生水", "c": "光反应、暗反应都既消耗水又产生水（光解耗水；合成糖类/ATP 产水）——判断正确。", "ch": 9}, {"t": "只用于暗反应", "c": "叶绿体产生的 ATP 只用于暗反应，不用于其他生命活动。", "ch": 9}, {"t": "C₃ 分子数是 C₅ 的 2 倍", "c": "暗反应稳定时，C₃ 分子数是 C₅ 的 2 倍（1 C₅ 固定 1 CO₂ 生成 2 C₃）。", "ch": 9}, {"t": "光补偿点", "c": "光补偿点：光合强度=呼吸强度（植物需整株光合＞呼吸才能生长）；光饱和点以后限制因素为 CO₂ 浓度、温度等。阳生植物补偿点、饱和点均高；阴生植物均低（连续阴雨时阴生植物受影响小）。", "ch": 9}, {"t": "光饱和点", "c": "光补偿点：光合强度=呼吸强度（植物需整株光合＞呼吸才能生长）；光饱和点以后限制因素为 CO₂ 浓度、温度等。阳生植物补偿点、饱和点均高；阴生植物均低（连续阴雨时阴生植物受影响小）。", "ch": 9}, {"t": "真正（总）光合 = 净（表观）光合 + 呼吸消耗", "c": "关键指标：真正（总）光合 = 净（表观）光合 + 呼吸消耗。「制造/产生/固定/合成/消耗」为总光合；「吸收/释放/测定/积累」为净光合。", "ch": 9}, {"t": "硝化细菌", "c": "硝化细菌等：利用体外环境中无机物氧化（NH₃ → HNO₂ → HNO₃）释放的化学能合成有机物。与光合作用同为自养，但能源不同（化学能 vs 光能）。", "ch": 9}, {"t": "浮起的数量", "c": "光合作用影响因素实验（教材 P105）：探究光照强度——调整灯与烧杯距离；CO₂ 浓度——吹气时间或不同浓度 NaHCO₃ 溶液；温度——水浴保温；光质——功率相同的不同色光 LED。因变量：圆形小叶片浮起的数量（或浮起…", "ch": 9}, {"t": "盛水玻璃槽", "c": "光合作用影响因素实验（教材 P105）：探究光照强度——调整灯与烧杯距离；CO₂ 浓度——吹气时间或不同浓度 NaHCO₃ 溶液；温度——水浴保温；光质——功率相同的不同色光 LED。因变量：圆形小叶片浮起的数量（或浮起…", "ch": 9}, {"t": "花青素", "c": "秋叶变黄：低温叶绿素合成受阻且易降解，类胡萝卜素稳定显现黄色；变红：可溶性糖积累形成花青素。遮光条件下叶绿素含量升高、叶绿素 a/b 比值降低（适应蓝紫光比例高的阴生环境）。", "ch": 9}, {"t": "生长和分裂", "c": "细胞增殖：细胞生长和分裂的过程（物质准备+细胞分裂）；是生物体生长、发育、繁殖、遗传的基础。", "ch": 10}, {"t": "表面积与体积之比（相对表面积）", "c": "细胞不能无限长大的原因：①表面积与体积之比（相对表面积）限制——体积越大相对表面积越小，物质运输效率越低；②核质比限制——一个核的控制能力有限。细胞也不能太小（容纳必要结构与物质）。", "ch": 10}, {"t": "核质比", "c": "细胞不能无限长大的原因：①表面积与体积之比（相对表面积）限制——体积越大相对表面积越小，物质运输效率越低；②核质比限制——一个核的控制能力有限。细胞也不能太小（容纳必要结构与物质）。", "ch": 10}, {"t": "细胞周期（黑体）", "c": "细胞周期（黑体）：连续分裂的细胞，从一次分裂完成时开始，到下一次分裂完成时为止；包括分裂间期（约占 90%~95%）和分裂期（M 期）。有丝分裂严格指分裂期。", "ch": 10}, {"t": "一次分裂完成时开始", "c": "细胞周期（黑体）：连续分裂的细胞，从一次分裂完成时开始，到下一次分裂完成时为止；包括分裂间期（约占 90%~95%）和分裂期（M 期）。有丝分裂严格指分裂期。", "ch": 10}, {"t": "下一次分裂完成时为止", "c": "细胞周期（黑体）：连续分裂的细胞，从一次分裂完成时开始，到下一次分裂完成时为止；包括分裂间期（约占 90%~95%）和分裂期（M 期）。有丝分裂严格指分裂期。", "ch": 10}, {"t": "S 期（DNA 复制）", "c": "分裂间期细分：G1（RNA、蛋白质合成，为 S 期准备）、S 期（DNA 复制）、G2（合成微管蛋白等，为 M 期准备）。", "ch": 10}, {"t": "DNA 分子的复制", "c": "完成 DNA 分子的复制和有关蛋白质的合成，细胞适度生长；动物细胞中心粒倍增", "ch": 10}, {"t": "有关蛋白质的合成", "c": "完成 DNA 分子的复制和有关蛋白质的合成，细胞适度生长；动物细胞中心粒倍增", "ch": 10}, {"t": "「膜仁消失显两体」", "c": "「膜仁消失显两体」：核膜核仁消失，出现染色体和纺锤体，染色体散乱分布", "ch": 10}, {"t": "「形定数晰赤道齐」", "c": "「形定数晰赤道齐」：染色体形态稳定、数目清晰，着丝粒整齐排列在赤道板上——观察染色体最佳时期", "ch": 10}, {"t": "赤道板", "c": "「形定数晰赤道齐」：染色体形态稳定、数目清晰，着丝粒整齐排列在赤道板上——观察染色体最佳时期", "ch": 10}, {"t": "「点裂数数加均极」", "c": "「点裂数数加均极」：着丝粒分裂，姐妹染色单体分开成为两条染色体，染色体数目加倍，平均移向两极", "ch": 10}, {"t": "加倍", "c": "「点裂数数加均极」：着丝粒分裂，姐妹染色单体分开成为两条染色体，染色体数目加倍，平均移向两极", "ch": 10}, {"t": "「两消两现重开始」", "c": "「两消两现重开始」：染色体、纺锤体消失，核膜核仁重现", "ch": 10}, {"t": "中心粒发出星射线", "c": "动植物细胞有丝分裂区别：①前期纺锤体形成方式——动物中心粒发出星射线；植物两极发出纺锤丝；②末期细胞质分裂——动物细胞膜中部内陷缢裂；植物赤道板位置出现细胞板扩展成新细胞壁。区分动植物细胞最可靠依据：细胞质分裂方式（有无…", "ch": 10}, {"t": "两极发出纺锤丝", "c": "动植物细胞有丝分裂区别：①前期纺锤体形成方式——动物中心粒发出星射线；植物两极发出纺锤丝；②末期细胞质分裂——动物细胞膜中部内陷缢裂；植物赤道板位置出现细胞板扩展成新细胞壁。区分动植物细胞最可靠依据：细胞质分裂方式（有无…", "ch": 10}, {"t": "细胞膜中部内陷缢裂", "c": "动植物细胞有丝分裂区别：①前期纺锤体形成方式——动物中心粒发出星射线；植物两极发出纺锤丝；②末期细胞质分裂——动物细胞膜中部内陷缢裂；植物赤道板位置出现细胞板扩展成新细胞壁。区分动植物细胞最可靠依据：细胞质分裂方式（有无…", "ch": 10}, {"t": "赤道板位置出现细胞板", "c": "动植物细胞有丝分裂区别：①前期纺锤体形成方式——动物中心粒发出星射线；植物两极发出纺锤丝；②末期细胞质分裂——动物细胞膜中部内陷缢裂；植物赤道板位置出现细胞板扩展成新细胞壁。区分动植物细胞最可靠依据：细胞质分裂方式（有无…", "ch": 10}, {"t": "中心体", "c": "有关细胞器：核糖体（间期合成蛋白质）、中心体（动物、低等植物）、线粒体（供能）、高尔基体（植物末期形成细胞壁）。", "ch": 10}, {"t": "精确地平均分配", "c": "有丝分裂意义（黑体）：将亲代细胞的染色体经过复制后，精确地平均分配到两个子细胞中，保持亲代和子代细胞之间遗传性状的稳定性。", "ch": 10}, {"t": "亲代和子代细胞之间遗传性状的稳定性", "c": "有丝分裂意义（黑体）：将亲代细胞的染色体经过复制后，精确地平均分配到两个子细胞中，保持亲代和子代细胞之间遗传性状的稳定性。", "ch": 10}, {"t": "没有出现纺锤丝和染色体的变化", "c": "过程：细胞核先延长缢裂为二，然后整个细胞从中部缢裂为二。特点：没有出现纺锤丝和染色体的变化（但有 DNA 复制）；过程简单迅速耗能少，核膜核仁不消失。典型实例：蛙的红细胞（高等植物薄壁组织如胚乳细胞中也常见）。", "ch": 10}, {"t": "蛙的红细胞", "c": "过程：细胞核先延长缢裂为二，然后整个细胞从中部缢裂为二。特点：没有出现纺锤丝和染色体的变化（但有 DNA 复制）；过程简单迅速耗能少，核膜核仁不消失。典型实例：蛙的红细胞（高等植物薄壁组织如胚乳细胞中也常见）。", "ch": 10}, {"t": "解离后细胞已死亡", "c": "解离后细胞已死亡——不能观察到连续分裂过程，需移动装片寻找不同时期的细胞。", "ch": 10}, {"t": "呈正方形、排列紧密", "c": "分生区细胞特点：呈正方形、排列紧密；先低倍镜找分生区，再高倍镜观察；视野中间期细胞最多（间期时间最长——各期细胞数目与该期持续时间成正比）。", "ch": 10}, {"t": "间期", "c": "药物：抑制 DNA 复制的抗癌药使细胞停留在间期；秋水仙素抑制纺锤体形成→着丝粒正常分裂但染色体不能移向两极→染色体数目加倍（多倍体育种、中期阻断法）。", "ch": 10}, {"t": "秋水仙素抑制纺锤体形成", "c": "药物：抑制 DNA 复制的抗癌药使细胞停留在间期；秋水仙素抑制纺锤体形成→着丝粒正常分裂但染色体不能移向两极→染色体数目加倍（多倍体育种、中期阻断法）。", "ch": 10}, {"t": "形态、结构和生理功能上发生稳定性差异", "c": "概念（黑体）：在个体发育中，由一个或一种细胞增殖产生的后代，在形态、结构和生理功能上发生稳定性差异的过程。", "ch": 11}, {"t": "基因的选择性表达", "c": "根本原因（实质）：基因的选择性表达（遗传物质 DNA 不变；mRNA、蛋白质种类改变）。", "ch": 11}, {"t": "全套遗传信息（全套基因）", "c": "原因：细胞含有本物种的全套遗传信息（全套基因）。条件：①离体；②适宜的营养、激素等条件。标志：发育成完整个体或分化成其他各种细胞。", "ch": 11}, {"t": "离体", "c": "原因：细胞含有本物种的全套遗传信息（全套基因）。条件：①离体；②适宜的营养、激素等条件。标志：发育成完整个体或分化成其他各种细胞。", "ch": 11}, {"t": "已分化的动物细胞核具有全能性", "c": "实例：植物组织培养（植物细胞全能性）；克隆羊多莉（已分化的动物细胞核具有全能性）。种子萌发长成植株不是体现全能性（胚本身是幼体，属正常发育）。", "ch": 11}, {"t": "不是", "c": "实例：植物组织培养（植物细胞全能性）；克隆羊多莉（已分化的动物细胞核具有全能性）。种子萌发长成植株不是体现全能性（胚本身是幼体，属正常发育）。", "ch": 11}, {"t": "生殖细胞（卵细胞）分化程度高而全能性较高", "c": "一般规律：分化程度越高，全能性越低；但生殖细胞（卵细胞）分化程度高而全能性较高（孤雌生殖）——特例。", "ch": 11}, {"t": "体积增大", "c": "特征口诀「一大一小、一多一少、两慢两低」：细胞核体积增大（核膜内折、染色质收缩）、细胞体积变小；色素（脂褐素）积累；水分减少；酶活性降低、代谢减慢；膜通透性改变、物质运输功能降低。", "ch": 11}, {"t": "体积变小", "c": "特征口诀「一大一小、一多一少、两慢两低」：细胞核体积增大（核膜内折、染色质收缩）、细胞体积变小；色素（脂褐素）积累；水分减少；酶活性降低、代谢减慢；膜通透性改变、物质运输功能降低。", "ch": 11}, {"t": "自由基学说", "c": "自由基学说：异常活泼的带电分子或基团攻击磷脂（破坏生物膜）、DNA（基因突变）、蛋白质（活性下降）→ 细胞衰老。", "ch": 11}, {"t": "端粒学说", "c": "端粒学说：端粒是染色体两端特殊序列的 DNA-蛋白质复合体；细胞每分裂一次端粒缩短一截，内侧正常 DNA 序列受损 → 细胞活动异常。端粒酶（含 RNA 模板的逆转录酶）可补添端粒（生殖细胞、癌细胞中活跃）。", "ch": 11}, {"t": "特殊序列的 DNA-蛋白质复合体", "c": "端粒学说：端粒是染色体两端特殊序列的 DNA-蛋白质复合体；细胞每分裂一次端粒缩短一截，内侧正常 DNA 序列受损 → 细胞活动异常。端粒酶（含 RNA 模板的逆转录酶）可补添端粒（生殖细胞、癌细胞中活跃）。", "ch": 11}, {"t": "细胞普遍衰老的过程", "c": "个体衰老与细胞衰老的关系：单细胞生物——细胞衰老=个体衰老；多细胞生物——个体衰老=细胞普遍衰老的过程，但年轻个体也有衰老细胞，衰老个体也有新生细胞（造血干细胞）。", "ch": 11}, {"t": "自我更新", "c": "正常细胞衰老有利于机体自我更新；延缓衰老：合理营养、多运动、多用脑、不吸烟、心情愉悦。", "ch": 11}, {"t": "细胞凋亡（黑体）", "c": "细胞凋亡（黑体）：由基因所决定的细胞自动结束生命的过程（程序性死亡，主动、生理性、对机体有利）。实例：胚胎发育中尾的消失、指间细胞自动死亡、被病原体感染细胞的清除、成熟个体细胞的自然更新。", "ch": 11}, {"t": "基因所决定的细胞自动结束生命的过程", "c": "细胞凋亡（黑体）：由基因所决定的细胞自动结束生命的过程（程序性死亡，主动、生理性、对机体有利）。实例：胚胎发育中尾的消失、指间细胞自动死亡、被病原体感染细胞的清除、成熟个体细胞的自然更新。", "ch": 11}, {"t": "细胞坏死", "c": "细胞坏死：外界不利因素导致的被动死亡，膜破裂内容物释放引发炎症，对机体有害。长期吸烟肺部细胞病变死亡属于坏死。", "ch": 11}, {"t": "被动", "c": "细胞坏死：外界不利因素导致的被动死亡，膜破裂内容物释放引发炎症，对机体有害。长期吸烟肺部细胞病变死亡属于坏死。", "ch": 11}, {"t": "细胞自噬", "c": "细胞自噬：细胞「吃掉」自身结构和物质——依赖溶酶体清除变性/错误折叠蛋白、衰老损伤细胞器；养分不足时自噬增强；产物可回收利用；激烈的细胞自噬可能诱导细胞凋亡；随年龄增长肌肉细胞自噬减弱。", "ch": 11}, {"t": "溶酶体", "c": "细胞自噬：细胞「吃掉」自身结构和物质——依赖溶酶体清除变性/错误折叠蛋白、衰老损伤细胞器；养分不足时自噬增强；产物可回收利用；激烈的细胞自噬可能诱导细胞凋亡；随年龄增长肌肉细胞自噬减弱。", "ch": 11}, {"t": "激烈的细胞自噬可能诱导细胞凋亡", "c": "细胞自噬：细胞「吃掉」自身结构和物质——依赖溶酶体清除变性/错误折叠蛋白、衰老损伤细胞器；养分不足时自噬增强；产物可回收利用；激烈的细胞自噬可能诱导细胞凋亡；随年龄增长肌肉细胞自噬减弱。", "ch": 11}, {"t": "双层膜自噬泡", "c": "凋亡与自噬形态区别：凋亡形成凋亡小体（单层膜内陷包裹）；自噬形成双层膜自噬泡与溶酶体融合；凋亡一定导致细胞死亡，自噬不一定。", "ch": 11}, {"t": "光合作用与细胞呼吸的综合", "c": "非选择题几乎必考光合作用与细胞呼吸的综合（曲线分析、装置计算、实验设计），其次是细胞增殖图像与实验、酶实验设计。", "ch": 12}, {"t": "教材小字与拓展信息", "c": "近年高考题明显偏好教材小字与拓展信息：磷酸戊糖途径（2022 山东）、瓦堡效应（2020 全国Ⅰ）、CDK1/BYDV（2020 山东）、染色体桥（2020 山东）、细胞焦亡与凋亡对比（2025 山东）、KDEL 回收、…", "ch": 12}, {"t": "核 DNA 加倍", "c": "染色体数不变", "ch": 0}, {"t": "核 DNA / 染色体减半", "c": "同源染色体分离入两子细胞", "ch": 0}, {"t": "染色体暂时加倍", "c": "着丝粒分裂；减Ⅱ全程无同源", "ch": 0}, {"t": "1个精原细胞", "c": "2种4个精子（两两相同、互补）", "ch": 0}, {"t": "1个卵原细胞", "c": "1种1个卵细胞", "ch": 0}, {"t": "个体配子种类", "c": "n对同源染色体（不考虑互换）→ 2n 种", "ch": 0}, {"t": "互换率", "c": "发生交换的初级精母细胞比例 = 重组型配子比例 × 2", "ch": 0}, {"t": "同源染色体", "c": "同源染色体：减Ⅰ中配对的两条染色体，形状大小一般相同，一条来自父方、一条来自母方。", "ch": 0}, {"t": "联会", "c": "联会：同源染色体两两配对（减Ⅰ前期）；联会后每对同源染色体含4条染色单体，称四分体（1四分体=1对同源=2条染色体=4条单体=2个着丝粒）。", "ch": 0}, {"t": "四分体", "c": "联会：同源染色体两两配对（减Ⅰ前期）；联会后每对同源染色体含4条染色单体，称四分体（1四分体=1对同源=2条染色体=4条单体=2个着丝粒）。", "ch": 0}, {"t": "交叉互换", "c": "交叉互换：四分体时期，同源染色体的非姐妹染色单体之间交换对应片段（属于基因重组）。", "ch": 0}, {"t": "透明带反应", "c": "过程：精子头部进入卵细胞，尾部留外；透明带反应、卵细胞膜反应阻止多个精子入卵。", "ch": 0}, {"t": "卵细胞膜反应", "c": "过程：精子头部进入卵细胞，尾部留外；透明带反应、卵细胞膜反应阻止多个精子入卵。", "ch": 0}, {"t": "显性纯合致死", "c": "杂合子自交 → 显:隐 = 2:1", "ch": 1}, {"t": "隐性纯合致死", "c": "杂合子自交 → 后代全显性", "ch": 1}, {"t": "配子致死", "c": "如 AB 雄配子致死 → 5:3:3:1 变式（见第3章）", "ch": 1}, {"t": "杂合子连续自交 n 代", "c": "Aa 占 (1/2)n；纯合子 1−(1/2)n；显纯=隐纯=[1−(1/2)n]/2", "ch": 1}, {"t": "连续自交逐代淘汰 aa", "c": "AA:Aa 比例每代不变，淘汰后按比例重新归一化", "ch": 1}, {"t": "自由交配", "c": "基因频率不变，基因型频率自 F1 起稳定（遗传平衡）", "ch": 1}, {"t": "自交", "c": "自交：基因型相同个体间交配（闭花授粉、同株授粉）；杂交：基因型不同个体交配；测交：与隐性纯合子杂交。", "ch": 1}, {"t": "相对性状", "c": "相对性状：一种生物同一种性状的不同表现类型；性状分离：杂种后代中同时出现显性性状和隐性性状。", "ch": 1}, {"t": "等位基因", "c": "等位基因：同源染色体相同位置上控制相对性状的基因（纯合子同位置为相同基因；本质区别是碱基排列顺序不同）。", "ch": 1}, {"t": "同一对同源染色体·不考虑互换", "c": "完全连锁：自交后代全显性或 显:隐=3:1（比例型同单基因）；测交后代 1:1", "ch": 2}, {"t": "同一对同源染色体·考虑互换", "c": "重组型配子少：测交后代两多两少；自交后代两种单显性比例始终相等", "ch": 2}, {"t": "亲本型判断", "c": "aabb 占比＞1/16 → ab 为亲本型配子；＜1/16 → ab 为重组型配子", "ch": 2}, {"t": "重组类型", "c": "F1 全为黄圆（黄对绿、圆对皱均为显性）；F2 出现亲本没有的重组类型，四种表现型之比 9:3:3:1。", "ch": 2}, {"t": "呈线性排列", "c": "结论：基因在染色体上；后又发明测定基因相对位置的方法（三点测交），证明基因在染色体上呈线性排列。", "ch": 3}, {"t": "³⁵S 标记蛋白质", "c": "理论上沉淀物无放射性；实测有少量→搅拌不充分，噬菌体仍吸附在细菌表面", "ch": 4}, {"t": "³²P 标记 DNA", "c": "理论上上清液无放射性；实测有少量→保温过短（未全部侵入）或过长（细菌裂解释放子代）", "ch": 4}, {"t": "结论", "c": "DNA 是遗传物质，蛋白质不是（有争议说\"没证明\"）", "ch": 4}, {"t": "转化因子", "c": "格里菲思体内转化：加热杀死的S型菌 + 活R型菌 → 小鼠死亡，体内分离出活S型菌 → 加热杀死的S型菌中含有\"转化因子\"，使R型转化为S型。", "ch": 4}, {"t": "不互补碱基之和恒定", "c": "A+G = T+C = 50%", "ch": 5}, {"t": "互补碱基比例相等", "c": "单链(A+T)% = 互补链(A+T)% = 双链(A+T)%", "ch": 5}, {"t": "氢键数", "c": "n对碱基中G-C有m对：2(n−m)+3m = 2n+m", "ch": 5}, {"t": "磷酸二酯键", "c": "2n−2 个（n为碱基对数）", "ch": 5}, {"t": "时间", "c": "有丝分裂间期、减数第一次分裂前的间期", "ch": 5}, {"t": "场所", "c": "主要细胞核；其次线粒体、叶绿体；原核在拟核、质粒", "ch": 5}, {"t": "条件", "c": "模板（两条母链）、原料（4种游离脱氧核苷酸）、能量、酶（解旋酶、DNA聚合酶等）", "ch": 5}, {"t": "过程", "c": "解旋 → 合成子链 → 重新螺旋（边解旋边复制）", "ch": 5}, {"t": "特点", "c": "半保留复制；多起点、双向复制", "ch": 5}, {"t": "结果与意义", "c": "1个DNA→2个完全相同的DNA；保持遗传信息连续性", "ch": 5}, {"t": "n 次复制后 DNA", "c": "共 2n 个；含¹⁵N的 2 个；只含¹⁴N的 2n−2 个", "ch": 5}, {"t": "脱氧核苷酸链", "c": "共 2n+1 条；含¹⁵N的链 2 条；含¹⁴N的 2n+1−2 条", "ch": 5}, {"t": "消耗某种脱氧核苷酸", "c": "亲代含 m 个：n 次共耗 m(2n−1)；第 n 次耗 m·2n−1", "ch": 5}, {"t": "碱基互补配对原则", "c": "外侧：脱氧核糖与磷酸交替连接构成基本骨架；内侧：碱基通过氢键形成碱基对（A=T，G≡C），遵循碱基互补配对原则。", "ch": 5}, {"t": "遗传信息", "c": "遗传信息：基因中 4 种碱基（脱氧核苷酸）的排列顺序。多样性：碱基对的数目和排列顺序千变万化；特异性：每种生物有特定的碱基排列顺序（β-珠蛋白基因1700对→41700 种排列）。", "ch": 5}, {"t": "基因", "c": "基因：通常是有遗传效应的 DNA 片段。基因在 DNA 上不连续分布（被碱基序列分隔）；染色体是 DNA 的主要载体，基因在染色体上呈线性排列；RNA 病毒的基因在 RNA 上。", "ch": 5}, {"t": "遗传效应", "c": "基因：通常是有遗传效应的 DNA 片段。基因在 DNA 上不连续分布（被碱基序列分隔）；染色体是 DNA 的主要载体，基因在染色体上呈线性排列；RNA 病毒的基因在 RNA 上。", "ch": 5}, {"t": "密码子", "c": "密码子：mRNA 上决定一个氨基酸的 3 个相邻碱基，共 4³=64 种（3 种终止密码子、61 种决定氨基酸）；反密码子在 tRNA 上。一种密码子只决定一种氨基酸，一种氨基酸可由一种或多种密码子决定。", "ch": 6}, {"t": "反密码子", "c": "密码子：mRNA 上决定一个氨基酸的 3 个相邻碱基，共 4³=64 种（3 种终止密码子、61 种决定氨基酸）；反密码子在 tRNA 上。一种密码子只决定一种氨基酸，一种氨基酸可由一种或多种密码子决定。", "ch": 6}, {"t": "启动子", "c": "启动子：基因上游，RNA 聚合酶识别结合位点，本身不被转录；终止子：编码区下游，终止转录（RNA 水平形成茎-环结构）。", "ch": 6}, {"t": "终止子", "c": "启动子：基因上游，RNA 聚合酶识别结合位点，本身不被转录；终止子：编码区下游，终止转录（RNA 水平形成茎-环结构）。", "ch": 6}, {"t": "肽键", "c": "核糖体有 2 个 tRNA 结合位点；氨基酸间脱水缩合形成肽键；遇终止密码子合成终止。", "ch": 6}, {"t": "酶的合成控制代谢过程", "c": "间接控制：基因通过控制酶的合成控制代谢过程，进而控制性状——白化病（酪氨酸酶）、豌豆皱粒（淀粉分支酶）。", "ch": 6}, {"t": "蛋白质的结构", "c": "直接控制：基因通过控制蛋白质的结构直接控制性状——镰刀型细胞贫血（血红蛋白）、囊性纤维化（CFTR）。", "ch": 6}, {"t": "选择性表达", "c": "细胞分化的实质：基因的选择性表达；不同细胞 mRNA 不同，但 tRNA、rRNA 无差异。", "ch": 6}, {"t": "碱基序列保持不变", "c": "概念（背诵）：生物体基因的碱基序列保持不变，但基因表达和表型发生可遗传变化的现象。", "ch": 6}, {"t": "基因表达和表型发生可遗传变化", "c": "概念（背诵）：生物体基因的碱基序列保持不变，但基因表达和表型发生可遗传变化的现象。", "ch": 6}, {"t": "替换、增添或缺失", "c": "概念（背诵·P81）：DNA 分子中发生碱基的替换、增添或缺失，而引起的基因碱基序列的改变。", "ch": 7}, {"t": "碱基序列的改变", "c": "概念（背诵·P81）：DNA 分子中发生碱基的替换、增添或缺失，而引起的基因碱基序列的改变。", "ch": 7}, {"t": "普遍性、随机性、不定向性、低频性、多害少利性", "c": "5个特点：普遍性、随机性、不定向性、低频性、多害少利性。", "ch": 7}, {"t": "染色体组", "c": "染色体组（背诵·P87）：细胞中的一组非同源染色体，形态和功能各不相同，携带着控
